<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelnet Security+ Practice Quiz 1.2</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #0c0c0c;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --border-color: rgba(255, 255, 255, 0.15);
            --accent-blue: #3b82f6; /* Tailwind blue-500 */
            --accent-blue-dim: rgba(59, 130, 246, 0.1);
            --accent-red: #ef4444;
            --font-sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            /* Grid Background Effect from App.jsx */
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Selection Color */
        ::selection {
            background: rgba(59, 130, 246, 0.3);
            color: #dbeafe;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            position: relative;
            z-index: 10;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* --- Terminal Header Bar --- */
        .terminal-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-color);
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot.red { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); }
        .dot.yellow { background: rgba(234, 179, 8, 0.2); border: 1px solid rgba(234, 179, 8, 0.5); }
        .dot.green { background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.5); }

        /* --- Brutal Header Section --- */
        .header {
            padding: 40px 40px 20px 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 10px;
            line-height: 1;
        }

        .header .subtitle {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            display: block;
        }

        /* --- Progress Bar --- */
        .progress-container {
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.1);
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-blue);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--accent-blue);
        }

        /* --- Content Area --- */
        .content {
            padding: 40px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px dashed var(--border-color);
        }

        .question-number {
            font-family: var(--font-mono);
            color: var(--accent-blue);
            font-size: 0.9rem;
        }

        .domain-tag {
            font-family: var(--font-mono);
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .question-text {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 40px;
            color: #eee;
            font-weight: 500;
        }

        /* --- Options --- */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            position: relative;
        }

        .option:hover {
            border-color: var(--accent-blue);
            background: rgba(255,255,255,0.04);
        }

        .option.selected {
            background: var(--accent-blue-dim);
            border-color: var(--accent-blue);
        }

        .option-label {
            font-family: var(--font-mono);
            margin-right: 20px;
            color: var(--text-muted);
            font-weight: bold;
        }

        .option.selected .option-label {
            color: var(--accent-blue);
        }

        .option-text {
            flex: 1;
            font-size: 1rem;
            color: rgba(255,255,255,0.8);
        }

        .option.selected .option-text {
            color: #fff;
        }

        /* --- Buttons --- */
        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid var(--border-color);
        }

        .btn {
            padding: 12px 24px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: #fff;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover:not(:disabled) {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .btn-primary {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--accent-blue);
            color: #000;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: var(--border-color);
        }

        /* --- Results Screen --- */
        .results {
            animation: fadeIn 0.5s ease;
        }

        .score-card {
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.02);
            padding: 40px;
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        /* Terminal scanline effect for score */
        .score-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: rgba(255,255,255,0.1);
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .score-number {
            font-size: 5rem;
            font-weight: bold;
            font-family: var(--font-mono);
            margin: 10px 0;
            color: #fff;
        }

        .pass-fail {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            padding: 10px 20px;
            display: inline-block;
            border: 1px solid currentColor;
            margin-top: 20px;
        }

        .pass { color: var(--accent-blue); }
        .fail { color: var(--accent-red); }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            padding: 20px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            font-family: var(--font-mono);
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-family: var(--font-mono);
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Review Section */
        .review-question {
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.02);
            padding: 25px;
            margin-bottom: 20px;
            border-left: 4px solid transparent;
        }

        .review-question.correct { border-left-color: var(--accent-blue); }
        .review-question.incorrect { border-left-color: var(--accent-red); }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .review-status.correct { color: var(--accent-blue); }
        .review-status.incorrect { color: var(--accent-red); }

        .review-text {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 20px;
        }

        .review-answers {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            padding: 15px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .answer-line {
            margin-bottom: 8px;
            display: flex;
        }

        .answer-line strong {
            width: 140px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .explanation {
            margin-top: 15px;
            padding: 15px;
            border-left: 2px solid var(--text-muted);
            background: rgba(255,255,255,0.03);
            font-size: 0.95rem;
            color: #ccc;
        }
        
        .explanation-title {
            font-family: var(--font-mono);
            text-transform: uppercase;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0c0c0c;
        }
        ::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #2563eb;
        }
        * {
            scrollbar-width: thin;
            scrollbar-color: #3b82f6 #0c0c0c;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .header h1 { font-size: 2rem; }
            .content { padding: 20px; }
            .question-header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .score-number { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="terminal-bar">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
            <span style="margin-left: 10px;">bash — user@shelnet-exam: ~</span>
        </div>

        <div class="header">
            <h1>Practice Quiz 1.2</h1>
            <div class="subtitle">C:\Shelnet\Exams> SY0-701 Objective 1.2</div>
        </div>
        
        <div class="progress-container">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <div class="content" id="examContent">
            </div>
    </div>

    <script>
        // Data generated from context
        const quizData = [
            {
                q: "A Chief Information Security Officer (CISO) is reviewing the organization's current security posture against a new set of industry compliance standards. The CISO identifies specific areas where the current controls do not meet the required standards and creates a plan to address these deficiencies. Which of the following concepts is the CISO performing?",
                options: ["Zero Trust", "Gap analysis", "Honeytoken deployment", "Non-repudiation"],
                correct: 1,
                domain: "General Security Concepts",
                explanation: "Correct: Gap analysis is a methodical assessment used to compare an organization's current security posture with a set of standards, best practices, or regulatory requirements to identify areas that need improvement."
            },
            {
                q: "A network administrator is configuring a new wireless network and wants to ensure that data transmitted between the user's device and the access point cannot be intercepted and read by unauthorized parties. Which element of the CIA triad is the administrator primarily addressing?",
                options: ["Availability", "Integrity", "Confidentiality", "Accounting"],
                correct: 2,
                domain: "General Security Concepts",
                explanation: "Correct: Confidentiality ensures that sensitive information is accessed only by authorized persons and kept away from those not authorized to possess it, often achieved through encryption."
            },
            {
                q: "A security analyst is investigating a data breach and discovers that a specific user account accessed sensitive files at 2:00 AM. The analyst uses the system logs to track the user's activities, including login times and resources accessed. Which component of the AAA framework is the analyst utilizing?",
                options: ["Authentication", "Authorization", "Accounting", "Attestation"],
                correct: 2,
                domain: "General Security Concepts",
                explanation: "Correct: Accounting (or Auditing) involves tracking user activities and resource usage, such as logging login times and accessed resources, to ensure users are held accountable for their actions."
            },
            {
                q: "An organization is implementing a Zero Trust architecture. They are deploying a component responsible for deciding whether to grant a subject access to a resource based on established policies. Which logical component of Zero Trust is this?",
                options: ["Policy Enforcement Point", "Policy Administrator", "Policy Engine", "Data Plane"],
                correct: 2,
                domain: "General Security Concepts",
                explanation: "Correct: The Policy Engine is responsible for the ultimate decision to grant access to a resource for a given subject within the Zero Trust Control Plane."
            },
            {
                q: "To secure a high-value data center, a company installs a physical security control consisting of two doors. The first door must close and lock before the second door can be opened, preventing an unauthorized person from tailgating an authorized employee. What is this control called?",
                options: ["Access control vestibule", "Air gap", "Faraday cage", "Bollard"],
                correct: 0,
                domain: "General Security Concepts",
                explanation: "Correct: An access control vestibule (often called a mantrap) is a secured area between two sets of doors used to manage and control access, ensuring only authorized individuals gain entry and preventing piggybacking/tailgating."
            },
            {
                q: "A software developer signs a digital contract using their private key. Later, the developer attempts to deny signing the document, but the recipient uses the developer's public key to verify the signature validly. Which security concept prevents the developer from denying their action?",
                options: ["Availability", "Obfuscation", "Non-repudiation", "Authorization"],
                correct: 2,
                domain: "General Security Concepts",
                explanation: "Correct: Non-repudiation ensures that a party cannot deny the authenticity of their signature or the sending of a message, often implemented using digital signatures."
            },
            {
                q: "An administrator places a fake file named 'Executive_Salaries.xlsx' on a network share that acts as a decoy. The file contains no real data, but the security team configures alerts to trigger immediately if anyone attempts to open or modify it. What type of deception technology is this?",
                options: ["Honeyfile", "Honeynet", "DNS sinkhole", "Jump server"],
                correct: 0,
                domain: "General Security Concepts",
                explanation: "Correct: A Honeyfile is a decoy file placed within a system to appear legitimate; unauthorized access to it alerts security personnel to a potential breach or insider threat."
            },
            {
                q: "A company requires employees to enter a username and password, followed by a fingerprint scan, to access the server room. Which fundamental security concept is being demonstrated?",
                options: ["Single Sign-On (SSO)", "Multifactor Authentication (MFA)", "Federation", "Discretionary Access Control"],
                correct: 1,
                domain: "General Security Concepts",
                explanation: "Correct: Multifactor Authentication (MFA) requires more than one method of authentication from independent categories (e.g., something you know and something you are) to verify identity."
            },
            {
                q: "An organization wants to ensure that its web store remains operational even if a primary server fails. They implement a load balancer and a cluster of redundant servers to maintain uptime. Which principle of the CIA triad is this primarily supporting?",
                options: ["Confidentiality", "Integrity", "Availability", "Non-repudiation"],
                correct: 2,
                domain: "General Security Concepts",
                explanation: "Correct: Availability refers to ensuring that data and systems are accessible when needed. This is often maintained through redundancy, fault tolerance, and load balancing."
            },
            {
                q: "In a secure facility, security guards utilize a specific type of sensor to detect intrusion. This sensor works by detecting changes in heat signatures within a room. Which type of sensor are they using?",
                options: ["Pressure", "Ultrasonic", "Microwave", "Infrared"],
                correct: 3,
                domain: "General Security Concepts",
                explanation: "Correct: Infrared sensors detect heat and movement, making them common choices for intrusion detection systems."
            },
            {
                q: "A system administrator is configuring permissions for a file server. The permissions are assigned based on the user's job function and department rather than their identity. For example, all 'Accountants' have access to the 'Finance' folder. Which authorization model is being used?",
                options: ["Discretionary Access Control (DAC)", "Mandatory Access Control (MAC)", "Role-Based Access Control (RBAC)", "Rule-Based Access Control"],
                correct: 2,
                domain: "General Security Concepts",
                explanation: "Correct: Role-Based Access Control (RBAC) assigns permissions based on a user's role or job function within an organization, rather than individually."
            },
            {
                q: "A security architect is designing a network based on the Zero Trust model. They want to ensure that user identity verification is not static but changes dynamically based on context, such as location and device health. Which Zero Trust control plane concept does this describe?",
                options: ["Adaptive identity", "Implicit trust zone", "Micro-segmentation", "Threat scope reduction"],
                correct: 0,
                domain: "General Security Concepts",
                explanation: "Correct: Adaptive identity involves dynamically adjusting user or system identity verification based on context, a key component of the Zero Trust Control Plane."
            },
            {
                q: "A user downloads a software patch from a vendor's website. Before installing, the user verifies the file's digital signature and compares the file's hash value against the one provided on the website. Which security goal is the user validating?",
                options: ["Confidentiality", "Integrity", "Availability", "Accounting"],
                correct: 1,
                domain: "General Security Concepts",
                explanation: "Correct: Integrity involves assuring the accuracy and reliability of information. Hashing and digital signatures are methods used to verify that data has not been altered or corrupted."
            },
            {
                q: "To protect the building's perimeter from vehicle-based attacks, a facility manager installs heavy vertical posts made of steel and concrete in front of the main entrance. What is this physical security control called?",
                options: ["Fencing", "Bollards", "Motion sensors", "Access control vestibule"],
                correct: 1,
                domain: "General Security Concepts",
                explanation: "Correct: Bollards are physical security barriers (posts) used to control road traffic and prevent vehicles from crashing into buildings or secure areas."
            },
            {
                q: "An organization sets up a server that appears to be a legitimate production database but is actually isolated and unpatched. The purpose is to attract attackers to study their methods and gather threat intelligence. What is this system called?",
                options: ["Honeypot", "Proxy server", "Firewall", "Jump server"],
                correct: 0,
                domain: "General Security Concepts",
                explanation: "Correct: A honeypot is a security mechanism set up to detect, deflect, or study hacking attempts by acting as a decoy system."
            }
        ];

        let currentQuestionIndex = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        
        const examContent = document.getElementById('examContent');
        const progressBar = document.getElementById('progressBar');

        function init() {
            renderQuestion();
            updateProgress();
        }

        function updateProgress() {
            // Calculate progress based on answered questions, not just index
            const answeredCount = userAnswers.filter(a => a !== null).length;
            const percentage = (answeredCount / quizData.length) * 100;
            progressBar.style.width = `${percentage}%`;
        }

        function handleOptionClick(optionIndex) {
            userAnswers[currentQuestionIndex] = optionIndex;
            renderQuestion(); // Re-render to show selection state
            updateProgress();
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                finishQuiz();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function renderQuestion() {
            const q = quizData[currentQuestionIndex];
            const selectedOption = userAnswers[currentQuestionIndex];
            const letters = ['A', 'B', 'C', 'D'];

            let html = `
                <div class="question-header">
                    <span class="question-number">QUESTION ${currentQuestionIndex + 1} OF ${quizData.length}</span>
                    <span class="domain-tag">${q.domain}</span>
                </div>
                <div class="question-text">${q.q}</div>
                <div class="options">
            `;

            q.options.forEach((opt, idx) => {
                const isSelected = selectedOption === idx ? 'selected' : '';
                html += `
                    <div class="option ${isSelected}" onclick="handleOptionClick(${idx})">
                        <span class="option-label">${letters[idx]}</span>
                        <span class="option-text">${opt}</span>
                    </div>
                `;
            });

            html += `
                </div>
                <div class="navigation">
                    <button class="btn" onclick="prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>
                        &larr; Previous
                    </button>
                    <button class="btn btn-primary" onclick="nextQuestion()" ${selectedOption === null ? 'disabled' : ''}>
                        ${currentQuestionIndex === quizData.length - 1 ? 'Finish Exam' : 'Next Question'} &rarr;
                    </button>
                </div>
            `;

            examContent.innerHTML = html;
        }

        function finishQuiz() {
            const score = userAnswers.reduce((acc, ans, idx) => {
                return acc + (ans === quizData[idx].correct ? 1 : 0);
            }, 0);

            const percentage = Math.round((score / quizData.length) * 100);
            const passed = percentage >= 83; // CompTIA standard is roughly 750/900 (~83%)

            let html = `
                <div class="results">
                    <div class="score-card">
                        <div class="score-number">${percentage}%</div>
                        <div class="pass-fail ${passed ? 'pass' : 'fail'}">
                            ${passed ? 'PASS' : 'FAIL'}
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-number" style="color: var(--accent-blue)">${score}</div>
                            <div class="stat-label">Correct</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number" style="color: var(--accent-red)">${quizData.length - score}</div>
                            <div class="stat-label">Incorrect</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${quizData.length}</div>
                            <div class="stat-label">Total Questions</div>
                        </div>
                    </div>

                    <h2 style="margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">Review</h2>
            `;

            quizData.forEach((q, idx) => {
                const userAnsIdx = userAnswers[idx];
                const isCorrect = userAnsIdx === q.correct;
                const letters = ['A', 'B', 'C', 'D'];

                html += `
                    <div class="review-question ${isCorrect ? 'correct' : 'incorrect'}">
                        <div class="review-header">
                            <span>Question ${idx + 1}</span>
                            <span class="review-status ${isCorrect ? 'correct' : 'incorrect'}">
                                ${isCorrect ? 'CORRECT' : 'INCORRECT'}
                            </span>
                        </div>
                        <div class="review-text">${q.q}</div>
                        
                        <div class="review-answers">
                            <div class="answer-line">
                                <strong>Your Answer:</strong>
                                <span style="color: ${isCorrect ? 'var(--accent-blue)' : 'var(--accent-red)'}">
                                    ${letters[userAnsIdx]}: ${q.options[userAnsIdx]}
                                </span>
                            </div>
                            <div class="answer-line">
                                <strong>Correct Answer:</strong>
                                <span style="color: var(--accent-blue)">
                                    ${letters[q.correct]}: ${q.options[q.correct]}
                                </span>
                            </div>
                        </div>

                        <div class="explanation">
                            <div class="explanation-title">Explanation</div>
                            ${q.explanation}
                        </div>
                    </div>
                `;
            });

            html += `
                <div style="text-align: center; margin-top: 40px;">
                    <button class="btn btn-primary" onclick="location.reload()">Retake Exam</button>
                </div>
                </div>
            `;

            examContent.innerHTML = html;
            progressBar.style.width = '100%';
        }

        // Start
        init();

    </script>
</body>
</html>
