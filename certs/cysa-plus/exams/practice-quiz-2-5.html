<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelnet Quiz</title>
    <style>
        :root {
            --bg:           #000000;
            --text-90:      rgba(255, 255, 255, 0.90);
            --text-70:      rgba(255, 255, 255, 0.70);
            --text-45:      rgba(255, 255, 255, 0.45);
            --text-30:      rgba(255, 255, 255, 0.30);
            --rule:         rgba(255, 255, 255, 0.15);
            --accent:       #38bdf8; /* Default — overridden per-quiz via ACCENT_HEX */
            --accent-tint:  rgba(56, 189, 248, 0.14); /* selected-row */
            --accent-hover: rgba(56, 189, 248, 0.08); /* hover-row */
            --pass-green:   #43c08c;
            --wrong-red:    #fb7185;
            --font-mono:    'Courier New', Courier, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { background: var(--bg); }

        body {
            font-family: var(--font-mono);
            color: var(--text-90);
            min-height: 100vh;
            padding: 32px 0 48px;
            line-height: 1.5;
            font-size: 15px;
        }

        ::selection {
            background: var(--accent-tint);
            color: #fff;
        }

        .col {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* --- Header --- */
        .title-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 24px;
            color: var(--text-90);
        }

        .title-row .meta {
            color: var(--text-45);
            font-size: 13px;
        }

        .rule {
            border-top: 1px solid var(--rule);
            margin: 12px 0 0;
        }

        .progress {
            height: 2px;
            background: rgba(255, 255, 255, 0.06);
            margin-top: 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.25s ease;
        }

        /* --- Question --- */
        .content { margin-top: 32px; }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 4px 24px;
            color: var(--text-70);
            font-size: 13px;
        }

        .q-header .count { color: var(--accent); }
        .q-header .domain { color: var(--text-45); }

        .stem {
            color: var(--text-90);
            font-size: 17px;
            line-height: 1.6;
            margin: 24px 0 32px;
        }

        .options { display: flex; flex-direction: column; gap: 2px; }

        .option {
            display: flex;
            align-items: baseline;
            gap: 18px;
            padding: 10px 12px;
            cursor: pointer;
            background: transparent;
            border: 0;
            color: var(--text-90);
            font: inherit;
            text-align: left;
            width: 100%;
            transition: background-color 0.12s ease;
        }

        .option:hover { background: var(--accent-hover); }
        .option.selected { background: var(--accent-tint); }

        .option .label {
            color: var(--text-45);
            min-width: 1.5ch;
        }

        .option.selected .label { color: var(--accent); }

        .option .text { flex: 1; }

        /* --- Footer hints --- */
        .hints {
            margin-top: 32px;
            color: var(--text-45);
            font-size: 13px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 18px;
        }

        .hints .key { color: var(--accent); margin-right: 4px; }
        .hints .verb { color: var(--text-90); }
        .hints .verb:hover { text-decoration: underline; }
        .hints .verb.disabled { color: var(--text-30); cursor: not-allowed; }
        .hints .verb.disabled:hover { text-decoration: none; }

        button.verb {
            background: transparent;
            border: 0;
            font: inherit;
            padding: 0;
            cursor: pointer;
        }

        /* --- Results --- */
        .results-heading {
            color: var(--text-70);
            font-size: 15px;
            margin-bottom: 0;
        }

        .score-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 28px;
            margin-top: 28px;
            align-items: baseline;
        }

        .score-row .label { color: var(--text-45); }
        .score-row .score-val { color: var(--text-90); }
        .score-row .verdict-pass { color: var(--pass-green); }
        .score-row .verdict-fail { color: var(--wrong-red); }
        .score-row .threshold   { color: var(--text-45); }

        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 36px;
            margin-top: 16px;
            align-items: baseline;
        }

        .stats-row .stat-label { color: var(--text-45); margin-right: 8px; }
        .stats-row .stat-val   { color: var(--text-90); }

        .review-heading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-70);
            margin: 36px 0 16px;
        }

        .review-heading .dashes {
            color: var(--text-30);
            flex: 1;
            border-top: 1px solid var(--rule);
            margin-left: 4px;
            transform: translateY(1px);
        }

        .review-q {
            border-left: 2px solid var(--text-30);
            padding: 0 0 8px 14px;
            margin-bottom: 20px;
        }

        .review-q.correct   { border-left-color: var(--accent); }
        .review-q.incorrect { border-left-color: var(--wrong-red); }

        .review-q .status {
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-70);
        }

        .review-q .status .glyph-correct   { color: var(--accent); margin: 0 8px; }
        .review-q .status .glyph-incorrect { color: var(--wrong-red); margin: 0 8px; }
        .review-q .status .verdict.correct   { color: var(--accent); }
        .review-q .status .verdict.incorrect { color: var(--wrong-red); }

        .review-q .stem-mini {
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 10px;
            line-height: 1.55;
        }

        .review-q .ans-line {
            display: grid;
            grid-template-columns: 18ch 1fr;
            gap: 4px 8px;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .review-q .ans-line .ans-label { color: var(--text-45); }
        .review-q .ans-line.right .ans-val { color: var(--accent); }
        .review-q .ans-line.wrong .ans-val { color: var(--wrong-red); }
        .review-q .ans-line.skipped .ans-val { color: var(--text-45); }

        .review-q .explanation {
            margin-top: 10px;
            color: var(--text-70);
            font-size: 14px;
            line-height: 1.55;
        }

        .review-q .explanation .arrow { color: var(--accent); margin-right: 6px; }

        .retake-row {
            margin-top: 36px;
            text-align: center;
            color: var(--text-90);
        }

        .retake-row .key { color: var(--accent); margin-right: 4px; }
        .retake-row button.verb:hover { text-decoration: underline; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--accent); }
        * { scrollbar-width: thin; scrollbar-color: var(--accent) #000; }

        /* Mobile */
        @media (max-width: 600px) {
            .col { padding: 0 24px; }
            .stem { font-size: 16px; }
            body { font-size: 14px; padding: 24px 0 36px; }
            .review-q .ans-line { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="col">
        <div class="title-row">
            <span id="quizTitle">quiz</span>
            <span class="meta" id="quizMeta">— · — · 0q</span>
        </div>
        <div class="rule"></div>
        <div class="progress"><div class="progress-fill" id="progressBar"></div></div>

        <div class="content" id="examContent"></div>
    </div>

    <script>
        // ============================================================
        // QUIZ CONFIG — edit this block when deriving a new quiz.
        // Leave the rest of this file unchanged.
        // ============================================================
        const QUIZ_TITLE    = "practice quiz 2.5";
        const QUIZ_SUBTITLE = "cysa-plus · obj 2.5";
        const ACCENT_HEX    = "#22d3ee";

        const questions = [
            {
                q: "A vulnerability analyst discovers a critical unpatched vulnerability in a medical device that cannot be taken offline for patching because doing so would disrupt patient care. The vendor has not yet released a patch. Which risk management approach BEST describes the team's decision to document the risk and continue operations while adding network-level access controls around the device?",
                options: ["Risk avoidance, because the team is choosing to keep operating despite the risk", "Risk transfer, because the vendor is responsible for providing the patch", "Risk mitigation with a compensating control, because the team reduces exploitability through network segmentation while awaiting an official patch", "Risk acceptance, because the team is doing nothing to address the vulnerability"],
                correct: 2,
                domain: "Vulnerability Management",
                explanation: "Adding network-level access controls while the patch is awaited constitutes risk mitigation via compensating control, not pure acceptance. Risk acceptance (4) means acknowledging the risk without additional controls; risk avoidance (1) would mean shutting down the device; risk transfer (2) involves insurance or contractual liability, not adding controls."
            },
            {
                q: "A security team is preparing a patch for a critical OpenSSL vulnerability across 500 production servers. The change management policy requires testing, implementation, rollback, and validation phases. What is the PRIMARY purpose of the rollback phase in this patching workflow?",
                options: ["To remove the vulnerability scanner plugin after the patch is confirmed installed", "To restore the system to a known-good pre-patch state if the patch causes instability or service disruption", "To notify the compliance team that patching is complete", "To re-scan the server immediately after patching to confirm the vulnerability is resolved"],
                correct: 1,
                domain: "Vulnerability Management",
                explanation: "The rollback phase provides a recovery mechanism: if a patch causes application failures or service disruption, the team can revert to the pre-patch state quickly. Removing scanner plugins (1) is not a patching lifecycle phase; notifying compliance (3) is an administrative step; re-scanning (4) is the validation phase, not the rollback phase."
            },
            {
                q: "An organization's SLO for Critical vulnerabilities on internet-facing systems requires remediation within 15 days. A critical finding is identified, but the application owner requests a 30-day extension because the patch requires significant regression testing. Which action is MOST appropriate for the vulnerability management team?",
                options: ["Automatically grant the extension because application owners have authority over their systems", "Deny the extension and force the patch within 15 days regardless of testing status", "Document a formal exception with a compensating control and approved risk acceptance from the application owner and security management, tracking against the extended timeline", "Remove the finding from the SLO tracker since it cannot be remediated in time"],
                correct: 2,
                domain: "Vulnerability Management",
                explanation: "SLO exceptions require formal documentation, a compensating control to reduce risk during the extended window, and explicit risk acceptance approval from both the asset owner and security management. Automatic extension (1) bypasses governance; forced patching (2) without testing risks system failure; removing the finding (4) destroys auditability."
            },
            {
                q: "A vulnerability management program manager is reviewing attack surface management practices. The team wants to identify externally exposed assets that are not in the asset inventory. Which technique MOST directly supports edge discovery for unknown external assets?",
                options: ["Passive internal network monitoring using a network tap behind the corporate firewall", "External scanning and OSINT reconnaissance against the organization's IP ranges and domain names to discover internet-facing assets not in the CMDB", "Reviewing the organization's source code repositories for hardcoded IP addresses", "Running credentialed scans against all known internal hosts to identify missing patches"],
                correct: 1,
                domain: "Vulnerability Management",
                explanation: "Edge discovery involves scanning the internet-facing perimeter and using OSINT to identify unknown external assets (shadow IT, forgotten services, cloud resources) that may not be in the CMDB. Internal passive monitoring (1) misses external exposure; source code review (3) is useful for secrets but not systematic asset discovery; internal credentialed scans (4) address known assets only."
            },
            {
                q: "A SOC manager reads a new company policy requiring all High-severity vulnerabilities on production systems to be remediated within 30 days. This policy MOST closely maps to which vulnerability management governance element?",
                options: ["Compensating control", "Attack surface reduction", "Threat modeling", "Service-level objective (SLO)"],
                correct: 3,
                domain: "Vulnerability Management",
                explanation: "An SLO (Service-Level Objective) defines the target remediation timeframe for each vulnerability severity tier. The 30-day High severity requirement is an SLO, not a compensating control (1), attack surface reduction technique (2), or threat modeling activity (3)."
            },
            {
                q: "A security analyst is reviewing a web application and identifies that the login form does not limit the number of failed password attempts, does not expire tokens after logout, and stores session cookies without the Secure flag. Under the OWASP secure coding taxonomy, which category MOST broadly describes these combined findings?",
                options: ["Injection flaws", "Cryptographic failures", "Identification and authentication failures", "Security misconfiguration"],
                correct: 2,
                domain: "Vulnerability Management",
                explanation: "Missing account lockout, improper session token invalidation, and insecure cookie flags are all identification and authentication failures. Injection (1) involves untrusted data in commands; cryptographic failures (2) relate to weak algorithms or missing encryption; security misconfiguration (4) covers server/platform settings, not authentication logic."
            },
            {
                q: "An organization's procurement team signed an MOU with a third-party vendor for a shared IT environment. The vulnerability management team discovers a critical finding in infrastructure controlled by the vendor. The vendor refuses to patch within the organization's SLO because their own change management cycle is 90 days. Which statement MOST accurately describes the MOU's role here?",
                options: ["The MOU legally requires the vendor to patch within the organization's SLO, so the organization can compel immediate remediation", "An MOU establishes mutual intent and cooperation expectations but is typically not a legally binding contract; remediation timelines may need to be renegotiated or escalated", "The MOU transfers all security liability to the vendor, eliminating the organization's risk", "The organization should immediately terminate the MOU and remove the vendor's access"],
                correct: 1,
                domain: "Vulnerability Management",
                explanation: "An MOU (Memorandum of Understanding) expresses mutual intent and cooperation but is generally not a legally binding contract with enforceable remediation timelines. The organization must negotiate, escalate, or apply compensating controls. MOUs do not carry the legal enforceability of an SLA (1); they do not transfer liability (3); immediate termination (4) may be a last resort but not the first action."
            },
            {
                q: "A security team applies the principle of least privilege as part of a secure SDLC. Which secure coding practice MOST aligns with this principle at the application layer?",
                options: ["Output encoding to prevent XSS in rendered HTML", "Parameterized queries to prevent SQLi", "Session management controls such as short token lifetimes and invalidation on logout", "Granting database accounts only the minimum permissions required (e.g., SELECT-only for read operations, no DDL rights)"],
                correct: 3,
                domain: "Vulnerability Management",
                explanation: "Principle of least privilege at the application layer means database accounts have only the rights they need (e.g., SELECT-only for read endpoints). Output encoding (1) and parameterized queries (2) are injection/XSS controls; session management (3) addresses authentication, not privilege minimization."
            },
            {
                q: "A vulnerability manager wants to perform threat modeling on a new microservices architecture before development begins. Which threat modeling output MOST directly informs the vulnerability management team's later scanning and prioritization strategy?",
                options: ["A list of attack surfaces, trust boundaries, and potential attack vectors identified during design, which guides what to scan and which findings to prioritize", "A penetration test report from an external firm after the application launches", "A CVSS scoring matrix applied to existing vulnerabilities in the production environment", "A weekly vulnerability scan report generated by Nessus after deployment"],
                correct: 0,
                domain: "Vulnerability Management",
                explanation: "Threat modeling during design produces a map of attack surfaces, trust boundaries, and likely attack vectors that directly informs what to scan and which findings to prioritize once the application is built. A post-launch pentest (2) and scan reports (C, D) come after deployment and do not shift left into the design phase."
            },
            {
                q: "An organization participates in a bug bounty program that allows external researchers to report vulnerabilities in exchange for financial rewards. How does a bug bounty program BEST contribute to attack surface management?",
                options: ["Bug bounties provide a continuous, crowd-sourced mechanism for discovering vulnerabilities not found by internal scanners, especially novel or complex logic flaws", "Bug bounties replace the need for internal vulnerability scanning programs", "Bug bounties fulfill PCI DSS quarterly scan requirements", "Bug bounties allow the organization to defer all patching until researchers report issues"],
                correct: 0,
                domain: "Vulnerability Management",
                explanation: "Bug bounty programs supplement internal scanning by engaging a diverse pool of researchers who find logic flaws, business-logic vulnerabilities, and novel attack paths that automated scanners miss. They do not replace internal scanning (2); they do not satisfy PCI DSS ASV requirements (3); patching is not deferred to researcher reports (4)."
            },
            {
                q: "A security analyst is reviewing a vulnerability for an internet-facing authentication service. A threat model identifies that the vulnerability could be used in an authentication bypass chain. Which attack surface management step is MOST appropriate as an immediate action before patching?",
                options: ["Implement additional authentication controls (e.g., geo-restriction, IP allowlist, or rate-limiting) to reduce the exploitable attack surface temporarily", "Remove the authentication service from DNS to prevent users from accessing it", "Notify users that the vulnerability exists and advise them to change their passwords", "Archive the vulnerability finding until the next scheduled quarterly review"],
                correct: 0,
                domain: "Vulnerability Management",
                explanation: "Attack surface reduction as a pre-patch compensating control includes IP allowlisting, geo-restriction, or rate-limiting to shrink the window of exploitability while patching proceeds. Removing from DNS (2) denies service entirely; notifying users (3) does not reduce technical risk; archiving (4) ignores an imminent threat."
            },
            {
                q: "A new vulnerability is discovered in a widely used open-source library that is embedded throughout the organization's software portfolio. The security team must decide how to manage the response across 40 development teams. Which vulnerability management practice MOST efficiently coordinates this response?",
                options: ["Require each development team to independently research and remediate the vulnerability on their own timeline", "Wait for the library maintainers to release a patch before assessing organizational impact", "Remove the library from all applications immediately regardless of business impact", "Centralize the remediation guidance: identify all affected systems via SCA, produce a standardized patch advisory, set SLO deadlines per severity tier, and track completion centrally"],
                correct: 3,
                domain: "Vulnerability Management",
                explanation: "Centralized coordination through SCA-based asset discovery, a standardized advisory, and tracked SLO deadlines is the most efficient model for a wide-scope library vulnerability. Independent per-team research (1) creates inconsistency and delays; waiting for a patch before assessing (2) loses valuable planning time; immediate removal (3) is disproportionate before risk is assessed."
            },
            {
                q: "A security operations team discovers that a detective control (a host-based IDS) has been alerting on exploitation attempts for a vulnerability that was supposed to be patched 45 days ago. Reviewing the patch management database shows the patch was marked \"complete.\" Which step is MOST important to take FIRST?",
                options: ["Ignore the IDS alert because the patch management database shows the patch as complete", "Escalate to executive leadership as a data breach", "Validate whether the patch was actually installed by querying the host directly, and investigate whether the IDS alerts represent successful or failed exploitation attempts", "Uninstall and reinstall the host-based IDS to confirm it is not generating false positives"],
                correct: 2,
                domain: "Vulnerability Management",
                explanation: "Discrepancies between patch management records and IDS alerts require direct host verification: query the installed package version or registry to confirm patch status, and analyze whether IDS alerts are pre- or post-exploit. Trusting the database record without verification (1) could leave the host exposed; executive escalation (2) is premature before validation; reinstalling the IDS (4) addresses a false positive hypothesis before confirming the finding."
            },
            {
                q: "A vulnerability analyst is documenting a control type taxonomy for a governance report. The analyst classifies a firewall rule that blocks exploitation attempts against a vulnerable web server as a specific control type. Which classification is MOST accurate?",
                options: ["Managerial and preventative", "Technical and preventative", "Operational and detective", "Technical and corrective"],
                correct: 1,
                domain: "Vulnerability Management",
                explanation: "A firewall rule is a technical control (implemented in technology) that blocks exploitation attempts, making it preventative in function (it stops the attack before compromise occurs). Managerial controls (1) are policy and administrative; operational controls (3) are process-driven; corrective controls (4) restore normal operations after an incident."
            },
            {
                q: "A vulnerability management team is maturing their secure SDLC practices and wants to catch vulnerabilities as early as possible in the development lifecycle. Which two secure coding practices have the MOST impact when integrated into the development pipeline (shift-left approach)?",
                options: ["Input validation and output encoding integrated into developer IDE plugins and CI/CD pipeline SAST gates", "Network-level WAF rules and SIEM alerting deployed at runtime in production", "Quarterly penetration testing after each major release", "Monthly vulnerability scan reports reviewed by the security team"],
                correct: 0,
                domain: "Vulnerability Management",
                explanation: "Shift-left means catching vulnerabilities during development: input validation and output encoding enforced via IDE plugins and SAST checks in CI/CD pipelines catch injection and XSS flaws before code reaches production. WAF and SIEM (2) are runtime production controls; penetration testing (3) and monthly scans (4) are post-development activities that detect issues after the fact."
            }
        ];

        // ============================================================
        // END CONFIG — chrome below is shared. Do not edit when deriving.
        // ============================================================

        function hexToRgba(hex, alpha) {
            const h = hex.replace('#', '');
            const r = parseInt(h.substring(0, 2), 16);
            const g = parseInt(h.substring(2, 4), 16);
            const b = parseInt(h.substring(4, 6), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // --- APP STATE ---
        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let onResults = false;

        // --- DOM ---
        const contentDiv = document.getElementById('examContent');
        const progressBar = document.getElementById('progressBar');

        // --- INIT ---
        function init() {
            document.title = QUIZ_TITLE;
            document.getElementById('quizTitle').textContent = QUIZ_TITLE;
            document.getElementById('quizMeta').textContent =
                `${QUIZ_SUBTITLE} · ${questions.length}q`;
            document.documentElement.style.setProperty('--accent', ACCENT_HEX);
            document.documentElement.style.setProperty('--accent-tint',  hexToRgba(ACCENT_HEX, 0.14));
            document.documentElement.style.setProperty('--accent-hover', hexToRgba(ACCENT_HEX, 0.08));
            renderQuestion();
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // --- RENDER ---
        function renderQuestion() {
            onResults = false;
            const q = questions[currentQuestionIndex];
            const isLast = currentQuestionIndex === questions.length - 1;
            const isFirst = currentQuestionIndex === 0;
            const picked = userAnswers[currentQuestionIndex];

            progressBar.style.width = `${(currentQuestionIndex / questions.length) * 100}%`;

            const optionsHtml = q.options.map((opt, i) => `
                <button type="button"
                        class="option ${picked === i ? 'selected' : ''}"
                        onclick="selectOption(${i})">
                    <span class="label">${i + 1}</span>
                    <span class="text">${escapeHtml(opt)}</span>
                </button>
            `).join('');

            const prevHtml = isFirst
                ? ''
                : `<button type="button" class="verb" onclick="prevQuestion()"><span class="key">&larr;</span>prev</button>`;

            const nextLabel = isLast ? 'finish' : 'next';
            const nextEnabled = picked !== null;
            const nextHtml = nextEnabled
                ? `<button type="button" class="verb" onclick="nextQuestion()"><span class="key">&#x21B5;</span>${nextLabel}</button>`
                : `<span class="verb disabled"><span class="key">&#x21B5;</span>${nextLabel}</span>`;

            contentDiv.innerHTML = `
                <div class="q-header">
                    <span class="count">question ${currentQuestionIndex + 1} of ${questions.length}</span>
                    <span class="domain">[ ${escapeHtml(q.domain.toLowerCase())} ]</span>
                </div>

                <div class="stem">${escapeHtml(q.q)}</div>

                <div class="options">${optionsHtml}</div>

                <div class="hints">
                    <span><span class="key">1-${q.options.length}</span>select</span>
                    ${prevHtml ? `<span>${prevHtml}</span>` : ''}
                    <span>${nextHtml}</span>
                </div>
            `;
        }

        function selectOption(i) {
            userAnswers[currentQuestionIndex] = i;
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (userAnswers[currentQuestionIndex] === null) return;
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            onResults = true;
            let correctCount = 0;
            questions.forEach((q, i) => { if (userAnswers[i] === q.correct) correctCount++; });
            const score = Math.round((correctCount / questions.length) * 100);
            const passed = score >= 83;
            progressBar.style.width = '100%';

            const reviewHtml = questions.map((q, i) => {
                const userAnswer = userAnswers[i];
                const skipped = userAnswer === null;
                const isCorrect = !skipped && userAnswer === q.correct;
                const userLabel = skipped ? '—' : `${userAnswer + 1}  ${escapeHtml(q.options[userAnswer])}`;
                const correctLabel = `${q.correct + 1}  ${escapeHtml(q.options[q.correct])}`;
                const statusGlyph = isCorrect
                    ? `<span class="glyph-correct">&#x2713;</span><span class="verdict correct">correct</span>`
                    : `<span class="glyph-incorrect">&#x2717;</span><span class="verdict incorrect">${skipped ? 'skipped' : 'incorrect'}</span>`;
                const yourLineClass = skipped ? 'skipped' : (isCorrect ? 'right' : 'wrong');
                return `
                    <div class="review-q ${isCorrect ? 'correct' : 'incorrect'}">
                        <div class="status">Q.${i + 1}${statusGlyph}</div>
                        <div class="stem-mini">${escapeHtml(q.q)}</div>
                        <div class="ans-line ${yourLineClass}">
                            <span class="ans-label">your answer:</span>
                            <span class="ans-val">${userLabel}</span>
                        </div>
                        <div class="ans-line right">
                            <span class="ans-label">correct answer:</span>
                            <span class="ans-val">${correctLabel}</span>
                        </div>
                        <div class="explanation"><span class="arrow">&rsaquo;</span>${escapeHtml(q.explanation)}</div>
                    </div>
                `;
            }).join('');

            contentDiv.innerHTML = `
                <div class="results-heading">results</div>

                <div class="score-row">
                    <span><span class="label">score</span> <span class="score-val">${score} / 100</span></span>
                    <span class="${passed ? 'verdict-pass' : 'verdict-fail'}">${passed ? 'pass' : 'fail'}</span>
                    <span class="threshold">(&ge; 83 to pass)</span>
                </div>

                <div class="stats-row">
                    <span><span class="stat-label">correct</span><span class="stat-val">${correctCount}</span></span>
                    <span><span class="stat-label">incorrect</span><span class="stat-val">${questions.length - correctCount}</span></span>
                    <span><span class="stat-label">total</span><span class="stat-val">${questions.length}</span></span>
                </div>

                <div class="review-heading">review<span class="dashes"></span></div>

                ${reviewHtml}

                <div class="retake-row">
                    <button type="button" class="verb" onclick="location.reload()"><span class="key">&#x21B5;</span>retake</button>
                </div>
            `;
            window.scrollTo(0, 0);
        }

        // --- KEYBOARD ---
        window.addEventListener('keydown', (e) => {
            const tag = document.activeElement && document.activeElement.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA') return;

            if (onResults) {
                if (e.key === 'Enter') { e.preventDefault(); location.reload(); }
                return;
            }

            if (/^[1-9]$/.test(e.key)) {
                const i = Number(e.key) - 1;
                const q = questions[currentQuestionIndex];
                if (i < q.options.length) { e.preventDefault(); selectOption(i); }
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault(); prevQuestion();
            } else if (e.key === 'ArrowRight' || e.key === 'Enter') {
                e.preventDefault(); nextQuestion();
            }
        });

        init();
    </script>
</body>
</html>
