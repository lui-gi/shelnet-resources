<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelnet Quiz</title>
    <style>
        :root {
            --bg:           #000000;
            --text-90:      rgba(255, 255, 255, 0.90);
            --text-70:      rgba(255, 255, 255, 0.70);
            --text-45:      rgba(255, 255, 255, 0.45);
            --text-30:      rgba(255, 255, 255, 0.30);
            --rule:         rgba(255, 255, 255, 0.15);
            --accent:       #38bdf8; /* Default — overridden per-quiz via ACCENT_HEX */
            --accent-tint:  rgba(56, 189, 248, 0.14); /* selected-row */
            --accent-hover: rgba(56, 189, 248, 0.08); /* hover-row */
            --pass-green:   #43c08c;
            --wrong-red:    #fb7185;
            --font-mono:    'Courier New', Courier, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { background: var(--bg); }

        body {
            font-family: var(--font-mono);
            color: var(--text-90);
            min-height: 100vh;
            padding: 32px 0 48px;
            line-height: 1.5;
            font-size: 15px;
        }

        ::selection {
            background: var(--accent-tint);
            color: #fff;
        }

        .col {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* --- Header --- */
        .title-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 24px;
            color: var(--text-90);
        }

        .title-row .meta {
            color: var(--text-45);
            font-size: 13px;
        }

        .rule {
            border-top: 1px solid var(--rule);
            margin: 12px 0 0;
        }

        .progress {
            height: 2px;
            background: rgba(255, 255, 255, 0.06);
            margin-top: 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.25s ease;
        }

        /* --- Question --- */
        .content { margin-top: 32px; }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 4px 24px;
            color: var(--text-70);
            font-size: 13px;
        }

        .q-header .count { color: var(--accent); }
        .q-header .domain { color: var(--text-45); }

        .stem {
            color: var(--text-90);
            font-size: 17px;
            line-height: 1.6;
            margin: 24px 0 32px;
        }

        .options { display: flex; flex-direction: column; gap: 2px; }

        .option {
            display: flex;
            align-items: baseline;
            gap: 18px;
            padding: 10px 12px;
            cursor: pointer;
            background: transparent;
            border: 0;
            color: var(--text-90);
            font: inherit;
            text-align: left;
            width: 100%;
            transition: background-color 0.12s ease;
        }

        .option:hover { background: var(--accent-hover); }
        .option.selected { background: var(--accent-tint); }

        .option .label {
            color: var(--text-45);
            min-width: 1.5ch;
        }

        .option.selected .label { color: var(--accent); }

        .option .text { flex: 1; }

        /* --- Footer hints --- */
        .hints {
            margin-top: 32px;
            color: var(--text-45);
            font-size: 13px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 18px;
        }

        .hints .key { color: var(--accent); margin-right: 4px; }
        .hints .verb { color: var(--text-90); }
        .hints .verb:hover { text-decoration: underline; }
        .hints .verb.disabled { color: var(--text-30); cursor: not-allowed; }
        .hints .verb.disabled:hover { text-decoration: none; }

        button.verb {
            background: transparent;
            border: 0;
            font: inherit;
            padding: 0;
            cursor: pointer;
        }

        /* --- Results --- */
        .results-heading {
            color: var(--text-70);
            font-size: 15px;
            margin-bottom: 0;
        }

        .score-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 28px;
            margin-top: 28px;
            align-items: baseline;
        }

        .score-row .label { color: var(--text-45); }
        .score-row .score-val { color: var(--text-90); }
        .score-row .verdict-pass { color: var(--pass-green); }
        .score-row .verdict-fail { color: var(--wrong-red); }
        .score-row .threshold   { color: var(--text-45); }

        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 36px;
            margin-top: 16px;
            align-items: baseline;
        }

        .stats-row .stat-label { color: var(--text-45); margin-right: 8px; }
        .stats-row .stat-val   { color: var(--text-90); }

        .review-heading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-70);
            margin: 36px 0 16px;
        }

        .review-heading .dashes {
            color: var(--text-30);
            flex: 1;
            border-top: 1px solid var(--rule);
            margin-left: 4px;
            transform: translateY(1px);
        }

        .review-q {
            border-left: 2px solid var(--text-30);
            padding: 0 0 8px 14px;
            margin-bottom: 20px;
        }

        .review-q.correct   { border-left-color: var(--accent); }
        .review-q.incorrect { border-left-color: var(--wrong-red); }

        .review-q .status {
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-70);
        }

        .review-q .status .glyph-correct   { color: var(--accent); margin: 0 8px; }
        .review-q .status .glyph-incorrect { color: var(--wrong-red); margin: 0 8px; }
        .review-q .status .verdict.correct   { color: var(--accent); }
        .review-q .status .verdict.incorrect { color: var(--wrong-red); }

        .review-q .stem-mini {
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 10px;
            line-height: 1.55;
        }

        .review-q .ans-line {
            display: grid;
            grid-template-columns: 18ch 1fr;
            gap: 4px 8px;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .review-q .ans-line .ans-label { color: var(--text-45); }
        .review-q .ans-line.right .ans-val { color: var(--accent); }
        .review-q .ans-line.wrong .ans-val { color: var(--wrong-red); }
        .review-q .ans-line.skipped .ans-val { color: var(--text-45); }

        .review-q .explanation {
            margin-top: 10px;
            color: var(--text-70);
            font-size: 14px;
            line-height: 1.55;
        }

        .review-q .explanation .arrow { color: var(--accent); margin-right: 6px; }

        .retake-row {
            margin-top: 36px;
            text-align: center;
            color: var(--text-90);
        }

        .retake-row .key { color: var(--accent); margin-right: 4px; }
        .retake-row button.verb:hover { text-decoration: underline; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--accent); }
        * { scrollbar-width: thin; scrollbar-color: var(--accent) #000; }

        /* Mobile */
        @media (max-width: 600px) {
            .col { padding: 0 24px; }
            .stem { font-size: 16px; }
            body { font-size: 14px; padding: 24px 0 36px; }
            .review-q .ans-line { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="col">
        <div class="title-row">
            <span id="quizTitle">quiz</span>
            <span class="meta" id="quizMeta">— · — · 0q</span>
        </div>
        <div class="rule"></div>
        <div class="progress"><div class="progress-fill" id="progressBar"></div></div>

        <div class="content" id="examContent"></div>
    </div>

    <script>
        // ============================================================
        // QUIZ CONFIG — edit this block when deriving a new quiz.
        // Leave the rest of this file unchanged.
        // ============================================================
        const QUIZ_TITLE    = "practice exam 1";
        const QUIZ_SUBTITLE = "cysa-plus · cs0-003";
        const ACCENT_HEX    = "#22d3ee";

        const questions = [
            {
                q: "A security engineer is evaluating identity solutions for a company that recently acquired two partner organizations. Employees must be able to log in to shared applications using their home-organization credentials, with each organization maintaining its own identity provider. Which of the following IAM capabilities BEST addresses this cross-organization trust requirement?",
                options: ["MFA", "PAM", "Federation", "SSO"],
                correct: 2,
                domain: "Security Operations",
                explanation: "Federation allows separate organizations to establish trust relationships so that users authenticate with their home identity provider and are granted access to partner applications without creating duplicate accounts. SSO (4) enables single-credential access within a single trust domain but does not by itself establish the cross-organizational trust that federation provides."
            },
            {
                q: "A SOC analyst is investigating an endpoint alert and discovers that a new executable was silently added to a well-known autostart path during off-hours. The analyst needs to understand which Windows architectural component stores this persistence mechanism as a key-value database entry. Which of the following OS concepts BEST describes what the analyst is examining?",
                options: ["Hardware architecture", "Windows Registry", "System hardening baseline", "File structure configuration locations"],
                correct: 1,
                domain: "Security Operations",
                explanation: "The Windows Registry is the centralized key-value database where Windows stores configuration including autorun keys that attackers abuse for persistence. Hardware architecture (1) describes physical components such as CPU and memory and has no role in storing software autostart entries."
            },
            {
                q: "A security analyst at a financial services firm is reviewing network architecture documentation. The analyst notes that all branch-office users connect to corporate applications through a cloud-hosted service that combines SD-WAN, ZTNA, and a secure web gateway into a single platform with no on-premises security appliances at the branches. Which of the following network architecture concepts does this BEST describe?",
                options: ["Zero trust", "SDN", "Network segmentation", "SASE"],
                correct: 3,
                domain: "Security Operations",
                explanation: "SASE converges WAN and security functions such as ZTNA and SWG into a cloud-delivered service, eliminating the need for on-premises appliances at branch offices. Zero trust (1) is an access philosophy rather than a specific network delivery architecture, and SASE implementations often use zero trust principles without being the same thing."
            },
            {
                q: "A cloud administrator needs to enforce security policies on data leaving the organization through employee use of unsanctioned SaaS applications. The solution must sit inline between users and cloud services, inspect traffic, and block transfers of sensitive data. Which of the following technologies BEST meets this requirement?",
                options: ["CASB", "DLP", "PKI", "PAM"],
                correct: 0,
                domain: "Security Operations",
                explanation: "A CASB sits between users and cloud service providers to enforce data security policies, provide visibility, and control access to sanctioned and unsanctioned SaaS applications. DLP (2) inspects content to prevent data loss but does not by itself provide the cloud-traffic brokering and policy enforcement layer that a CASB delivers for SaaS visibility."
            },
            {
                q: "A security analyst is reviewing logs from a web proxy that performs deep inspection of outbound HTTPS sessions. The proxy decrypts each TLS session, scans the payload for threats, then re-encrypts the traffic before forwarding it. Which of the following PKI and encryption concepts BEST describes this scenario?",
                options: ["SSL inspection", "Certificate pinning", "Mutual TLS", "Federation"],
                correct: 0,
                domain: "Security Operations",
                explanation: "SSL inspection (also known as TLS inspection or HTTPS inspection) terminates an encrypted session at a proxy, examines the decrypted payload, then re-establishes a new encrypted session toward the destination. Certificate pinning (2) is a client-side control that rejects certificates not matching a known pin, and its presence would actually prevent SSL inspection from functioning without additional configuration."
            },
            {
                q: "A SOC analyst is reviewing firewall logs and notices that an internal workstation has sent small, evenly timed HTTPS packets to the same external IP address every five minutes for the past 72 hours, even outside business hours. No legitimate application is known to communicate with that IP. Which of the following network-related indicators MOST likely explains this behavior?",
                options: ["Bandwidth consumption", "Unusual traffic spikes", "Rogue device on the network", "Beaconing"],
                correct: 3,
                domain: "Security Operations",
                explanation: "Beaconing is the periodic, clock-like check-in a compromised endpoint makes to a C2 server; the even five-minute interval and consistent external destination are classic signatures. Unusual traffic spikes (2) describes sudden volume increases rather than the low-and-slow, clock-like pattern observed here."
            },
            {
                q: "A security analyst is reviewing host telemetry on a Windows workstation after a user reported sluggishness. The analyst finds that CPU utilization has been pegged at 95% by an unrecognized process named svchost32.exe that started after the user opened a phishing email attachment last week. Which of the following host-related indicators is MOST directly present?",
                options: ["Drive capacity consumption", "Unauthorized scheduled task", "Malicious process", "Registry changes or anomalies"],
                correct: 2,
                domain: "Security Operations",
                explanation: "An unrecognized process consuming abnormal CPU resources that started after a phishing event is a malicious process indicator. Unauthorized scheduled tasks (2) could have launched the process, but the question asks about the indicator that is MOST directly present - which is the malicious process itself, not the launch mechanism."
            },
            {
                q: "A tier-2 analyst is reviewing application logs for a customer-facing web portal and discovers that an account was created with a username beginning with \"admin_\" shortly after a failed authentication burst against the login page. The new account has made several requests to financial data endpoints that the original account owner has no business need to access. Which of the following application-related indicators BEST describes this activity?",
                options: ["Service interruption", "Introduction of new accounts", "Unexpected outbound communication", "Anomalous activity"],
                correct: 1,
                domain: "Security Operations",
                explanation: "The creation of a new privileged-looking account following an authentication attack is a textbook example of the introduction-of-new-accounts application-layer indicator, which signals that an attacker may have gained the ability to modify the directory or database. Anomalous activity (4) is a broad catch-all indicator; the specific observable here maps precisely to the introduction-of-new-accounts indicator."
            },
            {
                q: "A SOC analyst is reviewing DNS logs and notices that an employee laptop has queried dozens of randomly generated subdomains under the same parent domain over a four-hour window, receiving NXDOMAIN responses for most of them. No legitimate application on that endpoint is expected to generate bulk subdomain queries. Which of the following attack techniques is MOST likely being used?",
                options: ["Beaconing", "Scans/sweeps", "Irregular peer-to-peer communication", "DNS tunneling with DGA"],
                correct: 3,
                domain: "Security Operations",
                explanation: "A domain generation algorithm (DGA) produces many pseudo-random subdomain names so malware can find an active C2 channel even as defenders sinkhole known domains; the bulk NXDOMAIN pattern is the signature of DGA-based C2 activity. Beaconing (1) describes periodic check-ins to a fixed destination, but the random subdomain generation pattern specifically points to DGA activity, which is a distinct technique."
            },
            {
                q: "An incident responder is examining a compromised Windows server and finds that a task was created under the SYSTEM account that runs a base64-encoded PowerShell one-liner every hour. The task was added at 02:17 local time three days ago by an unauthorized party. Which of the following host-related indicators does this MOST represent?",
                options: ["Unauthorized scheduled tasks", "Processor consumption", "Data exfiltration", "Unauthorized changes"],
                correct: 0,
                domain: "Security Operations",
                explanation: "A task object added to the Windows Task Scheduler by an attacker to run encoded commands on a regular interval is a direct example of the unauthorized scheduled tasks host indicator, commonly used for persistence and lateral movement. Unauthorized changes (4) is the broader category; the specific observable here maps exactly to unauthorized scheduled tasks."
            },
            {
                q: "A security analyst is reviewing web application logs and notices that API responses now include database schema names in JSON error fields, at a call rate ten times above baseline. The volume spike began immediately after a new application version was deployed. Which of the following application-related indicators is MOST directly present?",
                options: ["Unexpected output", "Service interruption", "Introduction of new accounts", "Anomalous activity"],
                correct: 0,
                domain: "Security Operations",
                explanation: "Error messages that expose database schema names in API responses are a textbook unexpected output indicator, which often signals injection flaws or misconfigured error handling revealing sensitive information. Anomalous activity (4) is the broad category; the specific, actionable indicator here is unexpected output because the response content contains data that should never be externally visible."
            },
            {
                q: "A threat analyst receives a report that a phishing email campaign is using encoded URLs that redirect victims through multiple legitimate URL-shortening services before landing on a credential-harvesting page. The obfuscation makes the final destination invisible in email header analysis. Which of the following indicators BEST represents this technique?",
                options: ["Unusual traffic spikes", "Rogue devices on the network", "Obfuscated links", "Social engineering attacks"],
                correct: 2,
                domain: "Security Operations",
                explanation: "Encoding and chaining URL redirectors to hide the true destination is the obfuscated links indicator, classified under the \"Other\" category of malicious activity indicators in the CS0-003 objectives. Social engineering attacks (4) describes the broader campaign category; the specific technical indicator here - hiding the destination through encoded multi-hop redirects - maps to obfuscated links."
            },
            {
                q: "A SOC analyst needs to capture and decode all network traffic crossing a specific network interface on a Linux server to identify whether a process is communicating with a known C2 IP. The analyst requires the ability to filter packets by IP address and inspect protocol fields in the captured frames. Which of the following tools is MOST appropriate for this task?",
                options: ["Wireshark", "Nessus", "AbuseIPDB", "WHOIS"],
                correct: 0,
                domain: "Security Operations",
                explanation: "Wireshark is the GUI-based packet capture and deep protocol analysis tool that allows filtering on IP addresses and full inspection of protocol fields in captured frames. Nessus (2) is a vulnerability scanner and does not capture or decode live network traffic."
            },
            {
                q: "A security analyst receives an alert about multiple failed SSH logins to a production server followed by a successful login from the same source IP. The analyst wants to correlate this event with other log sources across the environment to determine whether the same IP has been seen in other alert contexts. Which of the following tools is BEST suited to perform this multi-source log correlation?",
                options: ["EDR", "tcpdump", "SIEM", "SOAR"],
                correct: 2,
                domain: "Security Operations",
                explanation: "A SIEM aggregates logs from multiple sources and provides the correlation engine needed to identify the same IP across different alert contexts in a single search. SOAR (4) automates and orchestrates response actions based on SIEM detections but is not itself the correlation platform where the analyst would run the multi-source log search."
            },
            {
                q: "A malware analyst receives a suspicious executable sent via a phishing email. Before submitting the file to any live system, the analyst wants to extract readable ASCII strings from the binary to identify hardcoded IP addresses, domain names, or error messages that might reveal its purpose. Which of the following tools is MOST appropriate?",
                options: ["VirusTotal", "Strings", "Joe Sandbox", "Cuckoo Sandbox"],
                correct: 1,
                domain: "Security Operations",
                explanation: "The Strings tool extracts printable character sequences from a binary, providing a quick static triage step that can surface hardcoded indicators before dynamic analysis. VirusTotal (1) submits a file to multiple AV engines for a reputation check but does not extract and display the binary's raw strings for the analyst to inspect."
            },
            {
                q: "A threat analyst is investigating a domain that appeared in a phishing email. The analyst wants to identify the registrant organization, registration date, and name server information for the domain to determine whether it was recently registered by an adversary. Which of the following tools should the analyst use FIRST?",
                options: ["AbuseIPDB", "VirusTotal", "Maltego", "WHOIS"],
                correct: 3,
                domain: "Security Operations",
                explanation: "WHOIS retrieves domain registration records including registrant, creation date, and name servers, making it the direct tool for this ownership-lookup task. AbuseIPDB (1) is for checking whether an IP address has been reported for abuse and does not provide domain registration records."
            },
            {
                q: "An incident responder is analyzing a suspicious executable that a user inadvertently ran. The responder needs to observe the file's actual runtime behavior - including file system writes, network connections, and registry modifications - in a safe, isolated environment without risking the production network. Which of the following tools BEST meets this requirement?",
                options: ["Cuckoo Sandbox", "Strings", "WHOIS", "VirusTotal"],
                correct: 0,
                domain: "Security Operations",
                explanation: "Cuckoo Sandbox is an open-source automated malware analysis sandbox that executes a suspicious file in an isolated environment and records its runtime behavior including file, network, and registry activity. VirusTotal (4) performs a static reputation check against multiple AV engines but does not execute the file in an isolated environment to observe dynamic behavior."
            },
            {
                q: "A SOC analyst is examining an inbound email that a user flagged as suspicious. The analyst wants to verify whether the sending mail server was authorized by the domain owner to send email on behalf of that domain. Which of the following email authentication checks should the analyst perform FIRST?",
                options: ["DKIM signature verification", "DMARC policy check", "SPF record lookup", "Email header hop analysis"],
                correct: 2,
                domain: "Security Operations",
                explanation: "SPF validates whether the IP address of the sending mail server is listed as an authorized sender in the domain's DNS SPF record; it directly answers whether the sending server was permitted to send on behalf of that domain. DKIM (1) verifies the cryptographic signature on the message body and headers, which confirms integrity but does not indicate whether the sending IP was authorized."
            },
            {
                q: "A detection engineer needs to write a rule that identifies malware samples by matching a known byte sequence pattern embedded in PE file headers, regardless of which SIEM platform the organization uses. The rule will be shared across multiple organizations via a threat-sharing portal. Which of the following rule formats is MOST appropriate for file-based pattern matching?",
                options: ["Sigma", "Snort", "YARA", "Suricata"],
                correct: 2,
                domain: "Security Operations",
                explanation: "YARA is the standard language for writing pattern-matching rules that identify malware files based on byte sequences, strings, or structural characteristics; it operates against files, not network traffic or logs. Sigma (1) is also a vendor-neutral detection rule format, but it targets SIEM log events rather than file content analysis."
            },
            {
                q: "A threat intelligence analyst is evaluating a new paid feed from a commercial vendor. The feed provides indicators updated hourly, aligned to the analyst's industry sector, and sourced from multiple independent collection methods with explicit confidence ratings. Which of the following confidence-level attributes BEST accounts for the value of hourly updates specifically?",
                options: ["Accuracy", "Timeliness", "Relevancy", "Completeness"],
                correct: 1,
                domain: "Security Operations",
                explanation: "Timeliness measures how quickly intelligence is produced and distributed; hourly updates maximize the window during which indicators are actionable before adversaries rotate infrastructure. Relevancy (3) describes whether the intelligence applies to the organization's environment and industry sector, but the hourly cadence maps specifically to timeliness."
            },
            {
                q: "A nation-state threat actor has maintained undetected access inside a government contractor's environment for 14 months, using custom implants and living-off-the-land techniques to exfiltrate intellectual property. Which of the following threat actor categories BEST describes this adversary?",
                options: ["Hacktivist", "Script kiddie", "Organized crime", "APT"],
                correct: 3,
                domain: "Security Operations",
                explanation: "An APT is characterized by a well-resourced, stealthy actor with long dwell times, custom tooling, and a strategic objective such as intellectual property theft - all present in this scenario. Organized crime (3) typically prioritizes financial gain and speed over stealth and would not typically maintain a 14-month undetected presence for IP theft."
            },
            {
                q: "A threat hunter is conducting a proactive hunt for lateral movement inside a corporate network. Rather than waiting for alerts, the hunter forms a hypothesis that an attacker may be abusing WMI for remote execution and begins querying endpoint telemetry for relevant artifacts. Which of the following threat hunting concepts BEST describes this approach?",
                options: ["Active defense", "Honeypot", "IoC analysis", "TTP collection"],
                correct: 0,
                domain: "Security Operations",
                explanation: "Active defense encompasses proactive, analyst-driven hunts where the defender takes the initiative to search for adversary activity before alerts fire, using threat intelligence and hypotheses about attacker techniques. IoC analysis (3) focuses on matching known artifact indicators to logs, whereas this scenario describes hypothesis-driven proactive searching - the defining characteristic of active defense in a threat-hunting context."
            },
            {
                q: "A cybersecurity team lead is building a threat intelligence sharing program and needs a method that allows machine-readable indicator exchange in a standardized format that partner organizations' SIEM platforms can automatically ingest. Which of the following technology pairings BEST meets this requirement?",
                options: ["JSON over SMTP", "OSINT via dark web forums", "CERT over CSIRT", "STIX over TAXII"],
                correct: 3,
                domain: "Security Operations",
                explanation: "STIX is the structured, machine-readable format for expressing threat intelligence objects, and TAXII is the transport protocol that carries STIX bundles between organizations for automated ingestion. JSON over SMTP (1) could theoretically carry structured data but is not a standardized threat-sharing protocol and lacks the semantic schema that STIX provides for reliable machine parsing."
            },
            {
                q: "A security operations manager is evaluating whether to deploy a honeypot on the internal network segment that hosts business-critical financial systems. The primary goal is to detect lateral movement attempts by an attacker who has already breached the perimeter. Which of the following threat-hunting concepts is this MOST aligned with?",
                options: ["Collection methods from open source", "Focus on business-critical assets", "Confidence level assessment", "TTP analysis"],
                correct: 1,
                domain: "Security Operations",
                explanation: "Deploying deception assets such as honeypots within the network segment hosting critical assets is explicitly a threat-hunting focus area under business-critical assets and processes - the honeypot acts as an early warning system for lateral movement in sensitive zones. TTP analysis (4) involves studying adversary techniques using frameworks such as MITRE ATT&CK, which would inform where to place the honeypot but does not itself describe the deployment decision."
            },
            {
                q: "A SOC manager is reviewing the team's alert-handling workflow and identifies that first-level analysts spend 40% of their time manually checking an IP reputation database, then copying the result into a ticket, then querying a WHOIS service, and repeating these steps for every alert. The tasks follow a fixed procedure that requires no analyst judgment. Which of the following efficiency concepts is MOST applicable to automate this workflow?",
                options: ["Single pane of glass", "Data enrichment via SOAR", "Threat feed combination", "API-based plugin integration"],
                correct: 1,
                domain: "Security Operations",
                explanation: "SOAR automates repeatable, rule-based tasks such as IP reputation lookups and WHOIS queries by executing them as part of an orchestrated playbook triggered on each alert, which is exactly the identification-of-tasks-suitable-for-automation principle under streamline operations. Single pane of glass (1) consolidates tool views into one console but does not itself automate the lookup steps; the automation layer is provided by the SOAR orchestration."
            },
            {
                q: "A security engineer is integrating a new threat intelligence platform with an existing SIEM so that newly ingested indicators automatically trigger searches in the SIEM log store without any manual operator action. The integration uses a real-time push mechanism where the threat platform sends a notification to the SIEM each time a new indicator is added. Which of the following technology integration methods BEST describes this approach?",
                options: ["API polling", "Plugin", "Webhook", "Single pane of glass"],
                correct: 2,
                domain: "Security Operations",
                explanation: "A webhook is an event-driven push callback that sends a notification to a destination system whenever a specified event occurs, enabling real-time push-based integration without polling. API polling (1) is a pull model where the SIEM periodically queries the threat platform for new indicators, which adds latency and is the opposite of the real-time push described."

        function hexToRgba(hex, alpha) {
            const h = hex.replace('#', '');
            const r = parseInt(h.substring(0, 2), 16);
            const g = parseInt(h.substring(2, 4), 16);
            const b = parseInt(h.substring(4, 6), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function renderQuestion() {

                    <span class="text">${escapeHtml(opt)}</span>

            const prevHtml = isFirst
                ? ''
                : `<button type="button" class="verb" onclick="prevQuestion()"><span class="key">&larr;</span>prev</button>`;

            const nextHtml = nextEnabled
                ? `<button type="button" class="verb" onclick="nextQuestion()"><span class="key">&#x21B5;</span>${nextLabel}</button>`
                : `<span class="verb disabled"><span class="key">&#x21B5;</span>${nextLabel}</span>`;

            contentDiv.innerHTML = `
                <div class="q-header">
                    <span class="count">question ${currentQuestionIndex + 1} of ${questions.length}</span>
                    <span class="domain">[ ${escapeHtml(q.domain.toLowerCase())} ]</span>
                </div>

                <div class="stem">${escapeHtml(q.q)}</div>

                <div class="options">${optionsHtml}</div>

                <div class="hints">
                    <span><span class="key">1-${q.options.length}</span>select</span>
                    ${prevHtml ? `<span>${prevHtml}</span>` : ''}
                    <span>${nextHtml}</span>
                </div>
            `;
        }

        function selectOption(i) {
            userAnswers[currentQuestionIndex] = i;
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (userAnswers[currentQuestionIndex] === null) return;
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            onResults = true;
            let correctCount = 0;
            questions.forEach((q, i) => { if (userAnswers[i] === q.correct) correctCount++; });
            const score = Math.round((correctCount / questions.length) * 100);
            const passed = score >= 83;
            progressBar.style.width = '100%';

            const reviewHtml = questions.map((q, i) => {
                const userAnswer = userAnswers[i];
                const skipped = userAnswer === null;
                const isCorrect = !skipped && userAnswer === q.correct;
                const userLabel = skipped ? '—' : `${userAnswer + 1}  ${escapeHtml(q.options[userAnswer])}`;
                const correctLabel = `${q.correct + 1}  ${escapeHtml(q.options[q.correct])}`;
                const statusGlyph = isCorrect
                    ? `<span class="glyph-correct">&#x2713;</span><span class="verdict correct">correct</span>`
                    : `<span class="glyph-incorrect">&#x2717;</span><span class="verdict incorrect">${skipped ? 'skipped' : 'incorrect'}</span>`;
                const yourLineClass = skipped ? 'skipped' : (isCorrect ? 'right' : 'wrong');
                return `
                    <div class="review-q ${isCorrect ? 'correct' : 'incorrect'}">
                        <div class="status">Q.${i + 1}${statusGlyph}</div>
                        <div class="stem-mini">${escapeHtml(q.q)}</div>
                        <div class="ans-line ${yourLineClass}">
                            <span class="ans-label">your answer:</span>
                            <span class="ans-val">${userLabel}</span>
                        </div>
                        <div class="ans-line right">
                            <span class="ans-label">correct answer:</span>
                            <span class="ans-val">${correctLabel}</span>
                        </div>
                        <div class="explanation"><span class="arrow">&rsaquo;</span>${escapeHtml(q.explanation)}</div>
                    </div>
                `;
            }).join('');

            contentDiv.innerHTML = `
                <div class="results-heading">results</div>

                <div class="score-row">
                    <span><span class="label">score</span> <span class="score-val">${score} / 100</span></span>
                    <span class="${passed ? 'verdict-pass' : 'verdict-fail'}">${passed ? 'pass' : 'fail'}</span>
                    <span class="threshold">(&ge; 83 to pass)</span>
                </div>

                <div class="stats-row">
                    <span><span class="stat-label">correct</span><span class="stat-val">${correctCount}</span></span>
                    <span><span class="stat-label">incorrect</span><span class="stat-val">${questions.length - correctCount}</span></span>
                    <span><span class="stat-label">total</span><span class="stat-val">${questions.length}</span></span>
                </div>

                <div class="review-heading">review<span class="dashes"></span></div>

                ${reviewHtml}

                <div class="retake-row">
                    <button type="button" class="verb" onclick="location.reload()"><span class="key">&#x21B5;</span>retake</button>
                </div>
            `;
            window.scrollTo(0, 0);
        }

        // --- KEYBOARD ---
        window.addEventListener('keydown', (e) => {
            const tag = document.activeElement && document.activeElement.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA') return;

            if (onResults) {
                if (e.key === 'Enter') { e.preventDefault(); location.reload(); }
                return;
            }

            if (/^[1-9]$/.test(e.key)) {
                const i = Number(e.key) - 1;
                const q = questions[currentQuestionIndex];
                if (i < q.options.length) { e.preventDefault(); selectOption(i); }
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault(); prevQuestion();
            } else if (e.key === 'ArrowRight' || e.key === 'Enter') {
                e.preventDefault(); nextQuestion();
            }
        });

        init();
    </script>
</body>
</html>
