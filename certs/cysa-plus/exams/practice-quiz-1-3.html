<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelnet Quiz</title>
    <style>
        :root {
            --bg:           #000000;
            --text-90:      rgba(255, 255, 255, 0.90);
            --text-70:      rgba(255, 255, 255, 0.70);
            --text-45:      rgba(255, 255, 255, 0.45);
            --text-30:      rgba(255, 255, 255, 0.30);
            --rule:         rgba(255, 255, 255, 0.15);
            --accent:       #38bdf8; /* Default — overridden per-quiz via ACCENT_HEX */
            --accent-tint:  rgba(56, 189, 248, 0.14); /* selected-row */
            --accent-hover: rgba(56, 189, 248, 0.08); /* hover-row */
            --pass-green:   #43c08c;
            --wrong-red:    #fb7185;
            --font-mono:    'Courier New', Courier, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { background: var(--bg); }

        body {
            font-family: var(--font-mono);
            color: var(--text-90);
            min-height: 100vh;
            padding: 32px 0 48px;
            line-height: 1.5;
            font-size: 15px;
        }

        ::selection {
            background: var(--accent-tint);
            color: #fff;
        }

        .col {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* --- Header --- */
        .title-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 24px;
            color: var(--text-90);
        }

        .title-row .meta {
            color: var(--text-45);
            font-size: 13px;
        }

        .rule {
            border-top: 1px solid var(--rule);
            margin: 12px 0 0;
        }

        .progress {
            height: 2px;
            background: rgba(255, 255, 255, 0.06);
            margin-top: 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.25s ease;
        }

        /* --- Question --- */
        .content { margin-top: 32px; }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 4px 24px;
            color: var(--text-70);
            font-size: 13px;
        }

        .q-header .count { color: var(--accent); }
        .q-header .domain { color: var(--text-45); }

        .stem {
            color: var(--text-90);
            font-size: 17px;
            line-height: 1.6;
            margin: 24px 0 32px;
        }

        .options { display: flex; flex-direction: column; gap: 2px; }

        .option {
            display: flex;
            align-items: baseline;
            gap: 18px;
            padding: 10px 12px;
            cursor: pointer;
            background: transparent;
            border: 0;
            color: var(--text-90);
            font: inherit;
            text-align: left;
            width: 100%;
            transition: background-color 0.12s ease;
        }

        .option:hover { background: var(--accent-hover); }
        .option.selected { background: var(--accent-tint); }

        .option .label {
            color: var(--text-45);
            min-width: 1.5ch;
        }

        .option.selected .label { color: var(--accent); }

        .option .text { flex: 1; }

        /* --- Footer hints --- */
        .hints {
            margin-top: 32px;
            color: var(--text-45);
            font-size: 13px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 18px;
        }

        .hints .key { color: var(--accent); margin-right: 4px; }
        .hints .verb { color: var(--text-90); }
        .hints .verb:hover { text-decoration: underline; }
        .hints .verb.disabled { color: var(--text-30); cursor: not-allowed; }
        .hints .verb.disabled:hover { text-decoration: none; }

        button.verb {
            background: transparent;
            border: 0;
            font: inherit;
            padding: 0;
            cursor: pointer;
        }

        /* --- Results --- */
        .results-heading {
            color: var(--text-70);
            font-size: 15px;
            margin-bottom: 0;
        }

        .score-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 28px;
            margin-top: 28px;
            align-items: baseline;
        }

        .score-row .label { color: var(--text-45); }
        .score-row .score-val { color: var(--text-90); }
        .score-row .verdict-pass { color: var(--pass-green); }
        .score-row .verdict-fail { color: var(--wrong-red); }
        .score-row .threshold   { color: var(--text-45); }

        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 36px;
            margin-top: 16px;
            align-items: baseline;
        }

        .stats-row .stat-label { color: var(--text-45); margin-right: 8px; }
        .stats-row .stat-val   { color: var(--text-90); }

        .review-heading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-70);
            margin: 36px 0 16px;
        }

        .review-heading .dashes {
            color: var(--text-30);
            flex: 1;
            border-top: 1px solid var(--rule);
            margin-left: 4px;
            transform: translateY(1px);
        }

        .review-q {
            border-left: 2px solid var(--text-30);
            padding: 0 0 8px 14px;
            margin-bottom: 20px;
        }

        .review-q.correct   { border-left-color: var(--accent); }
        .review-q.incorrect { border-left-color: var(--wrong-red); }

        .review-q .status {
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-70);
        }

        .review-q .status .glyph-correct   { color: var(--accent); margin: 0 8px; }
        .review-q .status .glyph-incorrect { color: var(--wrong-red); margin: 0 8px; }
        .review-q .status .verdict.correct   { color: var(--accent); }
        .review-q .status .verdict.incorrect { color: var(--wrong-red); }

        .review-q .stem-mini {
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 10px;
            line-height: 1.55;
        }

        .review-q .ans-line {
            display: grid;
            grid-template-columns: 18ch 1fr;
            gap: 4px 8px;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .review-q .ans-line .ans-label { color: var(--text-45); }
        .review-q .ans-line.right .ans-val { color: var(--accent); }
        .review-q .ans-line.wrong .ans-val { color: var(--wrong-red); }
        .review-q .ans-line.skipped .ans-val { color: var(--text-45); }

        .review-q .explanation {
            margin-top: 10px;
            color: var(--text-70);
            font-size: 14px;
            line-height: 1.55;
        }

        .review-q .explanation .arrow { color: var(--accent); margin-right: 6px; }

        .retake-row {
            margin-top: 36px;
            text-align: center;
            color: var(--text-90);
        }

        .retake-row .key { color: var(--accent); margin-right: 4px; }
        .retake-row button.verb:hover { text-decoration: underline; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--accent); }
        * { scrollbar-width: thin; scrollbar-color: var(--accent) #000; }

        /* Mobile */
        @media (max-width: 600px) {
            .col { padding: 0 24px; }
            .stem { font-size: 16px; }
            body { font-size: 14px; padding: 24px 0 36px; }
            .review-q .ans-line { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="col">
        <div class="title-row">
            <span id="quizTitle">quiz</span>
            <span class="meta" id="quizMeta">— · — · 0q</span>
        </div>
        <div class="rule"></div>
        <div class="progress"><div class="progress-fill" id="progressBar"></div></div>

        <div class="content" id="examContent"></div>
    </div>

    <script>
        // ============================================================
        // QUIZ CONFIG — edit this block when deriving a new quiz.
        // Leave the rest of this file unchanged.
        // ============================================================
        const QUIZ_TITLE    = "practice quiz 1.3";
        const QUIZ_SUBTITLE = "cysa-plus · obj 1.3";
        const ACCENT_HEX    = "#22d3ee";

        const questions = [
            {
                q: "A SOC analyst is parsing authentication log lines to extract all source IP addresses that appear in failed-login events. The log format is consistent and the analyst wants to apply a pattern to match and capture only the IP field from each matching line without loading the logs into a SIEM. Which of the following tools or techniques is MOST appropriate for this task?",
                options: ["Regular expressions", "awk", "grep", "jq"],
                correct: 0,
                domain: "Security Operations",
                explanation: "Regular expressions define a character-pattern syntax that can match and capture specific fields within text; applying a regex to the log lines directly extracts the IP field from each failed-login entry. awk (2) is a CLI text-processing tool that can apply field-based rules but is not the underlying pattern syntax being selected here; a regex is the technique, awk is one tool that can execute it."
            },
            {
                q: "A SOC analyst is responding to a suspected intrusion on a headless Linux server and needs to capture packets using BPF filter syntax in a scriptable, lightweight manner without a graphical interface. Which of the following tools is MOST appropriate?",
                options: ["Wireshark", "tcpdump", "Zeek", "Nmap"],
                correct: 1,
                domain: "Security Operations",
                explanation: "tcpdump is a command-line packet capture tool that accepts BPF filter expressions and is scriptable on headless Linux systems. Wireshark (1) is in the same packet capture family but requires a graphical environment and is not the tool used for scriptable headless capture."
            },
            {
                q: "A security analyst has collected raw packet data from a suspicious network segment and wants to analyze it by converting the traffic into structured connection logs showing session metadata, rather than inspecting individual frames. Which of the following tools BEST provides this capability?",
                options: ["tcpdump", "Zeek", "Wireshark", "Snort"],
                correct: 1,
                domain: "Security Operations",
                explanation: "Zeek (formerly Bro) is a network security monitoring tool that processes traffic and generates rich, structured connection log files (conn.log, dns.log, http.log, etc.) rather than raw packet captures. Wireshark (3) is in the same network analysis family but produces raw packet capture files, not pre-parsed connection log metadata."
            },
            {
                q: "A SOC analyst is correlating authentication events, firewall logs, and endpoint telemetry from dozens of sources to identify whether a specific user account was involved in lateral movement over the past 72 hours. Which of the following tools BEST supports this large-scale log search and correlation task?",
                options: ["SIEM", "SOAR", "EDR", "Wireshark"],
                correct: 0,
                domain: "Security Operations",
                explanation: "A SIEM aggregates, indexes, and correlates log data from multiple sources, enabling timeline reconstruction and cross-source queries. SOAR (2) builds on SIEM by automating response playbooks but is not the primary tool for search and correlation of historical log data."
            },
            {
                q: "A security analyst has identified a confirmed phishing campaign and wants to automatically enrich alerts with threat intelligence, open a ticket in the ITSM system, and notify the affected user via email without manual intervention. Which of the following tools BEST enables this automated response workflow?",
                options: ["SOAR", "EDR", "SIEM", "AbuseIPDB"],
                correct: 0,
                domain: "Security Operations",
                explanation: "SOAR platforms execute playbooks that automate and orchestrate multi-step response actions across security tools, ITSM systems, and communication channels. A SIEM (3) can generate the initial alert but cannot natively execute the downstream ticket creation and notification workflow without SOAR orchestration."
            },
            {
                q: "A tier-2 analyst is investigating a Windows endpoint where a user reported unexpected behavior. The analyst wants to detect malicious processes, collect endpoint telemetry, and remotely contain the host without relying on a centralized log search tool. Which of the following tools is MOST appropriate for this task?",
                options: ["SIEM", "SOAR", "XDR", "EDR"],
                correct: 3,
                domain: "Security Operations",
                explanation: "EDR provides real-time endpoint telemetry, process visibility, and remote containment capabilities directly on the endpoint, making it the appropriate tool for investigating and containing a potentially compromised host. XDR (3) extends detection across multiple telemetry domains but its cross-domain correlation value-add is not needed when the scope is a single Windows endpoint requiring direct telemetry and containment."
            },
            {
                q: "A security analyst receives a suspicious email and wants to verify whether the sending domain is authorized to use the sending IP address by checking the DNS record that lists permitted mail servers. Which of the following email analysis concepts addresses this check?",
                options: ["SPF", "DMARC", "DKIM", "Header analysis"],
                correct: 0,
                domain: "Security Operations",
                explanation: "SPF is a DNS record that specifies which IP addresses are authorized to send email on behalf of a domain; checking SPF validates that the sending server is legitimate. DKIM (3) uses a cryptographic signature to verify the email content has not been altered, but it does not specify authorized sending IPs."
            },
            {
                q: "A SOC analyst is triaging a suspicious email and wants to verify that the email content was not modified in transit by checking a cryptographic signature embedded in the email headers that was applied by the sending mail server. Which of the following email authentication mechanisms does this describe?",
                options: ["SPF", "DKIM", "DMARC", "Header analysis"],
                correct: 1,
                domain: "Security Operations",
                explanation: "DKIM uses a public/private key pair to sign email messages; the receiving server verifies the signature in the headers against a public key published in DNS to confirm the message was not modified. SPF (1) validates the sending IP but does not protect message integrity."
            },
            {
                q: "A security analyst receives an unknown Windows executable submitted by a user who accidentally downloaded it. The analyst wants to quickly identify printable strings embedded in the binary to look for hardcoded URLs, registry keys, or other artifacts without executing the file. Which of the following tools is MOST appropriate?",
                options: ["VirusTotal", "Joe Sandbox", "Cuckoo Sandbox", "Strings"],
                correct: 3,
                domain: "Security Operations",
                explanation: "The Strings utility extracts printable character sequences from a binary file, providing a fast static analysis view of embedded artifacts such as URLs, file paths, and registry keys. VirusTotal (1) is also used for file analysis but performs multi-engine reputation lookups rather than extracting embedded string artifacts."
            },
            {
                q: "A security analyst wants to submit an unknown executable to a controlled environment that will run the file and monitor all system calls, network connections, file writes, and registry modifications generated by the process. The analyst needs a dynamic analysis result report. Which of the following tools is MOST appropriate?",
                options: ["Strings", "VirusTotal", "AbuseIPDB", "Cuckoo Sandbox"],
                correct: 3,
                domain: "Security Operations",
                explanation: "Cuckoo Sandbox is an open-source automated malware analysis sandbox that detonates files in an isolated environment and generates dynamic analysis reports covering process behavior, network activity, and file system changes. VirusTotal (2) performs reputation lookups across multiple AV engines but does not provide the behavioral dynamic analysis that a sandbox produces."
            },
            {
                q: "A SOC analyst has the SHA-256 hash of a suspicious file and wants to check whether it has been flagged as malicious by multiple antivirus vendors without uploading the file. Which of the following tools is MOST appropriate?",
                options: ["Cuckoo Sandbox", "Joe Sandbox", "Strings", "VirusTotal"],
                correct: 3,
                domain: "Security Operations",
                explanation: "VirusTotal accepts file hashes and checks them against the detection results of 70+ antivirus engines, providing a reputation verdict without requiring the file to be uploaded. Sandboxes (A, B) perform dynamic detonation and require the actual file; they do not accept hashes for multi-engine reputation lookups."
            },
            {
                q: "A security analyst is investigating a domain used in a phishing campaign and wants to identify the registrant organization, registration date, and name servers associated with the domain. Which of the following DNS and IP reputation tools is MOST appropriate?",
                options: ["AbuseIPDB", "Nmap", "WHOIS", "VirusTotal"],
                correct: 2,
                domain: "Security Operations",
                explanation: "WHOIS queries domain and IP registration records to retrieve ownership, registration dates, and name server information. AbuseIPDB (1) is in the same DNS/IP reputation grouping but focuses on crowd-sourced IP abuse reports, not domain registration metadata."
            },
            {
                q: "A threat analyst is investigating a series of alerts and needs to check whether an external IP address has a history of malicious activity reported by other organizations, including abuse type, number of reports, and country of origin. Which of the following tools BEST supports this lookup?",
                options: ["WHOIS", "Nmap", "AbuseIPDB", "Strings"],
                correct: 2,
                domain: "Security Operations",
                explanation: "AbuseIPDB is a crowd-sourced database of IP addresses reported for malicious activity; it provides abuse category, report count, and geographic origin. WHOIS (1) is also an IP reputation tool but returns registration and ownership data, not community abuse reports."
            },
            {
                q: "A security analyst is reviewing a PowerShell script found on a compromised endpoint and notices that the script uses Base64-encoded strings, character substitution, and concatenated variable names to hide its true function. Which of the following common techniques is the analyst identifying?",
                options: ["Email header analysis", "Interpreting suspicious commands", "User behavior analysis", "Hashing"],
                correct: 1,
                domain: "Security Operations",
                explanation: "Interpreting suspicious commands involves analyzing obfuscated scripts or command-line arguments to decode or reconstruct the actual malicious intent, which is precisely what the analyst is doing with the obfuscated PowerShell. Email header analysis (1) is a separate technique used for phishing investigation, not script de-obfuscation."
            },
            {
                q: "A security analyst is reviewing authentication logs and discovers that a user account logged in from Singapore and then from New York 45 minutes later. The analyst flags this as physically impossible travel time. Which of the following user behavior analysis techniques has the analyst applied?",
                options: ["Pattern recognition: command and control", "Email analysis: impersonation detection", "User behavior analysis: impossible travel", "File analysis: hashing"],
                correct: 2,
                domain: "Security Operations",
                explanation: "Impossible travel detection is a user behavior analysis technique that flags authentications from geographically distant locations within a time window that is physically impossible to traverse. Pattern recognition for C2 (1) focuses on network communication patterns to known C2 infrastructure, not authentication geolocation anomalies."
            }
        ];

        // ============================================================
        // END CONFIG — chrome below is shared. Do not edit when deriving.
        // ============================================================

        function hexToRgba(hex, alpha) {
            const h = hex.replace('#', '');
            const r = parseInt(h.substring(0, 2), 16);
            const g = parseInt(h.substring(2, 4), 16);
            const b = parseInt(h.substring(4, 6), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // --- APP STATE ---
        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let onResults = false;

        // --- DOM ---
        const contentDiv = document.getElementById('examContent');
        const progressBar = document.getElementById('progressBar');

        // --- INIT ---
        function init() {
            document.title = QUIZ_TITLE;
            document.getElementById('quizTitle').textContent = QUIZ_TITLE;
            document.getElementById('quizMeta').textContent =
                `${QUIZ_SUBTITLE} · ${questions.length}q`;
            document.documentElement.style.setProperty('--accent', ACCENT_HEX);
            document.documentElement.style.setProperty('--accent-tint',  hexToRgba(ACCENT_HEX, 0.14));
            document.documentElement.style.setProperty('--accent-hover', hexToRgba(ACCENT_HEX, 0.08));
            renderQuestion();
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // --- RENDER ---
        function renderQuestion() {
            onResults = false;
            const q = questions[currentQuestionIndex];
            const isLast = currentQuestionIndex === questions.length - 1;
            const isFirst = currentQuestionIndex === 0;
            const picked = userAnswers[currentQuestionIndex];

            progressBar.style.width = `${(currentQuestionIndex / questions.length) * 100}%`;

            const optionsHtml = q.options.map((opt, i) => `
                <button type="button"
                        class="option ${picked === i ? 'selected' : ''}"
                        onclick="selectOption(${i})">
                    <span class="label">${i + 1}</span>
                    <span class="text">${escapeHtml(opt)}</span>
                </button>
            `).join('');

            const prevHtml = isFirst
                ? ''
                : `<button type="button" class="verb" onclick="prevQuestion()"><span class="key">&larr;</span>prev</button>`;

            const nextLabel = isLast ? 'finish' : 'next';
            const nextEnabled = picked !== null;
            const nextHtml = nextEnabled
                ? `<button type="button" class="verb" onclick="nextQuestion()"><span class="key">&#x21B5;</span>${nextLabel}</button>`
                : `<span class="verb disabled"><span class="key">&#x21B5;</span>${nextLabel}</span>`;

            contentDiv.innerHTML = `
                <div class="q-header">
                    <span class="count">question ${currentQuestionIndex + 1} of ${questions.length}</span>
                    <span class="domain">[ ${escapeHtml(q.domain.toLowerCase())} ]</span>
                </div>

                <div class="stem">${escapeHtml(q.q)}</div>

                <div class="options">${optionsHtml}</div>

                <div class="hints">
                    <span><span class="key">1-${q.options.length}</span>select</span>
                    ${prevHtml ? `<span>${prevHtml}</span>` : ''}
                    <span>${nextHtml}</span>
                </div>
            `;
        }

        function selectOption(i) {
            userAnswers[currentQuestionIndex] = i;
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (userAnswers[currentQuestionIndex] === null) return;
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            onResults = true;
            let correctCount = 0;
            questions.forEach((q, i) => { if (userAnswers[i] === q.correct) correctCount++; });
            const score = Math.round((correctCount / questions.length) * 100);
            const passed = score >= 83;
            progressBar.style.width = '100%';

            const reviewHtml = questions.map((q, i) => {
                const userAnswer = userAnswers[i];
                const skipped = userAnswer === null;
                const isCorrect = !skipped && userAnswer === q.correct;
                const userLabel = skipped ? '—' : `${userAnswer + 1}  ${escapeHtml(q.options[userAnswer])}`;
                const correctLabel = `${q.correct + 1}  ${escapeHtml(q.options[q.correct])}`;
                const statusGlyph = isCorrect
                    ? `<span class="glyph-correct">&#x2713;</span><span class="verdict correct">correct</span>`
                    : `<span class="glyph-incorrect">&#x2717;</span><span class="verdict incorrect">${skipped ? 'skipped' : 'incorrect'}</span>`;
                const yourLineClass = skipped ? 'skipped' : (isCorrect ? 'right' : 'wrong');
                return `
                    <div class="review-q ${isCorrect ? 'correct' : 'incorrect'}">
                        <div class="status">Q.${i + 1}${statusGlyph}</div>
                        <div class="stem-mini">${escapeHtml(q.q)}</div>
                        <div class="ans-line ${yourLineClass}">
                            <span class="ans-label">your answer:</span>
                            <span class="ans-val">${userLabel}</span>
                        </div>
                        <div class="ans-line right">
                            <span class="ans-label">correct answer:</span>
                            <span class="ans-val">${correctLabel}</span>
                        </div>
                        <div class="explanation"><span class="arrow">&rsaquo;</span>${escapeHtml(q.explanation)}</div>
                    </div>
                `;
            }).join('');

            contentDiv.innerHTML = `
                <div class="results-heading">results</div>

                <div class="score-row">
                    <span><span class="label">score</span> <span class="score-val">${score} / 100</span></span>
                    <span class="${passed ? 'verdict-pass' : 'verdict-fail'}">${passed ? 'pass' : 'fail'}</span>
                    <span class="threshold">(&ge; 83 to pass)</span>
                </div>

                <div class="stats-row">
                    <span><span class="stat-label">correct</span><span class="stat-val">${correctCount}</span></span>
                    <span><span class="stat-label">incorrect</span><span class="stat-val">${questions.length - correctCount}</span></span>
                    <span><span class="stat-label">total</span><span class="stat-val">${questions.length}</span></span>
                </div>

                <div class="review-heading">review<span class="dashes"></span></div>

                ${reviewHtml}

                <div class="retake-row">
                    <button type="button" class="verb" onclick="location.reload()"><span class="key">&#x21B5;</span>retake</button>
                </div>
            `;
            window.scrollTo(0, 0);
        }

        // --- KEYBOARD ---
        window.addEventListener('keydown', (e) => {
            const tag = document.activeElement && document.activeElement.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA') return;

            if (onResults) {
                if (e.key === 'Enter') { e.preventDefault(); location.reload(); }
                return;
            }

            if (/^[1-9]$/.test(e.key)) {
                const i = Number(e.key) - 1;
                const q = questions[currentQuestionIndex];
                if (i < q.options.length) { e.preventDefault(); selectOption(i); }
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault(); prevQuestion();
            } else if (e.key === 'ArrowRight' || e.key === 'Enter') {
                e.preventDefault(); nextQuestion();
            }
        });

        init();
    </script>
</body>
</html>
