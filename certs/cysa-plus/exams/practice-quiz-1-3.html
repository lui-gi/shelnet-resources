<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelnet Quiz</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #0c0c0c;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --border-color: rgba(255, 255, 255, 0.15);
            --accent: #3b82f6; /* Default — overridden per-quiz via ACCENT_HEX in CONFIG */
            --accent-dim: rgba(59, 130, 246, 0.1); /* Default — overridden via setProperty in init() */
            --accent-glow: rgba(59, 130, 246, 0.4); /* Default — overridden via setProperty in init() */
            --accent-select: rgba(59, 130, 246, 0.3); /* Default — overridden via setProperty in init() */
            --accent-red: #ef4444;
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            /* Grid Background Effect */
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Selection Color */
        ::selection {
            background: var(--accent-select);
            color: #dbeafe;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            position: relative;
            z-index: 10;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            min-height: 600px;
            display: flex;
            flex-direction: column;
        }

        /* --- Terminal Header Bar --- */
        .terminal-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-color);
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot.red { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); }
        .dot.yellow { background: rgba(234, 179, 8, 0.2); border: 1px solid rgba(234, 179, 8, 0.5); }
        .dot.green { background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.5); }

        /* --- Brutal Header Section --- */
        .header {
            padding: 40px 40px 20px 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 10px;
            line-height: 1;
        }

        .header .subtitle {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            display: block;
        }

        /* --- Progress Bar --- */
        .progress-container {
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.1);
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--accent);
        }

        /* --- Content Area --- */
        .content {
            padding: 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px dashed var(--border-color);
        }

        .question-number {
            font-family: var(--font-mono);
            color: var(--accent);
            font-size: 0.9rem;
        }

        .domain-tag {
            font-family: var(--font-mono);
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .question-text {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 40px;
            color: #eee;
            font-weight: 400;
        }

        /* --- Options --- */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            position: relative;
        }

        .option:hover {
            border-color: var(--accent);
            background: rgba(255,255,255,0.04);
        }

        .option.selected {
            background: var(--accent-dim);
            border-color: var(--accent);
        }

        .option-label {
            font-family: var(--font-mono);
            margin-right: 20px;
            color: var(--text-muted);
            font-weight: bold;
            min-width: 25px;
        }

        .option.selected .option-label {
            color: var(--accent);
        }

        .option-text {
            flex: 1;
            font-size: 1rem;
            color: rgba(255,255,255,0.8);
        }

        .option.selected .option-text {
            color: #fff;
        }

        /* --- Buttons --- */
        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 50px;
        }

        .btn {
            padding: 12px 24px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: #fff;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover:not(:disabled) {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .btn-primary {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: var(--border-color);
        }

        /* --- Results Screen --- */
        .results {
            animation: fadeIn 0.5s ease;
        }

        .score-card {
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.02);
            padding: 40px;
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        /* Terminal scanline effect for score */
        .score-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: rgba(255,255,255,0.1);
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .score-number {
            font-size: 5rem;
            font-weight: bold;
            font-family: var(--font-mono);
            margin: 10px 0;
            color: #fff;
        }

        .pass-fail {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            padding: 10px 20px;
            display: inline-block;
            border: 1px solid currentColor;
            margin-top: 20px;
        }

        .pass { color: var(--accent); }
        .fail { color: var(--accent-red); }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            padding: 20px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            font-family: var(--font-mono);
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-family: var(--font-mono);
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Review Section */
        .review-question {
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.02);
            padding: 25px;
            margin-bottom: 20px;
            border-left: 4px solid transparent;
        }

        .review-question.correct { border-left-color: var(--accent); }
        .review-question.incorrect { border-left-color: var(--accent-red); }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .review-status.correct { color: var(--accent); }
        .review-status.incorrect { color: var(--accent-red); }

        .review-text {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 20px;
        }

        .review-answers {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            padding: 15px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .answer-line {
            margin-bottom: 8px;
            display: flex;
        }

        .answer-line strong {
            width: 140px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .explanation {
            margin-top: 15px;
            padding: 15px;
            border-left: 2px solid var(--text-muted);
            background: rgba(255,255,255,0.03);
            font-size: 0.95rem;
            color: #ccc;
        }

        .explanation-title {
            font-family: var(--font-mono);
            text-transform: uppercase;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0c0c0c;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--accent) #0c0c0c;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .header h1 { font-size: 2rem; }
            .content { padding: 20px; }
            .question-header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .score-number { font-size: 3rem; }
            .navigation { flex-direction: column; gap: 15px; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="terminal-bar">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
            <span style="margin-left: 10px;">bash — user@shelnet-exam: ~</span>
        </div>

        <div class="header">
            <h1 id="quizTitle">Quiz Title</h1>
            <div class="subtitle" id="quizSubtitle">C:\Shelnet\Quizzes> Objective</div>
        </div>

        <div class="progress-container">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <div class="content" id="examContent">
            </div>
    </div>

    <script>
        // ============================================================
        // QUIZ CONFIG — edit this block when deriving a new quiz.
        // Leave the rest of this file unchanged.
        // ============================================================
        const QUIZ_TITLE    = 'Practice Quiz 1.3';
        const QUIZ_SUBTITLE = 'C:\\Shelnet\\Quizzes> CS0-003 Objective 1.3';
        const ACCENT_HEX    = '#06b6d4';

        const questions = [
            {
                q: 'A security analyst needs to capture all network packets traversing a corporate switch port and inspect the full payload of individual frames using a GUI to follow TCP streams and decode protocols. Which of the following tools BEST meets this requirement?',
                options: [
                    'A. Zeek',
                    'B. tcpdump',
                    'C. Nmap',
                    'D. Wireshark'
                ],
                correct: 3,
                domain: 'Security Operations',
                explanation: 'Wireshark provides GUI-based packet capture with deep protocol decoding, stream following, and frame-level payload inspection. tcpdump (B) is the correct category (packet capture) but is command-line only with no GUI and limited protocol decode depth.'
            },
            {
                q: 'A SOC analyst is responding to a suspected intrusion on a headless Linux server and needs to capture packets using BPF filter syntax in a scriptable, lightweight manner without a graphical interface. Which of the following tools is MOST appropriate?',
                options: [
                    'A. Wireshark',
                    'B. tcpdump',
                    'C. Zeek',
                    'D. Nmap'
                ],
                correct: 1,
                domain: 'Security Operations',
                explanation: 'tcpdump is a command-line packet capture tool that accepts BPF filter expressions and is scriptable on headless Linux systems. Wireshark (A) is in the same packet capture family but requires a graphical environment and is not the tool used for scriptable headless capture.'
            },
            {
                q: 'A security analyst has collected raw packet data from a suspicious network segment and wants to analyze it by converting the traffic into structured connection logs showing session metadata, rather than inspecting individual frames. Which of the following tools BEST provides this capability?',
                options: [
                    'A. tcpdump',
                    'B. Zeek',
                    'C. Wireshark',
                    'D. Snort'
                ],
                correct: 1,
                domain: 'Security Operations',
                explanation: 'Zeek (formerly Bro) is a network security monitoring tool that processes traffic and generates rich, structured connection log files (conn.log, dns.log, http.log, etc.) rather than raw packet captures. Wireshark (C) is in the same network analysis family but produces raw packet capture files, not pre-parsed connection log metadata.'
            },
            {
                q: 'A SOC analyst is correlating authentication events, firewall logs, and endpoint telemetry from dozens of sources to identify whether a specific user account was involved in lateral movement over the past 72 hours. Which of the following tools BEST supports this large-scale log search and correlation task?',
                options: [
                    'A. EDR',
                    'B. SOAR',
                    'C. SIEM',
                    'D. Wireshark'
                ],
                correct: 2,
                domain: 'Security Operations',
                explanation: 'A SIEM aggregates, indexes, and correlates log data from multiple sources, enabling timeline reconstruction and cross-source queries. SOAR (B) builds on SIEM by automating response playbooks but is not the primary tool for search and correlation of historical log data.'
            },
            {
                q: 'A security analyst has identified a confirmed phishing campaign and wants to automatically enrich alerts with threat intelligence, open a ticket in the ITSM system, and notify the affected user via email without manual intervention. Which of the following tools BEST enables this automated response workflow?',
                options: [
                    'A. SIEM',
                    'B. EDR',
                    'C. SOAR',
                    'D. AbuseIPDB'
                ],
                correct: 2,
                domain: 'Security Operations',
                explanation: 'SOAR platforms execute playbooks that automate and orchestrate multi-step response actions across security tools, ITSM systems, and communication channels. A SIEM (A) can generate the initial alert but cannot natively execute the downstream ticket creation and notification workflow without SOAR orchestration.'
            },
            {
                q: 'A tier-2 analyst is investigating a Windows endpoint where a user reported unexpected behavior. The analyst wants to detect malicious processes, collect endpoint telemetry, and remotely contain the host without relying on a centralized log search tool. Which of the following tools is MOST appropriate for this task?',
                options: [
                    'A. SIEM',
                    'B. SOAR',
                    'C. UEBA',
                    'D. EDR'
                ],
                correct: 3,
                domain: 'Security Operations',
                explanation: 'EDR provides real-time endpoint telemetry, process visibility, and remote containment capabilities directly on the endpoint, making it the appropriate tool for investigating and containing a potentially compromised host. SIEM (A) aggregates logs centrally but does not provide direct endpoint telemetry or remote containment.'
            },
            {
                q: 'A security analyst receives a suspicious email and wants to verify whether the sending domain is authorized to use the sending IP address by checking the DNS record that lists permitted mail servers. Which of the following email analysis concepts addresses this check?',
                options: [
                    'A. DKIM',
                    'B. DMARC',
                    'C. SPF',
                    'D. Header analysis'
                ],
                correct: 2,
                domain: 'Security Operations',
                explanation: 'SPF is a DNS record that specifies which IP addresses are authorized to send email on behalf of a domain; checking SPF validates that the sending server is legitimate. DKIM (A) uses a cryptographic signature to verify the email content has not been altered, but it does not specify authorized sending IPs.'
            },
            {
                q: 'A SOC analyst is triaging a suspicious email and wants to verify that the email content was not modified in transit by checking a cryptographic signature embedded in the email headers that was applied by the sending mail server. Which of the following email authentication mechanisms does this describe?',
                options: [
                    'A. SPF',
                    'B. DKIM',
                    'C. DMARC',
                    'D. Header analysis'
                ],
                correct: 1,
                domain: 'Security Operations',
                explanation: 'DKIM uses a public/private key pair to sign email messages; the receiving server verifies the signature in the headers against a public key published in DNS to confirm the message was not modified. SPF (A) validates the sending IP but does not protect message integrity.'
            },
            {
                q: 'A security analyst receives an unknown Windows executable submitted by a user who accidentally downloaded it. The analyst wants to quickly identify printable strings embedded in the binary to look for hardcoded URLs, registry keys, or other artifacts without executing the file. Which of the following tools is MOST appropriate?',
                options: [
                    'A. VirusTotal',
                    'B. Joe Sandbox',
                    'C. Cuckoo Sandbox',
                    'D. Strings'
                ],
                correct: 3,
                domain: 'Security Operations',
                explanation: 'The Strings utility extracts printable character sequences from a binary file, providing a fast static analysis view of embedded artifacts such as URLs, file paths, and registry keys. VirusTotal (A) is also used for file analysis but performs multi-engine reputation lookups rather than extracting embedded string artifacts.'
            },
            {
                q: 'A security analyst wants to submit an unknown executable to a controlled environment that will run the file and monitor all system calls, network connections, file writes, and registry modifications generated by the process. The analyst needs a dynamic analysis result report. Which of the following tools is MOST appropriate?',
                options: [
                    'A. Strings',
                    'B. VirusTotal',
                    'C. AbuseIPDB',
                    'D. Cuckoo Sandbox'
                ],
                correct: 3,
                domain: 'Security Operations',
                explanation: 'Cuckoo Sandbox is an open-source automated malware analysis sandbox that detonates files in an isolated environment and generates dynamic analysis reports covering process behavior, network activity, and file system changes. VirusTotal (B) performs reputation lookups across multiple AV engines but does not provide the behavioral dynamic analysis that a sandbox produces.'
            },
            {
                q: 'A SOC analyst has the SHA-256 hash of a suspicious file and wants to check whether it has been flagged as malicious by multiple antivirus vendors without uploading the file. Which of the following tools is MOST appropriate?',
                options: [
                    'A. Cuckoo Sandbox',
                    'B. Joe Sandbox',
                    'C. Strings',
                    'D. VirusTotal'
                ],
                correct: 3,
                domain: 'Security Operations',
                explanation: 'VirusTotal accepts file hashes and checks them against the detection results of 70+ antivirus engines, providing a reputation verdict without requiring the file to be uploaded. Sandboxes (A, B) perform dynamic detonation and require the actual file; they do not accept hashes for multi-engine reputation lookups.'
            },
            {
                q: 'A security analyst is investigating a domain used in a phishing campaign and wants to identify the registrant organization, registration date, and name servers associated with the domain. Which of the following DNS and IP reputation tools is MOST appropriate?',
                options: [
                    'A. AbuseIPDB',
                    'B. Nmap',
                    'C. WHOIS',
                    'D. VirusTotal'
                ],
                correct: 2,
                domain: 'Security Operations',
                explanation: 'WHOIS queries domain and IP registration records to retrieve ownership, registration dates, and name server information. AbuseIPDB (A) is in the same DNS/IP reputation grouping but focuses on crowd-sourced IP abuse reports, not domain registration metadata.'
            },
            {
                q: 'A threat analyst is investigating a series of alerts and needs to check whether an external IP address has a history of malicious activity reported by other organizations, including abuse type, number of reports, and country of origin. Which of the following tools BEST supports this lookup?',
                options: [
                    'A. WHOIS',
                    'B. Nmap',
                    'C. AbuseIPDB',
                    'D. Strings'
                ],
                correct: 2,
                domain: 'Security Operations',
                explanation: 'AbuseIPDB is a crowd-sourced database of IP addresses reported for malicious activity; it provides abuse category, report count, and geographic origin. WHOIS (A) is also an IP reputation tool but returns registration and ownership data, not community abuse reports.'
            },
            {
                q: 'A security analyst is reviewing a PowerShell script found on a compromised endpoint and notices that the script uses Base64-encoded strings, character substitution, and concatenated variable names to hide its true function. Which of the following common techniques is the analyst identifying?',
                options: [
                    'A. Email header analysis',
                    'B. Interpreting suspicious commands',
                    'C. User behavior analysis',
                    'D. Hashing'
                ],
                correct: 1,
                domain: 'Security Operations',
                explanation: 'Interpreting suspicious commands involves analyzing obfuscated scripts or command-line arguments to decode or reconstruct the actual malicious intent, which is precisely what the analyst is doing with the obfuscated PowerShell. Email header analysis (A) is a separate technique used for phishing investigation, not script de-obfuscation.'
            },
            {
                q: 'A security analyst is reviewing authentication logs and discovers that a user account logged in from Singapore and then from New York 45 minutes later. The analyst flags this as physically impossible travel time. Which of the following user behavior analysis techniques has the analyst applied?',
                options: [
                    'A. Pattern recognition: command and control',
                    'B. Email analysis: impersonation detection',
                    'C. User behavior analysis: impossible travel',
                    'D. File analysis: hashing'
                ],
                correct: 2,
                domain: 'Security Operations',
                explanation: 'Impossible travel detection is a user behavior analysis technique that flags authentications from geographically distant locations within a time window that is physically impossible to traverse. Pattern recognition for C2 (A) focuses on network communication patterns to known C2 infrastructure, not authentication geolocation anomalies.'
            }
        ];

        // ============================================================
        // END CONFIG — chrome below is shared. Do not edit when deriving.
        // ============================================================

        // Small util: convert '#06b6d4' -> 'rgba(6, 182, 212, 0.1)' for the dim variant.
        function hexToRgba(hex, alpha) {
            const h = hex.replace('#', '');
            const r = parseInt(h.substring(0, 2), 16);
            const g = parseInt(h.substring(2, 4), 16);
            const b = parseInt(h.substring(4, 6), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // --- APP STATE ---
        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);

        // --- DOM ELEMENTS ---
        const contentDiv = document.getElementById('examContent');
        const progressBar = document.getElementById('progressBar');

        // --- INITIALIZATION ---
        function init() {
            // --- Apply CONFIG ---
            document.title = QUIZ_TITLE;
            document.getElementById('quizTitle').textContent = QUIZ_TITLE;
            document.getElementById('quizSubtitle').textContent = QUIZ_SUBTITLE;
            document.documentElement.style.setProperty('--accent', ACCENT_HEX);
            document.documentElement.style.setProperty('--accent-dim', hexToRgba(ACCENT_HEX, 0.1));
            document.documentElement.style.setProperty('--accent-glow', hexToRgba(ACCENT_HEX, 0.4));
            document.documentElement.style.setProperty('--accent-select', hexToRgba(ACCENT_HEX, 0.3));

            // --- existing init body continues below ---
            renderQuestion();
        }

        // --- RENDER FUNCTIONS ---
        function renderQuestion() {
            const q = questions[currentQuestionIndex];
            const isLastQuestion = currentQuestionIndex === questions.length - 1;

            // Update Progress
            const progress = ((currentQuestionIndex) / questions.length) * 100;
            progressBar.style.width = `${progress}%`;

            // HTML Structure for Question
            let html = `
                <div class="question-header">
                    <span class="question-number">QUESTION ${currentQuestionIndex + 1} OF ${questions.length}</span>
                    <span class="domain-tag">${q.domain}</span>
                </div>

                <div class="question-text">${q.q}</div>

                <div class="options">
                    ${q.options.map((opt, index) => {
                        const isSelected = userAnswers[currentQuestionIndex] === index;
                        const label = String.fromCharCode(65 + index); // A, B, C, D
                        return `
                            <div class="option ${isSelected ? 'selected' : ''}" onclick="selectOption(${index})">
                                <span class="option-label">${label}</span>
                                <span class="option-text">${opt}</span>
                            </div>
                        `;
                    }).join('')}
                </div>

                <div class="navigation">
                    <button class="btn" onclick="prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>
                        &larr; Previous
                    </button>
                    <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" ${userAnswers[currentQuestionIndex] === null ? 'disabled' : ''}>
                        ${isLastQuestion ? 'Finish Exam' : 'Next &rarr;'}
                    </button>
                </div>
            `;

            contentDiv.innerHTML = html;
        }

        function selectOption(index) {
            userAnswers[currentQuestionIndex] = index;
            // Re-render to show selection state (or just toggle class for performance, but re-render is safer for state sync)
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            // Calculate Score
            let correctCount = 0;
            questions.forEach((q, i) => {
                if (userAnswers[i] === q.correct) correctCount++;
            });

            const score = Math.round((correctCount / questions.length) * 100);
            const passed = score >= 83; // Approx 750/900
            progressBar.style.width = '100%';

            let html = `
                <div class="results">
                    <div class="score-card">
                        <div class="subtitle">EXAM RESULTS</div>
                        <div class="score-number">${score}</div>
                        <div class="subtitle">SCORE / 100</div>
                        <div class="pass-fail ${passed ? 'pass' : 'fail'}">
                            ${passed ? 'PASS' : 'FAIL'}
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-number">${correctCount}</div>
                            <div class="stat-label">Correct</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${questions.length - correctCount}</div>
                            <div class="stat-label">Incorrect</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${questions.length}</div>
                            <div class="stat-label">Total Questions</div>
                        </div>
                    </div>

                    <div class="subtitle" style="margin-bottom: 20px;">Review Answers</div>

                    ${questions.map((q, i) => {
                        const userAnswer = userAnswers[i];
                        const isCorrect = userAnswer === q.correct;
                        const labelUser = String.fromCharCode(65 + userAnswer);
                        const labelCorrect = String.fromCharCode(65 + q.correct);

                        return `
                            <div class="review-question ${isCorrect ? 'correct' : 'incorrect'}">
                                <div class="review-header">
                                    <span>Question ${i + 1}</span>
                                    <span class="review-status ${isCorrect ? 'correct' : 'incorrect'}">
                                        ${isCorrect ? 'CORRECT' : 'INCORRECT'}
                                    </span>
                                </div>
                                <div class="review-text">${q.q}</div>

                                <div class="review-answers">
                                    <div class="answer-line">
                                        <strong>Your Answer:</strong>
                                        <span style="color: ${isCorrect ? 'var(--accent)' : 'var(--accent-red)'}">
                                            ${labelUser}. ${q.options[userAnswer]}
                                        </span>
                                    </div>
                                    <div class="answer-line">
                                        <strong>Correct Answer:</strong>
                                        <span style="color: var(--accent)">
                                            ${labelCorrect}. ${q.options[q.correct]}
                                        </span>
                                    </div>
                                </div>

                                <div class="explanation">
                                    <div class="explanation-title">Explanation</div>
                                    ${q.explanation}
                                </div>
                            </div>
                        `;
                    }).join('')}

                    <div style="text-align: center; margin-top: 40px;">
                        <button class="btn btn-primary" onclick="location.reload()" style="display: inline-flex;">
                            Retake Exam
                        </button>
                    </div>
                </div>
            `;

            contentDiv.innerHTML = html;
            window.scrollTo(0,0);
        }

        // Start
        init();
    </script>
</body>
</html>
