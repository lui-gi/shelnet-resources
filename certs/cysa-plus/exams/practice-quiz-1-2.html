<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelnet Quiz</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #0c0c0c;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --border-color: rgba(255, 255, 255, 0.15);
            --accent: #3b82f6; /* Default — overridden per-quiz via ACCENT_HEX in CONFIG */
            --accent-dim: rgba(59, 130, 246, 0.1); /* Default — overridden via setProperty in init() */
            --accent-glow: rgba(59, 130, 246, 0.4); /* Default — overridden via setProperty in init() */
            --accent-select: rgba(59, 130, 246, 0.3); /* Default — overridden via setProperty in init() */
            --accent-red: #ef4444;
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            /* Grid Background Effect */
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Selection Color */
        ::selection {
            background: var(--accent-select);
            color: #dbeafe;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            position: relative;
            z-index: 10;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            min-height: 600px;
            display: flex;
            flex-direction: column;
        }

        /* --- Terminal Header Bar --- */
        .terminal-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-color);
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot.red { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); }
        .dot.yellow { background: rgba(234, 179, 8, 0.2); border: 1px solid rgba(234, 179, 8, 0.5); }
        .dot.green { background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.5); }

        /* --- Brutal Header Section --- */
        .header {
            padding: 40px 40px 20px 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 10px;
            line-height: 1;
        }

        .header .subtitle {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            display: block;
        }

        /* --- Progress Bar --- */
        .progress-container {
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.1);
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--accent);
        }

        /* --- Content Area --- */
        .content {
            padding: 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px dashed var(--border-color);
        }

        .question-number {
            font-family: var(--font-mono);
            color: var(--accent);
            font-size: 0.9rem;
        }

        .domain-tag {
            font-family: var(--font-mono);
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .question-text {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 40px;
            color: #eee;
            font-weight: 400;
        }

        /* --- Options --- */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            position: relative;
        }

        .option:hover {
            border-color: var(--accent);
            background: rgba(255,255,255,0.04);
        }

        .option.selected {
            background: var(--accent-dim);
            border-color: var(--accent);
        }

        .option-label {
            font-family: var(--font-mono);
            margin-right: 20px;
            color: var(--text-muted);
            font-weight: bold;
            min-width: 25px;
        }

        .option.selected .option-label {
            color: var(--accent);
        }

        .option-text {
            flex: 1;
            font-size: 1rem;
            color: rgba(255,255,255,0.8);
        }

        .option.selected .option-text {
            color: #fff;
        }

        /* --- Buttons --- */
        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 50px;
        }

        .btn {
            padding: 12px 24px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: #fff;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover:not(:disabled) {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .btn-primary {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: var(--border-color);
        }

        /* --- Results Screen --- */
        .results {
            animation: fadeIn 0.5s ease;
        }

        .score-card {
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.02);
            padding: 40px;
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        /* Terminal scanline effect for score */
        .score-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: rgba(255,255,255,0.1);
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .score-number {
            font-size: 5rem;
            font-weight: bold;
            font-family: var(--font-mono);
            margin: 10px 0;
            color: #fff;
        }

        .pass-fail {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            padding: 10px 20px;
            display: inline-block;
            border: 1px solid currentColor;
            margin-top: 20px;
        }

        .pass { color: var(--accent); }
        .fail { color: var(--accent-red); }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            padding: 20px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            font-family: var(--font-mono);
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-family: var(--font-mono);
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Review Section */
        .review-question {
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.02);
            padding: 25px;
            margin-bottom: 20px;
            border-left: 4px solid transparent;
        }

        .review-question.correct { border-left-color: var(--accent); }
        .review-question.incorrect { border-left-color: var(--accent-red); }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .review-status.correct { color: var(--accent); }
        .review-status.incorrect { color: var(--accent-red); }

        .review-text {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 20px;
        }

        .review-answers {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            padding: 15px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .answer-line {
            margin-bottom: 8px;
            display: flex;
        }

        .answer-line strong {
            width: 140px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .explanation {
            margin-top: 15px;
            padding: 15px;
            border-left: 2px solid var(--text-muted);
            background: rgba(255,255,255,0.03);
            font-size: 0.95rem;
            color: #ccc;
        }

        .explanation-title {
            font-family: var(--font-mono);
            text-transform: uppercase;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0c0c0c;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--accent) #0c0c0c;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .header h1 { font-size: 2rem; }
            .content { padding: 20px; }
            .question-header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .score-number { font-size: 3rem; }
            .navigation { flex-direction: column; gap: 15px; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="terminal-bar">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
            <span style="margin-left: 10px;">bash — user@shelnet-exam: ~</span>
        </div>

        <div class="header">
            <h1 id="quizTitle">Quiz Title</h1>
            <div class="subtitle" id="quizSubtitle">C:\Shelnet\Quizzes> Objective</div>
        </div>

        <div class="progress-container">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <div class="content" id="examContent">
            </div>
    </div>

    <script>
        // ============================================================
        // QUIZ CONFIG — edit this block when deriving a new quiz.
        // Leave the rest of this file unchanged.
        // ============================================================
        const QUIZ_TITLE    = 'Practice Quiz 1.2';
        const QUIZ_SUBTITLE = 'C:\\Shelnet\\Quizzes> CS0-003 Objective 1.2';
        const ACCENT_HEX    = '#06b6d4';

        const questions = [
            {
                q: 'A SOC analyst notices that an endpoint is generating 15 MB/s of outbound traffic to an external IP address during off-hours. The process responsible does not match any known business application, and the traffic began shortly after a user opened an email attachment. Which of the following network-related indicators MOST likely explains this behavior?',
                options: [
                    'A. Bandwidth consumption',
                    'B. Unusual traffic spikes',
                    'C. Irregular peer-to-peer communication',
                    'D. Beaconing'
                ],
                correct: 0,
                domain: 'Security Operations',
                explanation: 'Bandwidth consumption describes the sustained high volume of outbound data, which is a network-related indicator of potential exfiltration. Beaconing (D) refers to periodic short check-in signals from malware to a C2 server, not a sustained high-throughput data transfer.'
            },
            {
                q: 'A security analyst is reviewing firewall logs and notices that an internal host is making short, periodic outbound HTTPS connections to the same external IP address every 60 seconds. The connections transfer minimal data each time. The host is a developer workstation that has no scheduled tasks requiring external access. Which of the following network-related indicators BEST describes this behavior?',
                options: [
                    'A. Bandwidth consumption',
                    'B. Scans/sweeps',
                    'C. Beaconing',
                    'D. Activity on unexpected ports'
                ],
                correct: 2,
                domain: 'Security Operations',
                explanation: 'Beaconing is characterized by regular, periodic, low-volume check-in connections from an infected host to a C2 server. Bandwidth consumption (A) refers to high-volume data movement rather than small, periodic signals.'
            },
            {
                q: 'A tier-1 analyst receives an alert from the EDR platform showing that a Windows host is consuming 98% of available RAM and the responsible process is not a recognized system process. The process was spawned by a document opened by a finance team member. Which of the following host-related indicators is the analyst observing?',
                options: [
                    'A. Processor consumption',
                    'B. Drive capacity consumption',
                    'C. Memory consumption',
                    'D. Unauthorized scheduled tasks'
                ],
                correct: 2,
                domain: 'Security Operations',
                explanation: 'Memory consumption refers to a process consuming abnormal amounts of RAM, which is a host-related indicator of malicious activity such as a memory-resident payload. Processor consumption (A) describes high CPU usage, not RAM saturation.'
            },
            {
                q: 'A SOC analyst is investigating a Windows server that has been added to the domain without a change ticket. A review of event logs shows that new administrator-level accounts were created late on a weekend night, and previously restricted registry keys have been modified. Which of the following host-related indicators are present? (Select the option that includes ALL applicable indicators)',
                options: [
                    'A. Unauthorized changes and unauthorized privileges',
                    'B. Drive capacity consumption and file system changes',
                    'C. Abnormal OS process behavior and memory consumption',
                    'D. Unauthorized scheduled tasks and bandwidth consumption'
                ],
                correct: 0,
                domain: 'Security Operations',
                explanation: 'Creating unauthorized administrator accounts (unauthorized privileges) and modifying restricted registry keys without a change ticket (unauthorized changes) are both host-related indicators. Drive capacity and memory indicators (B, C) are not supported by the described evidence.'
            },
            {
                q: 'A security analyst is reviewing application logs for an internal HR portal and notices that three new administrative accounts were created between 2:00 AM and 3:00 AM, outside of any provisioning window, and that the application began generating unexpected error output to a public-facing error page. Which of the following application-related indicators are present?',
                options: [
                    'A. Service interruption and unexpected outbound communication',
                    'B. Introduction of new accounts and unexpected output',
                    'C. Anomalous activity and application logs',
                    'D. Obfuscated links and social engineering'
                ],
                correct: 1,
                domain: 'Security Operations',
                explanation: 'Introduction of new accounts (three admin accounts created outside provisioning windows) and unexpected output (error content exposed to public pages) are application-related indicators described in the scenario. Service interruption (A) is not indicated since the application continued running.'
            },
            {
                q: 'A threat analyst receives a report that a user clicked a link in a phishing email that appeared to go to the company intranet but actually contained encoded characters designed to disguise the true destination. Which of the following indicator categories BEST describes this technique?',
                options: [
                    'A. Host-related: registry changes',
                    'B. Network-related: rogue devices',
                    'C. Other: obfuscated links',
                    'D. Application-related: anomalous activity'
                ],
                correct: 2,
                domain: 'Security Operations',
                explanation: 'Obfuscated links fall under the "Other" indicator category for potentially malicious activity; they are used in social engineering to disguise the true destination URL. Registry changes (A) are a host-related indicator and are not described in this phishing scenario.'
            },
            {
                q: 'A SOC analyst is reviewing a report showing that an internal host scanned all 65,535 TCP ports on every device in the 192.168.10.0/24 subnet over a 10-minute window. No vulnerability scan was scheduled. Which of the following network-related indicators BEST describes this activity?',
                options: [
                    'A. Beaconing',
                    'B. Bandwidth consumption',
                    'C. Scans/sweeps',
                    'D. Irregular peer-to-peer communication'
                ],
                correct: 2,
                domain: 'Security Operations',
                explanation: 'Scans and sweeps involve systematic probing of IP ranges and ports to discover hosts and services, which matches the described behavior. Beaconing (A) refers to periodic outbound C2 check-ins, not internal network reconnaissance.'
            },
            {
                q: 'A security analyst is investigating a Windows workstation where the task scheduler was found to contain an entry that runs a PowerShell script every 15 minutes, with no corresponding change record. The script reaches out to an external IP address. Which of the following host-related indicators is the analyst examining?',
                options: [
                    'A. Malicious processes',
                    'B. Unauthorized scheduled tasks',
                    'C. Unauthorized privileges',
                    'D. Abnormal OS process behavior'
                ],
                correct: 1,
                domain: 'Security Operations',
                explanation: 'An unauthorized scheduled task is a host-related persistence indicator where attackers create scheduled jobs to maintain access or execute malicious code. Malicious processes (A) refers to actively running processes, whereas the scheduled task is the persistence mechanism discovered here.'
            },
            {
                q: 'A tier-2 analyst notices that a client-facing web application began returning HTTP 500 errors to all users after a deployment was rolled back. The application had been running normally for weeks, and no configuration changes were scheduled. Which of the following application-related indicators is MOST likely present?',
                options: [
                    'A. Introduction of new accounts',
                    'B. Unexpected output',
                    'C. Service interruption',
                    'D. Unexpected outbound communication'
                ],
                correct: 2,
                domain: 'Security Operations',
                explanation: 'Service interruption is an application-related indicator where a previously functioning application becomes unavailable or begins returning errors to users. Unexpected output (B) refers to data leaking into responses, not the application becoming broadly unavailable.'
            },
            {
                q: 'A security analyst is reviewing disk usage metrics and finds that a file server normally operating at 40% capacity has reached 98% within 48 hours. No large data migration was scheduled. Investigation reveals thousands of files with random-looking names have been written across multiple directories. Which of the following host-related indicators BEST describes this situation?',
                options: [
                    'A. Unauthorized software',
                    'B. Drive capacity consumption',
                    'C. Data exfiltration',
                    'D. File system changes or anomalies'
                ],
                correct: 1,
                domain: 'Security Operations',
                explanation: 'Drive capacity consumption refers to unexpected filling of disk storage, which is a host-related indicator of potential ransomware encryption activity (writing many encrypted files) or staging of exfiltration data. File system changes (D) is also present but drive capacity consumption is the primary presented indicator matching the fill-rate description.'
            },
            {
                q: 'A SOC analyst detects that an internal workstation has established direct TCP connections to five other internal workstations on port 445 without going through a server or using a centralized application. None of the connections match an approved peer-to-peer application. Which of the following network-related indicators BEST describes this behavior?',
                options: [
                    'A. Bandwidth consumption',
                    'B. Activity on unexpected ports',
                    'C. Irregular peer-to-peer communication',
                    'D. Scans/sweeps'
                ],
                correct: 2,
                domain: 'Security Operations',
                explanation: 'Irregular peer-to-peer communication describes direct host-to-host connections that bypass expected server-based communication paths; this pattern is common in lateral movement via SMB. Activity on unexpected ports (B) focuses on the port number, whereas the scenario highlights the unsanctioned peer-to-peer topology.'
            },
            {
                q: 'A security analyst is investigating a Linux server and discovers that a binary named "sshd" is running from /tmp rather than /usr/sbin. The process is consuming CPU and making outbound connections. The legitimate SSH daemon is also running from its expected location. Which of the following host-related indicators is the analyst observing?',
                options: [
                    'A. Unauthorized scheduled tasks',
                    'B. Drive capacity consumption',
                    'C. Abnormal OS process behavior',
                    'D. Malicious processes'
                ],
                correct: 3,
                domain: 'Security Operations',
                explanation: 'A process masquerading as a legitimate system binary but running from an unexpected location (/tmp) and making unauthorized outbound connections is a malicious process, a host-related indicator. Abnormal OS process behavior (C) can overlap, but a fake sshd running from /tmp making C2 connections is most precisely classified as a malicious process.'
            },
            {
                q: 'A SOC analyst reviews application logs for a customer portal and finds that an authenticated user queried the accounts endpoint with an ID parameter 500 times in 30 seconds, retrieving records for accounts other than their own. The application did not generate any errors. Which of the following application-related indicators is MOST likely present?',
                options: [
                    'A. Service interruption',
                    'B. Introduction of new accounts',
                    'C. Anomalous activity',
                    'D. Unexpected outbound communication'
                ],
                correct: 2,
                domain: 'Security Operations',
                explanation: 'Anomalous activity is an application-related indicator describing behavior that deviates significantly from the expected usage pattern; 500 queries per 30 seconds to retrieve other users\' records is clearly anomalous. Introduction of new accounts (B) refers to account creation events, which are not described in this scenario.'
            },
            {
                q: 'A security analyst receives a report that a user received a phone call from someone claiming to be IT support who convinced the user to reveal their password. No technical vulnerability was exploited. Which of the following indicator categories BEST classifies this event?',
                options: [
                    'A. Network-related: activity on unexpected ports',
                    'B. Host-related: unauthorized privileges',
                    'C. Other: social engineering attacks',
                    'D. Application-related: unexpected output'
                ],
                correct: 2,
                domain: 'Security Operations',
                explanation: 'Social engineering attacks fall under the "Other" indicator category; they manipulate people rather than exploiting technical systems. Unauthorized privileges (B) may result from the attack if the attacker uses the stolen credentials, but the attack itself is social engineering.'
            },
            {
                q: 'A SOC analyst is reviewing network flow data and notices that an internal Windows workstation began communicating on TCP port 4444 with an external IP address that has no business justification. The connection was initiated from a process running as SYSTEM. Which of the following network-related indicators is MOST relevant to this finding?',
                options: [
                    'A. Beaconing',
                    'B. Bandwidth consumption',
                    'C. Irregular peer-to-peer communication',
                    'D. Activity on unexpected ports'
                ],
                correct: 3,
                domain: 'Security Operations',
                explanation: 'Activity on unexpected ports refers to connections occurring on ports not associated with the host\'s expected business functions; TCP 4444 is a well-known Metasploit default listener port and is not a standard business port. Beaconing (A) would describe periodic short check-ins, whereas a single persistent connection on an unexpected port is the primary indicator.'
            }
        ];

        // ============================================================
        // END CONFIG — chrome below is shared. Do not edit when deriving.
        // ============================================================

        // Small util: convert '#06b6d4' -> 'rgba(6, 182, 212, 0.1)' for the dim variant.
        function hexToRgba(hex, alpha) {
            const h = hex.replace('#', '');
            const r = parseInt(h.substring(0, 2), 16);
            const g = parseInt(h.substring(2, 4), 16);
            const b = parseInt(h.substring(4, 6), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // --- APP STATE ---
        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);

        // --- DOM ELEMENTS ---
        const contentDiv = document.getElementById('examContent');
        const progressBar = document.getElementById('progressBar');

        // --- INITIALIZATION ---
        function init() {
            // --- Apply CONFIG ---
            document.title = QUIZ_TITLE;
            document.getElementById('quizTitle').textContent = QUIZ_TITLE;
            document.getElementById('quizSubtitle').textContent = QUIZ_SUBTITLE;
            document.documentElement.style.setProperty('--accent', ACCENT_HEX);
            document.documentElement.style.setProperty('--accent-dim', hexToRgba(ACCENT_HEX, 0.1));
            document.documentElement.style.setProperty('--accent-glow', hexToRgba(ACCENT_HEX, 0.4));
            document.documentElement.style.setProperty('--accent-select', hexToRgba(ACCENT_HEX, 0.3));

            // --- existing init body continues below ---
            renderQuestion();
        }

        // --- RENDER FUNCTIONS ---
        function renderQuestion() {
            const q = questions[currentQuestionIndex];
            const isLastQuestion = currentQuestionIndex === questions.length - 1;

            // Update Progress
            const progress = ((currentQuestionIndex) / questions.length) * 100;
            progressBar.style.width = `${progress}%`;

            // HTML Structure for Question
            let html = `
                <div class="question-header">
                    <span class="question-number">QUESTION ${currentQuestionIndex + 1} OF ${questions.length}</span>
                    <span class="domain-tag">${q.domain}</span>
                </div>

                <div class="question-text">${q.q}</div>

                <div class="options">
                    ${q.options.map((opt, index) => {
                        const isSelected = userAnswers[currentQuestionIndex] === index;
                        const label = String.fromCharCode(65 + index); // A, B, C, D
                        return `
                            <div class="option ${isSelected ? 'selected' : ''}" onclick="selectOption(${index})">
                                <span class="option-label">${label}</span>
                                <span class="option-text">${opt}</span>
                            </div>
                        `;
                    }).join('')}
                </div>

                <div class="navigation">
                    <button class="btn" onclick="prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>
                        &larr; Previous
                    </button>
                    <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" ${userAnswers[currentQuestionIndex] === null ? 'disabled' : ''}>
                        ${isLastQuestion ? 'Finish Exam' : 'Next &rarr;'}
                    </button>
                </div>
            `;

            contentDiv.innerHTML = html;
        }

        function selectOption(index) {
            userAnswers[currentQuestionIndex] = index;
            // Re-render to show selection state (or just toggle class for performance, but re-render is safer for state sync)
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            // Calculate Score
            let correctCount = 0;
            questions.forEach((q, i) => {
                if (userAnswers[i] === q.correct) correctCount++;
            });

            const score = Math.round((correctCount / questions.length) * 100);
            const passed = score >= 83; // Approx 750/900
            progressBar.style.width = '100%';

            let html = `
                <div class="results">
                    <div class="score-card">
                        <div class="subtitle">EXAM RESULTS</div>
                        <div class="score-number">${score}</div>
                        <div class="subtitle">SCORE / 100</div>
                        <div class="pass-fail ${passed ? 'pass' : 'fail'}">
                            ${passed ? 'PASS' : 'FAIL'}
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-number">${correctCount}</div>
                            <div class="stat-label">Correct</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${questions.length - correctCount}</div>
                            <div class="stat-label">Incorrect</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${questions.length}</div>
                            <div class="stat-label">Total Questions</div>
                        </div>
                    </div>

                    <div class="subtitle" style="margin-bottom: 20px;">Review Answers</div>

                    ${questions.map((q, i) => {
                        const userAnswer = userAnswers[i];
                        const isCorrect = userAnswer === q.correct;
                        const labelUser = String.fromCharCode(65 + userAnswer);
                        const labelCorrect = String.fromCharCode(65 + q.correct);

                        return `
                            <div class="review-question ${isCorrect ? 'correct' : 'incorrect'}">
                                <div class="review-header">
                                    <span>Question ${i + 1}</span>
                                    <span class="review-status ${isCorrect ? 'correct' : 'incorrect'}">
                                        ${isCorrect ? 'CORRECT' : 'INCORRECT'}
                                    </span>
                                </div>
                                <div class="review-text">${q.q}</div>

                                <div class="review-answers">
                                    <div class="answer-line">
                                        <strong>Your Answer:</strong>
                                        <span style="color: ${isCorrect ? 'var(--accent)' : 'var(--accent-red)'}">
                                            ${labelUser}. ${q.options[userAnswer]}
                                        </span>
                                    </div>
                                    <div class="answer-line">
                                        <strong>Correct Answer:</strong>
                                        <span style="color: var(--accent)">
                                            ${labelCorrect}. ${q.options[q.correct]}
                                        </span>
                                    </div>
                                </div>

                                <div class="explanation">
                                    <div class="explanation-title">Explanation</div>
                                    ${q.explanation}
                                </div>
                            </div>
                        `;
                    }).join('')}

                    <div style="text-align: center; margin-top: 40px;">
                        <button class="btn btn-primary" onclick="location.reload()" style="display: inline-flex;">
                            Retake Exam
                        </button>
                    </div>
                </div>
            `;

            contentDiv.innerHTML = html;
            window.scrollTo(0,0);
        }

        // Start
        init();
    </script>
</body>
</html>
