<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelnet Quiz</title>
    <style>
        :root {
            --bg:           #000000;
            --text-90:      rgba(255, 255, 255, 0.90);
            --text-70:      rgba(255, 255, 255, 0.70);
            --text-45:      rgba(255, 255, 255, 0.45);
            --text-30:      rgba(255, 255, 255, 0.30);
            --rule:         rgba(255, 255, 255, 0.15);
            --accent:       #38bdf8; /* Default — overridden per-quiz via ACCENT_HEX */
            --accent-tint:  rgba(56, 189, 248, 0.14); /* selected-row */
            --accent-hover: rgba(56, 189, 248, 0.08); /* hover-row */
            --pass-green:   #43c08c;
            --wrong-red:    #fb7185;
            --font-mono:    'Courier New', Courier, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { background: var(--bg); }

        body {
            font-family: var(--font-mono);
            color: var(--text-90);
            min-height: 100vh;
            padding: 32px 0 48px;
            line-height: 1.5;
            font-size: 15px;
        }

        ::selection {
            background: var(--accent-tint);
            color: #fff;
        }

        .col {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* --- Header --- */
        .title-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 24px;
            color: var(--text-90);
        }

        .title-row .meta {
            color: var(--text-45);
            font-size: 13px;
        }

        .rule {
            border-top: 1px solid var(--rule);
            margin: 12px 0 0;
        }

        .progress {
            height: 2px;
            background: rgba(255, 255, 255, 0.06);
            margin-top: 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.25s ease;
        }

        /* --- Question --- */
        .content { margin-top: 32px; }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 4px 24px;
            color: var(--text-70);
            font-size: 13px;
        }

        .q-header .count { color: var(--accent); }
        .q-header .domain { color: var(--text-45); }

        .stem {
            color: var(--text-90);
            font-size: 17px;
            line-height: 1.6;
            margin: 24px 0 32px;
        }

        .options { display: flex; flex-direction: column; gap: 2px; }

        .option {
            display: flex;
            align-items: baseline;
            gap: 18px;
            padding: 10px 12px;
            cursor: pointer;
            background: transparent;
            border: 0;
            color: var(--text-90);
            font: inherit;
            text-align: left;
            width: 100%;
            transition: background-color 0.12s ease;
        }

        .option:hover { background: var(--accent-hover); }
        .option.selected { background: var(--accent-tint); }

        .option .label {
            color: var(--text-45);
            min-width: 1.5ch;
        }

        .option.selected .label { color: var(--accent); }

        .option .text { flex: 1; }

        /* --- Footer hints --- */
        .hints {
            margin-top: 32px;
            color: var(--text-45);
            font-size: 13px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 18px;
        }

        .hints .key { color: var(--accent); margin-right: 4px; }
        .hints .verb { color: var(--text-90); }
        .hints .verb:hover { text-decoration: underline; }
        .hints .verb.disabled { color: var(--text-30); cursor: not-allowed; }
        .hints .verb.disabled:hover { text-decoration: none; }

        button.verb {
            background: transparent;
            border: 0;
            font: inherit;
            padding: 0;
            cursor: pointer;
        }

        /* --- Results --- */
        .results-heading {
            color: var(--text-70);
            font-size: 15px;
            margin-bottom: 0;
        }

        .score-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 28px;
            margin-top: 28px;
            align-items: baseline;
        }

        .score-row .label { color: var(--text-45); }
        .score-row .score-val { color: var(--text-90); }
        .score-row .verdict-pass { color: var(--pass-green); }
        .score-row .verdict-fail { color: var(--wrong-red); }
        .score-row .threshold   { color: var(--text-45); }

        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 36px;
            margin-top: 16px;
            align-items: baseline;
        }

        .stats-row .stat-label { color: var(--text-45); margin-right: 8px; }
        .stats-row .stat-val   { color: var(--text-90); }

        .review-heading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-70);
            margin: 36px 0 16px;
        }

        .review-heading .dashes {
            color: var(--text-30);
            flex: 1;
            border-top: 1px solid var(--rule);
            margin-left: 4px;
            transform: translateY(1px);
        }

        .review-q {
            border-left: 2px solid var(--text-30);
            padding: 0 0 8px 14px;
            margin-bottom: 20px;
        }

        .review-q.correct   { border-left-color: var(--accent); }
        .review-q.incorrect { border-left-color: var(--wrong-red); }

        .review-q .status {
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-70);
        }

        .review-q .status .glyph-correct   { color: var(--accent); margin: 0 8px; }
        .review-q .status .glyph-incorrect { color: var(--wrong-red); margin: 0 8px; }
        .review-q .status .verdict.correct   { color: var(--accent); }
        .review-q .status .verdict.incorrect { color: var(--wrong-red); }

        .review-q .stem-mini {
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 10px;
            line-height: 1.55;
        }

        .review-q .ans-line {
            display: grid;
            grid-template-columns: 18ch 1fr;
            gap: 4px 8px;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .review-q .ans-line .ans-label { color: var(--text-45); }
        .review-q .ans-line.right .ans-val { color: var(--accent); }
        .review-q .ans-line.wrong .ans-val { color: var(--wrong-red); }
        .review-q .ans-line.skipped .ans-val { color: var(--text-45); }

        .review-q .explanation {
            margin-top: 10px;
            color: var(--text-70);
            font-size: 14px;
            line-height: 1.55;
        }

        .review-q .explanation .arrow { color: var(--accent); margin-right: 6px; }

        .retake-row {
            margin-top: 36px;
            text-align: center;
            color: var(--text-90);
        }

        .retake-row .key { color: var(--accent); margin-right: 4px; }
        .retake-row button.verb:hover { text-decoration: underline; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--accent); }
        * { scrollbar-width: thin; scrollbar-color: var(--accent) #000; }

        /* Mobile */
        @media (max-width: 600px) {
            .col { padding: 0 24px; }
            .stem { font-size: 16px; }
            body { font-size: 14px; padding: 24px 0 36px; }
            .review-q .ans-line { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="col">
        <div class="title-row">
            <span id="quizTitle">quiz</span>
            <span class="meta" id="quizMeta">— · — · 0q</span>
        </div>
        <div class="rule"></div>
        <div class="progress"><div class="progress-fill" id="progressBar"></div></div>

        <div class="content" id="examContent"></div>
    </div>

    <script>
        // ============================================================
        // QUIZ CONFIG — edit this block when deriving a new quiz.
        // Leave the rest of this file unchanged.
        // ============================================================
        const QUIZ_TITLE    = "practice quiz 3.2";
        const QUIZ_SUBTITLE = "cysa-plus · obj 3.2";
        const ACCENT_HEX    = "#22d3ee";

        const questions = [
            {
                q: "A SOC analyst receives an EDR alert indicating that a workstation is beaconing to a known malicious IP every 60 seconds. The analyst has confirmed the beacon is consistent with a command-and-control callback. Which action should the analyst take FIRST?",
                options: ["Reimage the workstation immediately to eradicate the malware", "Isolate the workstation from the network to contain the threat while preserving the ability to investigate", "Collect a full memory dump of the workstation before taking any other action", "Notify the legal team and place the workstation under legal hold before touching it"],
                correct: 1,
                domain: "Incident Response and Management",
                explanation: "Network isolation (containment) is the correct FIRST action -- it stops active C2 communication and limits lateral movement while preserving evidence for investigation. Reimaging (1) is eradication and destroys volatile evidence; memory collection (3) is valuable but requires the host to be isolated from active attacker control first; legal hold (4) is a documentation step, not an immediate containment action."
            },
            {
                q: "An incident responder is collecting a forensic image of a compromised server's hard drive. To ensure the integrity of the acquired image can be proven in court, which procedure is MOST critical?",
                options: ["Use a hardware write blocker and generate cryptographic hashes of the source drive and the image immediately after acquisition", "Compress the image with a password and store it on a network share accessible only to IR team members", "Acquire the image using a live-response tool while the system remains online to capture running processes", "Store the original drive in an evidence bag and create the forensic image from a clone made weeks later"],
                correct: 0,
                domain: "Incident Response and Management",
                explanation: "Using a hardware write blocker prevents any writes to the source drive, and generating cryptographic hashes (e.g., MD5/SHA-256) immediately after acquisition provides a verifiable integrity baseline for court admissibility. Compression with a password (2) addresses storage access but not write protection or integrity; live-response imaging (3) misses disk artifacts and risks contamination; delayed cloning (4) breaks chain of custody."
            },
            {
                q: "A security analyst detects that an attacker has compromised three servers in a segment and is actively moving laterally. The IR team must choose a containment strategy that limits attacker movement without immediately disrupting business operations. Which approach MOST effectively balances containment and continuity?",
                options: ["Shut down the entire network segment to stop all attacker movement", "Reset all user passwords enterprise-wide to invalidate stolen credentials", "Apply compensating controls such as blocking malicious IOC at the firewall and restricting inter-server communication while maintaining critical services", "Wait and monitor to gather more intelligence before taking any containment action"],
                correct: 2,
                domain: "Incident Response and Management",
                explanation: "Applying targeted compensating controls (firewall rules blocking IOC, micro-segmentation of affected servers) contains the attacker while keeping critical services running. Shutting down the entire segment (1) disrupts business; enterprise-wide password reset (2) is disruptive and may alert the attacker prematurely; passive monitoring only (4) allows continued spread without containment."
            },
            {
                q: "A digital forensics analyst receives a seized laptop as part of a criminal investigation. Before imaging the drive, the analyst must document every person who handled the device from seizure to laboratory receipt. Which IR concept MOST directly governs this documentation requirement?",
                options: ["Legal hold, which freezes evidence in place to prevent destruction", "Data integrity validation, which verifies the evidence has not been altered", "Evidence preservation, which requires imaging before any analysis", "Chain of custody, which records every transfer and access of physical evidence"],
                correct: 3,
                domain: "Incident Response and Management",
                explanation: "Chain of custody is the documentation process that records every person who handled the evidence, every location it was stored, and every time it changed hands -- directly addressing the requirement described. Legal hold (1) applies to data retention before legal proceedings; data integrity validation (2) uses hashing; evidence preservation (3) is about imaging, not the transfer documentation."
            },
            {
                q: "An IR team has successfully contained a ransomware outbreak by isolating affected hosts. Before reimaging and restoring from backup, the team needs to confirm all malware artifacts have been identified and removed from every affected system. Which IR phase does this activity represent MOST accurately?",
                options: ["Detection and Analysis, because the team is identifying malware artifacts", "Eradication, because the team is removing all malicious components from affected systems", "Containment, because the team is preventing further spread while cleaning systems", "Recovery, because the team is restoring systems to normal operation"],
                correct: 1,
                domain: "Incident Response and Management",
                explanation: "Eradication is the IR phase in which all malware, backdoors, and attacker footholds are identified and removed from affected systems -- a prerequisite to recovery. Detection and Analysis (1) occurred earlier when the incident was identified; Containment (3) is the prior phase that stopped spread; Recovery (4) is the subsequent phase of restoring systems to production."
            },
            {
                q: "A SOC analyst investigating a suspected insider threat case needs to collect volatile evidence from a running Windows workstation. According to evidence acquisition best practices, which data type should be collected FIRST due to its transient nature?",
                options: ["RAM contents, because they contain running processes, network connections, and decrypted encryption keys that are lost when the system powers off", "The Windows Registry hive files, because they contain persistence artifacts that disappear on reboot", "Browser history and cached files, because they reveal the user's online activities", "The pagefile.sys, because it may contain memory artifacts that spilled to disk"],
                correct: 0,
                domain: "Incident Response and Management",
                explanation: "RAM is the most volatile evidence source -- it contains running processes, network connections, clipboard contents, and decryption keys that are permanently lost on power-off, making it the FIRST priority in volatile evidence collection. Registry hive files (2) and the pagefile (4) persist on disk after reboot; browser history (3) is also disk-resident and less volatile than RAM."
            },
            {
                q: "An incident responder has completed eradication of a malware infection on a Windows server. The team is now preparing to return the server to production. Which action MOST accurately describes the Recovery phase of the IR lifecycle in this context?",
                options: ["Documenting all IOC discovered during the investigation for sharing with threat-intel platforms", "Applying additional firewall rules to prevent similar malware from reaching the server in the future", "Restoring the server from a known-good backup, applying outstanding patches, and monitoring for signs of re-infection before declaring the incident closed", "Conducting a tabletop exercise with the IR team to test the response playbook used during the incident"],
                correct: 2,
                domain: "Incident Response and Management",
                explanation: "Recovery involves restoring affected systems to verified, known-good states and returning them to production under enhanced monitoring. IOC documentation (1) is an analysis artifact shared during or after recovery; adding firewall rules (2) is a remediation/mitigation action that may occur alongside recovery; tabletop exercises (4) are a preparation-phase activity."
            },
            {
                q: "A security analyst discovers that a compromised host was used to exfiltrate data over DNS by encoding sensitive content in DNS query strings. The attacker has since abandoned the host. Which eradication step should the IR team take FIRST before returning the host to service?",
                options: ["Update DNS server ACLs to block outbound DNS requests from the VLAN", "Notify the DNS provider and request removal of the attacker's domain", "Apply a patch for the exploit that was used to initially compromise the host", "Reimage the host from a known-good baseline to eliminate all attacker artifacts"],
                correct: 3,
                domain: "Incident Response and Management",
                explanation: "Reimaging from a known-good baseline is the most thorough eradication method -- it removes the OS, all malware, backdoors, and attacker modifications with certainty. Updating DNS ACLs (1) is a compensating control but does not remove the malware; notifying the DNS provider (2) removes the exfiltration channel but not the implant; patching (3) closes the initial attack vector but leaves existing artifacts in place."
            },
            {
                q: "A SOC analyst receives an alert from the SIEM indicating failed logins from an account across 15 different servers in 2 minutes, followed by a successful login on the 16th attempt. Which category of IOC does this pattern MOST likely represent?",
                options: ["Credential-based brute-force or password-spraying attack indicating an authentication anomaly IOC", "Bandwidth consumption anomaly indicating a data exfiltration attempt", "Beaconing behavior indicating an established C2 channel", "Privilege escalation indicating the attacker has obtained admin rights"],
                correct: 0,
                domain: "Incident Response and Management",
                explanation: "Rapid failed logins across multiple systems followed by a success is the classic pattern of a credential brute-force or password-spraying attack -- an authentication anomaly IOC. Bandwidth anomalies (2) relate to data volume, not authentication; beaconing (3) is regular outbound communication patterns; privilege escalation (4) involves elevating access level, not the login pattern described."
            },
            {
                q: "An incident responder is performing root cause analysis (RCA) on a phishing compromise. After tracing the full attack chain, the team wants to verify that the forensic image collected from the compromised workstation has not been altered since acquisition. Which technique MOST directly validates this integrity?",
                options: ["Re-running the AV scan against the image to check for known malware signatures", "Comparing the cryptographic hash of the forensic image against the hash recorded at the time of acquisition", "Verifying the image file size matches the original drive's reported capacity", "Mounting the image read-only and checking the last-modified timestamps on key system files"],
                correct: 1,
                domain: "Incident Response and Management",
                explanation: "Comparing the current cryptographic hash (e.g., SHA-256) of the forensic image to the hash computed at acquisition time directly validates that the image is bit-for-bit identical and unaltered. AV scanning (1) detects malware, not image tampering; file size comparison (3) is imprecise and does not detect content changes; checking timestamps (4) tests file metadata within the image, not the image integrity itself."
            },
            {
                q: "An IR team is managing a ransomware incident affecting 40 workstations. The CISO asks the team to scope the full impact before authorizing recovery. Which step BEST describes scoping the incident impact in the containment phase?",
                options: ["Restoring the 40 workstations from backup to establish a clean baseline before assessing further", "Engaging legal counsel to prepare regulatory notification filings before quantifying the scope", "Identifying all affected systems, determining what data was encrypted or exfiltrated, and mapping how the ransomware spread across the environment", "Deploying additional EDR agents across the enterprise to detect any re-infection after recovery"],
                correct: 2,
                domain: "Incident Response and Management",
                explanation: "Scoping involves identifying all affected systems, quantifying data impact (encryption + potential exfiltration), and understanding the spread path -- all of which must be understood before recovery begins. Restoring systems (1) is recovery and premature without full scope; engaging legal (2) is a communication/notification step; deploying additional EDR (4) is a future-state improvement, not current scoping."
            },
            {
                q: "A digital forensics analyst is tasked with imaging a Windows server that is under legal hold. During acquisition, which practice MOST directly ensures the legal hold requirements are met?",
                options: ["Ensuring the original evidence media is not altered, documenting all actions, and preserving all data in its original state until authorized disposal", "Encrypting the forensic image with AES-256 and uploading it to a cloud storage provider", "Deleting temporary files on the server before imaging to reduce the image size", "Notifying all system users that their data is being collected as part of a legal investigation"],
                correct: 0,
                domain: "Incident Response and Management",
                explanation: "Legal hold requires that evidence be preserved unaltered, all actions documented, and data retained until legal proceedings are complete. Encrypting and cloud-uploading (2) may be part of secure storage but does not address alteration prevention; deleting temp files (3) directly violates legal hold by destroying potential evidence; user notification (4) may be required in some jurisdictions but is not the core legal hold procedure."
            },
            {
                q: "A tier-2 analyst correlating events across SIEM, EDR, and DNS logs observes: failed Kerberos pre-authentication from a single account across 12 hosts in 4 minutes, a spike in outbound DNS queries with high-entropy subdomains from the same source IP 10 minutes later, and a proxy log entry showing a 400 KB POST to an uncategorized external host. Which log analysis technique BEST identifies the attack pattern represented by these three data points?",
                options: ["Threshold-based alerting, because each individual event exceeds a static count limit", "Time-series correlation across multiple log sources to detect a behavioral attack chain spanning authentication, DNS, and proxy telemetry", "Signature matching against known malware hashes in the EDR log", "Baseline deviation analysis on DNS query volume alone"],
                correct: 1,
                domain: "Incident Response and Management",
                explanation: "Time-series correlation across SIEM, EDR, and DNS logs is the technique that surfaces multi-stage attack chains -- in this case a credential attack followed by DNS tunneling and data staging -- that no single-source alert would catch. Threshold alerting (1) fires on individual events, not behavioral sequences; signature matching (3) detects known file hashes, not behavioral patterns; baseline deviation on DNS alone (4) is a single-source technique that misses the authentication and proxy context."
            },
            {
                q: "An incident responder is conducting RCA on a web application compromise. Using the 5 Whys technique, the team traces the root cause to a missing patch for a known CVE that was available for 90 days before exploitation. Which output of the RCA process MOST directly results from this finding?",
                options: ["An updated IR playbook documenting how to contain web application compromises faster", "A recommendation to reset all application user passwords enterprise-wide", "A corrective action to remediate the patch management process gap that allowed the CVE to remain unpatched", "A regulatory report disclosing the compromise to the relevant authority within the required timeframe"],
                correct: 2,
                domain: "Incident Response and Management",
                explanation: "RCA using 5 Whys identifies the systemic root cause -- in this case a patch management gap -- and the output is a corrective action to fix that process (e.g., enforce patching SLAs or automate patch deployment). Updating the IR playbook (1) addresses response procedures, not the root cause; password resets (2) are irrelevant to a patching failure; regulatory reporting (4) is a notification requirement, not an RCA output."
            },
            {
                q: "A SOC analyst discovers that a threat actor has been living in the environment for 60 days, accessing file servers nightly while evading detection. After containment, the IR team needs to verify that no attacker artifacts remain before returning systems to production. Which eradication verification step MOST effectively confirms a clean state?",
                options: ["Running a full credentialed vulnerability scan to verify no known CVEs remain unpatched on the affected systems", "Reviewing SIEM logs from the 60-day period to verify no new alerts have fired since containment", "Resetting passwords for all compromised accounts and enabling MFA as the sole eradication measure", "Performing post-eradication threat hunting using IOC derived from the investigation to confirm no attacker artifacts remain in the environment"],
                correct: 3,
                domain: "Incident Response and Management",
                explanation: "Post-eradication threat hunting using IOC from the investigation is the MOST effective verification step -- it actively searches for remaining attacker artifacts (backdoors, scheduled tasks, residual implants) that automated scans might miss. Vulnerability scanning (1) finds CVEs, not attacker artifacts; SIEM log review (2) is passive and relies on existing alerts that already failed to detect a 60-day intrusion; password resets + MFA (3) address credential exposure but do not verify eradication of all artifacts."
            }
        ];

        // ============================================================
        // END CONFIG — chrome below is shared. Do not edit when deriving.
        // ============================================================

        function hexToRgba(hex, alpha) {
            const h = hex.replace('#', '');
            const r = parseInt(h.substring(0, 2), 16);
            const g = parseInt(h.substring(2, 4), 16);
            const b = parseInt(h.substring(4, 6), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // --- APP STATE ---
        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let onResults = false;

        // --- DOM ---
        const contentDiv = document.getElementById('examContent');
        const progressBar = document.getElementById('progressBar');

        // --- INIT ---
        function init() {
            document.title = QUIZ_TITLE;
            document.getElementById('quizTitle').textContent = QUIZ_TITLE;
            document.getElementById('quizMeta').textContent =
                `${QUIZ_SUBTITLE} · ${questions.length}q`;
            document.documentElement.style.setProperty('--accent', ACCENT_HEX);
            document.documentElement.style.setProperty('--accent-tint',  hexToRgba(ACCENT_HEX, 0.14));
            document.documentElement.style.setProperty('--accent-hover', hexToRgba(ACCENT_HEX, 0.08));
            renderQuestion();
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // --- RENDER ---
        function renderQuestion() {
            onResults = false;
            const q = questions[currentQuestionIndex];
            const isLast = currentQuestionIndex === questions.length - 1;
            const isFirst = currentQuestionIndex === 0;
            const picked = userAnswers[currentQuestionIndex];

            progressBar.style.width = `${(currentQuestionIndex / questions.length) * 100}%`;

            const optionsHtml = q.options.map((opt, i) => `
                <button type="button"
                        class="option ${picked === i ? 'selected' : ''}"
                        onclick="selectOption(${i})">
                    <span class="label">${i + 1}</span>
                    <span class="text">${escapeHtml(opt)}</span>
                </button>
            `).join('');

            const prevHtml = isFirst
                ? ''
                : `<button type="button" class="verb" onclick="prevQuestion()"><span class="key">&larr;</span>prev</button>`;

            const nextLabel = isLast ? 'finish' : 'next';
            const nextEnabled = picked !== null;
            const nextHtml = nextEnabled
                ? `<button type="button" class="verb" onclick="nextQuestion()"><span class="key">&#x21B5;</span>${nextLabel}</button>`
                : `<span class="verb disabled"><span class="key">&#x21B5;</span>${nextLabel}</span>`;

            contentDiv.innerHTML = `
                <div class="q-header">
                    <span class="count">question ${currentQuestionIndex + 1} of ${questions.length}</span>
                    <span class="domain">[ ${escapeHtml(q.domain.toLowerCase())} ]</span>
                </div>

                <div class="stem">${escapeHtml(q.q)}</div>

                <div class="options">${optionsHtml}</div>

                <div class="hints">
                    <span><span class="key">1-${q.options.length}</span>select</span>
                    ${prevHtml ? `<span>${prevHtml}</span>` : ''}
                    <span>${nextHtml}</span>
                </div>
            `;
        }

        function selectOption(i) {
            userAnswers[currentQuestionIndex] = i;
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (userAnswers[currentQuestionIndex] === null) return;
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            onResults = true;
            let correctCount = 0;
            questions.forEach((q, i) => { if (userAnswers[i] === q.correct) correctCount++; });
            const score = Math.round((correctCount / questions.length) * 100);
            const passed = score >= 83;
            progressBar.style.width = '100%';

            const reviewHtml = questions.map((q, i) => {
                const userAnswer = userAnswers[i];
                const skipped = userAnswer === null;
                const isCorrect = !skipped && userAnswer === q.correct;
                const userLabel = skipped ? '—' : `${userAnswer + 1}  ${escapeHtml(q.options[userAnswer])}`;
                const correctLabel = `${q.correct + 1}  ${escapeHtml(q.options[q.correct])}`;
                const statusGlyph = isCorrect
                    ? `<span class="glyph-correct">&#x2713;</span><span class="verdict correct">correct</span>`
                    : `<span class="glyph-incorrect">&#x2717;</span><span class="verdict incorrect">${skipped ? 'skipped' : 'incorrect'}</span>`;
                const yourLineClass = skipped ? 'skipped' : (isCorrect ? 'right' : 'wrong');
                return `
                    <div class="review-q ${isCorrect ? 'correct' : 'incorrect'}">
                        <div class="status">Q.${i + 1}${statusGlyph}</div>
                        <div class="stem-mini">${escapeHtml(q.q)}</div>
                        <div class="ans-line ${yourLineClass}">
                            <span class="ans-label">your answer:</span>
                            <span class="ans-val">${userLabel}</span>
                        </div>
                        <div class="ans-line right">
                            <span class="ans-label">correct answer:</span>
                            <span class="ans-val">${correctLabel}</span>
                        </div>
                        <div class="explanation"><span class="arrow">&rsaquo;</span>${escapeHtml(q.explanation)}</div>
                    </div>
                `;
            }).join('');

            contentDiv.innerHTML = `
                <div class="results-heading">results</div>

                <div class="score-row">
                    <span><span class="label">score</span> <span class="score-val">${score} / 100</span></span>
                    <span class="${passed ? 'verdict-pass' : 'verdict-fail'}">${passed ? 'pass' : 'fail'}</span>
                    <span class="threshold">(&ge; 83 to pass)</span>
                </div>

                <div class="stats-row">
                    <span><span class="stat-label">correct</span><span class="stat-val">${correctCount}</span></span>
                    <span><span class="stat-label">incorrect</span><span class="stat-val">${questions.length - correctCount}</span></span>
                    <span><span class="stat-label">total</span><span class="stat-val">${questions.length}</span></span>
                </div>

                <div class="review-heading">review<span class="dashes"></span></div>

                ${reviewHtml}

                <div class="retake-row">
                    <button type="button" class="verb" onclick="location.reload()"><span class="key">&#x21B5;</span>retake</button>
                </div>
            `;
            window.scrollTo(0, 0);
        }

        // --- KEYBOARD ---
        window.addEventListener('keydown', (e) => {
            const tag = document.activeElement && document.activeElement.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA') return;

            if (onResults) {
                if (e.key === 'Enter') { e.preventDefault(); location.reload(); }
                return;
            }

            if (/^[1-9]$/.test(e.key)) {
                const i = Number(e.key) - 1;
                const q = questions[currentQuestionIndex];
                if (i < q.options.length) { e.preventDefault(); selectOption(i); }
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault(); prevQuestion();
            } else if (e.key === 'ArrowRight' || e.key === 'Enter') {
                e.preventDefault(); nextQuestion();
            }
        });

        init();
    </script>
</body>
</html>
