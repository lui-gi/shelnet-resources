<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelnet Quiz</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #0c0c0c;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --border-color: rgba(255, 255, 255, 0.15);
            --accent: #3b82f6; /* Default — overridden per-quiz via ACCENT_HEX in CONFIG */
            --accent-dim: rgba(59, 130, 246, 0.1); /* Default — overridden via setProperty in init() */
            --accent-glow: rgba(59, 130, 246, 0.4); /* Default — overridden via setProperty in init() */
            --accent-select: rgba(59, 130, 246, 0.3); /* Default — overridden via setProperty in init() */
            --accent-red: #ef4444;
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            /* Grid Background Effect */
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Selection Color */
        ::selection {
            background: var(--accent-select);
            color: #dbeafe;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            position: relative;
            z-index: 10;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            min-height: 600px;
            display: flex;
            flex-direction: column;
        }

        /* --- Terminal Header Bar --- */
        .terminal-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-color);
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot.red { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); }
        .dot.yellow { background: rgba(234, 179, 8, 0.2); border: 1px solid rgba(234, 179, 8, 0.5); }
        .dot.green { background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.5); }

        /* --- Brutal Header Section --- */
        .header {
            padding: 40px 40px 20px 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 10px;
            line-height: 1;
        }

        .header .subtitle {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            display: block;
        }

        /* --- Progress Bar --- */
        .progress-container {
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.1);
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--accent);
        }

        /* --- Content Area --- */
        .content {
            padding: 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px dashed var(--border-color);
        }

        .question-number {
            font-family: var(--font-mono);
            color: var(--accent);
            font-size: 0.9rem;
        }

        .domain-tag {
            font-family: var(--font-mono);
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .question-text {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 40px;
            color: #eee;
            font-weight: 400;
        }

        /* --- Options --- */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            position: relative;
        }

        .option:hover {
            border-color: var(--accent);
            background: rgba(255,255,255,0.04);
        }

        .option.selected {
            background: var(--accent-dim);
            border-color: var(--accent);
        }

        .option-label {
            font-family: var(--font-mono);
            margin-right: 20px;
            color: var(--text-muted);
            font-weight: bold;
            min-width: 25px;
        }

        .option.selected .option-label {
            color: var(--accent);
        }

        .option-text {
            flex: 1;
            font-size: 1rem;
            color: rgba(255,255,255,0.8);
        }

        .option.selected .option-text {
            color: #fff;
        }

        /* --- Buttons --- */
        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 50px;
        }

        .btn {
            padding: 12px 24px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: #fff;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover:not(:disabled) {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .btn-primary {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: var(--border-color);
        }

        /* --- Results Screen --- */
        .results {
            animation: fadeIn 0.5s ease;
        }

        .score-card {
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.02);
            padding: 40px;
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        /* Terminal scanline effect for score */
        .score-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: rgba(255,255,255,0.1);
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .score-number {
            font-size: 5rem;
            font-weight: bold;
            font-family: var(--font-mono);
            margin: 10px 0;
            color: #fff;
        }

        .pass-fail {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            padding: 10px 20px;
            display: inline-block;
            border: 1px solid currentColor;
            margin-top: 20px;
        }

        .pass { color: var(--accent); }
        .fail { color: var(--accent-red); }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            padding: 20px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            font-family: var(--font-mono);
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-family: var(--font-mono);
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Review Section */
        .review-question {
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.02);
            padding: 25px;
            margin-bottom: 20px;
            border-left: 4px solid transparent;
        }

        .review-question.correct { border-left-color: var(--accent); }
        .review-question.incorrect { border-left-color: var(--accent-red); }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .review-status.correct { color: var(--accent); }
        .review-status.incorrect { color: var(--accent-red); }

        .review-text {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 20px;
        }

        .review-answers {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            padding: 15px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .answer-line {
            margin-bottom: 8px;
            display: flex;
        }

        .answer-line strong {
            width: 140px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .explanation {
            margin-top: 15px;
            padding: 15px;
            border-left: 2px solid var(--text-muted);
            background: rgba(255,255,255,0.03);
            font-size: 0.95rem;
            color: #ccc;
        }

        .explanation-title {
            font-family: var(--font-mono);
            text-transform: uppercase;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0c0c0c;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--accent) #0c0c0c;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .header h1 { font-size: 2rem; }
            .content { padding: 20px; }
            .question-header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .score-number { font-size: 3rem; }
            .navigation { flex-direction: column; gap: 15px; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="terminal-bar">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
            <span style="margin-left: 10px;">bash — user@shelnet-exam: ~</span>
        </div>

        <div class="header">
            <h1 id="quizTitle">Quiz Title</h1>
            <div class="subtitle" id="quizSubtitle">C:\Shelnet\Quizzes> Objective</div>
        </div>

        <div class="progress-container">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <div class="content" id="examContent">
            </div>
    </div>

    <script>
        // ============================================================
        // QUIZ CONFIG — edit this block when deriving a new quiz.
        // Leave the rest of this file unchanged.
        // ============================================================
        const QUIZ_TITLE    = 'Practice Quiz 3.2';
        const QUIZ_SUBTITLE = 'C:\\Shelnet\\Quizzes> CS0-003 Objective 3.2';
        const ACCENT_HEX    = '#06b6d4';

        const questions = [
            {
                q: 'A SOC analyst receives an EDR alert indicating that a workstation is beaconing to a known malicious IP every 60 seconds. The analyst has confirmed the beacon is consistent with a command-and-control callback. Which action should the analyst take FIRST?',
                options: [
                    'A. Reimage the workstation immediately to eradicate the malware',
                    'B. Isolate the workstation from the network to contain the threat while preserving the ability to investigate',
                    'C. Collect a full memory dump of the workstation before taking any other action',
                    'D. Notify the legal team and place the workstation under legal hold before touching it'
                ],
                correct: 1,
                domain: 'Incident Response and Management',
                explanation: 'Network isolation (containment) is the correct FIRST action -- it stops active C2 communication and limits lateral movement while preserving evidence for investigation. Reimaging (A) is eradication and destroys volatile evidence; memory collection (C) is valuable but requires the host to be isolated from active attacker control first; legal hold (D) is a documentation step, not an immediate containment action.'
            },
            {
                q: 'An incident responder is collecting a forensic image of a compromised server\'s hard drive. To ensure the integrity of the acquired image can be proven in court, which procedure is MOST critical?',
                options: [
                    'A. Use a hardware write blocker and generate cryptographic hashes of the source drive and the image immediately after acquisition',
                    'B. Compress the image with a password and store it on a network share accessible only to IR team members',
                    'C. Acquire the image using a live-response tool while the system remains online to capture running processes',
                    'D. Store the original drive in an evidence bag and create the forensic image from a clone made weeks later'
                ],
                correct: 0,
                domain: 'Incident Response and Management',
                explanation: 'Using a hardware write blocker prevents any writes to the source drive, and generating cryptographic hashes (e.g., MD5/SHA-256) immediately after acquisition provides a verifiable integrity baseline for court admissibility. Compression with a password (B) addresses storage access but not write protection or integrity; live-response imaging (C) misses disk artifacts and risks contamination; delayed cloning (D) breaks chain of custody.'
            },
            {
                q: 'A security analyst detects that an attacker has compromised three servers in a segment and is actively moving laterally. The IR team must choose a containment strategy that limits attacker movement without immediately disrupting business operations. Which approach MOST effectively balances containment and continuity?',
                options: [
                    'A. Shut down the entire network segment to stop all attacker movement',
                    'B. Reset all user passwords enterprise-wide to invalidate stolen credentials',
                    'C. Apply compensating controls such as blocking malicious IOC at the firewall and restricting inter-server communication while maintaining critical services',
                    'D. Wait and monitor to gather more intelligence before taking any containment action'
                ],
                correct: 2,
                domain: 'Incident Response and Management',
                explanation: 'Applying targeted compensating controls (firewall rules blocking IOC, micro-segmentation of affected servers) contains the attacker while keeping critical services running. Shutting down the entire segment (A) disrupts business; enterprise-wide password reset (B) is disruptive and may alert the attacker prematurely; passive monitoring only (D) allows continued spread without containment.'
            },
            {
                q: 'A digital forensics analyst receives a seized laptop as part of a criminal investigation. Before imaging the drive, the analyst must document every person who handled the device from seizure to laboratory receipt. Which IR concept MOST directly governs this documentation requirement?',
                options: [
                    'A. Legal hold, which freezes evidence in place to prevent destruction',
                    'B. Data integrity validation, which verifies the evidence has not been altered',
                    'C. Evidence preservation, which requires imaging before any analysis',
                    'D. Chain of custody, which records every transfer and access of physical evidence'
                ],
                correct: 3,
                domain: 'Incident Response and Management',
                explanation: 'Chain of custody is the documentation process that records every person who handled the evidence, every location it was stored, and every time it changed hands -- directly addressing the requirement described. Legal hold (A) applies to data retention before legal proceedings; data integrity validation (B) uses hashing; evidence preservation (C) is about imaging, not the transfer documentation.'
            },
            {
                q: 'An IR team has successfully contained a ransomware outbreak by isolating affected hosts. Before reimaging and restoring from backup, the team needs to confirm all malware artifacts have been identified and removed from every affected system. Which IR phase does this activity represent MOST accurately?',
                options: [
                    'A. Detection and Analysis, because the team is identifying malware artifacts',
                    'B. Eradication, because the team is removing all malicious components from affected systems',
                    'C. Containment, because the team is preventing further spread while cleaning systems',
                    'D. Recovery, because the team is restoring systems to normal operation'
                ],
                correct: 1,
                domain: 'Incident Response and Management',
                explanation: 'Eradication is the IR phase in which all malware, backdoors, and attacker footholds are identified and removed from affected systems -- a prerequisite to recovery. Detection and Analysis (A) occurred earlier when the incident was identified; Containment (C) is the prior phase that stopped spread; Recovery (D) is the subsequent phase of restoring systems to production.'
            },
            {
                q: 'A SOC analyst investigating a suspected insider threat case needs to collect volatile evidence from a running Windows workstation. According to evidence acquisition best practices, which data type should be collected FIRST due to its transient nature?',
                options: [
                    'A. RAM contents, because they contain running processes, network connections, and decrypted encryption keys that are lost when the system powers off',
                    'B. The Windows Registry hive files, because they contain persistence artifacts that disappear on reboot',
                    'C. Browser history and cached files, because they reveal the user\'s online activities',
                    'D. The pagefile.sys, because it may contain memory artifacts that spilled to disk'
                ],
                correct: 0,
                domain: 'Incident Response and Management',
                explanation: 'RAM is the most volatile evidence source -- it contains running processes, network connections, clipboard contents, and decryption keys that are permanently lost on power-off, making it the FIRST priority in volatile evidence collection. Registry hive files (B) and the pagefile (D) persist on disk after reboot; browser history (C) is also disk-resident and less volatile than RAM.'
            },
            {
                q: 'An incident responder has completed eradication of a malware infection on a Windows server. The team is now preparing to return the server to production. Which action MOST accurately describes the Recovery phase of the IR lifecycle in this context?',
                options: [
                    'A. Documenting all IOC discovered during the investigation for sharing with threat-intel platforms',
                    'B. Applying additional firewall rules to prevent similar malware from reaching the server in the future',
                    'C. Restoring the server from a known-good backup, applying outstanding patches, and monitoring for signs of re-infection before declaring the incident closed',
                    'D. Conducting a tabletop exercise with the IR team to test the response playbook used during the incident'
                ],
                correct: 2,
                domain: 'Incident Response and Management',
                explanation: 'Recovery involves restoring affected systems to verified, known-good states and returning them to production under enhanced monitoring. IOC documentation (A) is an analysis artifact shared during or after recovery; adding firewall rules (B) is a remediation/mitigation action that may occur alongside recovery; tabletop exercises (D) are a preparation-phase activity.'
            },
            {
                q: 'A security analyst discovers that a compromised host was used to exfiltrate data over DNS by encoding sensitive content in DNS query strings. The attacker has since abandoned the host. Which eradication step should the IR team take FIRST before returning the host to service?',
                options: [
                    'A. Update DNS server ACLs to block outbound DNS requests from the VLAN',
                    'B. Notify the DNS provider and request removal of the attacker\'s domain',
                    'C. Apply a patch for the exploit that was used to initially compromise the host',
                    'D. Reimage the host from a known-good baseline to eliminate all attacker artifacts'
                ],
                correct: 3,
                domain: 'Incident Response and Management',
                explanation: 'Reimaging from a known-good baseline is the most thorough eradication method -- it removes the OS, all malware, backdoors, and attacker modifications with certainty. Updating DNS ACLs (A) is a compensating control but does not remove the malware; notifying the DNS provider (B) removes the exfiltration channel but not the implant; patching (C) closes the initial attack vector but leaves existing artifacts in place.'
            },
            {
                q: 'A SOC analyst receives an alert from the SIEM indicating failed logins from an account across 15 different servers in 2 minutes, followed by a successful login on the 16th attempt. Which category of IOC does this pattern MOST likely represent?',
                options: [
                    'A. Credential-based brute-force or password-spraying attack indicating an authentication anomaly IOC',
                    'B. Bandwidth consumption anomaly indicating a data exfiltration attempt',
                    'C. Beaconing behavior indicating an established C2 channel',
                    'D. Privilege escalation indicating the attacker has obtained admin rights'
                ],
                correct: 0,
                domain: 'Incident Response and Management',
                explanation: 'Rapid failed logins across multiple systems followed by a success is the classic pattern of a credential brute-force or password-spraying attack -- an authentication anomaly IOC. Bandwidth anomalies (B) relate to data volume, not authentication; beaconing (C) is regular outbound communication patterns; privilege escalation (D) involves elevating access level, not the login pattern described.'
            },
            {
                q: 'An incident responder is performing root cause analysis (RCA) on a phishing compromise. After tracing the full attack chain, the team wants to verify that the forensic image collected from the compromised workstation has not been altered since acquisition. Which technique MOST directly validates this integrity?',
                options: [
                    'A. Re-running the AV scan against the image to check for known malware signatures',
                    'B. Comparing the cryptographic hash of the forensic image against the hash recorded at the time of acquisition',
                    'C. Verifying the image file size matches the original drive\'s reported capacity',
                    'D. Mounting the image read-only and checking the last-modified timestamps on key system files'
                ],
                correct: 1,
                domain: 'Incident Response and Management',
                explanation: 'Comparing the current cryptographic hash (e.g., SHA-256) of the forensic image to the hash computed at acquisition time directly validates that the image is bit-for-bit identical and unaltered. AV scanning (A) detects malware, not image tampering; file size comparison (C) is imprecise and does not detect content changes; checking timestamps (D) tests file metadata within the image, not the image integrity itself.'
            },
            {
                q: 'An IR team is managing a ransomware incident affecting 40 workstations. The CISO asks the team to scope the full impact before authorizing recovery. Which step BEST describes scoping the incident impact in the containment phase?',
                options: [
                    'A. Restoring the 40 workstations from backup to establish a clean baseline before assessing further',
                    'B. Engaging legal counsel to prepare regulatory notification filings before quantifying the scope',
                    'C. Identifying all affected systems, determining what data was encrypted or exfiltrated, and mapping how the ransomware spread across the environment',
                    'D. Deploying additional EDR agents across the enterprise to detect any re-infection after recovery'
                ],
                correct: 2,
                domain: 'Incident Response and Management',
                explanation: 'Scoping involves identifying all affected systems, quantifying data impact (encryption + potential exfiltration), and understanding the spread path -- all of which must be understood before recovery begins. Restoring systems (A) is recovery and premature without full scope; engaging legal (B) is a communication/notification step; deploying additional EDR (D) is a future-state improvement, not current scoping.'
            },
            {
                q: 'A digital forensics analyst is tasked with imaging a Windows server that is under legal hold. During acquisition, which practice MOST directly ensures the legal hold requirements are met?',
                options: [
                    'A. Ensuring the original evidence media is not altered, documenting all actions, and preserving all data in its original state until authorized disposal',
                    'B. Encrypting the forensic image with AES-256 and uploading it to a cloud storage provider',
                    'C. Deleting temporary files on the server before imaging to reduce the image size',
                    'D. Notifying all system users that their data is being collected as part of a legal investigation'
                ],
                correct: 0,
                domain: 'Incident Response and Management',
                explanation: 'Legal hold requires that evidence be preserved unaltered, all actions documented, and data retained until legal proceedings are complete. Encrypting and cloud-uploading (B) may be part of secure storage but does not address alteration prevention; deleting temp files (C) directly violates legal hold by destroying potential evidence; user notification (D) may be required in some jurisdictions but is not the core legal hold procedure.'
            },
            {
                q: 'A tier-2 analyst is triaging an incident where an employee\'s workstation shows signs of compromise but the employee is in the middle of a critical financial transaction. The IR team must choose a containment approach. Which method BEST balances containment with minimal business disruption in this scenario?',
                options: [
                    'A. Immediately power off the workstation and confiscate it as evidence without warning',
                    'B. Apply network-layer containment by blocking the workstation\'s IP at the firewall and monitoring its traffic, allowing the transaction to complete before physical isolation',
                    'C. Allow the workstation to remain fully operational and uncontained until the transaction is complete',
                    'D. Migrate the financial transaction to a clean system and reimage the compromised workstation immediately'
                ],
                correct: 1,
                domain: 'Incident Response and Management',
                explanation: 'Network-layer containment (firewall block + traffic monitoring) stops attacker exfiltration and C2 callbacks while allowing the user to complete the critical transaction on the isolated host. Immediate power-off (A) destroys volatile evidence and stops the transaction; no containment (C) allows the attacker to continue operating; migrating the transaction (D) may be appropriate but reimaging immediately discards volatile evidence.'
            },
            {
                q: 'An incident responder is conducting RCA on a web application compromise. Using the 5 Whys technique, the team traces the root cause to a missing patch for a known CVE that was available for 90 days before exploitation. Which output of the RCA process MOST directly results from this finding?',
                options: [
                    'A. An updated IR playbook documenting how to contain web application compromises faster',
                    'B. A recommendation to reset all application user passwords enterprise-wide',
                    'C. A corrective action to remediate the patch management process gap that allowed the CVE to remain unpatched',
                    'D. A regulatory report disclosing the compromise to the relevant authority within the required timeframe'
                ],
                correct: 2,
                domain: 'Incident Response and Management',
                explanation: 'RCA using 5 Whys identifies the systemic root cause -- in this case a patch management gap -- and the output is a corrective action to fix that process (e.g., enforce patching SLAs or automate patch deployment). Updating the IR playbook (A) addresses response procedures, not the root cause; password resets (B) are irrelevant to a patching failure; regulatory reporting (D) is a notification requirement, not an RCA output.'
            },
            {
                q: 'A SOC analyst discovers that a threat actor has been living in the environment for 60 days, accessing file servers nightly while evading detection. After containment, the IR team needs to verify that no attacker artifacts remain before returning systems to production. Which eradication verification step MOST effectively confirms a clean state?',
                options: [
                    'A. Running a full credentialed vulnerability scan to verify no known CVEs remain unpatched on the affected systems',
                    'B. Reviewing SIEM logs from the 60-day period to verify no new alerts have fired since containment',
                    'C. Resetting passwords for all compromised accounts and enabling MFA as the sole eradication measure',
                    'D. Performing post-eradication threat hunting using IOC derived from the investigation to confirm no attacker artifacts remain in the environment'
                ],
                correct: 3,
                domain: 'Incident Response and Management',
                explanation: 'Post-eradication threat hunting using IOC from the investigation is the MOST effective verification step -- it actively searches for remaining attacker artifacts (backdoors, scheduled tasks, residual implants) that automated scans might miss. Vulnerability scanning (A) finds CVEs, not attacker artifacts; SIEM log review (B) is passive and relies on existing alerts that already failed to detect a 60-day intrusion; password resets + MFA (C) address credential exposure but do not verify eradication of all artifacts.'
            }
        ];

        // ============================================================
        // END CONFIG — chrome below is shared. Do not edit when deriving.
        // ============================================================

        // Small util: convert '#06b6d4' -> 'rgba(6, 182, 212, 0.1)' for the dim variant.
        function hexToRgba(hex, alpha) {
            const h = hex.replace('#', '');
            const r = parseInt(h.substring(0, 2), 16);
            const g = parseInt(h.substring(2, 4), 16);
            const b = parseInt(h.substring(4, 6), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // --- APP STATE ---
        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);

        // --- DOM ELEMENTS ---
        const contentDiv = document.getElementById('examContent');
        const progressBar = document.getElementById('progressBar');

        // --- INITIALIZATION ---
        function init() {
            // --- Apply CONFIG ---
            document.title = QUIZ_TITLE;
            document.getElementById('quizTitle').textContent = QUIZ_TITLE;
            document.getElementById('quizSubtitle').textContent = QUIZ_SUBTITLE;
            document.documentElement.style.setProperty('--accent', ACCENT_HEX);
            document.documentElement.style.setProperty('--accent-dim', hexToRgba(ACCENT_HEX, 0.1));
            document.documentElement.style.setProperty('--accent-glow', hexToRgba(ACCENT_HEX, 0.4));
            document.documentElement.style.setProperty('--accent-select', hexToRgba(ACCENT_HEX, 0.3));

            // --- existing init body continues below ---
            renderQuestion();
        }

        // --- RENDER FUNCTIONS ---
        function renderQuestion() {
            const q = questions[currentQuestionIndex];
            const isLastQuestion = currentQuestionIndex === questions.length - 1;

            // Update Progress
            const progress = ((currentQuestionIndex) / questions.length) * 100;
            progressBar.style.width = `${progress}%`;

            // HTML Structure for Question
            let html = `
                <div class="question-header">
                    <span class="question-number">QUESTION ${currentQuestionIndex + 1} OF ${questions.length}</span>
                    <span class="domain-tag">${q.domain}</span>
                </div>

                <div class="question-text">${q.q}</div>

                <div class="options">
                    ${q.options.map((opt, index) => {
                        const isSelected = userAnswers[currentQuestionIndex] === index;
                        const label = String.fromCharCode(65 + index); // A, B, C, D
                        return `
                            <div class="option ${isSelected ? 'selected' : ''}" onclick="selectOption(${index})">
                                <span class="option-label">${label}</span>
                                <span class="option-text">${opt}</span>
                            </div>
                        `;
                    }).join('')}
                </div>

                <div class="navigation">
                    <button class="btn" onclick="prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>
                        &larr; Previous
                    </button>
                    <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" ${userAnswers[currentQuestionIndex] === null ? 'disabled' : ''}>
                        ${isLastQuestion ? 'Finish Exam' : 'Next &rarr;'}
                    </button>
                </div>
            `;

            contentDiv.innerHTML = html;
        }

        function selectOption(index) {
            userAnswers[currentQuestionIndex] = index;
            // Re-render to show selection state (or just toggle class for performance, but re-render is safer for state sync)
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            // Calculate Score
            let correctCount = 0;
            questions.forEach((q, i) => {
                if (userAnswers[i] === q.correct) correctCount++;
            });

            const score = Math.round((correctCount / questions.length) * 100);
            const passed = score >= 83; // Approx 750/900
            progressBar.style.width = '100%';

            let html = `
                <div class="results">
                    <div class="score-card">
                        <div class="subtitle">EXAM RESULTS</div>
                        <div class="score-number">${score}</div>
                        <div class="subtitle">SCORE / 100</div>
                        <div class="pass-fail ${passed ? 'pass' : 'fail'}">
                            ${passed ? 'PASS' : 'FAIL'}
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-number">${correctCount}</div>
                            <div class="stat-label">Correct</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${questions.length - correctCount}</div>
                            <div class="stat-label">Incorrect</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${questions.length}</div>
                            <div class="stat-label">Total Questions</div>
                        </div>
                    </div>

                    <div class="subtitle" style="margin-bottom: 20px;">Review Answers</div>

                    ${questions.map((q, i) => {
                        const userAnswer = userAnswers[i];
                        const isCorrect = userAnswer === q.correct;
                        const labelUser = String.fromCharCode(65 + userAnswer);
                        const labelCorrect = String.fromCharCode(65 + q.correct);

                        return `
                            <div class="review-question ${isCorrect ? 'correct' : 'incorrect'}">
                                <div class="review-header">
                                    <span>Question ${i + 1}</span>
                                    <span class="review-status ${isCorrect ? 'correct' : 'incorrect'}">
                                        ${isCorrect ? 'CORRECT' : 'INCORRECT'}
                                    </span>
                                </div>
                                <div class="review-text">${q.q}</div>

                                <div class="review-answers">
                                    <div class="answer-line">
                                        <strong>Your Answer:</strong>
                                        <span style="color: ${isCorrect ? 'var(--accent)' : 'var(--accent-red)'}">
                                            ${labelUser}. ${q.options[userAnswer]}
                                        </span>
                                    </div>
                                    <div class="answer-line">
                                        <strong>Correct Answer:</strong>
                                        <span style="color: var(--accent)">
                                            ${labelCorrect}. ${q.options[q.correct]}
                                        </span>
                                    </div>
                                </div>

                                <div class="explanation">
                                    <div class="explanation-title">Explanation</div>
                                    ${q.explanation}
                                </div>
                            </div>
                        `;
                    }).join('')}

                    <div style="text-align: center; margin-top: 40px;">
                        <button class="btn btn-primary" onclick="location.reload()" style="display: inline-flex;">
                            Retake Exam
                        </button>
                    </div>
                </div>
            `;

            contentDiv.innerHTML = html;
            window.scrollTo(0,0);
        }

        // Start
        init();
    </script>
</body>
</html>
