<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelnet Quiz</title>
    <style>
        :root {
            --bg:           #000000;
            --text-90:      rgba(255, 255, 255, 0.90);
            --text-70:      rgba(255, 255, 255, 0.70);
            --text-45:      rgba(255, 255, 255, 0.45);
            --text-30:      rgba(255, 255, 255, 0.30);
            --rule:         rgba(255, 255, 255, 0.15);
            --accent:       #38bdf8; /* Default — overridden per-quiz via ACCENT_HEX */
            --accent-tint:  rgba(56, 189, 248, 0.14); /* selected-row */
            --accent-hover: rgba(56, 189, 248, 0.08); /* hover-row */
            --pass-green:   #43c08c;
            --wrong-red:    #fb7185;
            --font-mono:    'Courier New', Courier, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { background: var(--bg); }

        body {
            font-family: var(--font-mono);
            color: var(--text-90);
            min-height: 100vh;
            padding: 32px 0 48px;
            line-height: 1.5;
            font-size: 15px;
        }

        ::selection {
            background: var(--accent-tint);
            color: #fff;
        }

        .col {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* --- Header --- */
        .title-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 24px;
            color: var(--text-90);
        }

        .title-row .meta {
            color: var(--text-45);
            font-size: 13px;
        }

        .rule {
            border-top: 1px solid var(--rule);
            margin: 12px 0 0;
        }

        .progress {
            height: 2px;
            background: rgba(255, 255, 255, 0.06);
            margin-top: 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.25s ease;
        }

        /* --- Question --- */
        .content { margin-top: 32px; }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 4px 24px;
            color: var(--text-70);
            font-size: 13px;
        }

        .q-header .count { color: var(--accent); }
        .q-header .domain { color: var(--text-45); }

        .stem {
            color: var(--text-90);
            font-size: 17px;
            line-height: 1.6;
            margin: 24px 0 32px;
        }

        .options { display: flex; flex-direction: column; gap: 2px; }

        .option {
            display: flex;
            align-items: baseline;
            gap: 18px;
            padding: 10px 12px;
            cursor: pointer;
            background: transparent;
            border: 0;
            color: var(--text-90);
            font: inherit;
            text-align: left;
            width: 100%;
            transition: background-color 0.12s ease;
        }

        .option:hover { background: var(--accent-hover); }
        .option.selected { background: var(--accent-tint); }

        .option .label {
            color: var(--text-45);
            min-width: 1.5ch;
        }

        .option.selected .label { color: var(--accent); }

        .option .text { flex: 1; }

        /* --- Footer hints --- */
        .hints {
            margin-top: 32px;
            color: var(--text-45);
            font-size: 13px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 18px;
        }

        .hints .key { color: var(--accent); margin-right: 4px; }
        .hints .verb { color: var(--text-90); }
        .hints .verb:hover { text-decoration: underline; }
        .hints .verb.disabled { color: var(--text-30); cursor: not-allowed; }
        .hints .verb.disabled:hover { text-decoration: none; }

        button.verb {
            background: transparent;
            border: 0;
            font: inherit;
            padding: 0;
            cursor: pointer;
        }

        /* --- Results --- */
        .results-heading {
            color: var(--text-70);
            font-size: 15px;
            margin-bottom: 0;
        }

        .score-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 28px;
            margin-top: 28px;
            align-items: baseline;
        }

        .score-row .label { color: var(--text-45); }
        .score-row .score-val { color: var(--text-90); }
        .score-row .verdict-pass { color: var(--pass-green); }
        .score-row .verdict-fail { color: var(--wrong-red); }
        .score-row .threshold   { color: var(--text-45); }

        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 36px;
            margin-top: 16px;
            align-items: baseline;
        }

        .stats-row .stat-label { color: var(--text-45); margin-right: 8px; }
        .stats-row .stat-val   { color: var(--text-90); }

        .review-heading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-70);
            margin: 36px 0 16px;
        }

        .review-heading .dashes {
            color: var(--text-30);
            flex: 1;
            border-top: 1px solid var(--rule);
            margin-left: 4px;
            transform: translateY(1px);
        }

        .review-q {
            border-left: 2px solid var(--text-30);
            padding: 0 0 8px 14px;
            margin-bottom: 20px;
        }

        .review-q.correct   { border-left-color: var(--accent); }
        .review-q.incorrect { border-left-color: var(--wrong-red); }

        .review-q .status {
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-70);
        }

        .review-q .status .glyph-correct   { color: var(--accent); margin: 0 8px; }
        .review-q .status .glyph-incorrect { color: var(--wrong-red); margin: 0 8px; }
        .review-q .status .verdict.correct   { color: var(--accent); }
        .review-q .status .verdict.incorrect { color: var(--wrong-red); }

        .review-q .stem-mini {
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 10px;
            line-height: 1.55;
        }

        .review-q .ans-line {
            display: grid;
            grid-template-columns: 18ch 1fr;
            gap: 4px 8px;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .review-q .ans-line .ans-label { color: var(--text-45); }
        .review-q .ans-line.right .ans-val { color: var(--accent); }
        .review-q .ans-line.wrong .ans-val { color: var(--wrong-red); }
        .review-q .ans-line.skipped .ans-val { color: var(--text-45); }

        .review-q .explanation {
            margin-top: 10px;
            color: var(--text-70);
            font-size: 14px;
            line-height: 1.55;
        }

        .review-q .explanation .arrow { color: var(--accent); margin-right: 6px; }

        .retake-row {
            margin-top: 36px;
            text-align: center;
            color: var(--text-90);
        }

        .retake-row .key { color: var(--accent); margin-right: 4px; }
        .retake-row button.verb:hover { text-decoration: underline; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--accent); }
        * { scrollbar-width: thin; scrollbar-color: var(--accent) #000; }

        /* Mobile */
        @media (max-width: 600px) {
            .col { padding: 0 24px; }
            .stem { font-size: 16px; }
            body { font-size: 14px; padding: 24px 0 36px; }
            .review-q .ans-line { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="col">
        <div class="title-row">
            <span id="quizTitle">quiz</span>
            <span class="meta" id="quizMeta">— · — · 0q</span>
        </div>
        <div class="rule"></div>
        <div class="progress"><div class="progress-fill" id="progressBar"></div></div>

        <div class="content" id="examContent"></div>
    </div>

    <script>
        // ============================================================
        // QUIZ CONFIG — edit this block when deriving a new quiz.
        // Leave the rest of this file unchanged.
        // ============================================================
        const QUIZ_TITLE    = "practice quiz 3.1";
        const QUIZ_SUBTITLE = "cysa-plus · obj 3.1";
        const ACCENT_HEX    = "#22d3ee";

        const questions = [
            {
                q: "A security analyst reviewing a phishing campaign observes that the attacker registered a lookalike domain, crafted a macro-enabled document, and sent it via email. Which phase of the Cyber Kill Chain does the email delivery represent MOST accurately?",
                options: ["Weaponization, because the malicious document was constructed at this stage", "Delivery, because the weaponized payload was transmitted to the target", "Exploitation, because the email caused the victim to click a link", "Reconnaissance, because the attacker gathered target email addresses beforehand"],
                correct: 1,
                domain: "Incident Response and Management",
                explanation: "Delivery is the Cyber Kill Chain phase in which the attacker transmits the weaponized payload (in this case the email with the malicious document) to the target. Weaponization (1) is when the payload is built; Exploitation (3) occurs when the victim executes the payload; Reconnaissance (4) is the earlier information-gathering phase."
            },
            {
                q: "A SOC analyst investigating a breach discovers that the attacker installed a remote access trojan that phoned home on TCP 443 to blend in with HTTPS traffic. Which Cyber Kill Chain phase BEST describes this activity?",
                options: ["Installation, because the trojan was placed on the host file system", "Actions on Objectives, because the attacker achieved their final goal", "C2, because the trojan established an outbound channel to the attacker", "Exploitation, because the trojan leveraged a software vulnerability to persist"],
                correct: 2,
                domain: "Incident Response and Management",
                explanation: "C2 (Command and Control) is the phase where the implanted malware opens a communication channel back to the attacker's infrastructure. Installation (1) is the earlier phase when the trojan was written to disk; Actions on Objectives (2) is what follows C2 once control is established; Exploitation (4) refers to the initial code-execution event."
            },
            {
                q: "An incident responder is mapping a confirmed intrusion to the Diamond Model of Intrusion Analysis. The team has identified the attacker group, the targeted organization, the C2 server IP, and the custom malware used. Which Diamond Model vertex does the custom malware represent MOST directly?",
                options: ["Adversary, because the malware was created by the threat actor", "Infrastructure, because the malware communicates over network channels", "Victim, because the malware executes on the victim's endpoint", "Capability, because the malware is the tool used to accomplish the attack"],
                correct: 3,
                domain: "Incident Response and Management",
                explanation: "In the Diamond Model, Capability represents the tools and techniques the adversary employs against the victim -- custom malware is the quintessential capability artifact. Adversary (1) is the threat actor identity; Infrastructure (2) is the C2 server IP; Victim (3) is the targeted organization."
            },
            {
                q: "A tier-2 analyst is using MITRE ATT&CK to characterize observed attacker behaviors. The analyst notes that the attacker used a scheduled task for persistence and dumped LSASS memory for credential access. Which ATT&CK concept BEST describes these two observations?",
                options: ["Techniques, because they are specific adversary behaviors mapped to tactics in the ATT&CK matrix", "Groups, because the behaviors identify a known threat actor cluster", "Software entries, because the behaviors correspond to named malware tools", "Sub-techniques only, because scheduled tasks and LSASS dumping are too granular for technique-level mapping"],
                correct: 0,
                domain: "Incident Response and Management",
                explanation: "ATT&CK Techniques are the specific methods adversaries use to achieve tactical goals (e.g., T1053 Scheduled Task/Job for persistence, T1003.001 LSASS Memory for credential access). Groups (2) are named threat actor clusters; Software (3) are named tools; the claim in (4) is wrong -- both behaviors have technique-level entries, not sub-technique only."
            },
            {
                q: "A security analyst is evaluating which framework to use to assess the physical security of a financial institution's data center, including personnel security and operational controls, in addition to its technical network controls. Which framework BEST supports this scope?",
                options: ["MITRE ATT&CK, because it covers post-compromise TTP across all operating environments", "Cyber Kill Chain, because it maps attacker phases from reconnaissance to actions on objectives", "OSSTMM, because it provides a methodology for testing physical, human, and technical security channels", "Diamond Model, because it correlates adversary, victim, infrastructure, and capability"],
                correct: 2,
                domain: "Incident Response and Management",
                explanation: "OSSTMM (Open Source Security Testing Methodology Manual) explicitly covers physical, human, wireless, telecommunications, and network security testing channels, making it the BEST fit for a scope that includes physical and operational controls. MITRE ATT&CK (1) and Cyber Kill Chain (2) are threat/attack frameworks, not testing methodologies; Diamond Model (4) is an intrusion-analysis framework."
            },
            {
                q: "An IR team lead is briefing executives on how attackers typically progress from initial access to data exfiltration. The lead wants a linear, phase-based model that a non-technical audience can follow. Which framework MOST clearly illustrates this sequential attack progression?",
                options: ["OWASP Testing Guide, because it breaks web application testing into numbered phases", "Cyber Kill Chain, because it presents a sequential seven-phase model of attacker activity", "MITRE ATT&CK, because it organizes TTP into a matrix of tactics and techniques", "Diamond Model, because it provides a four-vertex graph of intrusion components"],
                correct: 1,
                domain: "Incident Response and Management",
                explanation: "The Cyber Kill Chain provides a linear seven-phase model (Reconnaissance through Actions on Objectives) that is easy for non-technical audiences to follow. OWASP Testing Guide (1) is a web testing methodology; MITRE ATT&CK (3) is a matrix, not a sequential narrative; the Diamond Model (4) is a relational graph, not a sequential flow."
            },
            {
                q: "A SOC analyst receives a threat intelligence report describing an actor who gathered publicly available employee names and emails from LinkedIn before crafting spear-phishing lures. Which Cyber Kill Chain phase does this activity represent MOST accurately?",
                options: ["Delivery, because the attacker sent communication to the target", "Reconnaissance, because the attacker collected target information from open sources", "Weaponization, because the attacker built a custom payload using gathered data", "Installation, because the attacker identified where to place future malware"],
                correct: 1,
                domain: "Incident Response and Management",
                explanation: "Reconnaissance is the first Cyber Kill Chain phase, covering all pre-attack information gathering including OSINT on employees via LinkedIn. Delivery (1) is when the payload reaches the target; Weaponization (3) is crafting the payload; Installation (4) is placing malware post-exploitation."
            },
            {
                q: "An incident responder is analyzing a breach where the attacker exploited a vulnerability in a web application to gain a shell, then pivoted to exfiltrate a customer database. The team wants to map the attacker's TTP to ATT&CK to identify detection gaps. Which ATT&CK component MOST directly provides mappable detection opportunities against these behaviors?",
                options: ["ATT&CK Groups, which list known threat actor clusters and their attributed campaigns", "ATT&CK Techniques and Sub-techniques, which describe specific adversary behaviors and include detection notes", "ATT&CK Software, which enumerates malware families associated with threat groups", "ATT&CK Mitigations, which prescribe defensive controls without listing detection methods"],
                correct: 1,
                domain: "Incident Response and Management",
                explanation: "ATT&CK Technique and Sub-technique pages include data sources, detection guidance, and mitigation references, making them the primary component for identifying detection opportunities. Groups (1) provide attribution context; Software (3) lists tools; Mitigations (4) are defensive prescriptions -- and the statement that they exclude detection methods is a mischaracterization."
            },
            {
                q: "A digital forensics analyst is describing the Diamond Model to a new team member. The analyst explains that the C2 IP addresses, domain names, and email accounts used by the attacker all belong to the same vertex. Which Diamond Model vertex is the analyst describing MOST accurately?",
                options: ["Infrastructure, because they are the network and communication resources the adversary uses", "Adversary, because they are controlled by the threat actor", "Capability, because these artifacts enable the attacker's malicious actions", "Victim, because they are the entry points targeted by the attacker"],
                correct: 0,
                domain: "Incident Response and Management",
                explanation: "In the Diamond Model, Infrastructure comprises the IP addresses, domain names, email addresses, and other network resources the adversary leverages to stage and execute attacks. Capability (3) refers to the malware and exploits; Adversary (2) is the threat actor itself; Victim (4) is the targeted organization, not the attacker's own communication resources."
            },
            {
                q: "A security analyst discovers that after exploitation, the attacker copied a custom backdoor to the Windows startup folder and added a registry Run key to ensure it executed at every boot. Which Cyber Kill Chain phase BEST describes this activity?",
                options: ["Exploitation, because the attacker used a vulnerability to run the backdoor", "C2, because the backdoor beacons home after starting", "Delivery, because the backdoor was transferred from an external host", "Installation, because the attacker established persistence mechanisms on the host"],
                correct: 3,
                domain: "Incident Response and Management",
                explanation: "Installation is the Cyber Kill Chain phase covering persistence establishment -- writing malware to disk and configuring autorun mechanisms like startup folders and registry Run keys. Exploitation (1) is the code-execution event that preceded this; C2 (2) is the subsequent outbound callback; Delivery (3) is the earlier payload transmission phase."
            },
            {
                q: "A SOC analyst is comparing the OWASP Testing Guide to MITRE ATT&CK for use in a web application penetration test engagement. Which statement MOST accurately distinguishes the two frameworks?",
                options: ["The OWASP Testing Guide is a prescriptive testing methodology for web applications, while MITRE ATT&CK is a knowledge base of observed adversary TTP across enterprise environments", "MITRE ATT&CK covers only network-layer attacks, while OWASP covers both network and application layers", "The OWASP Testing Guide is used exclusively for post-incident analysis, while MITRE ATT&CK is used only during active penetration testing", "Both frameworks provide identical coverage but MITRE ATT&CK uses numbered phases while OWASP uses named tactics"],
                correct: 0,
                domain: "Incident Response and Management",
                explanation: "OWASP Testing Guide provides structured web application test cases (e.g., OTG-AUTHN, OTG-INPVAL categories), while MITRE ATT&CK is a threat knowledge base cataloging observed TTP used by real adversaries. Option B mischaracterizes ATT&CK scope; Option C mischaracterizes both frameworks' use cases; Option D is factually wrong."
            },
            {
                q: "An incident responder has confirmed that an attacker used stolen domain credentials to log in to a SharePoint server and download 50 GB of sensitive documents before the SOC detected the intrusion. Which Cyber Kill Chain phase MOST accurately describes the document exfiltration activity?",
                options: ["Actions on Objectives, because the attacker accomplished their final goal of stealing data", "Reconnaissance, because the attacker surveyed which documents existed before downloading", "Installation, because the attacker placed themselves persistently inside the environment", "Exploitation, because the attacker exploited credential theft to access the server"],
                correct: 0,
                domain: "Incident Response and Management",
                explanation: "Actions on Objectives is the final Cyber Kill Chain phase in which the attacker achieves their mission -- in this case, data exfiltration. Reconnaissance (2) is pre-attack; Installation (3) is persistence establishment; Exploitation (4) is the code/auth vulnerability phase that enabled initial access, not the subsequent data theft."
            },
            {
                q: "A security analyst is mapping a threat group's campaign to the Diamond Model. The team confirmed the group is APT29, the targeted sector is government, the C2 uses Tor hidden services, and the group deployed a custom backdoor named SUNBURST. Which element maps to the Adversary vertex MOST accurately?",
                options: ["Tor hidden services, because they are the communication channel the adversary relies on", "Government sector organizations, because they are the entities the adversary targets", "APT29, because they are the threat actor responsible for the intrusion", "SUNBURST, because it is the tool the adversary built and deployed"],
                correct: 2,
                domain: "Incident Response and Management",
                explanation: "The Adversary vertex in the Diamond Model is the threat actor or group responsible for the intrusion -- APT29 in this case. Tor hidden services map to Infrastructure; government sector organizations map to Victim; SUNBURST maps to Capability."
            },
            {
                q: "A SOC manager wants to evaluate the overall effectiveness of security controls against observed adversary behaviors across all attack phases. Which framework provides the MOST comprehensive mapping of adversary behaviors for this purpose?",
                options: ["OSSTMM, because it provides quantitative metrics for security testing across all channels", "Cyber Kill Chain, because it covers every phase from reconnaissance through exfiltration", "MITRE ATT&CK, because it catalogs hundreds of observed techniques across all tactical phases including pre-attack and post-compromise behaviors", "OWASP Testing Guide, because it comprehensively covers all attack surfaces including network and mobile"],
                correct: 2,
                domain: "Incident Response and Management",
                explanation: "MITRE ATT&CK provides the broadest and most granular coverage of adversary behaviors, with matrices for Enterprise, Mobile, and ICS environments plus hundreds of techniques across all tactical phases. The Cyber Kill Chain (2) is a high-level seven-phase model with less granularity; OSSTMM (1) is a testing methodology, not an adversary behavior catalog; OWASP (4) focuses on application security testing."
            },
            {
                q: "A digital forensics analyst is analyzing a suspected nation-state intrusion. The analyst wants to understand the relationships between the attacker, their targets, the malware's functional capabilities, and the hosting infrastructure as an interconnected system. Which framework MOST directly supports this relational analysis approach?",
                options: ["OWASP Testing Guide, because it provides structured test cases for analyzing web application attack vectors", "Cyber Kill Chain, because it traces the attack progression from beginning to end", "OSSTMM, because it quantifies security posture across physical and technical channels", "Diamond Model of Intrusion Analysis, because it models the relationships among adversary, victim, infrastructure, and capability as four connected vertices"],
                correct: 3,
                domain: "Incident Response and Management",
                explanation: "The Diamond Model was specifically designed to represent the relationships between the four core elements of an intrusion (adversary, victim, infrastructure, capability) as a connected graph, enabling relational intelligence analysis. The Cyber Kill Chain (2) is a linear phase model; OWASP (1) is a web testing guide; OSSTMM (3) is a quantitative testing methodology."
            }
        ];

        // ============================================================
        // END CONFIG — chrome below is shared. Do not edit when deriving.
        // ============================================================

        function hexToRgba(hex, alpha) {
            const h = hex.replace('#', '');
            const r = parseInt(h.substring(0, 2), 16);
            const g = parseInt(h.substring(2, 4), 16);
            const b = parseInt(h.substring(4, 6), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // --- APP STATE ---
        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let onResults = false;

        // --- DOM ---
        const contentDiv = document.getElementById('examContent');
        const progressBar = document.getElementById('progressBar');

        // --- INIT ---
        function init() {
            document.title = QUIZ_TITLE;
            document.getElementById('quizTitle').textContent = QUIZ_TITLE;
            document.getElementById('quizMeta').textContent =
                `${QUIZ_SUBTITLE} · ${questions.length}q`;
            document.documentElement.style.setProperty('--accent', ACCENT_HEX);
            document.documentElement.style.setProperty('--accent-tint',  hexToRgba(ACCENT_HEX, 0.14));
            document.documentElement.style.setProperty('--accent-hover', hexToRgba(ACCENT_HEX, 0.08));
            renderQuestion();
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // --- RENDER ---
        function renderQuestion() {
            onResults = false;
            const q = questions[currentQuestionIndex];
            const isLast = currentQuestionIndex === questions.length - 1;
            const isFirst = currentQuestionIndex === 0;
            const picked = userAnswers[currentQuestionIndex];

            progressBar.style.width = `${(currentQuestionIndex / questions.length) * 100}%`;

            const optionsHtml = q.options.map((opt, i) => `
                <button type="button"
                        class="option ${picked === i ? 'selected' : ''}"
                        onclick="selectOption(${i})">
                    <span class="label">${i + 1}</span>
                    <span class="text">${escapeHtml(opt)}</span>
                </button>
            `).join('');

            const prevHtml = isFirst
                ? ''
                : `<button type="button" class="verb" onclick="prevQuestion()"><span class="key">&larr;</span>prev</button>`;

            const nextLabel = isLast ? 'finish' : 'next';
            const nextEnabled = picked !== null;
            const nextHtml = nextEnabled
                ? `<button type="button" class="verb" onclick="nextQuestion()"><span class="key">&#x21B5;</span>${nextLabel}</button>`
                : `<span class="verb disabled"><span class="key">&#x21B5;</span>${nextLabel}</span>`;

            contentDiv.innerHTML = `
                <div class="q-header">
                    <span class="count">question ${currentQuestionIndex + 1} of ${questions.length}</span>
                    <span class="domain">[ ${escapeHtml(q.domain.toLowerCase())} ]</span>
                </div>

                <div class="stem">${escapeHtml(q.q)}</div>

                <div class="options">${optionsHtml}</div>

                <div class="hints">
                    <span><span class="key">1-${q.options.length}</span>select</span>
                    ${prevHtml ? `<span>${prevHtml}</span>` : ''}
                    <span>${nextHtml}</span>
                </div>
            `;
        }

        function selectOption(i) {
            userAnswers[currentQuestionIndex] = i;
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (userAnswers[currentQuestionIndex] === null) return;
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            onResults = true;
            let correctCount = 0;
            questions.forEach((q, i) => { if (userAnswers[i] === q.correct) correctCount++; });
            const score = Math.round((correctCount / questions.length) * 100);
            const passed = score >= 83;
            progressBar.style.width = '100%';

            const reviewHtml = questions.map((q, i) => {
                const userAnswer = userAnswers[i];
                const skipped = userAnswer === null;
                const isCorrect = !skipped && userAnswer === q.correct;
                const userLabel = skipped ? '—' : `${userAnswer + 1}  ${escapeHtml(q.options[userAnswer])}`;
                const correctLabel = `${q.correct + 1}  ${escapeHtml(q.options[q.correct])}`;
                const statusGlyph = isCorrect
                    ? `<span class="glyph-correct">&#x2713;</span><span class="verdict correct">correct</span>`
                    : `<span class="glyph-incorrect">&#x2717;</span><span class="verdict incorrect">${skipped ? 'skipped' : 'incorrect'}</span>`;
                const yourLineClass = skipped ? 'skipped' : (isCorrect ? 'right' : 'wrong');
                return `
                    <div class="review-q ${isCorrect ? 'correct' : 'incorrect'}">
                        <div class="status">Q.${i + 1}${statusGlyph}</div>
                        <div class="stem-mini">${escapeHtml(q.q)}</div>
                        <div class="ans-line ${yourLineClass}">
                            <span class="ans-label">your answer:</span>
                            <span class="ans-val">${userLabel}</span>
                        </div>
                        <div class="ans-line right">
                            <span class="ans-label">correct answer:</span>
                            <span class="ans-val">${correctLabel}</span>
                        </div>
                        <div class="explanation"><span class="arrow">&rsaquo;</span>${escapeHtml(q.explanation)}</div>
                    </div>
                `;
            }).join('');

            contentDiv.innerHTML = `
                <div class="results-heading">results</div>

                <div class="score-row">
                    <span><span class="label">score</span> <span class="score-val">${score} / 100</span></span>
                    <span class="${passed ? 'verdict-pass' : 'verdict-fail'}">${passed ? 'pass' : 'fail'}</span>
                    <span class="threshold">(&ge; 83 to pass)</span>
                </div>

                <div class="stats-row">
                    <span><span class="stat-label">correct</span><span class="stat-val">${correctCount}</span></span>
                    <span><span class="stat-label">incorrect</span><span class="stat-val">${questions.length - correctCount}</span></span>
                    <span><span class="stat-label">total</span><span class="stat-val">${questions.length}</span></span>
                </div>

                <div class="review-heading">review<span class="dashes"></span></div>

                ${reviewHtml}

                <div class="retake-row">
                    <button type="button" class="verb" onclick="location.reload()"><span class="key">&#x21B5;</span>retake</button>
                </div>
            `;
            window.scrollTo(0, 0);
        }

        // --- KEYBOARD ---
        window.addEventListener('keydown', (e) => {
            const tag = document.activeElement && document.activeElement.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA') return;

            if (onResults) {
                if (e.key === 'Enter') { e.preventDefault(); location.reload(); }
                return;
            }

            if (/^[1-9]$/.test(e.key)) {
                const i = Number(e.key) - 1;
                const q = questions[currentQuestionIndex];
                if (i < q.options.length) { e.preventDefault(); selectOption(i); }
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault(); prevQuestion();
            } else if (e.key === 'ArrowRight' || e.key === 'Enter') {
                e.preventDefault(); nextQuestion();
            }
        });

        init();
    </script>
</body>
</html>
