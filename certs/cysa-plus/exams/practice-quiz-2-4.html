<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelnet Quiz</title>
    <style>
        :root {
            --bg:           #000000;
            --text-90:      rgba(255, 255, 255, 0.90);
            --text-70:      rgba(255, 255, 255, 0.70);
            --text-45:      rgba(255, 255, 255, 0.45);
            --text-30:      rgba(255, 255, 255, 0.30);
            --rule:         rgba(255, 255, 255, 0.15);
            --accent:       #38bdf8; /* Default — overridden per-quiz via ACCENT_HEX */
            --accent-tint:  rgba(56, 189, 248, 0.14); /* selected-row */
            --accent-hover: rgba(56, 189, 248, 0.08); /* hover-row */
            --pass-green:   #43c08c;
            --wrong-red:    #fb7185;
            --font-mono:    'Courier New', Courier, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { background: var(--bg); }

        body {
            font-family: var(--font-mono);
            color: var(--text-90);
            min-height: 100vh;
            padding: 32px 0 48px;
            line-height: 1.5;
            font-size: 15px;
        }

        ::selection {
            background: var(--accent-tint);
            color: #fff;
        }

        .col {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* --- Header --- */
        .title-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 24px;
            color: var(--text-90);
        }

        .title-row .meta {
            color: var(--text-45);
            font-size: 13px;
        }

        .rule {
            border-top: 1px solid var(--rule);
            margin: 12px 0 0;
        }

        .progress {
            height: 2px;
            background: rgba(255, 255, 255, 0.06);
            margin-top: 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.25s ease;
        }

        /* --- Question --- */
        .content { margin-top: 32px; }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 4px 24px;
            color: var(--text-70);
            font-size: 13px;
        }

        .q-header .count { color: var(--accent); }
        .q-header .domain { color: var(--text-45); }

        .stem {
            color: var(--text-90);
            font-size: 17px;
            line-height: 1.6;
            margin: 24px 0 32px;
        }

        .options { display: flex; flex-direction: column; gap: 2px; }

        .option {
            display: flex;
            align-items: baseline;
            gap: 18px;
            padding: 10px 12px;
            cursor: pointer;
            background: transparent;
            border: 0;
            color: var(--text-90);
            font: inherit;
            text-align: left;
            width: 100%;
            transition: background-color 0.12s ease;
        }

        .option:hover { background: var(--accent-hover); }
        .option.selected { background: var(--accent-tint); }

        .option .label {
            color: var(--text-45);
            min-width: 1.5ch;
        }

        .option.selected .label { color: var(--accent); }

        .option .text { flex: 1; }

        /* --- Footer hints --- */
        .hints {
            margin-top: 32px;
            color: var(--text-45);
            font-size: 13px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 18px;
        }

        .hints .key { color: var(--accent); margin-right: 4px; }
        .hints .verb { color: var(--text-90); }
        .hints .verb:hover { text-decoration: underline; }
        .hints .verb.disabled { color: var(--text-30); cursor: not-allowed; }
        .hints .verb.disabled:hover { text-decoration: none; }

        button.verb {
            background: transparent;
            border: 0;
            font: inherit;
            padding: 0;
            cursor: pointer;
        }

        /* --- Results --- */
        .results-heading {
            color: var(--text-70);
            font-size: 15px;
            margin-bottom: 0;
        }

        .score-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 28px;
            margin-top: 28px;
            align-items: baseline;
        }

        .score-row .label { color: var(--text-45); }
        .score-row .score-val { color: var(--text-90); }
        .score-row .verdict-pass { color: var(--pass-green); }
        .score-row .verdict-fail { color: var(--wrong-red); }
        .score-row .threshold   { color: var(--text-45); }

        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 36px;
            margin-top: 16px;
            align-items: baseline;
        }

        .stats-row .stat-label { color: var(--text-45); margin-right: 8px; }
        .stats-row .stat-val   { color: var(--text-90); }

        .review-heading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-70);
            margin: 36px 0 16px;
        }

        .review-heading .dashes {
            color: var(--text-30);
            flex: 1;
            border-top: 1px solid var(--rule);
            margin-left: 4px;
            transform: translateY(1px);
        }

        .review-q {
            border-left: 2px solid var(--text-30);
            padding: 0 0 8px 14px;
            margin-bottom: 20px;
        }

        .review-q.correct   { border-left-color: var(--accent); }
        .review-q.incorrect { border-left-color: var(--wrong-red); }

        .review-q .status {
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-70);
        }

        .review-q .status .glyph-correct   { color: var(--accent); margin: 0 8px; }
        .review-q .status .glyph-incorrect { color: var(--wrong-red); margin: 0 8px; }
        .review-q .status .verdict.correct   { color: var(--accent); }
        .review-q .status .verdict.incorrect { color: var(--wrong-red); }

        .review-q .stem-mini {
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 10px;
            line-height: 1.55;
        }

        .review-q .ans-line {
            display: grid;
            grid-template-columns: 18ch 1fr;
            gap: 4px 8px;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .review-q .ans-line .ans-label { color: var(--text-45); }
        .review-q .ans-line.right .ans-val { color: var(--accent); }
        .review-q .ans-line.wrong .ans-val { color: var(--wrong-red); }
        .review-q .ans-line.skipped .ans-val { color: var(--text-45); }

        .review-q .explanation {
            margin-top: 10px;
            color: var(--text-70);
            font-size: 14px;
            line-height: 1.55;
        }

        .review-q .explanation .arrow { color: var(--accent); margin-right: 6px; }

        .retake-row {
            margin-top: 36px;
            text-align: center;
            color: var(--text-90);
        }

        .retake-row .key { color: var(--accent); margin-right: 4px; }
        .retake-row button.verb:hover { text-decoration: underline; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--accent); }
        * { scrollbar-width: thin; scrollbar-color: var(--accent) #000; }

        /* Mobile */
        @media (max-width: 600px) {
            .col { padding: 0 24px; }
            .stem { font-size: 16px; }
            body { font-size: 14px; padding: 24px 0 36px; }
            .review-q .ans-line { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="col">
        <div class="title-row">
            <span id="quizTitle">quiz</span>
            <span class="meta" id="quizMeta">— · — · 0q</span>
        </div>
        <div class="rule"></div>
        <div class="progress"><div class="progress-fill" id="progressBar"></div></div>

        <div class="content" id="examContent"></div>
    </div>

    <script>
        // ============================================================
        // QUIZ CONFIG — edit this block when deriving a new quiz.
        // Leave the rest of this file unchanged.
        // ============================================================
        const QUIZ_TITLE    = "practice quiz 2.4";
        const QUIZ_SUBTITLE = "cysa-plus · obj 2.4";
        const ACCENT_HEX    = "#22d3ee";

        const questions = [
            {
                q: "A developer reports that a web application search feature reflects user-supplied input directly in the page response without sanitization. A penetration tester confirms that JavaScript injected in the search parameter executes in the browser. Which control BEST mitigates this reflected XSS vulnerability?",
                options: ["Output encoding of user-controlled data before rendering it in the HTML response", "Input length validation to reject search terms longer than 256 characters", "Requiring users to authenticate before accessing the search feature", "Encrypting the search parameter in transit using TLS"],
                correct: 0,
                domain: "Vulnerability Management",
                explanation: "Output encoding (HTML entity encoding) neutralizes injected script by converting characters like < > into harmless display entities, preventing the browser from executing the injected payload. Input length validation (2) limits attack surface but does not prevent XSS payloads within the length limit; authentication (3) does not mitigate XSS; TLS (4) protects data in transit but not from injection."
            },
            {
                q: "An application security team discovers that a legacy PHP web application concatenates user input directly into SQL query strings without any sanitization. This allows an attacker to modify query logic and extract database contents. Which control BEST mitigates SQL injection in this application?",
                options: ["Replacing string concatenation with parameterized queries (prepared statements) so user input is treated as data, not SQL syntax", "Enforcing HTTPS to encrypt the SQL query in transit between the browser and server", "Validating that user input does not contain the characters SELECT or DROP", "Storing database credentials in environment variables instead of source code"],
                correct: 0,
                domain: "Vulnerability Management",
                explanation: "Parameterized queries separate SQL code from user data at the database driver level, making injection structurally impossible. HTTPS (2) protects transit but not the injection itself; keyword blocklisting (3) is bypassable through encoding, whitespace, and alternative syntax; credential management (4) improves security hygiene but does not prevent injection."
            },
            {
                q: "A security engineer reviews a web application and finds that server-side code makes outbound HTTP requests to URLs constructed from user-supplied parameters without any allow-listing. An attacker has demonstrated they can use this to reach internal AWS metadata endpoints. Which control BEST mitigates this SSRF vulnerability?",
                options: ["Blocking all outbound HTTP from the web server at the network firewall", "Implementing a strict allowlist of permitted destination URLs or hostnames, and rejecting requests to internal or link-local address ranges", "Requiring the user to log in before accessing the affected feature", "Rate-limiting HTTP requests from any single IP to 10 per minute"],
                correct: 1,
                domain: "Vulnerability Management",
                explanation: "An allowlist of permitted outbound destinations is the primary SSRF control: it prevents the server from being used as a proxy to internal addresses. Blocking all outbound HTTP (1) would break legitimate functionality; authentication (3) does not prevent an authenticated attacker from exploiting SSRF; rate-limiting (4) limits attack speed but does not block the vector."
            },
            {
                q: "A web application allows users to upload avatar images. A security analyst discovers that the application executes PHP files uploaded with a .jpg extension because the web server is misconfigured. An attacker exploited this to run arbitrary OS commands. Which control BEST prevents remote code execution via this upload feature?",
                options: ["Limit file upload size to 1 MB to prevent large payloads from being stored", "Validate file content by checking the magic bytes and MIME type, enforce allowlisted extensions, store files outside the web root, and disable execution permissions on the upload directory", "Require users to solve a CAPTCHA before uploading to slow down automated attacks", "Log all upload events to a SIEM for post-incident analysis"],
                correct: 1,
                domain: "Vulnerability Management",
                explanation: "Defense-in-depth for file upload RCE requires content validation (magic bytes + MIME), allowlisted extensions, storage outside the web root, and non-executable permissions on the upload directory. Size limits (1) and CAPTCHAs (3) do not prevent execution of an uploaded file; logging (4) aids detection but does not prevent the attack."
            },
            {
                q: "A security analyst is investigating a CSRF attack against a financial web application. An attacker crafted a malicious page that triggers a fund-transfer POST request when a logged-in user visits the page, because the bank uses session cookies without any origin verification. Which control MOST directly mitigates CSRF?",
                options: ["Enforcing HTTPS on all pages of the application", "Adding synchronizer token (CSRF token) validation on all state-changing requests, ensuring each form submission includes a secret unpredictable value tied to the user session", "Hashing the user password with bcrypt before storing it in the database", "Implementing MFA for all user logins"],
                correct: 1,
                domain: "Vulnerability Management",
                explanation: "CSRF tokens (synchronizer tokens) are the standard mitigation: the server generates an unpredictable per-session token embedded in forms, and validates it on each state-changing request. The attacker's forged request cannot include the correct token. HTTPS (1) protects data in transit; password hashing (3) and MFA (4) protect authentication but not CSRF."
            },
            {
                q: "An analyst discovers a directory traversal vulnerability in a web application that allows attackers to read files outside the web root by supplying paths like ../../etc/passwd in a filename parameter. Which control BEST mitigates path traversal?",
                options: ["Canonicalize file paths after construction and verify they remain within the allowed base directory before file access", "Encrypt the filename parameter in the URL to prevent attackers from modifying it", "Increase web server logging to detect traversal attempts via SIEM alerts", "Require HTTP POST instead of GET for all file access requests"],
                correct: 0,
                domain: "Vulnerability Management",
                explanation: "Path canonicalization resolves relative path sequences (../../) and checks that the resulting path is within the permitted base directory before any file access. URL encryption (2) is not a standard control and can be bypassed; logging (3) detects but does not prevent traversal; HTTP method (4) is irrelevant to path traversal."
            },
            {
                q: "A security review finds that an e-commerce application allows users to view order details by supplying an order ID in the URL (e.g., /orders/1234). By changing the ID to another customer's order number, a user can view that customer's order. Which vulnerability does this describe, and what is the BEST control?",
                options: ["SQLi; mitigate with parameterized queries", "Buffer overflow; mitigate with input length validation", "IDOR (Insecure Direct Object Reference); mitigate by enforcing authorization checks to verify the requesting user owns the requested resource", "XSS (Cross-Site Scripting); mitigate with output encoding"],
                correct: 2,
                domain: "Vulnerability Management",
                explanation: "IDOR occurs when an application exposes a direct reference to an internal object (such as a database record ID) without verifying the requester is authorized to access that specific object. The mitigation is server-side authorization enforcement (not just authentication). SQL injection (1), buffer overflow (2), and XSS (4) are different vulnerability classes with different controls."
            },
            {
                q: "A security assessment reveals a heap overflow vulnerability in a C application that processes network packets. An attacker can send a specially crafted packet to corrupt heap memory and overwrite function pointers. Which controls MOST reduce the exploitability of this heap overflow?",
                options: ["Enabling ASLR (Address Space Layout Randomization) and stack canaries on the target OS, and rewriting the vulnerable function with bounds-checked memory operations", "Requiring all users to authenticate with MFA before sending network packets", "Encrypting all network packets with TLS to prevent attackers from injecting malformed data", "Adding firewall rules to rate-limit inbound connections to 100 per second"],
                correct: 0,
                domain: "Vulnerability Management",
                explanation: "Heap overflow exploitability is reduced by ASLR (randomizes memory layout, making address guessing harder), heap metadata protection, and most directly by fixing the bounds-checking bug in the vulnerable function. MFA (2) is an authentication control, not a memory safety control; TLS (3) authenticates the channel but does not validate packet content; rate-limiting (4) reduces attack speed but does not prevent exploitation."
            },
            {
                q: "A web application uses an ML model trained on customer review data. A security researcher demonstrates that by injecting carefully crafted text into product reviews, the model's classification behavior is manipulated to flag legitimate negative reviews as positive. Which attack type does this describe, and what is the BEST preventive control?",
                options: ["XSS attack; mitigate with output encoding", "SQLi; mitigate with parameterized queries", "Data poisoning; mitigate with input validation on training data, anomaly detection on incoming training samples, and adversarial training techniques", "CSRF attack; mitigate with synchronizer tokens"],
                correct: 2,
                domain: "Vulnerability Management",
                explanation: "Data poisoning attacks corrupt ML training pipelines by injecting adversarial samples that shift model behavior. Controls include validating and sanitizing training data, detecting statistical anomalies in new training samples, and using adversarial training. XSS (1), SQL injection (2), and CSRF (4) are web application attacks unrelated to ML model integrity."
            },
            {
                q: "A software team deploys a file parsing library that processes untrusted serialized Java objects received over the network. A security researcher demonstrates that deserializing a crafted payload triggers arbitrary code execution via a gadget chain in a third-party library. Which control BEST mitigates insecure deserialization?",
                options: ["Encrypting serialized objects before transmission to prevent tampering", "Adding a WAF rule to block HTTP requests with a Content-Type of application/octet-stream", "Replacing Java object deserialization with a data-only format such as JSON or XML for untrusted input, or implementing deserialization allow-listing to restrict which classes can be instantiated", "Requiring authentication before the deserialization endpoint is accessible"],
                correct: 2,
                domain: "Vulnerability Management",
                explanation: "Insecure deserialization is best mitigated by avoiding native serialization for untrusted data (use JSON/XML instead) or strictly allow-listing which classes may be instantiated during deserialization. Encryption (1) protects integrity in transit but an attacker can still craft a valid encrypted payload if they have the key; WAF rules (2) can be bypassed; authentication (4) limits who can exploit the endpoint but does not prevent exploitation by authenticated users or stolen credentials."
            },
            {
                q: "A web application stores uploaded profile pictures in a world-readable S3 bucket without any access controls. An attacker enumerates the bucket and downloads all user photos. Which vulnerability category BEST describes this finding, and what is the BEST control?",
                options: ["Cryptographic failure; mitigate by encrypting bucket contents with AES-256", "Injection flaw; mitigate with parameterized queries on file metadata", "Identification and authentication failure; mitigate with MFA for S3 access", "Security misconfiguration; mitigate by restricting bucket ACLs and enabling bucket policies that deny public access"],
                correct: 3,
                domain: "Vulnerability Management",
                explanation: "World-readable S3 buckets are a classic security misconfiguration. The correct control is restricting bucket ACLs and enabling the S3 Block Public Access policy. Encryption at rest (1) would prevent content exposure to an unauthenticated reader only if combined with proper access controls; injection (2) is unrelated to bucket exposure; MFA (3) applies to console access, not bucket policy enforcement."
            },
            {
                q: "A security team discovers that a web application uses an end-of-life version of a JavaScript front-end framework with a known XSS vulnerability in its HTML sanitizer. The development team cannot upgrade immediately due to compatibility constraints. Which compensating control MOST reduces risk while the upgrade is planned?",
                options: ["Disable JavaScript in the browser for all users until the upgrade is complete", "Change the framework license to open source to allow community patches", "Archive the application and notify users that it is unavailable until further notice", "Deploy a WAF rule to detect and block known XSS payload patterns targeting the framework vulnerability"],
                correct: 3,
                domain: "Vulnerability Management",
                explanation: "When an upgrade is blocked, a WAF rule targeting the specific XSS payload pattern for the known CVE provides a compensating control that reduces exploitability without breaking the application. Disabling JavaScript (1) would break the application entirely; license changes (2) do not address the security vulnerability; taking the application offline (3) is a business decision that goes beyond compensating control."
            },
            {
                q: "A vulnerability scan identifies that a web application includes a user-controlled variable in a server-side template string (Python Jinja2). A penetration tester confirms that injecting template syntax causes the server to evaluate expressions and return sensitive data. Which control BEST mitigates server-side template injection (SSTI)?",
                options: ["Encode template output using HTML entity encoding before sending the response to the browser", "Switch from Python to a compiled language such as Go to prevent template injection", "Add rate-limiting on the affected endpoint to slow down template injection probing", "Avoid passing user-controlled input to template engines; if required, sandbox the template engine and enforce a strict allowlist of permitted template expressions"],
                correct: 3,
                domain: "Vulnerability Management",
                explanation: "SSTI is prevented by never passing user-controlled input to template engines, or if necessary, sandboxing the template environment and restricting available expressions. HTML entity encoding (1) prevents XSS output in a browser but does not stop server-side evaluation; switching languages (2) does not prevent SSTI if the same pattern is used; rate-limiting (3) slows but does not prevent exploitation."
            },
            {
                q: "A penetration tester discovered a privilege escalation vulnerability in a Linux web application: the server process runs as root and a path traversal flaw allows writing arbitrary files. An attacker could write a cron job to achieve persistent root access. Which control MOST directly reduces the impact of this privilege escalation chain?",
                options: ["Require MFA for the web application admin panel", "Log all write operations to a central SIEM for forensic review", "Encrypt the web application's configuration files at rest", "Run the web application process as a dedicated low-privilege service account with only the permissions required for its function"],
                correct: 3,
                domain: "Vulnerability Management",
                explanation: "Principle of least privilege applied to service accounts is the direct control: if the web application runs as a low-privilege user rather than root, a successful path traversal still cannot write to root-owned directories or create root cron jobs. MFA (1) protects admin panel logins; logging (2) aids detection but does not prevent the escalation; encryption (3) protects data at rest but not runtime privilege."
            },
            {
                q: "A penetration tester demonstrates that a web application is vulnerable to persistent (stored) XSS: a malicious script stored in a user profile field executes in the browser of any administrator who views that profile. Which combination of controls BEST addresses persistent XSS?",
                options: ["Requiring administrators to use a different browser than regular users", "Storing user profile data in an encrypted database column", "Input validation to reject script tags on input, plus output encoding when rendering stored content in HTML", "Adding session timeout to limit the window of admin session hijacking"],
                correct: 2,
                domain: "Vulnerability Management",
                explanation: "Persistent XSS requires defense at both storage (input validation to reduce what is stored) and rendering (output encoding to neutralize payloads that were stored). Defense-in-depth applies: input validation reduces but cannot always block all payloads, so output encoding at render is the critical final control. Different browsers (1) offer no real protection; encryption (2) protects data at rest, not rendering; session timeout (4) limits hijacking impact but does not prevent the XSS."
            }
        ];

        // ============================================================
        // END CONFIG — chrome below is shared. Do not edit when deriving.
        // ============================================================

        function hexToRgba(hex, alpha) {
            const h = hex.replace('#', '');
            const r = parseInt(h.substring(0, 2), 16);
            const g = parseInt(h.substring(2, 4), 16);
            const b = parseInt(h.substring(4, 6), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // --- APP STATE ---
        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let onResults = false;

        // --- DOM ---
        const contentDiv = document.getElementById('examContent');
        const progressBar = document.getElementById('progressBar');

        // --- INIT ---
        function init() {
            document.title = QUIZ_TITLE;
            document.getElementById('quizTitle').textContent = QUIZ_TITLE;
            document.getElementById('quizMeta').textContent =
                `${QUIZ_SUBTITLE} · ${questions.length}q`;
            document.documentElement.style.setProperty('--accent', ACCENT_HEX);
            document.documentElement.style.setProperty('--accent-tint',  hexToRgba(ACCENT_HEX, 0.14));
            document.documentElement.style.setProperty('--accent-hover', hexToRgba(ACCENT_HEX, 0.08));
            renderQuestion();
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // --- RENDER ---
        function renderQuestion() {
            onResults = false;
            const q = questions[currentQuestionIndex];
            const isLast = currentQuestionIndex === questions.length - 1;
            const isFirst = currentQuestionIndex === 0;
            const picked = userAnswers[currentQuestionIndex];

            progressBar.style.width = `${(currentQuestionIndex / questions.length) * 100}%`;

            const optionsHtml = q.options.map((opt, i) => `
                <button type="button"
                        class="option ${picked === i ? 'selected' : ''}"
                        onclick="selectOption(${i})">
                    <span class="label">${i + 1}</span>
                    <span class="text">${escapeHtml(opt)}</span>
                </button>
            `).join('');

            const prevHtml = isFirst
                ? ''
                : `<button type="button" class="verb" onclick="prevQuestion()"><span class="key">&larr;</span>prev</button>`;

            const nextLabel = isLast ? 'finish' : 'next';
            const nextEnabled = picked !== null;
            const nextHtml = nextEnabled
                ? `<button type="button" class="verb" onclick="nextQuestion()"><span class="key">&#x21B5;</span>${nextLabel}</button>`
                : `<span class="verb disabled"><span class="key">&#x21B5;</span>${nextLabel}</span>`;

            contentDiv.innerHTML = `
                <div class="q-header">
                    <span class="count">question ${currentQuestionIndex + 1} of ${questions.length}</span>
                    <span class="domain">[ ${escapeHtml(q.domain.toLowerCase())} ]</span>
                </div>

                <div class="stem">${escapeHtml(q.q)}</div>

                <div class="options">${optionsHtml}</div>

                <div class="hints">
                    <span><span class="key">1-${q.options.length}</span>select</span>
                    ${prevHtml ? `<span>${prevHtml}</span>` : ''}
                    <span>${nextHtml}</span>
                </div>
            `;
        }

        function selectOption(i) {
            userAnswers[currentQuestionIndex] = i;
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (userAnswers[currentQuestionIndex] === null) return;
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            onResults = true;
            let correctCount = 0;
            questions.forEach((q, i) => { if (userAnswers[i] === q.correct) correctCount++; });
            const score = Math.round((correctCount / questions.length) * 100);
            const passed = score >= 83;
            progressBar.style.width = '100%';

            const reviewHtml = questions.map((q, i) => {
                const userAnswer = userAnswers[i];
                const skipped = userAnswer === null;
                const isCorrect = !skipped && userAnswer === q.correct;
                const userLabel = skipped ? '—' : `${userAnswer + 1}  ${escapeHtml(q.options[userAnswer])}`;
                const correctLabel = `${q.correct + 1}  ${escapeHtml(q.options[q.correct])}`;
                const statusGlyph = isCorrect
                    ? `<span class="glyph-correct">&#x2713;</span><span class="verdict correct">correct</span>`
                    : `<span class="glyph-incorrect">&#x2717;</span><span class="verdict incorrect">${skipped ? 'skipped' : 'incorrect'}</span>`;
                const yourLineClass = skipped ? 'skipped' : (isCorrect ? 'right' : 'wrong');
                return `
                    <div class="review-q ${isCorrect ? 'correct' : 'incorrect'}">
                        <div class="status">Q.${i + 1}${statusGlyph}</div>
                        <div class="stem-mini">${escapeHtml(q.q)}</div>
                        <div class="ans-line ${yourLineClass}">
                            <span class="ans-label">your answer:</span>
                            <span class="ans-val">${userLabel}</span>
                        </div>
                        <div class="ans-line right">
                            <span class="ans-label">correct answer:</span>
                            <span class="ans-val">${correctLabel}</span>
                        </div>
                        <div class="explanation"><span class="arrow">&rsaquo;</span>${escapeHtml(q.explanation)}</div>
                    </div>
                `;
            }).join('');

            contentDiv.innerHTML = `
                <div class="results-heading">results</div>

                <div class="score-row">
                    <span><span class="label">score</span> <span class="score-val">${score} / 100</span></span>
                    <span class="${passed ? 'verdict-pass' : 'verdict-fail'}">${passed ? 'pass' : 'fail'}</span>
                    <span class="threshold">(&ge; 83 to pass)</span>
                </div>

                <div class="stats-row">
                    <span><span class="stat-label">correct</span><span class="stat-val">${correctCount}</span></span>
                    <span><span class="stat-label">incorrect</span><span class="stat-val">${questions.length - correctCount}</span></span>
                    <span><span class="stat-label">total</span><span class="stat-val">${questions.length}</span></span>
                </div>

                <div class="review-heading">review<span class="dashes"></span></div>

                ${reviewHtml}

                <div class="retake-row">
                    <button type="button" class="verb" onclick="location.reload()"><span class="key">&#x21B5;</span>retake</button>
                </div>
            `;
            window.scrollTo(0, 0);
        }

        // --- KEYBOARD ---
        window.addEventListener('keydown', (e) => {
            const tag = document.activeElement && document.activeElement.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA') return;

            if (onResults) {
                if (e.key === 'Enter') { e.preventDefault(); location.reload(); }
                return;
            }

            if (/^[1-9]$/.test(e.key)) {
                const i = Number(e.key) - 1;
                const q = questions[currentQuestionIndex];
                if (i < q.options.length) { e.preventDefault(); selectOption(i); }
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault(); prevQuestion();
            } else if (e.key === 'ArrowRight' || e.key === 'Enter') {
                e.preventDefault(); nextQuestion();
            }
        });

        init();
    </script>
</body>
</html>
