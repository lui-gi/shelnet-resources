<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelnet Quiz</title>
    <style>
        :root {
            --bg:           #000000;
            --text-90:      rgba(255, 255, 255, 0.90);
            --text-70:      rgba(255, 255, 255, 0.70);
            --text-45:      rgba(255, 255, 255, 0.45);
            --text-30:      rgba(255, 255, 255, 0.30);
            --rule:         rgba(255, 255, 255, 0.15);
            --accent:       #38bdf8; /* Default — overridden per-quiz via ACCENT_HEX */
            --accent-tint:  rgba(56, 189, 248, 0.14); /* selected-row */
            --accent-hover: rgba(56, 189, 248, 0.08); /* hover-row */
            --pass-green:   #43c08c;
            --wrong-red:    #fb7185;
            --font-mono:    'Courier New', Courier, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { background: var(--bg); }

        body {
            font-family: var(--font-mono);
            color: var(--text-90);
            min-height: 100vh;
            padding: 32px 0 48px;
            line-height: 1.5;
            font-size: 15px;
        }

        ::selection {
            background: var(--accent-tint);
            color: #fff;
        }

        .col {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* --- Header --- */
        .title-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 24px;
            color: var(--text-90);
        }

        .title-row .meta {
            color: var(--text-45);
            font-size: 13px;
        }

        .rule {
            border-top: 1px solid var(--rule);
            margin: 12px 0 0;
        }

        .progress {
            height: 2px;
            background: rgba(255, 255, 255, 0.06);
            margin-top: 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.25s ease;
        }

        /* --- Question --- */
        .content { margin-top: 32px; }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 4px 24px;
            color: var(--text-70);
            font-size: 13px;
        }

        .q-header .count { color: var(--accent); }
        .q-header .domain { color: var(--text-45); }

        .stem {
            color: var(--text-90);
            font-size: 17px;
            line-height: 1.6;
            margin: 24px 0 32px;
        }

        .options { display: flex; flex-direction: column; gap: 2px; }

        .option {
            display: flex;
            align-items: baseline;
            gap: 18px;
            padding: 10px 12px;
            cursor: pointer;
            background: transparent;
            border: 0;
            color: var(--text-90);
            font: inherit;
            text-align: left;
            width: 100%;
            transition: background-color 0.12s ease;
        }

        .option:hover { background: var(--accent-hover); }
        .option.selected { background: var(--accent-tint); }

        .option .label {
            color: var(--text-45);
            min-width: 1.5ch;
        }

        .option.selected .label { color: var(--accent); }

        .option .text { flex: 1; }

        /* --- Footer hints --- */
        .hints {
            margin-top: 32px;
            color: var(--text-45);
            font-size: 13px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 18px;
        }

        .hints .key { color: var(--accent); margin-right: 4px; }
        .hints .verb { color: var(--text-90); }
        .hints .verb:hover { text-decoration: underline; }
        .hints .verb.disabled { color: var(--text-30); cursor: not-allowed; }
        .hints .verb.disabled:hover { text-decoration: none; }

        button.verb {
            background: transparent;
            border: 0;
            font: inherit;
            padding: 0;
            cursor: pointer;
        }

        /* --- Results --- */
        .results-heading {
            color: var(--text-70);
            font-size: 15px;
            margin-bottom: 0;
        }

        .score-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 28px;
            margin-top: 28px;
            align-items: baseline;
        }

        .score-row .label { color: var(--text-45); }
        .score-row .score-val { color: var(--text-90); }
        .score-row .verdict-pass { color: var(--pass-green); }
        .score-row .verdict-fail { color: var(--wrong-red); }
        .score-row .threshold   { color: var(--text-45); }

        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 36px;
            margin-top: 16px;
            align-items: baseline;
        }

        .stats-row .stat-label { color: var(--text-45); margin-right: 8px; }
        .stats-row .stat-val   { color: var(--text-90); }

        .review-heading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-70);
            margin: 36px 0 16px;
        }

        .review-heading .dashes {
            color: var(--text-30);
            flex: 1;
            border-top: 1px solid var(--rule);
            margin-left: 4px;
            transform: translateY(1px);
        }

        .review-q {
            border-left: 2px solid var(--text-30);
            padding: 0 0 8px 14px;
            margin-bottom: 20px;
        }

        .review-q.correct   { border-left-color: var(--accent); }
        .review-q.incorrect { border-left-color: var(--wrong-red); }

        .review-q .status {
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-70);
        }

        .review-q .status .glyph-correct   { color: var(--accent); margin: 0 8px; }
        .review-q .status .glyph-incorrect { color: var(--wrong-red); margin: 0 8px; }
        .review-q .status .verdict.correct   { color: var(--accent); }
        .review-q .status .verdict.incorrect { color: var(--wrong-red); }

        .review-q .stem-mini {
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 10px;
            line-height: 1.55;
        }

        .review-q .ans-line {
            display: grid;
            grid-template-columns: 18ch 1fr;
            gap: 4px 8px;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .review-q .ans-line .ans-label { color: var(--text-45); }
        .review-q .ans-line.right .ans-val { color: var(--accent); }
        .review-q .ans-line.wrong .ans-val { color: var(--wrong-red); }
        .review-q .ans-line.skipped .ans-val { color: var(--text-45); }

        .review-q .explanation {
            margin-top: 10px;
            color: var(--text-70);
            font-size: 14px;
            line-height: 1.55;
        }

        .review-q .explanation .arrow { color: var(--accent); margin-right: 6px; }

        .retake-row {
            margin-top: 36px;
            text-align: center;
            color: var(--text-90);
        }

        .retake-row .key { color: var(--accent); margin-right: 4px; }
        .retake-row button.verb:hover { text-decoration: underline; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--accent); }
        * { scrollbar-width: thin; scrollbar-color: var(--accent) #000; }

        /* Mobile */
        @media (max-width: 600px) {
            .col { padding: 0 24px; }
            .stem { font-size: 16px; }
            body { font-size: 14px; padding: 24px 0 36px; }
            .review-q .ans-line { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="col">
        <div class="title-row">
            <span id="quizTitle">quiz</span>
            <span class="meta" id="quizMeta">— · — · 0q</span>
        </div>
        <div class="rule"></div>
        <div class="progress"><div class="progress-fill" id="progressBar"></div></div>

        <div class="content" id="examContent"></div>
    </div>

    <script>
        // ============================================================
        // QUIZ CONFIG — edit this block when deriving a new quiz.
        // Leave the rest of this file unchanged.
        // ============================================================
        const QUIZ_TITLE    = "practice quiz 1.4";
        const QUIZ_SUBTITLE = "cysa-plus · obj 1.4";
        const ACCENT_HEX    = "#22d3ee";

        const questions = [
            {
                q: "A threat-intel analyst is evaluating a newly received threat report about a nation-state actor. The report was published three weeks ago and describes TTPs that the group abandoned after their infrastructure was publicly exposed in a prior disclosure. Which intelligence confidence dimension is MOST degraded by this situation?",
                options: ["Timeliness", "Relevancy", "Accuracy", "Completeness"],
                correct: 0,
                domain: "Security Operations",
                explanation: "Timeliness refers to how current the intelligence is; a three-week-old report describing TTPs the actor has already abandoned is not timely and significantly reduces its operational value. Relevancy (2) concerns whether the intel applies to the organization's environment, which is a separate confidence dimension."
            },
            {
                q: "A threat hunter is profiling a recently identified threat actor group that targets financial institutions using spear-phishing followed by custom implants and living-off-the-land techniques to move laterally. The hunter documents the adversary's methods in structured form. Which of the following threat-intel concepts encompasses the actor's specific methods, tools, and procedural steps?",
                options: ["IoC collection", "TTPs", "Confidence levels", "Active defense"],
                correct: 1,
                domain: "Security Operations",
                explanation: "TTPs (Tactics, Techniques, and Procedures) describe how an adversary operates at a behavioral level, including the methods, tools, and step-by-step procedures they use to achieve their objectives. IoC collection (1) focuses on specific observable artifacts (IP addresses, hashes) rather than the adversary's behavioral patterns."
            },
            {
                q: "A threat-intel analyst is sourcing information about a newly disclosed malware family. The analyst reviews government bulletins, CERT advisories, and open cybersecurity forums to gather context. Which of the following collection method categories BEST describes these sources?",
                options: ["Closed source: paid feeds", "Closed source: information sharing organizations", "Open source: deep/dark web", "Open source: government bulletins and CERT"],
                correct: 3,
                domain: "Security Operations",
                explanation: "Government bulletins and CERT/CSIRT advisories are open-source intelligence collection sources; they are publicly available without a subscription or special access. Closed-source paid feeds (1) require a commercial subscription and are a distinct category."
            },
            {
                q: "A threat-intel team subscribes to a commercial threat feed from a specialized vendor and receives structured indicator packages not available to the general public. The team also participates in an industry ISAC where members share incidents and indicators under a trust agreement. Which of the following collection method categories BEST describes both of these sources?",
                options: ["Closed source: paid feeds and information sharing organizations", "Open source: deep/dark web", "Open source: blogs/forums", "Closed source: internal sources"],
                correct: 0,
                domain: "Security Operations",
                explanation: "Commercial threat feeds (paid feeds) and ISAC memberships (information sharing organizations) are both closed-source intelligence sources that require payment or a vetted trust agreement to access. Open-source blogs and forums (3) are publicly accessible without any access controls."
            },
            {
                q: "A threat hunter is conducting a proactive hunt across the enterprise for evidence of a known APT technique involving DLL side-loading. The hunter begins by reviewing endpoint telemetry for unsigned DLLs loaded by legitimate system binaries. Which of the following threat-hunting concepts is the hunter applying?",
                options: ["IoC: application", "Active defense", "Honeypot deployment", "IoC: collection"],
                correct: 0,
                domain: "Security Operations",
                explanation: "IoC application involves taking known indicators of compromise and applying them against collected telemetry to detect adversary presence, which is what the hunter is doing by searching endpoint data for DLL side-loading artifacts. IoC collection (4) is the prior step of gathering the indicators, whereas this scenario describes using them (application)."
            },
            {
                q: "A threat-intel analyst is assessing the confidence level of a newly received indicator. The indicator is a specific IP address associated with a C2 server. The source is a highly reputable commercial vendor with a proven track record, and the report was published this morning. However, the indicator describes attack patterns targeting industrial control systems, which the analyst's organization does not operate. Which confidence dimension is MOST affected?",
                options: ["Relevancy", "Accuracy", "Timeliness", "Attribution"],
                correct: 0,
                domain: "Security Operations",
                explanation: "Relevancy measures whether the intelligence applies to the specific organization's environment and threat landscape; an indicator targeting ICS environments is not relevant to an organization that does not operate ICS. Accuracy (2) concerns whether the data is factually correct, which is not questioned here given the reputable source."
            },
            {
                q: "A security operations team wants to lure threat actors into interacting with a decoy system that mimics a production server, allowing the team to observe attacker techniques and collect IoCs. Which of the following threat-hunting concepts describes this approach?",
                options: ["Active defense", "Honeypot", "Isolated network segment", "TTPs analysis"],
                correct: 1,
                domain: "Security Operations",
                explanation: "A honeypot is a decoy system designed to attract and monitor attacker activity; any interaction with the honeypot is by definition suspicious and yields IoCs and behavioral intelligence. Active defense (1) is the broader concept of using offensive-leaning defensive techniques; a honeypot is a specific tool within that concept."
            },
            {
                q: "A threat hunter is conducting a focused hunt on business-critical assets after leadership identified the ERP system as a high-value target. The hunter is looking for unauthorized access patterns and configuration drift on those specific systems. Which of the following threat-hunting focus areas does this represent?",
                options: ["Isolated networks", "Configurations/misconfigurations", "Business-critical assets and processes", "IoC collection"],
                correct: 2,
                domain: "Security Operations",
                explanation: "Business-critical assets and processes is a defined threat-hunting focus area; prioritizing hunts on high-value systems such as ERP platforms reduces dwell time for attacks targeting the most impactful systems. Configurations/misconfigurations (2) is a different focus area concerned with security baseline deviations rather than asset prioritization."
            },
            {
                q: "A threat-intel analyst is evaluating an indicator received from an external partner organization. The analyst verifies that the IP address is currently active, associated with a known campaign, and has been seen in the wild within the last 24 hours. The indicator is also verified against multiple independent sources. Which confidence level dimension does the 24-hour recency MOST directly support?",
                options: ["Relevancy", "Accuracy", "Completeness", "Timeliness"],
                correct: 3,
                domain: "Security Operations",
                explanation: "Timeliness reflects how current the intelligence is; an indicator seen in the wild within 24 hours is highly timely and actionable. Accuracy (2) reflects whether the indicator is factually correct, which is supported by multi-source corroboration but is a separate dimension from recency."
            },
            {
                q: "A threat hunter discovers that an isolated network segment housing legacy manufacturing systems has no egress filtering and is not monitored by any security tooling. The hunter flags this as a high-priority hunt target. Which of the following threat-hunting focus areas is the hunter applying?",
                options: ["Business-critical assets and processes", "Honeypot", "Isolated networks", "Active defense"],
                correct: 2,
                domain: "Security Operations",
                explanation: "Isolated networks is a threat-hunting focus area specifically because unmonitored or poorly secured network segments create blind spots that adversaries can exploit for long dwell times. Business-critical assets (1) is a separate focus area prioritized by asset value rather than by network visibility gaps."
            },
            {
                q: "A threat-intel analyst is sharing a collection of IoCs related to a recent ransomware campaign with the vulnerability management and detection engineering teams so they can update scan policies and detection rules. Which of the following threat-intelligence sharing use cases does this represent?",
                options: ["Risk management", "Security engineering and detection and monitoring", "Incident response", "Closed-source distribution"],
                correct: 1,
                domain: "Security Operations",
                explanation: "Sharing threat intelligence with vulnerability management and detection/monitoring teams is a defined sharing use case; it enables those functions to update scanning coverage and detection rules based on current adversary behavior. Incident response (3) would apply if the team were actively responding to an ongoing compromise, not proactively updating defenses."
            },
            {
                q: "A threat-intel analyst receives a report attributing a recent campaign to a hacktivist group protesting corporate environmental practices. The group is known for website defacement and DDoS attacks rather than data theft or espionage. Which of the following threat actor categories BEST describes this group?",
                options: ["APT", "Nation-state", "Organized crime", "Hacktivists"],
                correct: 3,
                domain: "Security Operations",
                explanation: "Hacktivists are threat actors motivated by ideological, political, or social causes who typically conduct disruptive attacks such as defacement and DDoS rather than financial or espionage operations. Organized crime (3) is a different category motivated primarily by financial gain through data theft, fraud, or extortion."
            },
            {
                q: "A security analyst is reviewing a threat report about a well-resourced group that has maintained persistent, covert access to a government contractor's network for over 18 months, exfiltrating classified documents while evading detection through custom malware and zero-day exploits. Which of the following threat actor categories MOST likely describes this group?",
                options: ["Script kiddie", "Insider threat", "Hacktivists", "APT"],
                correct: 3,
                domain: "Security Operations",
                explanation: "APT (Advanced Persistent Threat) groups are characterized by sophisticated tooling, long-term stealthy presence, custom malware, and targeted data exfiltration, all of which match the described behavior. Script kiddies (1) lack the resources and technical sophistication to develop zero-day exploits or maintain covert access for 18 months."
            },
            {
                q: "A threat hunter reviews a report about a supply chain compromise where a legitimate software vendor's update mechanism was weaponized to distribute malware to thousands of customers. Which of the following threat actor motivations or vectors is MOST directly relevant to this scenario?",
                options: ["Insider threat: intentional", "Organized crime", "Supply chain", "Hacktivist"],
                correct: 2,
                domain: "Security Operations",
                explanation: "Supply chain attacks involve compromising a trusted third-party vendor or software component to gain access to downstream targets; the weaponized update mechanism is a classic supply chain compromise vector. Organized crime (2) is a threat actor motivation category, not a delivery vector, and is not the most precise descriptor for the technique described."
            },
            {
                q: "A threat-intel analyst is building a hunt hypothesis based on recent intelligence. The analyst collects file hashes, C2 domain names, and mutex names associated with a malware family, then plans to search endpoint and network telemetry for matches. Which of the following IoC workflow steps is the analyst currently executing?",
                options: ["IoC: analysis", "IoC: application", "IoC: collection", "Active defense"],
                correct: 2,
                domain: "Security Operations",
                explanation: "IoC collection is the step of gathering indicators (hashes, domains, mutex names) from threat intelligence sources before they are analyzed or applied to detection systems. IoC application (2) is the subsequent step of actually searching for those indicators across telemetry, which has not yet occurred in this scenario."
            }
        ];

        // ============================================================
        // END CONFIG — chrome below is shared. Do not edit when deriving.
        // ============================================================

        function hexToRgba(hex, alpha) {
            const h = hex.replace('#', '');
            const r = parseInt(h.substring(0, 2), 16);
            const g = parseInt(h.substring(2, 4), 16);
            const b = parseInt(h.substring(4, 6), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // --- APP STATE ---
        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let onResults = false;

        // --- DOM ---
        const contentDiv = document.getElementById('examContent');
        const progressBar = document.getElementById('progressBar');

        // --- INIT ---
        function init() {
            document.title = QUIZ_TITLE;
            document.getElementById('quizTitle').textContent = QUIZ_TITLE;
            document.getElementById('quizMeta').textContent =
                `${QUIZ_SUBTITLE} · ${questions.length}q`;
            document.documentElement.style.setProperty('--accent', ACCENT_HEX);
            document.documentElement.style.setProperty('--accent-tint',  hexToRgba(ACCENT_HEX, 0.14));
            document.documentElement.style.setProperty('--accent-hover', hexToRgba(ACCENT_HEX, 0.08));
            renderQuestion();
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // --- RENDER ---
        function renderQuestion() {
            onResults = false;
            const q = questions[currentQuestionIndex];
            const isLast = currentQuestionIndex === questions.length - 1;
            const isFirst = currentQuestionIndex === 0;
            const picked = userAnswers[currentQuestionIndex];

            progressBar.style.width = `${(currentQuestionIndex / questions.length) * 100}%`;

            const optionsHtml = q.options.map((opt, i) => `
                <button type="button"
                        class="option ${picked === i ? 'selected' : ''}"
                        onclick="selectOption(${i})">
                    <span class="label">${i + 1}</span>
                    <span class="text">${escapeHtml(opt)}</span>
                </button>
            `).join('');

            const prevHtml = isFirst
                ? ''
                : `<button type="button" class="verb" onclick="prevQuestion()"><span class="key">&larr;</span>prev</button>`;

            const nextLabel = isLast ? 'finish' : 'next';
            const nextEnabled = picked !== null;
            const nextHtml = nextEnabled
                ? `<button type="button" class="verb" onclick="nextQuestion()"><span class="key">&#x21B5;</span>${nextLabel}</button>`
                : `<span class="verb disabled"><span class="key">&#x21B5;</span>${nextLabel}</span>`;

            contentDiv.innerHTML = `
                <div class="q-header">
                    <span class="count">question ${currentQuestionIndex + 1} of ${questions.length}</span>
                    <span class="domain">[ ${escapeHtml(q.domain.toLowerCase())} ]</span>
                </div>

                <div class="stem">${escapeHtml(q.q)}</div>

                <div class="options">${optionsHtml}</div>

                <div class="hints">
                    <span><span class="key">1-${q.options.length}</span>select</span>
                    ${prevHtml ? `<span>${prevHtml}</span>` : ''}
                    <span>${nextHtml}</span>
                </div>
            `;
        }

        function selectOption(i) {
            userAnswers[currentQuestionIndex] = i;
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (userAnswers[currentQuestionIndex] === null) return;
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            onResults = true;
            let correctCount = 0;
            questions.forEach((q, i) => { if (userAnswers[i] === q.correct) correctCount++; });
            const score = Math.round((correctCount / questions.length) * 100);
            const passed = score >= 83;
            progressBar.style.width = '100%';

            const reviewHtml = questions.map((q, i) => {
                const userAnswer = userAnswers[i];
                const skipped = userAnswer === null;
                const isCorrect = !skipped && userAnswer === q.correct;
                const userLabel = skipped ? '—' : `${userAnswer + 1}  ${escapeHtml(q.options[userAnswer])}`;
                const correctLabel = `${q.correct + 1}  ${escapeHtml(q.options[q.correct])}`;
                const statusGlyph = isCorrect
                    ? `<span class="glyph-correct">&#x2713;</span><span class="verdict correct">correct</span>`
                    : `<span class="glyph-incorrect">&#x2717;</span><span class="verdict incorrect">${skipped ? 'skipped' : 'incorrect'}</span>`;
                const yourLineClass = skipped ? 'skipped' : (isCorrect ? 'right' : 'wrong');
                return `
                    <div class="review-q ${isCorrect ? 'correct' : 'incorrect'}">
                        <div class="status">Q.${i + 1}${statusGlyph}</div>
                        <div class="stem-mini">${escapeHtml(q.q)}</div>
                        <div class="ans-line ${yourLineClass}">
                            <span class="ans-label">your answer:</span>
                            <span class="ans-val">${userLabel}</span>
                        </div>
                        <div class="ans-line right">
                            <span class="ans-label">correct answer:</span>
                            <span class="ans-val">${correctLabel}</span>
                        </div>
                        <div class="explanation"><span class="arrow">&rsaquo;</span>${escapeHtml(q.explanation)}</div>
                    </div>
                `;
            }).join('');

            contentDiv.innerHTML = `
                <div class="results-heading">results</div>

                <div class="score-row">
                    <span><span class="label">score</span> <span class="score-val">${score} / 100</span></span>
                    <span class="${passed ? 'verdict-pass' : 'verdict-fail'}">${passed ? 'pass' : 'fail'}</span>
                    <span class="threshold">(&ge; 83 to pass)</span>
                </div>

                <div class="stats-row">
                    <span><span class="stat-label">correct</span><span class="stat-val">${correctCount}</span></span>
                    <span><span class="stat-label">incorrect</span><span class="stat-val">${questions.length - correctCount}</span></span>
                    <span><span class="stat-label">total</span><span class="stat-val">${questions.length}</span></span>
                </div>

                <div class="review-heading">review<span class="dashes"></span></div>

                ${reviewHtml}

                <div class="retake-row">
                    <button type="button" class="verb" onclick="location.reload()"><span class="key">&#x21B5;</span>retake</button>
                </div>
            `;
            window.scrollTo(0, 0);
        }

        // --- KEYBOARD ---
        window.addEventListener('keydown', (e) => {
            const tag = document.activeElement && document.activeElement.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA') return;

            if (onResults) {
                if (e.key === 'Enter') { e.preventDefault(); location.reload(); }
                return;
            }

            if (/^[1-9]$/.test(e.key)) {
                const i = Number(e.key) - 1;
                const q = questions[currentQuestionIndex];
                if (i < q.options.length) { e.preventDefault(); selectOption(i); }
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault(); prevQuestion();
            } else if (e.key === 'ArrowRight' || e.key === 'Enter') {
                e.preventDefault(); nextQuestion();
            }
        });

        init();
    </script>
</body>
</html>
