<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelnet Quiz</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #0c0c0c;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --border-color: rgba(255, 255, 255, 0.15);
            --accent: #3b82f6; /* Default — overridden per-quiz via ACCENT_HEX in CONFIG */
            --accent-dim: rgba(59, 130, 246, 0.1); /* Default — overridden via setProperty in init() */
            --accent-glow: rgba(59, 130, 246, 0.4); /* Default — overridden via setProperty in init() */
            --accent-select: rgba(59, 130, 246, 0.3); /* Default — overridden via setProperty in init() */
            --accent-red: #ef4444;
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            /* Grid Background Effect */
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Selection Color */
        ::selection {
            background: var(--accent-select);
            color: #dbeafe;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            position: relative;
            z-index: 10;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            min-height: 600px;
            display: flex;
            flex-direction: column;
        }

        /* --- Terminal Header Bar --- */
        .terminal-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-color);
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot.red { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); }
        .dot.yellow { background: rgba(234, 179, 8, 0.2); border: 1px solid rgba(234, 179, 8, 0.5); }
        .dot.green { background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.5); }

        /* --- Brutal Header Section --- */
        .header {
            padding: 40px 40px 20px 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 10px;
            line-height: 1;
        }

        .header .subtitle {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            display: block;
        }

        /* --- Progress Bar --- */
        .progress-container {
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.1);
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--accent);
        }

        /* --- Content Area --- */
        .content {
            padding: 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px dashed var(--border-color);
        }

        .question-number {
            font-family: var(--font-mono);
            color: var(--accent);
            font-size: 0.9rem;
        }

        .domain-tag {
            font-family: var(--font-mono);
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .question-text {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 40px;
            color: #eee;
            font-weight: 400;
        }

        /* --- Options --- */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            position: relative;
        }

        .option:hover {
            border-color: var(--accent);
            background: rgba(255,255,255,0.04);
        }

        .option.selected {
            background: var(--accent-dim);
            border-color: var(--accent);
        }

        .option-label {
            font-family: var(--font-mono);
            margin-right: 20px;
            color: var(--text-muted);
            font-weight: bold;
            min-width: 25px;
        }

        .option.selected .option-label {
            color: var(--accent);
        }

        .option-text {
            flex: 1;
            font-size: 1rem;
            color: rgba(255,255,255,0.8);
        }

        .option.selected .option-text {
            color: #fff;
        }

        /* --- Buttons --- */
        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 50px;
        }

        .btn {
            padding: 12px 24px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: #fff;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover:not(:disabled) {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .btn-primary {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: var(--border-color);
        }

        /* --- Results Screen --- */
        .results {
            animation: fadeIn 0.5s ease;
        }

        .score-card {
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.02);
            padding: 40px;
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        /* Terminal scanline effect for score */
        .score-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: rgba(255,255,255,0.1);
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .score-number {
            font-size: 5rem;
            font-weight: bold;
            font-family: var(--font-mono);
            margin: 10px 0;
            color: #fff;
        }

        .pass-fail {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            padding: 10px 20px;
            display: inline-block;
            border: 1px solid currentColor;
            margin-top: 20px;
        }

        .pass { color: var(--accent); }
        .fail { color: var(--accent-red); }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            padding: 20px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            font-family: var(--font-mono);
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-family: var(--font-mono);
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Review Section */
        .review-question {
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.02);
            padding: 25px;
            margin-bottom: 20px;
            border-left: 4px solid transparent;
        }

        .review-question.correct { border-left-color: var(--accent); }
        .review-question.incorrect { border-left-color: var(--accent-red); }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .review-status.correct { color: var(--accent); }
        .review-status.incorrect { color: var(--accent-red); }

        .review-text {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 20px;
        }

        .review-answers {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            padding: 15px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .answer-line {
            margin-bottom: 8px;
            display: flex;
        }

        .answer-line strong {
            width: 140px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .explanation {
            margin-top: 15px;
            padding: 15px;
            border-left: 2px solid var(--text-muted);
            background: rgba(255,255,255,0.03);
            font-size: 0.95rem;
            color: #ccc;
        }

        .explanation-title {
            font-family: var(--font-mono);
            text-transform: uppercase;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0c0c0c;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--accent) #0c0c0c;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .header h1 { font-size: 2rem; }
            .content { padding: 20px; }
            .question-header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .score-number { font-size: 3rem; }
            .navigation { flex-direction: column; gap: 15px; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="terminal-bar">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
            <span style="margin-left: 10px;">bash — user@shelnet-exam: ~</span>
        </div>

        <div class="header">
            <h1 id="quizTitle">Quiz Title</h1>
            <div class="subtitle" id="quizSubtitle">C:\Shelnet\Quizzes> Objective</div>
        </div>

        <div class="progress-container">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <div class="content" id="examContent">
            </div>
    </div>

    <script>
        // ============================================================
        // QUIZ CONFIG — edit this block when deriving a new quiz.
        // Leave the rest of this file unchanged.
        // ============================================================
        const QUIZ_TITLE    = 'Practice Quiz 1.4';
        const QUIZ_SUBTITLE = 'C:\\Shelnet\\Quizzes> CS0-003 Objective 1.4';
        const ACCENT_HEX    = '#06b6d4';

        const questions = [
            {
                q: 'A threat-intel analyst is evaluating a newly received threat report about a nation-state actor. The report was published three weeks ago and describes TTPs that the group abandoned after their infrastructure was publicly exposed in a prior disclosure. Which intelligence confidence dimension is MOST degraded by this situation?',
                options: [
                    'A. Timeliness',
                    'B. Relevancy',
                    'C. Accuracy',
                    'D. Completeness'
                ],
                correct: 0,
                domain: 'Security Operations',
                explanation: 'Timeliness refers to how current the intelligence is; a three-week-old report describing TTPs the actor has already abandoned is not timely and significantly reduces its operational value. Relevancy (B) concerns whether the intel applies to the organization\'s environment, which is a separate confidence dimension.'
            },
            {
                q: 'A threat hunter is profiling a recently identified threat actor group that targets financial institutions using spear-phishing followed by custom implants and living-off-the-land techniques to move laterally. The hunter documents the adversary\'s methods in structured form. Which of the following threat-intel concepts encompasses the actor\'s specific methods, tools, and procedural steps?',
                options: [
                    'A. IoC collection',
                    'B. TTPs',
                    'C. Confidence levels',
                    'D. Active defense'
                ],
                correct: 1,
                domain: 'Security Operations',
                explanation: 'TTPs (Tactics, Techniques, and Procedures) describe how an adversary operates at a behavioral level, including the methods, tools, and step-by-step procedures they use to achieve their objectives. IoC collection (A) focuses on specific observable artifacts (IP addresses, hashes) rather than the adversary\'s behavioral patterns.'
            },
            {
                q: 'A threat-intel analyst is sourcing information about a newly disclosed malware family. The analyst reviews government bulletins, CERT advisories, and open cybersecurity forums to gather context. Which of the following collection method categories BEST describes these sources?',
                options: [
                    'A. Closed source: paid feeds',
                    'B. Closed source: information sharing organizations',
                    'C. Open source: deep/dark web',
                    'D. Open source: government bulletins and CERT'
                ],
                correct: 3,
                domain: 'Security Operations',
                explanation: 'Government bulletins and CERT/CSIRT advisories are open-source intelligence collection sources; they are publicly available without a subscription or special access. Closed-source paid feeds (A) require a commercial subscription and are a distinct category.'
            },
            {
                q: 'A threat-intel team subscribes to a commercial threat feed from a specialized vendor and receives structured indicator packages not available to the general public. The team also participates in an industry ISAC where members share incidents and indicators under a trust agreement. Which of the following collection method categories BEST describes both of these sources?',
                options: [
                    'A. Closed source: paid feeds and information sharing organizations',
                    'B. Open source: deep/dark web',
                    'C. Open source: blogs/forums',
                    'D. Closed source: internal sources'
                ],
                correct: 0,
                domain: 'Security Operations',
                explanation: 'Commercial threat feeds (paid feeds) and ISAC memberships (information sharing organizations) are both closed-source intelligence sources that require payment or a vetted trust agreement to access. Open-source blogs and forums (C) are publicly accessible without any access controls.'
            },
            {
                q: 'A threat hunter is conducting a proactive hunt across the enterprise for evidence of a known APT technique involving DLL side-loading. The hunter begins by reviewing endpoint telemetry for unsigned DLLs loaded by legitimate system binaries. Which of the following threat-hunting concepts is the hunter applying?',
                options: [
                    'A. IoC: application',
                    'B. Active defense',
                    'C. Honeypot deployment',
                    'D. IoC: collection'
                ],
                correct: 0,
                domain: 'Security Operations',
                explanation: 'IoC application involves taking known indicators of compromise and applying them against collected telemetry to detect adversary presence, which is what the hunter is doing by searching endpoint data for DLL side-loading artifacts. IoC collection (D) is the prior step of gathering the indicators, whereas this scenario describes using them (application).'
            },
            {
                q: 'A threat-intel analyst is assessing the confidence level of a newly received indicator. The indicator is a specific IP address associated with a C2 server. The source is a highly reputable commercial vendor with a proven track record, and the report was published this morning. However, the indicator describes attack patterns targeting industrial control systems, which the analyst\'s organization does not operate. Which confidence dimension is MOST affected?',
                options: [
                    'A. Relevancy',
                    'B. Accuracy',
                    'C. Timeliness',
                    'D. Attribution'
                ],
                correct: 0,
                domain: 'Security Operations',
                explanation: 'Relevancy measures whether the intelligence applies to the specific organization\'s environment and threat landscape; an indicator targeting ICS environments is not relevant to an organization that does not operate ICS. Accuracy (B) concerns whether the data is factually correct, which is not questioned here given the reputable source.'
            },
            {
                q: 'A security operations team wants to lure threat actors into interacting with a decoy system that mimics a production server, allowing the team to observe attacker techniques and collect IoCs. Which of the following threat-hunting concepts describes this approach?',
                options: [
                    'A. Active defense',
                    'B. Honeypot',
                    'C. Isolated network segment',
                    'D. TTPs analysis'
                ],
                correct: 1,
                domain: 'Security Operations',
                explanation: 'A honeypot is a decoy system designed to attract and monitor attacker activity; any interaction with the honeypot is by definition suspicious and yields IoCs and behavioral intelligence. Active defense (A) is the broader concept of using offensive-leaning defensive techniques; a honeypot is a specific tool within that concept.'
            },
            {
                q: 'A threat hunter is conducting a focused hunt on business-critical assets after leadership identified the ERP system as a high-value target. The hunter is looking for unauthorized access patterns and configuration drift on those specific systems. Which of the following threat-hunting focus areas does this represent?',
                options: [
                    'A. Isolated networks',
                    'B. Configurations/misconfigurations',
                    'C. Business-critical assets and processes',
                    'D. IoC collection'
                ],
                correct: 2,
                domain: 'Security Operations',
                explanation: 'Business-critical assets and processes is a defined threat-hunting focus area; prioritizing hunts on high-value systems such as ERP platforms reduces dwell time for attacks targeting the most impactful systems. Configurations/misconfigurations (B) is a different focus area concerned with security baseline deviations rather than asset prioritization.'
            },
            {
                q: 'A threat-intel analyst is evaluating an indicator received from an external partner organization. The analyst verifies that the IP address is currently active, associated with a known campaign, and has been seen in the wild within the last 24 hours. The indicator is also verified against multiple independent sources. Which confidence level dimension does the 24-hour recency MOST directly support?',
                options: [
                    'A. Relevancy',
                    'B. Accuracy',
                    'C. Completeness',
                    'D. Timeliness'
                ],
                correct: 3,
                domain: 'Security Operations',
                explanation: 'Timeliness reflects how current the intelligence is; an indicator seen in the wild within 24 hours is highly timely and actionable. Accuracy (B) reflects whether the indicator is factually correct, which is supported by multi-source corroboration but is a separate dimension from recency.'
            },
            {
                q: 'A threat hunter discovers that an isolated network segment housing legacy manufacturing systems has no egress filtering and is not monitored by any security tooling. The hunter flags this as a high-priority hunt target. Which of the following threat-hunting focus areas is the hunter applying?',
                options: [
                    'A. Business-critical assets and processes',
                    'B. Honeypot',
                    'C. Isolated networks',
                    'D. Active defense'
                ],
                correct: 2,
                domain: 'Security Operations',
                explanation: 'Isolated networks is a threat-hunting focus area specifically because unmonitored or poorly secured network segments create blind spots that adversaries can exploit for long dwell times. Business-critical assets (A) is a separate focus area prioritized by asset value rather than by network visibility gaps.'
            },
            {
                q: 'A threat-intel analyst is sharing a collection of IoCs related to a recent ransomware campaign with the vulnerability management and detection engineering teams so they can update scan policies and detection rules. Which of the following threat-intelligence sharing use cases does this represent?',
                options: [
                    'A. Risk management',
                    'B. Security engineering and detection and monitoring',
                    'C. Incident response',
                    'D. Closed-source distribution'
                ],
                correct: 1,
                domain: 'Security Operations',
                explanation: 'Sharing threat intelligence with vulnerability management and detection/monitoring teams is a defined sharing use case; it enables those functions to update scanning coverage and detection rules based on current adversary behavior. Incident response (C) would apply if the team were actively responding to an ongoing compromise, not proactively updating defenses.'
            },
            {
                q: 'A threat-intel analyst receives a report attributing a recent campaign to a hacktivist group protesting corporate environmental practices. The group is known for website defacement and DDoS attacks rather than data theft or espionage. Which of the following threat actor categories BEST describes this group?',
                options: [
                    'A. APT',
                    'B. Nation-state',
                    'C. Organized crime',
                    'D. Hacktivists'
                ],
                correct: 3,
                domain: 'Security Operations',
                explanation: 'Hacktivists are threat actors motivated by ideological, political, or social causes who typically conduct disruptive attacks such as defacement and DDoS rather than financial or espionage operations. Organized crime (C) is a different category motivated primarily by financial gain through data theft, fraud, or extortion.'
            },
            {
                q: 'A security analyst is reviewing a threat report about a well-resourced group that has maintained persistent, covert access to a government contractor\'s network for over 18 months, exfiltrating classified documents while evading detection through custom malware and zero-day exploits. Which of the following threat actor categories MOST likely describes this group?',
                options: [
                    'A. Script kiddie',
                    'B. Insider threat',
                    'C. Hacktivists',
                    'D. APT'
                ],
                correct: 3,
                domain: 'Security Operations',
                explanation: 'APT (Advanced Persistent Threat) groups are characterized by sophisticated tooling, long-term stealthy presence, custom malware, and targeted data exfiltration, all of which match the described behavior. Script kiddies (A) lack the resources and technical sophistication to develop zero-day exploits or maintain covert access for 18 months.'
            },
            {
                q: 'A threat hunter reviews a report about a supply chain compromise where a legitimate software vendor\'s update mechanism was weaponized to distribute malware to thousands of customers. Which of the following threat actor motivations or vectors is MOST directly relevant to this scenario?',
                options: [
                    'A. Insider threat: intentional',
                    'B. Organized crime',
                    'C. Supply chain',
                    'D. Hacktivist'
                ],
                correct: 2,
                domain: 'Security Operations',
                explanation: 'Supply chain attacks involve compromising a trusted third-party vendor or software component to gain access to downstream targets; the weaponized update mechanism is a classic supply chain compromise vector. Organized crime (B) is a threat actor motivation category, not a delivery vector, and is not the most precise descriptor for the technique described.'
            },
            {
                q: 'A threat-intel analyst is building a hunt hypothesis based on recent intelligence. The analyst collects file hashes, C2 domain names, and mutex names associated with a malware family, then plans to search endpoint and network telemetry for matches. Which of the following IoC workflow steps is the analyst currently executing?',
                options: [
                    'A. IoC: analysis',
                    'B. IoC: application',
                    'C. IoC: collection',
                    'D. Active defense'
                ],
                correct: 2,
                domain: 'Security Operations',
                explanation: 'IoC collection is the step of gathering indicators (hashes, domains, mutex names) from threat intelligence sources before they are analyzed or applied to detection systems. IoC application (B) is the subsequent step of actually searching for those indicators across telemetry, which has not yet occurred in this scenario.'
            }
        ];

        // ============================================================
        // END CONFIG — chrome below is shared. Do not edit when deriving.
        // ============================================================

        // Small util: convert '#06b6d4' -> 'rgba(6, 182, 212, 0.1)' for the dim variant.
        function hexToRgba(hex, alpha) {
            const h = hex.replace('#', '');
            const r = parseInt(h.substring(0, 2), 16);
            const g = parseInt(h.substring(2, 4), 16);
            const b = parseInt(h.substring(4, 6), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // --- APP STATE ---
        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);

        // --- DOM ELEMENTS ---
        const contentDiv = document.getElementById('examContent');
        const progressBar = document.getElementById('progressBar');

        // --- INITIALIZATION ---
        function init() {
            // --- Apply CONFIG ---
            document.title = QUIZ_TITLE;
            document.getElementById('quizTitle').textContent = QUIZ_TITLE;
            document.getElementById('quizSubtitle').textContent = QUIZ_SUBTITLE;
            document.documentElement.style.setProperty('--accent', ACCENT_HEX);
            document.documentElement.style.setProperty('--accent-dim', hexToRgba(ACCENT_HEX, 0.1));
            document.documentElement.style.setProperty('--accent-glow', hexToRgba(ACCENT_HEX, 0.4));
            document.documentElement.style.setProperty('--accent-select', hexToRgba(ACCENT_HEX, 0.3));

            // --- existing init body continues below ---
            renderQuestion();
        }

        // --- RENDER FUNCTIONS ---
        function renderQuestion() {
            const q = questions[currentQuestionIndex];
            const isLastQuestion = currentQuestionIndex === questions.length - 1;

            // Update Progress
            const progress = ((currentQuestionIndex) / questions.length) * 100;
            progressBar.style.width = `${progress}%`;

            // HTML Structure for Question
            let html = `
                <div class="question-header">
                    <span class="question-number">QUESTION ${currentQuestionIndex + 1} OF ${questions.length}</span>
                    <span class="domain-tag">${q.domain}</span>
                </div>

                <div class="question-text">${q.q}</div>

                <div class="options">
                    ${q.options.map((opt, index) => {
                        const isSelected = userAnswers[currentQuestionIndex] === index;
                        const label = String.fromCharCode(65 + index); // A, B, C, D
                        return `
                            <div class="option ${isSelected ? 'selected' : ''}" onclick="selectOption(${index})">
                                <span class="option-label">${label}</span>
                                <span class="option-text">${opt}</span>
                            </div>
                        `;
                    }).join('')}
                </div>

                <div class="navigation">
                    <button class="btn" onclick="prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>
                        &larr; Previous
                    </button>
                    <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" ${userAnswers[currentQuestionIndex] === null ? 'disabled' : ''}>
                        ${isLastQuestion ? 'Finish Exam' : 'Next &rarr;'}
                    </button>
                </div>
            `;

            contentDiv.innerHTML = html;
        }

        function selectOption(index) {
            userAnswers[currentQuestionIndex] = index;
            // Re-render to show selection state (or just toggle class for performance, but re-render is safer for state sync)
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            // Calculate Score
            let correctCount = 0;
            questions.forEach((q, i) => {
                if (userAnswers[i] === q.correct) correctCount++;
            });

            const score = Math.round((correctCount / questions.length) * 100);
            const passed = score >= 83; // Approx 750/900
            progressBar.style.width = '100%';

            let html = `
                <div class="results">
                    <div class="score-card">
                        <div class="subtitle">EXAM RESULTS</div>
                        <div class="score-number">${score}</div>
                        <div class="subtitle">SCORE / 100</div>
                        <div class="pass-fail ${passed ? 'pass' : 'fail'}">
                            ${passed ? 'PASS' : 'FAIL'}
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-number">${correctCount}</div>
                            <div class="stat-label">Correct</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${questions.length - correctCount}</div>
                            <div class="stat-label">Incorrect</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${questions.length}</div>
                            <div class="stat-label">Total Questions</div>
                        </div>
                    </div>

                    <div class="subtitle" style="margin-bottom: 20px;">Review Answers</div>

                    ${questions.map((q, i) => {
                        const userAnswer = userAnswers[i];
                        const isCorrect = userAnswer === q.correct;
                        const labelUser = String.fromCharCode(65 + userAnswer);
                        const labelCorrect = String.fromCharCode(65 + q.correct);

                        return `
                            <div class="review-question ${isCorrect ? 'correct' : 'incorrect'}">
                                <div class="review-header">
                                    <span>Question ${i + 1}</span>
                                    <span class="review-status ${isCorrect ? 'correct' : 'incorrect'}">
                                        ${isCorrect ? 'CORRECT' : 'INCORRECT'}
                                    </span>
                                </div>
                                <div class="review-text">${q.q}</div>

                                <div class="review-answers">
                                    <div class="answer-line">
                                        <strong>Your Answer:</strong>
                                        <span style="color: ${isCorrect ? 'var(--accent)' : 'var(--accent-red)'}">
                                            ${labelUser}. ${q.options[userAnswer]}
                                        </span>
                                    </div>
                                    <div class="answer-line">
                                        <strong>Correct Answer:</strong>
                                        <span style="color: var(--accent)">
                                            ${labelCorrect}. ${q.options[q.correct]}
                                        </span>
                                    </div>
                                </div>

                                <div class="explanation">
                                    <div class="explanation-title">Explanation</div>
                                    ${q.explanation}
                                </div>
                            </div>
                        `;
                    }).join('')}

                    <div style="text-align: center; margin-top: 40px;">
                        <button class="btn btn-primary" onclick="location.reload()" style="display: inline-flex;">
                            Retake Exam
                        </button>
                    </div>
                </div>
            `;

            contentDiv.innerHTML = html;
            window.scrollTo(0,0);
        }

        // Start
        init();
    </script>
</body>
</html>
