<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelnet Quiz</title>
    <style>
        :root {
            --bg:           #000000;
            --text-90:      rgba(255, 255, 255, 0.90);
            --text-70:      rgba(255, 255, 255, 0.70);
            --text-45:      rgba(255, 255, 255, 0.45);
            --text-30:      rgba(255, 255, 255, 0.30);
            --rule:         rgba(255, 255, 255, 0.15);
            --accent:       #38bdf8; /* Default — overridden per-quiz via ACCENT_HEX */
            --accent-tint:  rgba(56, 189, 248, 0.14); /* selected-row */
            --accent-hover: rgba(56, 189, 248, 0.08); /* hover-row */
            --pass-green:   #43c08c;
            --wrong-red:    #fb7185;
            --font-mono:    'Courier New', Courier, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { background: var(--bg); }

        body {
            font-family: var(--font-mono);
            color: var(--text-90);
            min-height: 100vh;
            padding: 32px 0 48px;
            line-height: 1.5;
            font-size: 15px;
        }

        ::selection {
            background: var(--accent-tint);
            color: #fff;
        }

        .col {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* --- Header --- */
        .title-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 24px;
            color: var(--text-90);
        }

        .title-row .meta {
            color: var(--text-45);
            font-size: 13px;
        }

        .rule {
            border-top: 1px solid var(--rule);
            margin: 12px 0 0;
        }

        .progress {
            height: 2px;
            background: rgba(255, 255, 255, 0.06);
            margin-top: 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.25s ease;
        }

        /* --- Question --- */
        .content { margin-top: 32px; }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 4px 24px;
            color: var(--text-70);
            font-size: 13px;
        }

        .q-header .count { color: var(--accent); }
        .q-header .domain { color: var(--text-45); }

        .stem {
            color: var(--text-90);
            font-size: 17px;
            line-height: 1.6;
            margin: 24px 0 32px;
        }

        .options { display: flex; flex-direction: column; gap: 2px; }

        .option {
            display: flex;
            align-items: baseline;
            gap: 18px;
            padding: 10px 12px;
            cursor: pointer;
            background: transparent;
            border: 0;
            color: var(--text-90);
            font: inherit;
            text-align: left;
            width: 100%;
            transition: background-color 0.12s ease;
        }

        .option:hover { background: var(--accent-hover); }
        .option.selected { background: var(--accent-tint); }

        .option .label {
            color: var(--text-45);
            min-width: 1.5ch;
        }

        .option.selected .label { color: var(--accent); }

        .option .text { flex: 1; }

        /* --- Footer hints --- */
        .hints {
            margin-top: 32px;
            color: var(--text-45);
            font-size: 13px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 18px;
        }

        .hints .key { color: var(--accent); margin-right: 4px; }
        .hints .verb { color: var(--text-90); }
        .hints .verb:hover { text-decoration: underline; }
        .hints .verb.disabled { color: var(--text-30); cursor: not-allowed; }
        .hints .verb.disabled:hover { text-decoration: none; }

        button.verb {
            background: transparent;
            border: 0;
            font: inherit;
            padding: 0;
            cursor: pointer;
        }

        /* --- Results --- */
        .results-heading {
            color: var(--text-70);
            font-size: 15px;
            margin-bottom: 0;
        }

        .score-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 28px;
            margin-top: 28px;
            align-items: baseline;
        }

        .score-row .label { color: var(--text-45); }
        .score-row .score-val { color: var(--text-90); }
        .score-row .verdict-pass { color: var(--pass-green); }
        .score-row .verdict-fail { color: var(--wrong-red); }
        .score-row .threshold   { color: var(--text-45); }

        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 36px;
            margin-top: 16px;
            align-items: baseline;
        }

        .stats-row .stat-label { color: var(--text-45); margin-right: 8px; }
        .stats-row .stat-val   { color: var(--text-90); }

        .review-heading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-70);
            margin: 36px 0 16px;
        }

        .review-heading .dashes {
            color: var(--text-30);
            flex: 1;
            border-top: 1px solid var(--rule);
            margin-left: 4px;
            transform: translateY(1px);
        }

        .review-q {
            border-left: 2px solid var(--text-30);
            padding: 0 0 8px 14px;
            margin-bottom: 20px;
        }

        .review-q.correct   { border-left-color: var(--accent); }
        .review-q.incorrect { border-left-color: var(--wrong-red); }

        .review-q .status {
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-70);
        }

        .review-q .status .glyph-correct   { color: var(--accent); margin: 0 8px; }
        .review-q .status .glyph-incorrect { color: var(--wrong-red); margin: 0 8px; }
        .review-q .status .verdict.correct   { color: var(--accent); }
        .review-q .status .verdict.incorrect { color: var(--wrong-red); }

        .review-q .stem-mini {
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 10px;
            line-height: 1.55;
        }

        .review-q .ans-line {
            display: grid;
            grid-template-columns: 18ch 1fr;
            gap: 4px 8px;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .review-q .ans-line .ans-label { color: var(--text-45); }
        .review-q .ans-line.right .ans-val { color: var(--accent); }
        .review-q .ans-line.wrong .ans-val { color: var(--wrong-red); }
        .review-q .ans-line.skipped .ans-val { color: var(--text-45); }

        .review-q .explanation {
            margin-top: 10px;
            color: var(--text-70);
            font-size: 14px;
            line-height: 1.55;
        }

        .review-q .explanation .arrow { color: var(--accent); margin-right: 6px; }

        .retake-row {
            margin-top: 36px;
            text-align: center;
            color: var(--text-90);
        }

        .retake-row .key { color: var(--accent); margin-right: 4px; }
        .retake-row button.verb:hover { text-decoration: underline; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--accent); }
        * { scrollbar-width: thin; scrollbar-color: var(--accent) #000; }

        /* Mobile */
        @media (max-width: 600px) {
            .col { padding: 0 24px; }
            .stem { font-size: 16px; }
            body { font-size: 14px; padding: 24px 0 36px; }
            .review-q .ans-line { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="col">
        <div class="title-row">
            <span id="quizTitle">quiz</span>
            <span class="meta" id="quizMeta">— · — · 0q</span>
        </div>
        <div class="rule"></div>
        <div class="progress"><div class="progress-fill" id="progressBar"></div></div>

        <div class="content" id="examContent"></div>
    </div>

    <script>
        // ============================================================
        // QUIZ CONFIG — edit this block when deriving a new quiz.
        // Leave the rest of this file unchanged.
        // ============================================================
        const QUIZ_TITLE    = "practice quiz 2.2";
        const QUIZ_SUBTITLE = "cysa-plus · obj 2.2";
        const ACCENT_HEX    = "#22d3ee";

        const questions = [
            {
                q: "A Nessus scan of a web server returns a finding titled \"SSL Certificate Cannot Be Trusted\" with severity set to Medium. The certificate was issued by an internal CA not in Nessus's trusted root store. How should the analyst FIRST handle this finding?",
                options: ["Escalate immediately as a critical finding because untrusted certificates indicate active MITM attacks", "Validate whether the CA is a known internal root before marking as a false positive", "Suppress the plugin permanently because internal CAs always generate this finding", "Replace the certificate with a public CA-issued certificate to close the finding"],
                correct: 1,
                domain: "Vulnerability Management",
                explanation: "The analyst must first validate context: if the certificate was issued by a legitimate internal CA, the finding is a false positive caused by Nessus lacking the private root. Escalating as critical (1) is premature; suppressing permanently (3) could mask future real issues; replacing the cert (4) is a remediation step, not a triage step."
            },
            {
                q: "An OpenVAS scan output shows a finding with QoD (Quality of Detection) of 30% for a critical Apache vulnerability. The analyst must decide how much confidence to place in this result. What does a low QoD percentage MOST indicate?",
                options: ["The vulnerability was confirmed by authenticating to the host and reading the installed version", "OpenVAS detected the issue via banner-grabbing or indirect evidence, making the finding less reliable", "The finding was generated by a community-contributed plugin that lacks vendor validation", "The CVSS base score was calculated without access to vendor advisory data"],
                correct: 1,
                domain: "Vulnerability Management",
                explanation: "QoD in OpenVAS measures detection confidence: low percentages (e.g., 30%) mean the scanner relied on indirect evidence such as banners or version strings rather than direct exploitation or credentialed inspection. High QoD (1) indicates credentialed or confirmed findings; community plugins (3) and CVSS scoring (4) are not what QoD measures."
            },
            {
                q: "A Qualys scan report groups findings into severity levels 1 through 5. A system administrator asks which severity level warrants immediate patching under the organization's SLO. Which Qualys severity is MOST accurately classified as \"Urgent\" and assigned the shortest remediation timeline?",
                options: ["Severity 3 (Medium)", "Severity 2 (Low)", "Severity 4 (Critical)", "Severity 5 (Urgent)"],
                correct: 3,
                domain: "Vulnerability Management",
                explanation: "Qualys uses a 1-5 scale where Severity 5 is labeled \"Urgent\" and carries the highest priority. Most SLOs assign the shortest remediation window (e.g., 15-30 days) to Severity 5 findings. Severity 4 (3) is labeled \"Critical\" and is also high priority but not the top tier; Severities 2-3 (A, B) are lower priority."
            },
            {
                q: "While reviewing a Burp Suite Pro scan report, an analyst notices a \"Reflected XSS\" finding with confidence \"Firm\" on a login page. The finding was auto-discovered by the scanner. Which action should the analyst take NEXT to verify the finding before escalation?",
                options: ["Immediately patch the login page and close the finding without manual verification", "Mark the finding as a false positive because scanners frequently misidentify XSS on login pages", "Manually replay the request in Burp Repeater to confirm that the payload reflects in the browser response", "Escalate to the development team and request a full application rewrite"],
                correct: 2,
                domain: "Vulnerability Management",
                explanation: "Even a \"Firm\" confidence finding should be manually verified: replaying the request in Burp Repeater confirms whether the payload reflects and is executable. Patching without verification (1) skips confirmation; marking as false positive (2) could miss a real vulnerability; requesting a full rewrite (4) is disproportionate before confirmation."
            },
            {
                q: "A Nikto scan against an internal web server returns: \"Server may be vulnerable to CVE-2021-41773 (Apache path traversal/RCE).\" The web server is running Apache 2.4.49. How should the analyst BEST interpret this Nikto output?",
                options: ["The finding is definitely a false positive because Nikto relies only on banner checks", "Nikto confirmed RCE via an active exploit attempt, so the server is fully compromised", "Nikto matched the banner version to a known vulnerable range; the analyst should verify the Apache version and patch level", "The severity is informational only; CVE-2021-41773 affects only Windows IIS servers"],
                correct: 2,
                domain: "Vulnerability Management",
                explanation: "Nikto uses version-based and signature checks; for CVE-2021-41773 it flags Apache 2.4.49 based on the version banner. The analyst should verify the actual installed version and patch status rather than treating the Nikto output as definitive. Nikto does not execute exploits (2); dismissing as a false positive (1) is unwarranted; CVE-2021-41773 is an Apache Linux vulnerability, not Windows IIS (4)."
            },
            {
                q: "An OWASP ZAP automated scan of a web application generates 400 alerts. The security engineer needs to identify findings that require immediate developer attention. Which ZAP alert field is MOST useful for initial triage prioritization?",
                options: ["Alert name (CWE reference)", "Risk level (High/Medium/Low/Informational) combined with confidence level", "URL parameter name where the payload was injected", "HTTP response code returned by the server"],
                correct: 1,
                domain: "Vulnerability Management",
                explanation: "ZAP's risk level combined with confidence is the primary triage filter: High-risk, High-confidence findings are the most actionable. CWE references (1) inform remediation strategy; the parameter name (3) and response code (4) help reproduction but are not initial prioritization fields."
            },
            {
                q: "A vulnerability analyst reviews a Nessus credentialed scan and finds the plugin \"SMB Signing Not Required\" with CVSS Base Score 5.3 (Medium). The affected host is a domain controller. How should asset criticality MOST influence the analyst's response priority?",
                options: ["The finding should be treated as Low priority because the CVSS score is below 7.0", "The finding should be closed as a false positive because domain controllers are protected by Active Directory", "Asset criticality should be ignored; CVSS alone determines patch priority", "Priority should be elevated because a domain controller is a high-value asset and SMB relay attacks targeting it can result in domain compromise"],
                correct: 3,
                domain: "Vulnerability Management",
                explanation: "Asset criticality is a key context factor: SMB signing disabled on a domain controller is far more dangerous than on a workstation, because NTLM relay attacks can lead to domain admin compromise. CVSS alone (3) ignores business context; the finding is not a false positive (2); CVSS 5.3 alone understates the true risk (1)."
            },
            {
                q: "An analyst runs an OpenVAS scan and observes several findings flagged as \"Potential\" rather than \"Confirmed.\" A colleague suggests accepting all \"Potential\" findings as real vulnerabilities to avoid missing anything. What is the BEST practice for handling these findings?",
                options: ["Treat all \"Potential\" findings as confirmed and patch immediately without further investigation", "Investigate each \"Potential\" finding with additional testing (credentialed scan or manual verification) before planning remediation", "Suppress all \"Potential\" findings to keep the report manageable", "Escalate all \"Potential\" findings as critical to management because the risk is unknown"],
                correct: 1,
                domain: "Vulnerability Management",
                explanation: "\"Potential\" findings in OpenVAS indicate the scanner could not confirm the vulnerability with high confidence. Best practice is to investigate further using credentialed scans or manual verification before committing remediation resources. Treating all as confirmed (1) wastes effort on false positives; suppressing all (3) risks missing real vulnerabilities; escalating all as critical (4) creates alert fatigue."
            },
            {
                q: "A Burp Suite scan identifies a \"SQL Injection\" finding with risk \"High\" and confidence \"Tentative\" on a search endpoint. The development team asks what \"Tentative\" means for Burp findings. Which explanation is MOST accurate?",
                options: ["Tentative means the vulnerability was confirmed by successfully extracting database content during the scan", "Tentative means the finding was generated by a manual test case rather than the automated scanner", "Tentative means the finding only applies to authenticated sessions and was not tested on the public endpoint", "Tentative means Burp found heuristic indicators of SQLi but did not confirm data extraction or error-based proof"],
                correct: 3,
                domain: "Vulnerability Management",
                explanation: "Burp's \"Tentative\" confidence means the scanner detected patterns consistent with SQL injection (e.g., timing differences or error fragments) but could not definitively confirm exploitation. \"Certain\" or \"Firm\" would indicate confirmed extraction (1). Manual tests (2) and session scope (3) are not what the confidence level describes."
            },
            {
                q: "A security analyst uses Nessus to scan a DMZ webserver and receives a finding for CVE-2014-6271 (Shellshock). The server runs Apache with CGI enabled. Which Nessus plugin output field is MOST useful to determine whether the scan actively verified the vulnerability versus relying on version checks?",
                options: ["CVSS Base Score listed in the finding header", "The vulnerability publication date in the CVE reference", "The number of times the plugin triggered across other hosts in the scan", "Plugin output section showing whether Nessus sent a probe and received a confirming response"],
                correct: 3,
                domain: "Vulnerability Management",
                explanation: "The Plugin Output field in Nessus contains the raw evidence collected: for an active check like Shellshock, it shows the probe sent and the confirming response received, indicating a true positive. CVSS (1) is a severity metric, not evidence; publication date (2) is historical context; trigger count across hosts (3) measures breadth, not verification quality."
            },
            {
                q: "During a Qualys web application scan, the tool reports \"Sensitive Data Exposure\" because a test account password appeared in an HTTP response body. The application team argues the response is only visible to authenticated users. Which analyst action BEST addresses this disagreement?",
                options: ["Accept the team's explanation and mark the finding as a false positive immediately", "Escalate the finding to the CISO without further investigation", "Review the scan configuration to confirm authentication context, then assess whether the credential exposure violates data handling policy regardless of authentication state", "Close the finding because authenticated-only exposure is not a vulnerability"],
                correct: 2,
                domain: "Vulnerability Management",
                explanation: "The analyst must confirm scan context (authenticated vs. unauthenticated) and evaluate whether exposing credentials in responses violates policy (it typically does, since session compromise would expose the credential). Accepting the claim without verification (1) is insufficient; immediate CISO escalation (2) skips analysis; authenticated-only exposure is still a real risk (4)."
            },
            {
                q: "A Nessus scan produces 1,200 findings across a large enterprise network. The security team must prioritize which hosts to remediate first. Which combination of Nessus report filters is MOST effective for identifying the highest-risk hosts?",
                options: ["Filter by plugin family = \"Web Servers\" only, regardless of severity", "Filter by severity = Critical and sort by plugin output length to find the most detailed findings", "Filter by severity = Critical, then sub-sort by asset criticality or business unit tag", "Filter by finding age to remediate the oldest vulnerabilities first regardless of severity"],
                correct: 2,
                domain: "Vulnerability Management",
                explanation: "Filtering for Critical severity and then sorting by asset criticality ensures the highest-risk combinations are addressed first. Filtering by plugin family alone (1) ignores severity; sorting by output length (2) is not a meaningful risk indicator; remediating by age first (4) ignores severity entirely."
            },
            {
                q: "An analyst reviewing an OWASP ZAP scan for a Node.js REST API notices \"Missing Anti-CSRF Tokens\" alerts on several POST endpoints. The API uses JSON and is consumed only by a mobile app, not a browser. How should the analyst MOST accurately characterize these findings?",
                options: ["Mark all findings as false positives because CSRF requires a browser context and this API is consumed only by a mobile client", "Escalate all findings as critical because REST APIs are always vulnerable to CSRF attacks", "Request that ZAP be reconfigured to exclude JSON POST endpoints from CSRF checks", "Patch all endpoints with CSRF tokens before closing any finding"],
                correct: 0,
                domain: "Vulnerability Management",
                explanation: "CSRF exploits the browser's automatic credential attachment. A REST API consumed exclusively by a mobile client using token-based auth (not browser cookies/sessions) is not vulnerable to CSRF; ZAP's generic scanner produces false positives in this architecture. Escalating as critical (2) misapplies the CSRF threat model; mandatory CSRF token patching (4) adds unnecessary complexity; reconfiguring ZAP (3) improves future scanning but is not the finding characterization."
            },
            {
                q: "A security engineer receives a Nikto scan report that flags: \"Allowed HTTP Methods: OPTIONS, GET, HEAD, POST, PUT, DELETE.\" Why is the presence of PUT and DELETE MOST significant as a security concern identified by this Nikto output?",
                options: ["PUT and DELETE methods, if not properly restricted, could allow unauthorized file upload or resource deletion on the server", "PUT and DELETE are always blocked by web application firewalls; their presence indicates WAF misconfiguration", "Allowing authenticated users to use PUT and DELETE is an expected and inherently secure design pattern", "Nikto flagged this as informational only; exposed HTTP methods are never a vulnerability"],
                correct: 0,
                domain: "Vulnerability Management",
                explanation: "Unrestricted HTTP methods PUT and DELETE on a web server can allow unauthorized file uploads or resource deletion if access controls are insufficient. Nikto correctly flags this for investigation. WAF blocking is not guaranteed and bypass is possible (2); authenticated use must still be validated (3); calling it purely informational (4) underestimates the risk."
            },
            {
                q: "A vulnerability scan run against a cloud-hosted Linux server reports \"OpenSSH Username Enumeration\" (CVE-2018-15473) as a Medium severity finding. The server is accessible only via an internal VPN requiring MFA. How should the analyst MOST accurately classify this finding after considering context?",
                options: ["Accept the risk or reduce priority because VPN-with-MFA access control significantly limits the attack surface for this finding", "Escalate to Critical because SSH username enumeration enables credential-stuffing attacks", "Remediate immediately because all CVE findings must be patched within 30 days", "Mark as a false positive because the CVE only applies to physical servers, not cloud-hosted instances"],
                correct: 0,
                domain: "Vulnerability Management",
                explanation: "Context-aware prioritization weighs access controls: a Medium finding on a host reachable only via VPN with MFA has a significantly reduced exploitability window. The analyst can document risk acceptance or defer patching. Escalating to Critical (2) ignores compensating controls; blanket 30-day rules (3) do not replace context-aware analysis; cloud vs. physical does not affect CVE applicability (4)."
            }
        ];

        // ============================================================
        // END CONFIG — chrome below is shared. Do not edit when deriving.
        // ============================================================

        function hexToRgba(hex, alpha) {
            const h = hex.replace('#', '');
            const r = parseInt(h.substring(0, 2), 16);
            const g = parseInt(h.substring(2, 4), 16);
            const b = parseInt(h.substring(4, 6), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // --- APP STATE ---
        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let onResults = false;

        // --- DOM ---
        const contentDiv = document.getElementById('examContent');
        const progressBar = document.getElementById('progressBar');

        // --- INIT ---
        function init() {
            document.title = QUIZ_TITLE;
            document.getElementById('quizTitle').textContent = QUIZ_TITLE;
            document.getElementById('quizMeta').textContent =
                `${QUIZ_SUBTITLE} · ${questions.length}q`;
            document.documentElement.style.setProperty('--accent', ACCENT_HEX);
            document.documentElement.style.setProperty('--accent-tint',  hexToRgba(ACCENT_HEX, 0.14));
            document.documentElement.style.setProperty('--accent-hover', hexToRgba(ACCENT_HEX, 0.08));
            renderQuestion();
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // --- RENDER ---
        function renderQuestion() {
            onResults = false;
            const q = questions[currentQuestionIndex];
            const isLast = currentQuestionIndex === questions.length - 1;
            const isFirst = currentQuestionIndex === 0;
            const picked = userAnswers[currentQuestionIndex];

            progressBar.style.width = `${(currentQuestionIndex / questions.length) * 100}%`;

            const optionsHtml = q.options.map((opt, i) => `
                <button type="button"
                        class="option ${picked === i ? 'selected' : ''}"
                        onclick="selectOption(${i})">
                    <span class="label">${i + 1}</span>
                    <span class="text">${escapeHtml(opt)}</span>
                </button>
            `).join('');

            const prevHtml = isFirst
                ? ''
                : `<button type="button" class="verb" onclick="prevQuestion()"><span class="key">&larr;</span>prev</button>`;

            const nextLabel = isLast ? 'finish' : 'next';
            const nextEnabled = picked !== null;
            const nextHtml = nextEnabled
                ? `<button type="button" class="verb" onclick="nextQuestion()"><span class="key">&#x21B5;</span>${nextLabel}</button>`
                : `<span class="verb disabled"><span class="key">&#x21B5;</span>${nextLabel}</span>`;

            contentDiv.innerHTML = `
                <div class="q-header">
                    <span class="count">question ${currentQuestionIndex + 1} of ${questions.length}</span>
                    <span class="domain">[ ${escapeHtml(q.domain.toLowerCase())} ]</span>
                </div>

                <div class="stem">${escapeHtml(q.q)}</div>

                <div class="options">${optionsHtml}</div>

                <div class="hints">
                    <span><span class="key">1-${q.options.length}</span>select</span>
                    ${prevHtml ? `<span>${prevHtml}</span>` : ''}
                    <span>${nextHtml}</span>
                </div>
            `;
        }

        function selectOption(i) {
            userAnswers[currentQuestionIndex] = i;
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (userAnswers[currentQuestionIndex] === null) return;
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            onResults = true;
            let correctCount = 0;
            questions.forEach((q, i) => { if (userAnswers[i] === q.correct) correctCount++; });
            const score = Math.round((correctCount / questions.length) * 100);
            const passed = score >= 83;
            progressBar.style.width = '100%';

            const reviewHtml = questions.map((q, i) => {
                const userAnswer = userAnswers[i];
                const skipped = userAnswer === null;
                const isCorrect = !skipped && userAnswer === q.correct;
                const userLabel = skipped ? '—' : `${userAnswer + 1}  ${escapeHtml(q.options[userAnswer])}`;
                const correctLabel = `${q.correct + 1}  ${escapeHtml(q.options[q.correct])}`;
                const statusGlyph = isCorrect
                    ? `<span class="glyph-correct">&#x2713;</span><span class="verdict correct">correct</span>`
                    : `<span class="glyph-incorrect">&#x2717;</span><span class="verdict incorrect">${skipped ? 'skipped' : 'incorrect'}</span>`;
                const yourLineClass = skipped ? 'skipped' : (isCorrect ? 'right' : 'wrong');
                return `
                    <div class="review-q ${isCorrect ? 'correct' : 'incorrect'}">
                        <div class="status">Q.${i + 1}${statusGlyph}</div>
                        <div class="stem-mini">${escapeHtml(q.q)}</div>
                        <div class="ans-line ${yourLineClass}">
                            <span class="ans-label">your answer:</span>
                            <span class="ans-val">${userLabel}</span>
                        </div>
                        <div class="ans-line right">
                            <span class="ans-label">correct answer:</span>
                            <span class="ans-val">${correctLabel}</span>
                        </div>
                        <div class="explanation"><span class="arrow">&rsaquo;</span>${escapeHtml(q.explanation)}</div>
                    </div>
                `;
            }).join('');

            contentDiv.innerHTML = `
                <div class="results-heading">results</div>

                <div class="score-row">
                    <span><span class="label">score</span> <span class="score-val">${score} / 100</span></span>
                    <span class="${passed ? 'verdict-pass' : 'verdict-fail'}">${passed ? 'pass' : 'fail'}</span>
                    <span class="threshold">(&ge; 83 to pass)</span>
                </div>

                <div class="stats-row">
                    <span><span class="stat-label">correct</span><span class="stat-val">${correctCount}</span></span>
                    <span><span class="stat-label">incorrect</span><span class="stat-val">${questions.length - correctCount}</span></span>
                    <span><span class="stat-label">total</span><span class="stat-val">${questions.length}</span></span>
                </div>

                <div class="review-heading">review<span class="dashes"></span></div>

                ${reviewHtml}

                <div class="retake-row">
                    <button type="button" class="verb" onclick="location.reload()"><span class="key">&#x21B5;</span>retake</button>
                </div>
            `;
            window.scrollTo(0, 0);
        }

        // --- KEYBOARD ---
        window.addEventListener('keydown', (e) => {
            const tag = document.activeElement && document.activeElement.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA') return;

            if (onResults) {
                if (e.key === 'Enter') { e.preventDefault(); location.reload(); }
                return;
            }

            if (/^[1-9]$/.test(e.key)) {
                const i = Number(e.key) - 1;
                const q = questions[currentQuestionIndex];
                if (i < q.options.length) { e.preventDefault(); selectOption(i); }
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault(); prevQuestion();
            } else if (e.key === 'ArrowRight' || e.key === 'Enter') {
                e.preventDefault(); nextQuestion();
            }
        });

        init();
    </script>
</body>
</html>
