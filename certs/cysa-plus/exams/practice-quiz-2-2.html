<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelnet Quiz</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #0c0c0c;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --border-color: rgba(255, 255, 255, 0.15);
            --accent: #3b82f6; /* Default — overridden per-quiz via ACCENT_HEX in CONFIG */
            --accent-dim: rgba(59, 130, 246, 0.1); /* Default — overridden via setProperty in init() */
            --accent-glow: rgba(59, 130, 246, 0.4); /* Default — overridden via setProperty in init() */
            --accent-select: rgba(59, 130, 246, 0.3); /* Default — overridden via setProperty in init() */
            --accent-red: #ef4444;
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            /* Grid Background Effect */
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Selection Color */
        ::selection {
            background: var(--accent-select);
            color: #dbeafe;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            position: relative;
            z-index: 10;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            min-height: 600px;
            display: flex;
            flex-direction: column;
        }

        /* --- Terminal Header Bar --- */
        .terminal-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-color);
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot.red { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); }
        .dot.yellow { background: rgba(234, 179, 8, 0.2); border: 1px solid rgba(234, 179, 8, 0.5); }
        .dot.green { background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.5); }

        /* --- Brutal Header Section --- */
        .header {
            padding: 40px 40px 20px 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 10px;
            line-height: 1;
        }

        .header .subtitle {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            display: block;
        }

        /* --- Progress Bar --- */
        .progress-container {
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.1);
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--accent);
        }

        /* --- Content Area --- */
        .content {
            padding: 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px dashed var(--border-color);
        }

        .question-number {
            font-family: var(--font-mono);
            color: var(--accent);
            font-size: 0.9rem;
        }

        .domain-tag {
            font-family: var(--font-mono);
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .question-text {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 40px;
            color: #eee;
            font-weight: 400;
        }

        /* --- Options --- */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            position: relative;
        }

        .option:hover {
            border-color: var(--accent);
            background: rgba(255,255,255,0.04);
        }

        .option.selected {
            background: var(--accent-dim);
            border-color: var(--accent);
        }

        .option-label {
            font-family: var(--font-mono);
            margin-right: 20px;
            color: var(--text-muted);
            font-weight: bold;
            min-width: 25px;
        }

        .option.selected .option-label {
            color: var(--accent);
        }

        .option-text {
            flex: 1;
            font-size: 1rem;
            color: rgba(255,255,255,0.8);
        }

        .option.selected .option-text {
            color: #fff;
        }

        /* --- Buttons --- */
        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 50px;
        }

        .btn {
            padding: 12px 24px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: #fff;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover:not(:disabled) {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .btn-primary {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: var(--border-color);
        }

        /* --- Results Screen --- */
        .results {
            animation: fadeIn 0.5s ease;
        }

        .score-card {
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.02);
            padding: 40px;
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        /* Terminal scanline effect for score */
        .score-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: rgba(255,255,255,0.1);
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .score-number {
            font-size: 5rem;
            font-weight: bold;
            font-family: var(--font-mono);
            margin: 10px 0;
            color: #fff;
        }

        .pass-fail {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            padding: 10px 20px;
            display: inline-block;
            border: 1px solid currentColor;
            margin-top: 20px;
        }

        .pass { color: var(--accent); }
        .fail { color: var(--accent-red); }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            padding: 20px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            font-family: var(--font-mono);
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-family: var(--font-mono);
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Review Section */
        .review-question {
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.02);
            padding: 25px;
            margin-bottom: 20px;
            border-left: 4px solid transparent;
        }

        .review-question.correct { border-left-color: var(--accent); }
        .review-question.incorrect { border-left-color: var(--accent-red); }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .review-status.correct { color: var(--accent); }
        .review-status.incorrect { color: var(--accent-red); }

        .review-text {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 20px;
        }

        .review-answers {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            padding: 15px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .answer-line {
            margin-bottom: 8px;
            display: flex;
        }

        .answer-line strong {
            width: 140px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .explanation {
            margin-top: 15px;
            padding: 15px;
            border-left: 2px solid var(--text-muted);
            background: rgba(255,255,255,0.03);
            font-size: 0.95rem;
            color: #ccc;
        }

        .explanation-title {
            font-family: var(--font-mono);
            text-transform: uppercase;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0c0c0c;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--accent) #0c0c0c;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .header h1 { font-size: 2rem; }
            .content { padding: 20px; }
            .question-header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .score-number { font-size: 3rem; }
            .navigation { flex-direction: column; gap: 15px; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="terminal-bar">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
            <span style="margin-left: 10px;">bash — user@shelnet-exam: ~</span>
        </div>

        <div class="header">
            <h1 id="quizTitle">Quiz Title</h1>
            <div class="subtitle" id="quizSubtitle">C:\Shelnet\Quizzes> Objective</div>
        </div>

        <div class="progress-container">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <div class="content" id="examContent">
            </div>
    </div>

    <script>
        // ============================================================
        // QUIZ CONFIG — edit this block when deriving a new quiz.
        // Leave the rest of this file unchanged.
        // ============================================================
        const QUIZ_TITLE    = 'Practice Quiz 2.2';
        const QUIZ_SUBTITLE = 'C:\\Shelnet\\Quizzes> CS0-003 Objective 2.2';
        const ACCENT_HEX    = '#06b6d4';

        const questions = [
            {
                q: 'A Nessus scan of a web server returns a finding titled "SSL Certificate Cannot Be Trusted" with severity set to Medium. The certificate was issued by an internal CA not in Nessus\'s trusted root store. How should the analyst FIRST handle this finding?',
                options: [
                    'A. Escalate immediately as a critical finding because untrusted certificates indicate active MITM attacks',
                    'B. Validate whether the CA is a known internal root before marking as a false positive',
                    'C. Suppress the plugin permanently because internal CAs always generate this finding',
                    'D. Replace the certificate with a public CA-issued certificate to close the finding'
                ],
                correct: 1,
                domain: 'Vulnerability Management',
                explanation: 'The analyst must first validate context: if the certificate was issued by a legitimate internal CA, the finding is a false positive caused by Nessus lacking the private root. Escalating as critical (A) is premature; suppressing permanently (C) could mask future real issues; replacing the cert (D) is a remediation step, not a triage step.'
            },
            {
                q: 'An OpenVAS scan output shows a finding with QoD (Quality of Detection) of 30% for a critical Apache vulnerability. The analyst must decide how much confidence to place in this result. What does a low QoD percentage MOST indicate?',
                options: [
                    'A. The vulnerability was confirmed by authenticating to the host and reading the installed version',
                    'B. OpenVAS detected the issue via banner-grabbing or indirect evidence, making the finding less reliable',
                    'C. The finding was generated by a community-contributed plugin that lacks vendor validation',
                    'D. The CVSS base score was calculated without access to vendor advisory data'
                ],
                correct: 1,
                domain: 'Vulnerability Management',
                explanation: 'QoD in OpenVAS measures detection confidence: low percentages (e.g., 30%) mean the scanner relied on indirect evidence such as banners or version strings rather than direct exploitation or credentialed inspection. High QoD (A) indicates credentialed or confirmed findings; community plugins (C) and CVSS scoring (D) are not what QoD measures.'
            },
            {
                q: 'A Qualys scan report groups findings into severity levels 1 through 5. A system administrator asks which severity level warrants immediate patching under the organization\'s SLO. Which Qualys severity is MOST accurately classified as "Critical" and assigned the shortest remediation timeline?',
                options: [
                    'A. Severity 3 (Medium)',
                    'B. Severity 2 (Low)',
                    'C. Severity 4 (High)',
                    'D. Severity 5 (Critical)'
                ],
                correct: 3,
                domain: 'Vulnerability Management',
                explanation: 'Qualys uses a 1-5 scale where Severity 5 is Critical and carries the highest urgency. Most SLOs assign the shortest remediation window (e.g., 15-30 days) to Severity 5 findings. Severity 4 (C) is High and also urgent but not the top tier; Severities 2-3 (A, B) are lower priority.'
            },
            {
                q: 'While reviewing a Burp Suite Pro scan report, an analyst notices a "Reflected XSS" finding with confidence "Firm" on a login page. The finding was auto-discovered by the scanner. Which action should the analyst take NEXT to verify the finding before escalation?',
                options: [
                    'A. Immediately patch the login page and close the finding without manual verification',
                    'B. Mark the finding as a false positive because scanners frequently misidentify XSS on login pages',
                    'C. Manually replay the request in Burp Repeater to confirm that the payload reflects in the browser response',
                    'D. Escalate to the development team and request a full application rewrite'
                ],
                correct: 2,
                domain: 'Vulnerability Management',
                explanation: 'Even a "Firm" confidence finding should be manually verified: replaying the request in Burp Repeater confirms whether the payload reflects and is executable. Patching without verification (A) skips confirmation; marking as false positive (B) could miss a real vulnerability; requesting a full rewrite (D) is disproportionate before confirmation.'
            },
            {
                q: 'A Nikto scan against an internal web server returns: "Server may be vulnerable to CVE-2021-41773 (Apache path traversal/RCE)." The web server is running Apache 2.4.49. How should the analyst BEST interpret this Nikto output?',
                options: [
                    'A. The finding is definitely a false positive because Nikto relies only on banner checks',
                    'B. Nikto confirmed RCE via an active exploit attempt, so the server is fully compromised',
                    'C. Nikto matched the banner version to a known vulnerable range; the analyst should verify the Apache version and patch level',
                    'D. The severity is informational only; CVE-2021-41773 affects only Windows IIS servers'
                ],
                correct: 2,
                domain: 'Vulnerability Management',
                explanation: 'Nikto uses version-based and signature checks; for CVE-2021-41773 it flags Apache 2.4.49 based on the version banner. The analyst should verify the actual installed version and patch status rather than treating the Nikto output as definitive. Nikto does not execute exploits (B); dismissing as a false positive (A) is unwarranted; CVE-2021-41773 is an Apache Linux vulnerability, not Windows IIS (D).'
            },
            {
                q: 'An OWASP ZAP automated scan of a web application generates 400 alerts. The security engineer needs to identify findings that require immediate developer attention. Which ZAP alert field is MOST useful for initial triage prioritization?',
                options: [
                    'A. Alert name (CWE reference)',
                    'B. Risk level (High/Medium/Low/Informational) combined with confidence level',
                    'C. URL parameter name where the payload was injected',
                    'D. HTTP response code returned by the server'
                ],
                correct: 1,
                domain: 'Vulnerability Management',
                explanation: 'ZAP\'s risk level combined with confidence is the primary triage filter: High-risk, High-confidence findings are the most actionable. CWE references (A) inform remediation strategy; the parameter name (C) and response code (D) help reproduction but are not initial prioritization fields.'
            },
            {
                q: 'A vulnerability analyst reviews a Nessus credentialed scan and finds the plugin "SMB Signing Not Required" with CVSS Base Score 5.3 (Medium). The affected host is a domain controller. How should asset criticality MOST influence the analyst\'s response priority?',
                options: [
                    'A. The finding should be treated as Low priority because the CVSS score is below 7.0',
                    'B. The finding should be closed as a false positive because domain controllers are protected by Active Directory',
                    'C. Asset criticality should be ignored; CVSS alone determines patch priority',
                    'D. Priority should be elevated because a domain controller is a high-value asset and SMB relay attacks targeting it can result in domain compromise'
                ],
                correct: 3,
                domain: 'Vulnerability Management',
                explanation: 'Asset criticality is a key context factor: SMB signing disabled on a domain controller is far more dangerous than on a workstation, because NTLM relay attacks can lead to domain admin compromise. CVSS alone (C) ignores business context; the finding is not a false positive (B); CVSS 5.3 alone understates the true risk (A).'
            },
            {
                q: 'An analyst runs an OpenVAS scan and observes several findings flagged as "Potential" rather than "Confirmed." A colleague suggests accepting all "Potential" findings as real vulnerabilities to avoid missing anything. What is the BEST practice for handling these findings?',
                options: [
                    'A. Treat all "Potential" findings as confirmed and patch immediately without further investigation',
                    'B. Investigate each "Potential" finding with additional testing (credentialed scan or manual verification) before planning remediation',
                    'C. Suppress all "Potential" findings to keep the report manageable',
                    'D. Escalate all "Potential" findings as critical to management because the risk is unknown'
                ],
                correct: 1,
                domain: 'Vulnerability Management',
                explanation: '"Potential" findings in OpenVAS indicate the scanner could not confirm the vulnerability with high confidence. Best practice is to investigate further using credentialed scans or manual verification before committing remediation resources. Treating all as confirmed (A) wastes effort on false positives; suppressing all (C) risks missing real vulnerabilities; escalating all as critical (D) creates alert fatigue.'
            },
            {
                q: 'A Burp Suite scan identifies a "SQL Injection" finding with risk "High" and confidence "Tentative" on a search endpoint. The development team asks what "Tentative" means for Burp findings. Which explanation is MOST accurate?',
                options: [
                    'A. Tentative means the vulnerability was confirmed by successfully extracting database content during the scan',
                    'B. Tentative means the finding was generated by a manual test case rather than the automated scanner',
                    'C. Tentative means the finding only applies to authenticated sessions and was not tested on the public endpoint',
                    'D. Tentative means Burp found heuristic indicators of SQLi but did not confirm data extraction or error-based proof'
                ],
                correct: 3,
                domain: 'Vulnerability Management',
                explanation: 'Burp\'s "Tentative" confidence means the scanner detected patterns consistent with SQL injection (e.g., timing differences or error fragments) but could not definitively confirm exploitation. "Certain" or "Firm" would indicate confirmed extraction (A). Manual tests (B) and session scope (C) are not what the confidence level describes.'
            },
            {
                q: 'A security analyst uses Nessus to scan a DMZ webserver and receives a finding for CVE-2014-6271 (Shellshock). The server runs Apache with CGI enabled. Which Nessus plugin output field is MOST useful to determine whether the scan actively verified the vulnerability versus relying on version checks?',
                options: [
                    'A. CVSS Base Score listed in the finding header',
                    'B. The vulnerability publication date in the CVE reference',
                    'C. The number of times the plugin triggered across other hosts in the scan',
                    'D. Plugin output section showing whether Nessus sent a probe and received a confirming response'
                ],
                correct: 3,
                domain: 'Vulnerability Management',
                explanation: 'The Plugin Output field in Nessus contains the raw evidence collected: for an active check like Shellshock, it shows the probe sent and the confirming response received, indicating a true positive. CVSS (A) is a severity metric, not evidence; publication date (B) is historical context; trigger count across hosts (C) measures breadth, not verification quality.'
            },
            {
                q: 'During a Qualys web application scan, the tool reports "Sensitive Data Exposure" because a test account password appeared in an HTTP response body. The application team argues the response is only visible to authenticated users. Which analyst action BEST addresses this disagreement?',
                options: [
                    'A. Accept the team\'s explanation and mark the finding as a false positive immediately',
                    'B. Escalate the finding to the CISO without further investigation',
                    'C. Review the scan configuration to confirm authentication context, then assess whether the credential exposure violates data handling policy regardless of authentication state',
                    'D. Close the finding because authenticated-only exposure is not a vulnerability'
                ],
                correct: 2,
                domain: 'Vulnerability Management',
                explanation: 'The analyst must confirm scan context (authenticated vs. unauthenticated) and evaluate whether exposing credentials in responses violates policy (it typically does, since session compromise would expose the credential). Accepting the claim without verification (A) is insufficient; immediate CISO escalation (B) skips analysis; authenticated-only exposure is still a real risk (D).'
            },
            {
                q: 'A Nessus scan produces 1,200 findings across a large enterprise network. The security team must prioritize which hosts to remediate first. Which combination of Nessus report filters is MOST effective for identifying the highest-risk hosts?',
                options: [
                    'A. Filter by plugin family = "Web Servers" only, regardless of severity',
                    'B. Filter by severity = Critical and sort by plugin output length to find the most detailed findings',
                    'C. Filter by severity = Critical, then sub-sort by asset criticality or business unit tag',
                    'D. Filter by finding age to remediate the oldest vulnerabilities first regardless of severity'
                ],
                correct: 2,
                domain: 'Vulnerability Management',
                explanation: 'Filtering for Critical severity and then sorting by asset criticality ensures the highest-risk combinations are addressed first. Filtering by plugin family alone (A) ignores severity; sorting by output length (B) is not a meaningful risk indicator; remediating by age first (D) ignores severity entirely.'
            },
            {
                q: 'An analyst reviewing an OWASP ZAP scan for a Node.js REST API notices "Missing Anti-CSRF Tokens" alerts on several POST endpoints. The API uses JSON and is consumed only by a mobile app, not a browser. How should the analyst MOST accurately characterize these findings?',
                options: [
                    'A. Mark all findings as false positives because CSRF requires a browser context and this API is consumed only by a mobile client',
                    'B. Escalate all findings as critical because REST APIs are always vulnerable to CSRF attacks',
                    'C. Request that ZAP be reconfigured to exclude JSON POST endpoints from CSRF checks',
                    'D. Patch all endpoints with CSRF tokens before closing any finding'
                ],
                correct: 0,
                domain: 'Vulnerability Management',
                explanation: 'CSRF exploits the browser\'s automatic credential attachment. A REST API consumed exclusively by a mobile client using token-based auth (not browser cookies/sessions) is not vulnerable to CSRF; ZAP\'s generic scanner produces false positives in this architecture. Escalating as critical (B) misapplies the CSRF threat model; mandatory CSRF token patching (D) adds unnecessary complexity; reconfiguring ZAP (C) improves future scanning but is not the finding characterization.'
            },
            {
                q: 'A security engineer receives a Nikto scan report that flags: "Allowed HTTP Methods: OPTIONS, GET, HEAD, POST, PUT, DELETE." Why is the presence of PUT and DELETE MOST significant as a security concern identified by this Nikto output?',
                options: [
                    'A. PUT and DELETE methods, if not properly restricted, could allow unauthorized file upload or resource deletion on the server',
                    'B. PUT and DELETE are always blocked by web application firewalls; their presence indicates WAF misconfiguration',
                    'C. Allowing authenticated users to use PUT and DELETE is an expected and inherently secure design pattern',
                    'D. Nikto flagged this as informational only; exposed HTTP methods are never a vulnerability'
                ],
                correct: 0,
                domain: 'Vulnerability Management',
                explanation: 'Unrestricted HTTP methods PUT and DELETE on a web server can allow unauthorized file uploads or resource deletion if access controls are insufficient. Nikto correctly flags this for investigation. WAF blocking is not guaranteed and bypass is possible (B); authenticated use must still be validated (C); calling it purely informational (D) underestimates the risk.'
            },
            {
                q: 'A vulnerability scan run against a cloud-hosted Linux server reports "OpenSSH Username Enumeration" (CVE-2018-15473) as a Medium severity finding. The server is accessible only via an internal VPN requiring MFA. How should the analyst MOST accurately classify this finding after considering context?',
                options: [
                    'A. Accept the risk or reduce priority because VPN-with-MFA access control significantly limits the attack surface for this finding',
                    'B. Escalate to Critical because SSH username enumeration enables credential-stuffing attacks',
                    'C. Remediate immediately because all CVE findings must be patched within 30 days',
                    'D. Mark as a false positive because the CVE only applies to physical servers, not cloud-hosted instances'
                ],
                correct: 0,
                domain: 'Vulnerability Management',
                explanation: 'Context-aware prioritization weighs access controls: a Medium finding on a host reachable only via VPN with MFA has a significantly reduced exploitability window. The analyst can document risk acceptance or defer patching. Escalating to Critical (B) ignores compensating controls; blanket 30-day rules (C) do not replace context-aware analysis; cloud vs. physical does not affect CVE applicability (D).'
            }
        ];

        // ============================================================
        // END CONFIG — chrome below is shared. Do not edit when deriving.
        // ============================================================

        // Small util: convert '#06b6d4' -> 'rgba(6, 182, 212, 0.1)' for the dim variant.
        function hexToRgba(hex, alpha) {
            const h = hex.replace('#', '');
            const r = parseInt(h.substring(0, 2), 16);
            const g = parseInt(h.substring(2, 4), 16);
            const b = parseInt(h.substring(4, 6), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // --- APP STATE ---
        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);

        // --- DOM ELEMENTS ---
        const contentDiv = document.getElementById('examContent');
        const progressBar = document.getElementById('progressBar');

        // --- INITIALIZATION ---
        function init() {
            // --- Apply CONFIG ---
            document.title = QUIZ_TITLE;
            document.getElementById('quizTitle').textContent = QUIZ_TITLE;
            document.getElementById('quizSubtitle').textContent = QUIZ_SUBTITLE;
            document.documentElement.style.setProperty('--accent', ACCENT_HEX);
            document.documentElement.style.setProperty('--accent-dim', hexToRgba(ACCENT_HEX, 0.1));
            document.documentElement.style.setProperty('--accent-glow', hexToRgba(ACCENT_HEX, 0.4));
            document.documentElement.style.setProperty('--accent-select', hexToRgba(ACCENT_HEX, 0.3));

            // --- existing init body continues below ---
            renderQuestion();
        }

        // --- RENDER FUNCTIONS ---
        function renderQuestion() {
            const q = questions[currentQuestionIndex];
            const isLastQuestion = currentQuestionIndex === questions.length - 1;

            // Update Progress
            const progress = ((currentQuestionIndex) / questions.length) * 100;
            progressBar.style.width = `${progress}%`;

            // HTML Structure for Question
            let html = `
                <div class="question-header">
                    <span class="question-number">QUESTION ${currentQuestionIndex + 1} OF ${questions.length}</span>
                    <span class="domain-tag">${q.domain}</span>
                </div>

                <div class="question-text">${q.q}</div>

                <div class="options">
                    ${q.options.map((opt, index) => {
                        const isSelected = userAnswers[currentQuestionIndex] === index;
                        const label = String.fromCharCode(65 + index); // A, B, C, D
                        return `
                            <div class="option ${isSelected ? 'selected' : ''}" onclick="selectOption(${index})">
                                <span class="option-label">${label}</span>
                                <span class="option-text">${opt}</span>
                            </div>
                        `;
                    }).join('')}
                </div>

                <div class="navigation">
                    <button class="btn" onclick="prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>
                        &larr; Previous
                    </button>
                    <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" ${userAnswers[currentQuestionIndex] === null ? 'disabled' : ''}>
                        ${isLastQuestion ? 'Finish Exam' : 'Next &rarr;'}
                    </button>
                </div>
            `;

            contentDiv.innerHTML = html;
        }

        function selectOption(index) {
            userAnswers[currentQuestionIndex] = index;
            // Re-render to show selection state (or just toggle class for performance, but re-render is safer for state sync)
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            // Calculate Score
            let correctCount = 0;
            questions.forEach((q, i) => {
                if (userAnswers[i] === q.correct) correctCount++;
            });

            const score = Math.round((correctCount / questions.length) * 100);
            const passed = score >= 83; // Approx 750/900
            progressBar.style.width = '100%';

            let html = `
                <div class="results">
                    <div class="score-card">
                        <div class="subtitle">EXAM RESULTS</div>
                        <div class="score-number">${score}</div>
                        <div class="subtitle">SCORE / 100</div>
                        <div class="pass-fail ${passed ? 'pass' : 'fail'}">
                            ${passed ? 'PASS' : 'FAIL'}
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-number">${correctCount}</div>
                            <div class="stat-label">Correct</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${questions.length - correctCount}</div>
                            <div class="stat-label">Incorrect</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${questions.length}</div>
                            <div class="stat-label">Total Questions</div>
                        </div>
                    </div>

                    <div class="subtitle" style="margin-bottom: 20px;">Review Answers</div>

                    ${questions.map((q, i) => {
                        const userAnswer = userAnswers[i];
                        const isCorrect = userAnswer === q.correct;
                        const labelUser = String.fromCharCode(65 + userAnswer);
                        const labelCorrect = String.fromCharCode(65 + q.correct);

                        return `
                            <div class="review-question ${isCorrect ? 'correct' : 'incorrect'}">
                                <div class="review-header">
                                    <span>Question ${i + 1}</span>
                                    <span class="review-status ${isCorrect ? 'correct' : 'incorrect'}">
                                        ${isCorrect ? 'CORRECT' : 'INCORRECT'}
                                    </span>
                                </div>
                                <div class="review-text">${q.q}</div>

                                <div class="review-answers">
                                    <div class="answer-line">
                                        <strong>Your Answer:</strong>
                                        <span style="color: ${isCorrect ? 'var(--accent)' : 'var(--accent-red)'}">
                                            ${labelUser}. ${q.options[userAnswer]}
                                        </span>
                                    </div>
                                    <div class="answer-line">
                                        <strong>Correct Answer:</strong>
                                        <span style="color: var(--accent)">
                                            ${labelCorrect}. ${q.options[q.correct]}
                                        </span>
                                    </div>
                                </div>

                                <div class="explanation">
                                    <div class="explanation-title">Explanation</div>
                                    ${q.explanation}
                                </div>
                            </div>
                        `;
                    }).join('')}

                    <div style="text-align: center; margin-top: 40px;">
                        <button class="btn btn-primary" onclick="location.reload()" style="display: inline-flex;">
                            Retake Exam
                        </button>
                    </div>
                </div>
            `;

            contentDiv.innerHTML = html;
            window.scrollTo(0,0);
        }

        // Start
        init();
    </script>
</body>
</html>
