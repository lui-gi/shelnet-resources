<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelnet Quiz</title>
    <style>
        :root {
            --bg:           #000000;
            --text-90:      rgba(255, 255, 255, 0.90);
            --text-70:      rgba(255, 255, 255, 0.70);
            --text-45:      rgba(255, 255, 255, 0.45);
            --text-30:      rgba(255, 255, 255, 0.30);
            --rule:         rgba(255, 255, 255, 0.15);
            --accent:       #38bdf8; /* Default — overridden per-quiz via ACCENT_HEX */
            --accent-tint:  rgba(56, 189, 248, 0.14); /* selected-row */
            --accent-hover: rgba(56, 189, 248, 0.08); /* hover-row */
            --pass-green:   #43c08c;
            --wrong-red:    #fb7185;
            --font-mono:    'Courier New', Courier, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { background: var(--bg); }

        body {
            font-family: var(--font-mono);
            color: var(--text-90);
            min-height: 100vh;
            padding: 32px 0 48px;
            line-height: 1.5;
            font-size: 15px;
        }

        ::selection {
            background: var(--accent-tint);
            color: #fff;
        }

        .col {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* --- Header --- */
        .title-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 24px;
            color: var(--text-90);
        }

        .title-row .meta {
            color: var(--text-45);
            font-size: 13px;
        }

        .rule {
            border-top: 1px solid var(--rule);
            margin: 12px 0 0;
        }

        .progress {
            height: 2px;
            background: rgba(255, 255, 255, 0.06);
            margin-top: 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.25s ease;
        }

        /* --- Question --- */
        .content { margin-top: 32px; }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 4px 24px;
            color: var(--text-70);
            font-size: 13px;
        }

        .q-header .count { color: var(--accent); }
        .q-header .domain { color: var(--text-45); }

        .stem {
            color: var(--text-90);
            font-size: 17px;
            line-height: 1.6;
            margin: 24px 0 32px;
        }

        .options { display: flex; flex-direction: column; gap: 2px; }

        .option {
            display: flex;
            align-items: baseline;
            gap: 18px;
            padding: 10px 12px;
            cursor: pointer;
            background: transparent;
            border: 0;
            color: var(--text-90);
            font: inherit;
            text-align: left;
            width: 100%;
            transition: background-color 0.12s ease;
        }

        .option:hover { background: var(--accent-hover); }
        .option.selected { background: var(--accent-tint); }

        .option .label {
            color: var(--text-45);
            min-width: 1.5ch;
        }

        .option.selected .label { color: var(--accent); }

        .option .text { flex: 1; }

        /* --- Footer hints --- */
        .hints {
            margin-top: 32px;
            color: var(--text-45);
            font-size: 13px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 18px;
        }

        .hints .key { color: var(--accent); margin-right: 4px; }
        .hints .verb { color: var(--text-90); }
        .hints .verb:hover { text-decoration: underline; }
        .hints .verb.disabled { color: var(--text-30); cursor: not-allowed; }
        .hints .verb.disabled:hover { text-decoration: none; }

        button.verb {
            background: transparent;
            border: 0;
            font: inherit;
            padding: 0;
            cursor: pointer;
        }

        /* --- Results --- */
        .results-heading {
            color: var(--text-70);
            font-size: 15px;
            margin-bottom: 0;
        }

        .score-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 28px;
            margin-top: 28px;
            align-items: baseline;
        }

        .score-row .label { color: var(--text-45); }
        .score-row .score-val { color: var(--text-90); }
        .score-row .verdict-pass { color: var(--pass-green); }
        .score-row .verdict-fail { color: var(--wrong-red); }
        .score-row .threshold   { color: var(--text-45); }

        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 36px;
            margin-top: 16px;
            align-items: baseline;
        }

        .stats-row .stat-label { color: var(--text-45); margin-right: 8px; }
        .stats-row .stat-val   { color: var(--text-90); }

        .review-heading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-70);
            margin: 36px 0 16px;
        }

        .review-heading .dashes {
            color: var(--text-30);
            flex: 1;
            border-top: 1px solid var(--rule);
            margin-left: 4px;
            transform: translateY(1px);
        }

        .review-q {
            border-left: 2px solid var(--text-30);
            padding: 0 0 8px 14px;
            margin-bottom: 20px;
        }

        .review-q.correct   { border-left-color: var(--accent); }
        .review-q.incorrect { border-left-color: var(--wrong-red); }

        .review-q .status {
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-70);
        }

        .review-q .status .glyph-correct   { color: var(--accent); margin: 0 8px; }
        .review-q .status .glyph-incorrect { color: var(--wrong-red); margin: 0 8px; }
        .review-q .status .verdict.correct   { color: var(--accent); }
        .review-q .status .verdict.incorrect { color: var(--wrong-red); }

        .review-q .stem-mini {
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 10px;
            line-height: 1.55;
        }

        .review-q .ans-line {
            display: grid;
            grid-template-columns: 18ch 1fr;
            gap: 4px 8px;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .review-q .ans-line .ans-label { color: var(--text-45); }
        .review-q .ans-line.right .ans-val { color: var(--accent); }
        .review-q .ans-line.wrong .ans-val { color: var(--wrong-red); }
        .review-q .ans-line.skipped .ans-val { color: var(--text-45); }

        .review-q .explanation {
            margin-top: 10px;
            color: var(--text-70);
            font-size: 14px;
            line-height: 1.55;
        }

        .review-q .explanation .arrow { color: var(--accent); margin-right: 6px; }

        .retake-row {
            margin-top: 36px;
            text-align: center;
            color: var(--text-90);
        }

        .retake-row .key { color: var(--accent); margin-right: 4px; }
        .retake-row button.verb:hover { text-decoration: underline; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--accent); }
        * { scrollbar-width: thin; scrollbar-color: var(--accent) #000; }

        /* Mobile */
        @media (max-width: 600px) {
            .col { padding: 0 24px; }
            .stem { font-size: 16px; }
            body { font-size: 14px; padding: 24px 0 36px; }
            .review-q .ans-line { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="col">
        <div class="title-row">
            <span id="quizTitle">quiz</span>
            <span class="meta" id="quizMeta">— · — · 0q</span>
        </div>
        <div class="rule"></div>
        <div class="progress"><div class="progress-fill" id="progressBar"></div></div>

        <div class="content" id="examContent"></div>
    </div>

    <script>
        // ============================================================
        // QUIZ CONFIG — edit this block when deriving a new quiz.
        // Leave the rest of this file unchanged.
        // ============================================================
        const QUIZ_TITLE    = "practice quiz 2.1";
        const QUIZ_SUBTITLE = "cysa-plus · obj 2.1";
        const ACCENT_HEX    = "#22d3ee";

        const questions = [
            {
                q: "A vulnerability analyst needs to enumerate all active IP addresses and open ports across a flat /16 enterprise network before scheduling a credentialed scan. Which asset-discovery technique BEST meets this requirement?",
                options: ["Map scan using Nmap to sweep the subnet and fingerprint live hosts", "Passive network tap to capture traffic and infer host presence", "Agent-based poll that queries each endpoint for its IP and open ports", "DNS zone transfer to collect all registered hostnames in the domain"],
                correct: 0,
                domain: "Vulnerability Management",
                explanation: "A map scan (Nmap host discovery + port sweep) is the standard active asset-discovery technique for enumerating live hosts and open ports. Passive taps (2) miss silent hosts; agent polling (3) requires agents pre-installed; DNS zone transfers (4) return names, not real-time port state."
            },
            {
                q: "A security team is scheduling recurring vulnerability scans for a 24/7 e-commerce platform. The application owner warns that intensive scans have previously caused page-load degradation during peak hours. Which scheduling consideration MOST directly addresses this concern?",
                options: ["Run scans only during low-traffic maintenance windows to limit performance impact", "Use non-credentialed scans exclusively to reduce authentication overhead", "Increase scan frequency to reduce per-scan depth and duration", "Switch to agent-based scanning so network bandwidth is not consumed"],
                correct: 0,
                domain: "Vulnerability Management",
                explanation: "Scheduling scans during low-traffic maintenance windows directly reduces the risk of user-facing performance degradation. Non-credentialed scans (2) reduce findings quality, not necessarily bandwidth; increasing frequency (3) actually increases total load; agent-based scanning (4) moves CPU load to the endpoint but does not eliminate network scans."
            },
            {
                q: "An analyst discovers that several OT sensors in a manufacturing facility cannot tolerate aggressive network probes because even brief packet floods have caused sensor resets in the past. Which scanning approach BEST protects operational continuity?",
                options: ["Non-credentialed external scan from a DMZ jump host", "Passive vulnerability identification by monitoring network traffic without sending probes", "Credentialed scan with throttled bandwidth settings", "SCADA-protocol-aware active scan during scheduled downtime"],
                correct: 1,
                domain: "Vulnerability Management",
                explanation: "Passive scanning monitors existing traffic to infer vulnerabilities without transmitting probe packets, eliminating the risk of triggering sensor resets. Credentialed or active scans (A, C, D) all send traffic to the target, which is dangerous for sensitive OT/ICS/SCADA devices."
            },
            {
                q: "A compliance auditor requires evidence that internal systems are assessed from a perspective equivalent to a malicious insider. Which scan configuration BEST satisfies this requirement?",
                options: ["External non-credentialed scan launched from an internet-facing host", "Passive network monitoring deployed at the perimeter firewall", "Internal credentialed scan using domain service accounts to simulate insider access", "Web application DAST scan targeting only internet-exposed endpoints"],
                correct: 2,
                domain: "Vulnerability Management",
                explanation: "An internal credentialed scan uses authenticated domain accounts from inside the network, simulating what a malicious insider with standard access could enumerate. External scans (1) model an outside attacker; passive monitoring (2) does not actively probe; DAST (4) is scoped to web apps only."
            },
            {
                q: "A security engineer is evaluating a new web application before it goes to production. The team wants to discover vulnerabilities that only appear while the application is executing, such as runtime injection flaws. Which assessment technique is MOST appropriate?",
                options: ["SAST analysis of the source code repository before compilation", "SCA scan of the dependency manifest to identify vulnerable libraries", "DAST scan against the running application in a staging environment", "Credentialed network vulnerability scan against the application server"],
                correct: 2,
                domain: "Vulnerability Management",
                explanation: "DAST (Dynamic Application Security Testing) interacts with the running application and can discover runtime flaws like injection and authentication bypass that are invisible in static code. SAST (1) analyzes source without execution; SCA (2) checks library versions; a credentialed network scan (4) finds OS/service vulnerabilities, not web app logic flaws."
            },
            {
                q: "A vulnerability team discovers that a network segment hosting payment processing servers is governed by PCI DSS. The team must ensure scan coverage meets the standard's requirements. Which consideration is MOST directly imposed by this regulatory requirement?",
                options: ["Quarterly external scans performed by an Approved Scanning Vendor (ASV)", "Daily agent-based scans installed on every cardholder data environment host", "Passive-only scanning to avoid impacting transaction throughput", "SAST reviews of all payment application code every 90 days"],
                correct: 0,
                domain: "Vulnerability Management",
                explanation: "PCI DSS requires quarterly external vulnerability scans conducted by an ASV, along with internal scans after significant changes. Daily agent scans (2) and passive-only scanning (3) are not PCI DSS mandates; SAST code reviews (4) address secure development but are not the external scanning requirement."
            },
            {
                q: "During a credentialed scan of Windows servers, the scanner returns significantly more findings than a non-credentialed scan of the same targets. A junior analyst asks why the gap is so large. What is the BEST explanation?",
                options: ["Credentialed scans authenticate to the host and enumerate installed software, patches, and registry settings that are invisible to unauthenticated probes", "Credentialed scans generate more network traffic, which causes more IDS alerts to be logged as findings", "Non-credentialed scans skip banner-grabbing, causing them to miss open ports entirely", "Credentialed scans run at higher privilege and can trigger false positives by accessing sensitive files"],
                correct: 0,
                domain: "Vulnerability Management",
                explanation: "Credentialed scans log into the host (e.g., using local admin or domain credentials) and can read installed software lists, registry keys, and patch levels, revealing far more vulnerabilities than banner-grabbing. The other options mischaracterize how non-credentialed (B, C) and credentialed (4) scanning work."
            },
            {
                q: "A security team is deploying vulnerability scanning to 3,000 laptops that spend most of their time off-premises and connect intermittently via VPN. Which scanning deployment model BEST ensures continuous coverage regardless of network location?",
                options: ["Scheduled network scan from a centralized on-premises scanner targeting RFC 1918 addresses", "Agent-based scanning with a lightweight endpoint agent that reports to a cloud console", "External non-credentialed scan from an internet-facing scanner targeting public IPs", "Passive network tap at the VPN concentrator to intercept laptop traffic during sessions"],
                correct: 1,
                domain: "Vulnerability Management",
                explanation: "Agent-based scanning installs a lightweight sensor on each endpoint that scans locally and reports results regardless of network location, ensuring off-premises laptops are never missed. A centralized network scanner (1) cannot reach laptops when they are off VPN; external scans (3) only see public NAT addresses; passive taps (4) only capture data during VPN sessions."
            },
            {
                q: "An analyst configures Nessus to perform a security baseline scan against a group of Linux servers. Which CIS benchmark document provides the configuration checks MOST aligned with this goal?",
                options: ["OWASP Application Security Verification Standard (ASVS)", "ISO/IEC 27001 Annex A control checklist", "CIS Benchmark for the specific Linux distribution (e.g., CIS Ubuntu Linux Benchmark)", "NIST SP 800-53 security control catalog"],
                correct: 2,
                domain: "Vulnerability Management",
                explanation: "CIS Benchmarks are OS-specific hardening guides that map directly to security baseline scans (e.g., Nessus ships CIS policy audits). OWASP ASVS (1) is for web applications; ISO 27001 Annex A (2) is a management-level control list; NIST SP 800-53 (4) is a federal control catalog, not an OS baseline."
            },
            {
                q: "A penetration tester is asked to assess a web application for OWASP Top 10 vulnerabilities before an upcoming public launch. The team has source code access. Which combination of assessment types provides the MOST comprehensive coverage?",
                options: ["SAST alone, because source code analysis finds all possible vulnerabilities", "DAST alone, because runtime testing reflects the actual attack surface", "Credentialed network scan plus passive traffic analysis", "SAST combined with DAST to catch both code-level and runtime vulnerabilities"],
                correct: 3,
                domain: "Vulnerability Management",
                explanation: "Combining SAST (static analysis of source code) with DAST (dynamic testing of the running app) provides the broadest coverage: SAST finds logic and coding flaws; DAST uncovers runtime and configuration issues. Neither alone (A, B) is as comprehensive; a credentialed network scan plus passive analysis (3) misses web application logic flaws."
            },
            {
                q: "A vulnerability scanner reports a critical finding on a segmented industrial control system network. The security team confirms there is no routable path from the corporate network to the ICS segment. How should this segmentation fact MOST affect the vulnerability's priority?",
                options: ["The vulnerability should be treated as critical regardless of segmentation because ICS devices are always high-value targets", "The finding should be deleted from the scan report since the scanner cannot reach the host", "The vulnerability should be escalated immediately because segmented networks indicate a compliance violation", "The vulnerability's priority should be reduced because network segmentation functions as a compensating control that limits reachability"],
                correct: 3,
                domain: "Vulnerability Management",
                explanation: "Segmentation is a compensating control that reduces the exploitability of a vulnerability by limiting attacker access paths. Priority is context-aware: a critical CVE on an isolated host is lower risk than the same CVE on an internet-facing host. Ignoring segmentation (1) inflates risk; deleting findings (2) loses auditability; segmentation is not a compliance violation (3)."
            },
            {
                q: "During an SCA scan review, a security engineer notices the tool flagged a transitive dependency three levels deep in a Node.js application's dependency tree with a known critical CVE. The library is never directly imported by application code. Which action BEST addresses this finding?",
                options: ["Dismiss the finding because transitive dependencies cannot be exploited", "Update the direct dependency that pulls in the vulnerable transitive package to a version that resolves it", "Remove the entire Node.js application and rewrite it without third-party libraries", "Apply a WAF rule to block all requests to the application until the library is patched"],
                correct: 1,
                domain: "Vulnerability Management",
                explanation: "Transitive dependencies can absolutely be exploited (A is wrong). The correct fix is to upgrade the direct dependency to a version that resolves or removes the vulnerable transitive package. Rewriting the application (3) is disproportionate; a WAF rule (4) is a broad compensating control that does not remediate the root cause."
            },
            {
                q: "An analyst is comparing active vs. passive vulnerability scanning for a healthcare network with strict uptime requirements. Which statement MOST accurately distinguishes the two approaches?",
                options: ["Active scanning requires agent installation on every host, while passive scanning uses network-based probes", "Passive scanning is more accurate than active scanning because it reads actual exploit attempts in real time", "Active scanning can only test internet-facing hosts, while passive scanning covers internal hosts", "Active scanning sends probe packets to targets and can detect current patch levels, while passive scanning observes existing traffic without sending probes"],
                correct: 3,
                domain: "Vulnerability Management",
                explanation: "Active scanning sends crafted probe packets to elicit responses and detect host state; passive scanning analyzes existing traffic without generating probes. The other choices (A, B, C) mischaracterize both methods: agents are an active variant but not required (1); passive does not read exploit attempts (2); active scans can target internal hosts (3)."
            },
            {
                q: "A company must demonstrate vulnerability scan compliance for both internal hosts and externally facing assets. The security team plans to run separate scans from an internal scanner and an external scanner. What is the PRIMARY reason for using both vantage points?",
                options: ["Internal and external scans use different vulnerability databases, so running both increases database coverage", "An internal scan reveals vulnerabilities visible from inside the network, while an external scan reveals what an internet-based attacker can see", "External scans require regulatory approval, so an internal scan bypasses compliance overhead", "Running two scans halves the scan duration by dividing the target list between scanners"],
                correct: 1,
                domain: "Vulnerability Management",
                explanation: "Internal and external scanning provide two different attack-perspective views: internal mimics an insider or post-breach attacker, external mimics an internet-based attacker and reveals firewall/NAT exposure. Different databases (1) are not the primary reason; regulatory approval (3) is backwards; splitting targets (4) is not the purpose of dual vantage points."
            },
            {
                q: "A vulnerability analyst is integrating threat feed data into the scanning workflow. A newly published threat feed entry indicates that a specific vulnerability is actively being exploited in the wild. How should this intelligence MOST influence the scanning schedule?",
                options: ["Wait for the next scheduled monthly scan to include the new plugin", "Remove all other findings from the scan queue to focus exclusively on the active exploit", "Trigger an out-of-cycle targeted scan for that specific CVE across all in-scope hosts immediately", "Disable scanning for the affected hosts to prevent the scanner from accidentally triggering the exploit"],
                correct: 2,
                domain: "Vulnerability Management",
                explanation: "Active exploitation intelligence justifies an immediate out-of-cycle targeted scan to identify exposed hosts before threat actors can reach them. Waiting for monthly scans (1) leaves a dangerous gap; removing other findings (2) is not operationally sound; disabling scans (4) is counterproductive and does not reduce risk."
            }
        ];

        // ============================================================
        // END CONFIG — chrome below is shared. Do not edit when deriving.
        // ============================================================

        function hexToRgba(hex, alpha) {
            const h = hex.replace('#', '');
            const r = parseInt(h.substring(0, 2), 16);
            const g = parseInt(h.substring(2, 4), 16);
            const b = parseInt(h.substring(4, 6), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // --- APP STATE ---
        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let onResults = false;

        // --- DOM ---
        const contentDiv = document.getElementById('examContent');
        const progressBar = document.getElementById('progressBar');

        // --- INIT ---
        function init() {
            document.title = QUIZ_TITLE;
            document.getElementById('quizTitle').textContent = QUIZ_TITLE;
            document.getElementById('quizMeta').textContent =
                `${QUIZ_SUBTITLE} · ${questions.length}q`;
            document.documentElement.style.setProperty('--accent', ACCENT_HEX);
            document.documentElement.style.setProperty('--accent-tint',  hexToRgba(ACCENT_HEX, 0.14));
            document.documentElement.style.setProperty('--accent-hover', hexToRgba(ACCENT_HEX, 0.08));
            renderQuestion();
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // --- RENDER ---
        function renderQuestion() {
            onResults = false;
            const q = questions[currentQuestionIndex];
            const isLast = currentQuestionIndex === questions.length - 1;
            const isFirst = currentQuestionIndex === 0;
            const picked = userAnswers[currentQuestionIndex];

            progressBar.style.width = `${(currentQuestionIndex / questions.length) * 100}%`;

            const optionsHtml = q.options.map((opt, i) => `
                <button type="button"
                        class="option ${picked === i ? 'selected' : ''}"
                        onclick="selectOption(${i})">
                    <span class="label">${i + 1}</span>
                    <span class="text">${escapeHtml(opt)}</span>
                </button>
            `).join('');

            const prevHtml = isFirst
                ? ''
                : `<button type="button" class="verb" onclick="prevQuestion()"><span class="key">&larr;</span>prev</button>`;

            const nextLabel = isLast ? 'finish' : 'next';
            const nextEnabled = picked !== null;
            const nextHtml = nextEnabled
                ? `<button type="button" class="verb" onclick="nextQuestion()"><span class="key">&#x21B5;</span>${nextLabel}</button>`
                : `<span class="verb disabled"><span class="key">&#x21B5;</span>${nextLabel}</span>`;

            contentDiv.innerHTML = `
                <div class="q-header">
                    <span class="count">question ${currentQuestionIndex + 1} of ${questions.length}</span>
                    <span class="domain">[ ${escapeHtml(q.domain.toLowerCase())} ]</span>
                </div>

                <div class="stem">${escapeHtml(q.q)}</div>

                <div class="options">${optionsHtml}</div>

                <div class="hints">
                    <span><span class="key">1-${q.options.length}</span>select</span>
                    ${prevHtml ? `<span>${prevHtml}</span>` : ''}
                    <span>${nextHtml}</span>
                </div>
            `;
        }

        function selectOption(i) {
            userAnswers[currentQuestionIndex] = i;
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (userAnswers[currentQuestionIndex] === null) return;
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            onResults = true;
            let correctCount = 0;
            questions.forEach((q, i) => { if (userAnswers[i] === q.correct) correctCount++; });
            const score = Math.round((correctCount / questions.length) * 100);
            const passed = score >= 83;
            progressBar.style.width = '100%';

            const reviewHtml = questions.map((q, i) => {
                const userAnswer = userAnswers[i];
                const skipped = userAnswer === null;
                const isCorrect = !skipped && userAnswer === q.correct;
                const userLabel = skipped ? '—' : `${userAnswer + 1}  ${escapeHtml(q.options[userAnswer])}`;
                const correctLabel = `${q.correct + 1}  ${escapeHtml(q.options[q.correct])}`;
                const statusGlyph = isCorrect
                    ? `<span class="glyph-correct">&#x2713;</span><span class="verdict correct">correct</span>`
                    : `<span class="glyph-incorrect">&#x2717;</span><span class="verdict incorrect">${skipped ? 'skipped' : 'incorrect'}</span>`;
                const yourLineClass = skipped ? 'skipped' : (isCorrect ? 'right' : 'wrong');
                return `
                    <div class="review-q ${isCorrect ? 'correct' : 'incorrect'}">
                        <div class="status">Q.${i + 1}${statusGlyph}</div>
                        <div class="stem-mini">${escapeHtml(q.q)}</div>
                        <div class="ans-line ${yourLineClass}">
                            <span class="ans-label">your answer:</span>
                            <span class="ans-val">${userLabel}</span>
                        </div>
                        <div class="ans-line right">
                            <span class="ans-label">correct answer:</span>
                            <span class="ans-val">${correctLabel}</span>
                        </div>
                        <div class="explanation"><span class="arrow">&rsaquo;</span>${escapeHtml(q.explanation)}</div>
                    </div>
                `;
            }).join('');

            contentDiv.innerHTML = `
                <div class="results-heading">results</div>

                <div class="score-row">
                    <span><span class="label">score</span> <span class="score-val">${score} / 100</span></span>
                    <span class="${passed ? 'verdict-pass' : 'verdict-fail'}">${passed ? 'pass' : 'fail'}</span>
                    <span class="threshold">(&ge; 83 to pass)</span>
                </div>

                <div class="stats-row">
                    <span><span class="stat-label">correct</span><span class="stat-val">${correctCount}</span></span>
                    <span><span class="stat-label">incorrect</span><span class="stat-val">${questions.length - correctCount}</span></span>
                    <span><span class="stat-label">total</span><span class="stat-val">${questions.length}</span></span>
                </div>

                <div class="review-heading">review<span class="dashes"></span></div>

                ${reviewHtml}

                <div class="retake-row">
                    <button type="button" class="verb" onclick="location.reload()"><span class="key">&#x21B5;</span>retake</button>
                </div>
            `;
            window.scrollTo(0, 0);
        }

        // --- KEYBOARD ---
        window.addEventListener('keydown', (e) => {
            const tag = document.activeElement && document.activeElement.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA') return;

            if (onResults) {
                if (e.key === 'Enter') { e.preventDefault(); location.reload(); }
                return;
            }

            if (/^[1-9]$/.test(e.key)) {
                const i = Number(e.key) - 1;
                const q = questions[currentQuestionIndex];
                if (i < q.options.length) { e.preventDefault(); selectOption(i); }
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault(); prevQuestion();
            } else if (e.key === 'ArrowRight' || e.key === 'Enter') {
                e.preventDefault(); nextQuestion();
            }
        });

        init();
    </script>
</body>
</html>
