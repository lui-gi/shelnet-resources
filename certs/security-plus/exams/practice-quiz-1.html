<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelnet Quiz</title>
    <style>
        :root {
            --bg:           #000000;
            --text-90:      rgba(255, 255, 255, 0.90);
            --text-70:      rgba(255, 255, 255, 0.70);
            --text-45:      rgba(255, 255, 255, 0.45);
            --text-30:      rgba(255, 255, 255, 0.30);
            --rule:         rgba(255, 255, 255, 0.15);
            --accent:       #38bdf8; /* Default — overridden per-quiz via ACCENT_HEX */
            --accent-tint:  rgba(56, 189, 248, 0.14); /* selected-row */
            --accent-hover: rgba(56, 189, 248, 0.08); /* hover-row */
            --pass-green:   #43c08c;
            --wrong-red:    #fb7185;
            --font-mono:    'Courier New', Courier, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { background: var(--bg); }

        body {
            font-family: var(--font-mono);
            color: var(--text-90);
            min-height: 100vh;
            padding: 32px 0 48px;
            line-height: 1.5;
            font-size: 15px;
        }

        ::selection {
            background: var(--accent-tint);
            color: #fff;
        }

        .col {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* --- Header --- */
        .title-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 24px;
            color: var(--text-90);
        }

        .title-row .meta {
            color: var(--text-45);
            font-size: 13px;
        }

        .rule {
            border-top: 1px solid var(--rule);
            margin: 12px 0 0;
        }

        .progress {
            height: 2px;
            background: rgba(255, 255, 255, 0.06);
            margin-top: 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.25s ease;
        }

        /* --- Question --- */
        .content { margin-top: 32px; }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 4px 24px;
            color: var(--text-70);
            font-size: 13px;
        }

        .q-header .count { color: var(--accent); }
        .q-header .domain { color: var(--text-45); }

        .stem {
            color: var(--text-90);
            font-size: 17px;
            line-height: 1.6;
            margin: 24px 0 32px;
        }

        .options { display: flex; flex-direction: column; gap: 2px; }

        .option {
            display: flex;
            align-items: baseline;
            gap: 18px;
            padding: 10px 12px;
            cursor: pointer;
            background: transparent;
            border: 0;
            color: var(--text-90);
            font: inherit;
            text-align: left;
            width: 100%;
            transition: background-color 0.12s ease;
        }

        .option:hover { background: var(--accent-hover); }
        .option.selected { background: var(--accent-tint); }

        .option .label {
            color: var(--text-45);
            min-width: 1.5ch;
        }

        .option.selected .label { color: var(--accent); }

        .option .text { flex: 1; }

        /* --- Footer hints --- */
        .hints {
            margin-top: 32px;
            color: var(--text-45);
            font-size: 13px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 18px;
        }

        .hints .key { color: var(--accent); margin-right: 4px; }
        .hints .verb { color: var(--text-90); }
        .hints .verb:hover { text-decoration: underline; }
        .hints .verb.disabled { color: var(--text-30); cursor: not-allowed; }
        .hints .verb.disabled:hover { text-decoration: none; }

        button.verb {
            background: transparent;
            border: 0;
            font: inherit;
            padding: 0;
            cursor: pointer;
        }

        /* --- Results --- */
        .results-heading {
            color: var(--text-70);
            font-size: 15px;
            margin-bottom: 0;
        }

        .score-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 28px;
            margin-top: 28px;
            align-items: baseline;
        }

        .score-row .label { color: var(--text-45); }
        .score-row .score-val { color: var(--text-90); }
        .score-row .verdict-pass { color: var(--pass-green); }
        .score-row .verdict-fail { color: var(--wrong-red); }
        .score-row .threshold   { color: var(--text-45); }

        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 36px;
            margin-top: 16px;
            align-items: baseline;
        }

        .stats-row .stat-label { color: var(--text-45); margin-right: 8px; }
        .stats-row .stat-val   { color: var(--text-90); }

        .review-heading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-70);
            margin: 36px 0 16px;
        }

        .review-heading .dashes {
            color: var(--text-30);
            flex: 1;
            border-top: 1px solid var(--rule);
            margin-left: 4px;
            transform: translateY(1px);
        }

        .review-q {
            border-left: 2px solid var(--text-30);
            padding: 0 0 8px 14px;
            margin-bottom: 20px;
        }

        .review-q.correct   { border-left-color: var(--accent); }
        .review-q.incorrect { border-left-color: var(--wrong-red); }

        .review-q .status {
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-70);
        }

        .review-q .status .glyph-correct   { color: var(--accent); margin: 0 8px; }
        .review-q .status .glyph-incorrect { color: var(--wrong-red); margin: 0 8px; }
        .review-q .status .verdict.correct   { color: var(--accent); }
        .review-q .status .verdict.incorrect { color: var(--wrong-red); }

        .review-q .stem-mini {
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 10px;
            line-height: 1.55;
        }

        .review-q .ans-line {
            display: grid;
            grid-template-columns: 18ch 1fr;
            gap: 4px 8px;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .review-q .ans-line .ans-label { color: var(--text-45); }
        .review-q .ans-line.right .ans-val { color: var(--accent); }
        .review-q .ans-line.wrong .ans-val { color: var(--wrong-red); }
        .review-q .ans-line.skipped .ans-val { color: var(--text-45); }

        .review-q .explanation {
            margin-top: 10px;
            color: var(--text-70);
            font-size: 14px;
            line-height: 1.55;
        }

        .review-q .explanation .arrow { color: var(--accent); margin-right: 6px; }

        .retake-row {
            margin-top: 36px;
            text-align: center;
            color: var(--text-90);
        }

        .retake-row .key { color: var(--accent); margin-right: 4px; }
        .retake-row button.verb:hover { text-decoration: underline; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--accent); }
        * { scrollbar-width: thin; scrollbar-color: var(--accent) #000; }

        /* Mobile */
        @media (max-width: 600px) {
            .col { padding: 0 24px; }
            .stem { font-size: 16px; }
            body { font-size: 14px; padding: 24px 0 36px; }
            .review-q .ans-line { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="col">
        <div class="title-row">
            <span id="quizTitle">quiz</span>
            <span class="meta" id="quizMeta">— · — · 0q</span>
        </div>
        <div class="rule"></div>
        <div class="progress"><div class="progress-fill" id="progressBar"></div></div>

        <div class="content" id="examContent"></div>
    </div>

    <script>
        // ============================================================
        // QUIZ CONFIG — edit this block when deriving a new quiz.
        // Leave the rest of this file unchanged.
        // ============================================================
        const QUIZ_TITLE    = 'practice quiz 1.1';
        const QUIZ_SUBTITLE = 'sec-plus · obj 1.1';
        const ACCENT_HEX    = '#38bdf8';

        const questions = [
            {
                "q": "A security administrator is configuring a firewall to automatically block traffic from IP addresses known to be associated with botnets. Which of the following best describes this control function?",
                "options": [
                    "Detective",
                    "Deterrent",
                    "Preventive",
                    "Corrective"
                ],
                "correct": 2,
                "domain": "Security Controls",
                "explanation": "Correct: Preventive controls attempt to stop a security incident from occurring. A firewall blocking malicious traffic is a classic example of a technical preventive control as it actively stops the threat."
            },
            {
                "q": "An organization has a legacy application running on an old operating system that cannot be patched due to vendor constraints. To mitigate the risk, the security team isolates the server on a separate VLAN with strict access control lists (ACLs). This is an example of which type of control?",
                "options": [
                    "Compensating",
                    "Directive",
                    "Operational",
                    "Detective"
                ],
                "correct": 0,
                "domain": "Security Controls",
                "explanation": "Correct: Compensating controls provide an alternative measure of security when the primary control (in this case, patching the OS) is not feasible or effective."
            },
            {
                "q": "After a recent data breach, a company updates its Disaster Recovery Plan (DRP) to ensure data can be restored more quickly in the future. Creating and updating this plan falls under which control category?",
                "options": [
                    "Managerial",
                    "Technical",
                    "Physical",
                    "Operational"
                ],
                "correct": 0,
                "domain": "Security Controls",
                "explanation": "Correct: Managerial (or Administrative) controls involve the policies, procedures, and planning that govern security, such as risk management and disaster recovery planning."
            },
            {
                "q": "A Chief Information Security Officer (CISO) implements a new rule requiring all employees to undergo annual phishing awareness training. Which category of control does this training represent?",
                "options": [
                    "Operational",
                    "Physical",
                    "Detective",
                    "Technical"
                ],
                "correct": 0,
                "domain": "Security Controls",
                "explanation": "Correct: Operational controls are people-centric and include day-to-day methods like security awareness training and physical media protection."
            },
            {
                "q": "A data center installs motion sensors and security cameras at all entrances. The security team reviews the footage only after an alarm is triggered. In this scenario, how are the cameras primarily functioning?",
                "options": [
                    "Corrective",
                    "Compensating",
                    "Preventive",
                    "Detective"
                ],
                "correct": 3,
                "domain": "Security Controls",
                "explanation": "Correct: Since the footage is reviewed after an event to investigate what happened, the cameras are serving as a detective control."
            },
            {
                "q": "A company places signs around its perimeter stating '24-Hour Surveillance' and 'Trespassers Will Be Prosecuted.' The primary goal of these signs is to:",
                "options": [
                    "Correct",
                    "Prevent",
                    "Detect",
                    "Deter"
                ],
                "correct": 3,
                "domain": "Security Controls",
                "explanation": "Correct: Deterrent controls, such as warning signs, aim to psychologically discourage an attacker from attempting a breach."
            },
            {
                "q": "An organization discovers a server has been infected with ransomware. The IT team immediately disconnects the server from the network and begins restoring data from an offline backup. The restoration from backup is an example of which control type?",
                "options": [
                    "Detective",
                    "Preventive",
                    "Corrective",
                    "Managerial"
                ],
                "correct": 2,
                "domain": "Security Controls",
                "explanation": "Correct: Corrective controls are designed to remediate or restore systems after an incident has occurred. Restoring from backup fixes the data loss."
            },
            {
                "q": "To comply with government regulations, a company writes a new Acceptable Use Policy (AUP) that mandates how employees handle sensitive data. This policy is an example of a:",
                "options": [
                    "Corrective control",
                    "Directive control",
                    "Technical control",
                    "Physical control"
                ],
                "correct": 1,
                "domain": "Security Controls",
                "explanation": "Correct: Directive controls are administrative measures, such as policies and regulations, that specify rules of behavior or mandate specific actions."
            },
            {
                "q": "A secure facility employs a security guard to verify the badges of everyone entering the building. If a badge is invalid, the guard denies entry. The guard is acting as which category of control?",
                "options": [
                    "Managerial",
                    "Physical",
                    "Directive",
                    "Technical"
                ],
                "correct": 1,
                "domain": "Security Controls",
                "explanation": "Correct: Security guards are a physical security control because they protect the physical facility and tangible assets."
            },
            {
                "q": "An administrator installs an Intrusion Detection System (IDS) to monitor network traffic for suspicious signatures. The IDS sends an email alert to the security team when a potential threat is found but does not block the traffic. This is a:",
                "options": [
                    "Technical Preventive control",
                    "Physical Detective control",
                    "Technical Detective control",
                    "Managerial Corrective control"
                ],
                "correct": 2,
                "domain": "Security Controls",
                "explanation": "Correct: It is Technical (implemented via software/hardware) and Detective (it identifies and alerts on events but does not stop them)."
            },
            {
                "q": "A company uses a UPS (Uninterruptible Power Supply) to ensure servers continue running during a short power outage until the backup generators come online. The UPS is acting as a:",
                "options": [
                    "Detective control",
                    "Corrective / Compensating control",
                    "Directive control",
                    "Managerial control"
                ],
                "correct": 1,
                "domain": "Security Controls",
                "explanation": "Correct: In the context of availability, a UPS is often viewed as corrective (remediating the loss of power immediately) or compensating (mitigating the risk of power failure)."
            },
            {
                "q": "To prevent unauthorized users from accessing sensitive files, the IT department implements file permissions that ensure only the 'HR Group' can read salary data. This implementation of permissions is a:",
                "options": [
                    "Corrective control",
                    "Physical control",
                    "Technical control",
                    "Managerial control"
                ],
                "correct": 2,
                "domain": "Security Controls",
                "explanation": "Correct: File permissions (ACLs) are logical mechanisms implemented in the operating system software, making them technical controls."
            },
            {
                "q": "An organization conducts a background check on all potential new employees before offering them a job. This background check is considered a:",
                "options": [
                    "Managerial / Administrative control",
                    "Technical control",
                    "Corrective control",
                    "Physical control"
                ],
                "correct": 0,
                "domain": "Security Controls",
                "explanation": "Correct: Background checks are administrative procedures governed by HR policies to manage personnel risk."
            },
            {
                "q": "A security team implements a policy requiring two distinct administrators to approve any change to the root firewall configuration. This 'Separation of Duties' is primarily a:",
                "options": [
                    "Technical Detective control",
                    "Operational Corrective control",
                    "Managerial Preventive control",
                    "Physical Deterrent control"
                ],
                "correct": 2,
                "domain": "Security Controls",
                "explanation": "Correct: It is Managerial (a policy/procedure) and Preventive (it stops a single person from making unauthorized changes)."
            },
            {
                "q": "A company installs bollards in front of the main entrance to prevent vehicles from ramming into the lobby. This is an example of a:",
                "options": [
                    "Managerial Deterrent control",
                    "Physical Detective control",
                    "Technical Preventive control",
                    "Physical Preventive control"
                ],
                "correct": 3,
                "domain": "Security Controls",
                "explanation": "Correct: Bollards are physical barriers that physically stop vehicles from entering, making them both Physical and Preventive."
            }
        ];

        // ============================================================
        // END CONFIG — chrome below is shared. Do not edit when deriving.
        // ============================================================

        function hexToRgba(hex, alpha) {
            const h = hex.replace('#', '');
            const r = parseInt(h.substring(0, 2), 16);
            const g = parseInt(h.substring(2, 4), 16);
            const b = parseInt(h.substring(4, 6), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // --- APP STATE ---
        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let onResults = false;

        // --- DOM ---
        const contentDiv = document.getElementById('examContent');
        const progressBar = document.getElementById('progressBar');

        // --- INIT ---
        function init() {
            document.title = QUIZ_TITLE;
            document.getElementById('quizTitle').textContent = QUIZ_TITLE;
            document.getElementById('quizMeta').textContent =
                `${QUIZ_SUBTITLE} · ${questions.length}q`;
            document.documentElement.style.setProperty('--accent', ACCENT_HEX);
            document.documentElement.style.setProperty('--accent-tint',  hexToRgba(ACCENT_HEX, 0.14));
            document.documentElement.style.setProperty('--accent-hover', hexToRgba(ACCENT_HEX, 0.08));
            renderQuestion();
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // --- RENDER ---
        function renderQuestion() {
            onResults = false;
            const q = questions[currentQuestionIndex];
            const isLast = currentQuestionIndex === questions.length - 1;
            const isFirst = currentQuestionIndex === 0;
            const picked = userAnswers[currentQuestionIndex];

            progressBar.style.width = `${(currentQuestionIndex / questions.length) * 100}%`;

            const optionsHtml = q.options.map((opt, i) => `
                <button type="button"
                        class="option ${picked === i ? 'selected' : ''}"
                        onclick="selectOption(${i})">
                    <span class="label">${i + 1}</span>
                    <span class="text">${escapeHtml(opt)}</span>
                </button>
            `).join('');

            const prevHtml = isFirst
                ? ''
                : `<button type="button" class="verb" onclick="prevQuestion()"><span class="key">&larr;</span>prev</button>`;

            const nextLabel = isLast ? 'finish' : 'next';
            const nextEnabled = picked !== null;
            const nextHtml = nextEnabled
                ? `<button type="button" class="verb" onclick="nextQuestion()"><span class="key">&#x21B5;</span>${nextLabel}</button>`
                : `<span class="verb disabled"><span class="key">&#x21B5;</span>${nextLabel}</span>`;

            contentDiv.innerHTML = `
                <div class="q-header">
                    <span class="count">question ${currentQuestionIndex + 1} of ${questions.length}</span>
                    <span class="domain">[ ${escapeHtml(q.domain.toLowerCase())} ]</span>
                </div>

                <div class="stem">${escapeHtml(q.q)}</div>

                <div class="options">${optionsHtml}</div>

                <div class="hints">
                    <span><span class="key">1-${q.options.length}</span>select</span>
                    ${prevHtml ? `<span>${prevHtml}</span>` : ''}
                    <span>${nextHtml}</span>
                </div>
            `;
        }

        function selectOption(i) {
            userAnswers[currentQuestionIndex] = i;
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (userAnswers[currentQuestionIndex] === null) return;
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            onResults = true;
            let correctCount = 0;
            questions.forEach((q, i) => { if (userAnswers[i] === q.correct) correctCount++; });
            const score = Math.round((correctCount / questions.length) * 100);
            const passed = score >= 83;
            progressBar.style.width = '100%';

            const reviewHtml = questions.map((q, i) => {
                const userAnswer = userAnswers[i];
                const skipped = userAnswer === null;
                const isCorrect = !skipped && userAnswer === q.correct;
                const userLabel = skipped ? '—' : `${userAnswer + 1}  ${escapeHtml(q.options[userAnswer])}`;
                const correctLabel = `${q.correct + 1}  ${escapeHtml(q.options[q.correct])}`;
                const statusGlyph = isCorrect
                    ? `<span class="glyph-correct">&#x2713;</span><span class="verdict correct">correct</span>`
                    : `<span class="glyph-incorrect">&#x2717;</span><span class="verdict incorrect">${skipped ? 'skipped' : 'incorrect'}</span>`;
                const yourLineClass = skipped ? 'skipped' : (isCorrect ? 'right' : 'wrong');
                return `
                    <div class="review-q ${isCorrect ? 'correct' : 'incorrect'}">
                        <div class="status">Q.${i + 1}${statusGlyph}</div>
                        <div class="stem-mini">${escapeHtml(q.q)}</div>
                        <div class="ans-line ${yourLineClass}">
                            <span class="ans-label">your answer:</span>
                            <span class="ans-val">${userLabel}</span>
                        </div>
                        <div class="ans-line right">
                            <span class="ans-label">correct answer:</span>
                            <span class="ans-val">${correctLabel}</span>
                        </div>
                        <div class="explanation"><span class="arrow">&rsaquo;</span>${escapeHtml(q.explanation)}</div>
                    </div>
                `;
            }).join('');

            contentDiv.innerHTML = `
                <div class="results-heading">results</div>

                <div class="score-row">
                    <span><span class="label">score</span> <span class="score-val">${score} / 100</span></span>
                    <span class="${passed ? 'verdict-pass' : 'verdict-fail'}">${passed ? 'pass' : 'fail'}</span>
                    <span class="threshold">(&ge; 83 to pass)</span>
                </div>

                <div class="stats-row">
                    <span><span class="stat-label">correct</span><span class="stat-val">${correctCount}</span></span>
                    <span><span class="stat-label">incorrect</span><span class="stat-val">${questions.length - correctCount}</span></span>
                    <span><span class="stat-label">total</span><span class="stat-val">${questions.length}</span></span>
                </div>

                <div class="review-heading">review<span class="dashes"></span></div>

                ${reviewHtml}

                <div class="retake-row">
                    <button type="button" class="verb" onclick="location.reload()"><span class="key">&#x21B5;</span>retake</button>
                </div>
            `;
            window.scrollTo(0, 0);
        }

        // --- KEYBOARD ---
        window.addEventListener('keydown', (e) => {
            const tag = document.activeElement && document.activeElement.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA') return;

            if (onResults) {
                if (e.key === 'Enter') { e.preventDefault(); location.reload(); }
                return;
            }

            if (/^[1-9]$/.test(e.key)) {
                const i = Number(e.key) - 1;
                const q = questions[currentQuestionIndex];
                if (i < q.options.length) { e.preventDefault(); selectOption(i); }
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault(); prevQuestion();
            } else if (e.key === 'ArrowRight' || e.key === 'Enter') {
                e.preventDefault(); nextQuestion();
            }
        });

        init();
    </script>
</body>
</html>
