<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelnet Quiz</title>
    <style>
        :root {
            --bg:           #000000;
            --text-90:      rgba(255, 255, 255, 0.90);
            --text-70:      rgba(255, 255, 255, 0.70);
            --text-45:      rgba(255, 255, 255, 0.45);
            --text-30:      rgba(255, 255, 255, 0.30);
            --rule:         rgba(255, 255, 255, 0.15);
            --accent:       #38bdf8; /* Default — overridden per-quiz via ACCENT_HEX */
            --accent-tint:  rgba(56, 189, 248, 0.14); /* selected-row */
            --accent-hover: rgba(56, 189, 248, 0.08); /* hover-row */
            --pass-green:   #43c08c;
            --wrong-red:    #fb7185;
            --font-mono:    'Courier New', Courier, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { background: var(--bg); }

        body {
            font-family: var(--font-mono);
            color: var(--text-90);
            min-height: 100vh;
            padding: 32px 0 48px;
            line-height: 1.5;
            font-size: 15px;
        }

        ::selection {
            background: var(--accent-tint);
            color: #fff;
        }

        .col {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* --- Header --- */
        .title-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 24px;
            color: var(--text-90);
        }

        .title-row .meta {
            color: var(--text-45);
            font-size: 13px;
        }

        .rule {
            border-top: 1px solid var(--rule);
            margin: 12px 0 0;
        }

        .progress {
            height: 2px;
            background: rgba(255, 255, 255, 0.06);
            margin-top: 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.25s ease;
        }

        /* --- Question --- */
        .content { margin-top: 32px; }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 4px 24px;
            color: var(--text-70);
            font-size: 13px;
        }

        .q-header .count { color: var(--accent); }
        .q-header .domain { color: var(--text-45); }

        .stem {
            color: var(--text-90);
            font-size: 17px;
            line-height: 1.6;
            margin: 24px 0 32px;
        }

        .options { display: flex; flex-direction: column; gap: 2px; }

        .option {
            display: flex;
            align-items: baseline;
            gap: 18px;
            padding: 10px 12px;
            cursor: pointer;
            background: transparent;
            border: 0;
            color: var(--text-90);
            font: inherit;
            text-align: left;
            width: 100%;
            transition: background-color 0.12s ease;
        }

        .option:hover { background: var(--accent-hover); }
        .option.selected { background: var(--accent-tint); }

        .option .label {
            color: var(--text-45);
            min-width: 1.5ch;
        }

        .option.selected .label { color: var(--accent); }

        .option .text { flex: 1; }

        /* --- Footer hints --- */
        .hints {
            margin-top: 32px;
            color: var(--text-45);
            font-size: 13px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 18px;
        }

        .hints .key { color: var(--accent); margin-right: 4px; }
        .hints .verb { color: var(--text-90); }
        .hints .verb:hover { text-decoration: underline; }
        .hints .verb.disabled { color: var(--text-30); cursor: not-allowed; }
        .hints .verb.disabled:hover { text-decoration: none; }

        button.verb {
            background: transparent;
            border: 0;
            font: inherit;
            padding: 0;
            cursor: pointer;
        }

        /* --- Results --- */
        .results-heading {
            color: var(--text-70);
            font-size: 15px;
            margin-bottom: 0;
        }

        .score-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 28px;
            margin-top: 28px;
            align-items: baseline;
        }

        .score-row .label { color: var(--text-45); }
        .score-row .score-val { color: var(--text-90); }
        .score-row .verdict-pass { color: var(--pass-green); }
        .score-row .verdict-fail { color: var(--wrong-red); }
        .score-row .threshold   { color: var(--text-45); }

        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 36px;
            margin-top: 16px;
            align-items: baseline;
        }

        .stats-row .stat-label { color: var(--text-45); margin-right: 8px; }
        .stats-row .stat-val   { color: var(--text-90); }

        .review-heading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-70);
            margin: 36px 0 16px;
        }

        .review-heading .dashes {
            color: var(--text-30);
            flex: 1;
            border-top: 1px solid var(--rule);
            margin-left: 4px;
            transform: translateY(1px);
        }

        .review-q {
            border-left: 2px solid var(--text-30);
            padding: 0 0 8px 14px;
            margin-bottom: 20px;
        }

        .review-q.correct   { border-left-color: var(--accent); }
        .review-q.incorrect { border-left-color: var(--wrong-red); }

        .review-q .status {
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-70);
        }

        .review-q .status .glyph-correct   { color: var(--accent); margin: 0 8px; }
        .review-q .status .glyph-incorrect { color: var(--wrong-red); margin: 0 8px; }
        .review-q .status .verdict.correct   { color: var(--accent); }
        .review-q .status .verdict.incorrect { color: var(--wrong-red); }

        .review-q .stem-mini {
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 10px;
            line-height: 1.55;
        }

        .review-q .ans-line {
            display: grid;
            grid-template-columns: 18ch 1fr;
            gap: 4px 8px;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .review-q .ans-line .ans-label { color: var(--text-45); }
        .review-q .ans-line.right .ans-val { color: var(--accent); }
        .review-q .ans-line.wrong .ans-val { color: var(--wrong-red); }
        .review-q .ans-line.skipped .ans-val { color: var(--text-45); }

        .review-q .explanation {
            margin-top: 10px;
            color: var(--text-70);
            font-size: 14px;
            line-height: 1.55;
        }

        .review-q .explanation .arrow { color: var(--accent); margin-right: 6px; }

        .retake-row {
            margin-top: 36px;
            text-align: center;
            color: var(--text-90);
        }

        .retake-row .key { color: var(--accent); margin-right: 4px; }
        .retake-row button.verb:hover { text-decoration: underline; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--accent); }
        * { scrollbar-width: thin; scrollbar-color: var(--accent) #000; }

        /* Mobile */
        @media (max-width: 600px) {
            .col { padding: 0 24px; }
            .stem { font-size: 16px; }
            body { font-size: 14px; padding: 24px 0 36px; }
            .review-q .ans-line { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="col">
        <div class="title-row">
            <span id="quizTitle">quiz</span>
            <span class="meta" id="quizMeta">— · — · 0q</span>
        </div>
        <div class="rule"></div>
        <div class="progress"><div class="progress-fill" id="progressBar"></div></div>

        <div class="content" id="examContent"></div>
    </div>

    <script>
        // ============================================================
        // QUIZ CONFIG — edit this block when deriving a new quiz.
        // Leave the rest of this file unchanged.
        // ============================================================
        const QUIZ_TITLE    = 'practice quiz 1.2';
        const QUIZ_SUBTITLE = 'sec-plus · obj 1.2';
        const ACCENT_HEX    = '#38bdf8';

        const questions = [
            {
                q: "A Chief Information Security Officer (CISO) is reviewing the organization's current security posture against a new set of industry compliance standards. The CISO identifies specific areas where the current controls do not meet the required standards and creates a plan to address these deficiencies. Which of the following concepts is the CISO performing?",
                options: ["Zero Trust", "Gap analysis", "Honeytoken deployment", "Non-repudiation"],
                correct: 1,
                domain: "General Security Concepts",
                explanation: "Correct: Gap analysis is a methodical assessment used to compare an organization's current security posture with a set of standards, best practices, or regulatory requirements to identify areas that need improvement."
            },
            {
                q: "A network administrator is configuring a new wireless network and wants to ensure that data transmitted between the user's device and the access point cannot be intercepted and read by unauthorized parties. Which element of the CIA triad is the administrator primarily addressing?",
                options: ["Availability", "Integrity", "Confidentiality", "Accounting"],
                correct: 2,
                domain: "General Security Concepts",
                explanation: "Correct: Confidentiality ensures that sensitive information is accessed only by authorized persons and kept away from those not authorized to possess it, often achieved through encryption."
            },
            {
                q: "A security analyst is investigating a data breach and discovers that a specific user account accessed sensitive files at 2:00 AM. The analyst uses the system logs to track the user's activities, including login times and resources accessed. Which component of the AAA framework is the analyst utilizing?",
                options: ["Authentication", "Authorization", "Accounting", "Attestation"],
                correct: 2,
                domain: "General Security Concepts",
                explanation: "Correct: Accounting (or Auditing) involves tracking user activities and resource usage, such as logging login times and accessed resources, to ensure users are held accountable for their actions."
            },
            {
                q: "An organization is implementing a Zero Trust architecture. They are deploying a component responsible for deciding whether to grant a subject access to a resource based on established policies. Which logical component of Zero Trust is this?",
                options: ["Policy Enforcement Point", "Policy Administrator", "Policy Engine", "Data Plane"],
                correct: 2,
                domain: "General Security Concepts",
                explanation: "Correct: The Policy Engine is responsible for the ultimate decision to grant access to a resource for a given subject within the Zero Trust Control Plane."
            },
            {
                q: "To secure a high-value data center, a company installs a physical security control consisting of two doors. The first door must close and lock before the second door can be opened, preventing an unauthorized person from tailgating an authorized employee. What is this control called?",
                options: ["Access control vestibule", "Air gap", "Faraday cage", "Bollard"],
                correct: 0,
                domain: "General Security Concepts",
                explanation: "Correct: An access control vestibule (often called a mantrap) is a secured area between two sets of doors used to manage and control access, ensuring only authorized individuals gain entry and preventing piggybacking/tailgating."
            },
            {
                q: "A software developer signs a digital contract using their private key. Later, the developer attempts to deny signing the document, but the recipient uses the developer's public key to verify the signature validly. Which security concept prevents the developer from denying their action?",
                options: ["Availability", "Obfuscation", "Non-repudiation", "Authorization"],
                correct: 2,
                domain: "General Security Concepts",
                explanation: "Correct: Non-repudiation ensures that a party cannot deny the authenticity of their signature or the sending of a message, often implemented using digital signatures."
            },
            {
                q: "An administrator places a fake file named 'Executive_Salaries.xlsx' on a network share that acts as a decoy. The file contains no real data, but the security team configures alerts to trigger immediately if anyone attempts to open or modify it. What type of deception technology is this?",
                options: ["Honeyfile", "Honeynet", "DNS sinkhole", "Jump server"],
                correct: 0,
                domain: "General Security Concepts",
                explanation: "Correct: A Honeyfile is a decoy file placed within a system to appear legitimate; unauthorized access to it alerts security personnel to a potential breach or insider threat."
            },
            {
                q: "A company requires employees to enter a username and password, followed by a fingerprint scan, to access the server room. Which fundamental security concept is being demonstrated?",
                options: ["Single Sign-On (SSO)", "Multifactor Authentication (MFA)", "Federation", "Discretionary Access Control"],
                correct: 1,
                domain: "General Security Concepts",
                explanation: "Correct: Multifactor Authentication (MFA) requires more than one method of authentication from independent categories (e.g., something you know and something you are) to verify identity."
            },
            {
                q: "An organization wants to ensure that its web store remains operational even if a primary server fails. They implement a load balancer and a cluster of redundant servers to maintain uptime. Which principle of the CIA triad is this primarily supporting?",
                options: ["Confidentiality", "Integrity", "Availability", "Non-repudiation"],
                correct: 2,
                domain: "General Security Concepts",
                explanation: "Correct: Availability refers to ensuring that data and systems are accessible when needed. This is often maintained through redundancy, fault tolerance, and load balancing."
            },
            {
                q: "In a secure facility, security guards utilize a specific type of sensor to detect intrusion. This sensor works by detecting changes in heat signatures within a room. Which type of sensor are they using?",
                options: ["Pressure", "Ultrasonic", "Microwave", "Infrared"],
                correct: 3,
                domain: "General Security Concepts",
                explanation: "Correct: Infrared sensors detect heat and movement, making them common choices for intrusion detection systems."
            },
            {
                q: "A system administrator is configuring permissions for a file server. The permissions are assigned based on the user's job function and department rather than their identity. For example, all 'Accountants' have access to the 'Finance' folder. Which authorization model is being used?",
                options: ["Discretionary Access Control (DAC)", "Mandatory Access Control (MAC)", "Role-Based Access Control (RBAC)", "Rule-Based Access Control"],
                correct: 2,
                domain: "General Security Concepts",
                explanation: "Correct: Role-Based Access Control (RBAC) assigns permissions based on a user's role or job function within an organization, rather than individually."
            },
            {
                q: "A security architect is designing a network based on the Zero Trust model. They want to ensure that user identity verification is not static but changes dynamically based on context, such as location and device health. Which Zero Trust control plane concept does this describe?",
                options: ["Adaptive identity", "Implicit trust zone", "Micro-segmentation", "Threat scope reduction"],
                correct: 0,
                domain: "General Security Concepts",
                explanation: "Correct: Adaptive identity involves dynamically adjusting user or system identity verification based on context, a key component of the Zero Trust Control Plane."
            },
            {
                q: "A user downloads a software patch from a vendor's website. Before installing, the user verifies the file's digital signature and compares the file's hash value against the one provided on the website. Which security goal is the user validating?",
                options: ["Confidentiality", "Integrity", "Availability", "Accounting"],
                correct: 1,
                domain: "General Security Concepts",
                explanation: "Correct: Integrity involves assuring the accuracy and reliability of information. Hashing and digital signatures are methods used to verify that data has not been altered or corrupted."
            },
            {
                q: "To protect the building's perimeter from vehicle-based attacks, a facility manager installs heavy vertical posts made of steel and concrete in front of the main entrance. What is this physical security control called?",
                options: ["Fencing", "Bollards", "Motion sensors", "Access control vestibule"],
                correct: 1,
                domain: "General Security Concepts",
                explanation: "Correct: Bollards are physical security barriers (posts) used to control road traffic and prevent vehicles from crashing into buildings or secure areas."
            },
            {
                q: "An organization sets up a server that appears to be a legitimate production database but is actually isolated and unpatched. The purpose is to attract attackers to study their methods and gather threat intelligence. What is this system called?",
                options: ["Honeypot", "Proxy server", "Firewall", "Jump server"],
                correct: 0,
                domain: "General Security Concepts",
                explanation: "Correct: A honeypot is a security mechanism set up to detect, deflect, or study hacking attempts by acting as a decoy system."
            }
        ];

        // ============================================================
        // END CONFIG — chrome below is shared. Do not edit when deriving.
        // ============================================================

        function hexToRgba(hex, alpha) {
            const h = hex.replace('#', '');
            const r = parseInt(h.substring(0, 2), 16);
            const g = parseInt(h.substring(2, 4), 16);
            const b = parseInt(h.substring(4, 6), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // --- APP STATE ---
        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let onResults = false;

        // --- DOM ---
        const contentDiv = document.getElementById('examContent');
        const progressBar = document.getElementById('progressBar');

        // --- INIT ---
        function init() {
            document.title = QUIZ_TITLE;
            document.getElementById('quizTitle').textContent = QUIZ_TITLE;
            document.getElementById('quizMeta').textContent =
                `${QUIZ_SUBTITLE} · ${questions.length}q`;
            document.documentElement.style.setProperty('--accent', ACCENT_HEX);
            document.documentElement.style.setProperty('--accent-tint',  hexToRgba(ACCENT_HEX, 0.14));
            document.documentElement.style.setProperty('--accent-hover', hexToRgba(ACCENT_HEX, 0.08));
            renderQuestion();
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // --- RENDER ---
        function renderQuestion() {
            onResults = false;
            const q = questions[currentQuestionIndex];
            const isLast = currentQuestionIndex === questions.length - 1;
            const isFirst = currentQuestionIndex === 0;
            const picked = userAnswers[currentQuestionIndex];

            progressBar.style.width = `${(currentQuestionIndex / questions.length) * 100}%`;

            const optionsHtml = q.options.map((opt, i) => `
                <button type="button"
                        class="option ${picked === i ? 'selected' : ''}"
                        onclick="selectOption(${i})">
                    <span class="label">${i + 1}</span>
                    <span class="text">${escapeHtml(opt)}</span>
                </button>
            `).join('');

            const prevHtml = isFirst
                ? ''
                : `<button type="button" class="verb" onclick="prevQuestion()"><span class="key">&larr;</span>prev</button>`;

            const nextLabel = isLast ? 'finish' : 'next';
            const nextEnabled = picked !== null;
            const nextHtml = nextEnabled
                ? `<button type="button" class="verb" onclick="nextQuestion()"><span class="key">&#x21B5;</span>${nextLabel}</button>`
                : `<span class="verb disabled"><span class="key">&#x21B5;</span>${nextLabel}</span>`;

            contentDiv.innerHTML = `
                <div class="q-header">
                    <span class="count">question ${currentQuestionIndex + 1} of ${questions.length}</span>
                    <span class="domain">[ ${escapeHtml(q.domain.toLowerCase())} ]</span>
                </div>

                <div class="stem">${escapeHtml(q.q)}</div>

                <div class="options">${optionsHtml}</div>

                <div class="hints">
                    <span><span class="key">1-${q.options.length}</span>select</span>
                    ${prevHtml ? `<span>${prevHtml}</span>` : ''}
                    <span>${nextHtml}</span>
                </div>
            `;
        }

        function selectOption(i) {
            userAnswers[currentQuestionIndex] = i;
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (userAnswers[currentQuestionIndex] === null) return;
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            onResults = true;
            let correctCount = 0;
            questions.forEach((q, i) => { if (userAnswers[i] === q.correct) correctCount++; });
            const score = Math.round((correctCount / questions.length) * 100);
            const passed = score >= 83;
            progressBar.style.width = '100%';

            const reviewHtml = questions.map((q, i) => {
                const userAnswer = userAnswers[i];
                const skipped = userAnswer === null;
                const isCorrect = !skipped && userAnswer === q.correct;
                const userLabel = skipped ? '—' : `${userAnswer + 1}  ${escapeHtml(q.options[userAnswer])}`;
                const correctLabel = `${q.correct + 1}  ${escapeHtml(q.options[q.correct])}`;
                const statusGlyph = isCorrect
                    ? `<span class="glyph-correct">&#x2713;</span><span class="verdict correct">correct</span>`
                    : `<span class="glyph-incorrect">&#x2717;</span><span class="verdict incorrect">${skipped ? 'skipped' : 'incorrect'}</span>`;
                const yourLineClass = skipped ? 'skipped' : (isCorrect ? 'right' : 'wrong');
                return `
                    <div class="review-q ${isCorrect ? 'correct' : 'incorrect'}">
                        <div class="status">Q.${i + 1}${statusGlyph}</div>
                        <div class="stem-mini">${escapeHtml(q.q)}</div>
                        <div class="ans-line ${yourLineClass}">
                            <span class="ans-label">your answer:</span>
                            <span class="ans-val">${userLabel}</span>
                        </div>
                        <div class="ans-line right">
                            <span class="ans-label">correct answer:</span>
                            <span class="ans-val">${correctLabel}</span>
                        </div>
                        <div class="explanation"><span class="arrow">&rsaquo;</span>${escapeHtml(q.explanation)}</div>
                    </div>
                `;
            }).join('');

            contentDiv.innerHTML = `
                <div class="results-heading">results</div>

                <div class="score-row">
                    <span><span class="label">score</span> <span class="score-val">${score} / 100</span></span>
                    <span class="${passed ? 'verdict-pass' : 'verdict-fail'}">${passed ? 'pass' : 'fail'}</span>
                    <span class="threshold">(&ge; 83 to pass)</span>
                </div>

                <div class="stats-row">
                    <span><span class="stat-label">correct</span><span class="stat-val">${correctCount}</span></span>
                    <span><span class="stat-label">incorrect</span><span class="stat-val">${questions.length - correctCount}</span></span>
                    <span><span class="stat-label">total</span><span class="stat-val">${questions.length}</span></span>
                </div>

                <div class="review-heading">review<span class="dashes"></span></div>

                ${reviewHtml}

                <div class="retake-row">
                    <button type="button" class="verb" onclick="location.reload()"><span class="key">&#x21B5;</span>retake</button>
                </div>
            `;
            window.scrollTo(0, 0);
        }

        // --- KEYBOARD ---
        window.addEventListener('keydown', (e) => {
            const tag = document.activeElement && document.activeElement.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA') return;

            if (onResults) {
                if (e.key === 'Enter') { e.preventDefault(); location.reload(); }
                return;
            }

            if (/^[1-9]$/.test(e.key)) {
                const i = Number(e.key) - 1;
                const q = questions[currentQuestionIndex];
                if (i < q.options.length) { e.preventDefault(); selectOption(i); }
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault(); prevQuestion();
            } else if (e.key === 'ArrowRight' || e.key === 'Enter') {
                e.preventDefault(); nextQuestion();
            }
        });

        init();
    </script>
</body>
</html>
