<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelnet OSI Model Visualizer</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // SHELNET Blue Theme
                        blue: { 
                            400: '#60a5fa', 
                            500: '#3b82f6', 
                            900: '#1e3a8a',
                            950: '#172554' // Deep blue for glass tint
                        },
                    },
                    fontFamily: {
                        sans: ['Helvetica Neue', 'Helvetica', 'Arial', 'sans-serif'],
                        mono: ['Courier New', 'Courier', 'monospace'],
                    },
                    backgroundImage: {
                        'grid-pattern': "linear-gradient(to right, #1e3a8a1a 1px, transparent 1px), linear-gradient(to bottom, #1e3a8a1a 1px, transparent 1px)",
                    }
                }
            }
        }
    </script>
    
    <style>
        /* GLOBAL SETTINGS */
        body { 
            background-color: #000; 
            color: #fff; 
            overflow-x: hidden;
        }

        /* HUD BACKGROUND GRID */
        .bg-grid {
            background-size: 40px 40px;
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
        }

        /* 3D PERSPECTIVE CONTAINER */
        .hud-perspective {
            perspective: 1000px;
            transform-style: preserve-3d;
        }

        /* GLASS PANES */
        .glass-pane {
            background: rgba(23, 37, 84, 0.3); /* blue-950 with opacity */
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(59, 130, 246, 0.2); /* blue-500 low opacity */
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            transform: rotateX(10deg) scale(0.95);
            transition: all 0.3s ease-out;
            opacity: 0; /* Hidden initially for scanline */
        }

        .glass-pane.revealed {
            opacity: 1;
            transform: rotateX(0deg) scale(1);
            animation: glitch-intro 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        }

        .glass-pane:hover {
            background: rgba(30, 58, 138, 0.5);
            border-color: #60a5fa; /* blue-400 */
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            transform: scale(1.02) translateX(10px);
            z-index: 10;
        }

        /* HARDWARE INVENTORY ITEMS */
        .hw-item {
            transition: all 0.2s;
            opacity: 0.4;
        }
        .glass-pane:hover .hw-item {
            opacity: 1;
            text-shadow: 0 0 8px #3b82f6;
        }

        /* SCANLINE ANIMATION */
        .scanline {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: #60a5fa;
            box-shadow: 0 0 20px #60a5fa, 0 0 40px #3b82f6;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
        }
        
        .scanning {
            opacity: 1;
            animation: scan-down 2.5s linear forwards;
        }

        @keyframes scan-down {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        /* GLITCH EFFECT FOR REVEAL */
        @keyframes glitch-intro {
            0% { clip-path: inset(80% 0 0 0); transform: translate(-5px, 0); }
            20% { clip-path: inset(10% 0 60% 0); transform: translate(5px, 0); }
            40% { clip-path: inset(40% 0 40% 0); transform: translate(-5px, 0); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(5px, 0); }
            80% { clip-path: inset(10% 0 80% 0); transform: translate(-2px, 0); }
            100% { clip-path: inset(0 0 0 0); transform: translate(0, 0); }
        }

        /* CONNECTOR LINES */
        .connector-line {
            width: 2px;
            background: linear-gradient(to bottom, #3b82f6 50%, transparent 50%);
            background-size: 2px 10px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-6 md:p-8 bg-grid bg-fixed">

    <header class="flex justify-between items-end border-b border-blue-500/20 pb-6 mb-8 relative z-10 backdrop-blur-sm">
        <div>
            <h1 class="text-4xl md:text-5xl font-bold text-white tracking-tighter uppercase font-sans">
                Network<span class="text-blue-500">_HUD</span>
            </h1>
            <div class="text-xs text-blue-400/60 uppercase tracking-[0.2em] font-mono mt-2">
                System_Analysis // OSI_Model_v1.0
            </div>
        </div>
        <div class="hidden md:block text-right">
            <div class="flex items-center gap-2 justify-end font-mono text-xs text-blue-400">
                <span class="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></span>
                LIVE MONITORING
            </div>
            <button onclick="runScan()" class="mt-2 text-[10px] border border-blue-500/30 px-3 py-1 rounded text-blue-300 hover:bg-blue-500/10 transition-colors uppercase font-mono">
                [ Re-Initialize Scan ]
            </button>
        </div>
    </header>

    <main class="relative flex-grow max-w-6xl mx-auto w-full flex flex-col md:flex-row gap-8">
        
        <div id="scanner" class="scanline"></div>

        <div class="w-full md:w-2/3 relative hud-perspective space-y-3" id="layers-container">
            </div>

        <div class="hidden md:flex w-1/3 flex-col gap-4 sticky top-8 h-fit">
            
            <div class="bg-black/80 border border-blue-500/30 p-4 rounded backdrop-blur-md">
                <div class="text-[10px] text-blue-500 uppercase tracking-widest font-mono mb-2">Diagnostic Log</div>
                <div id="log-output" class="font-mono text-xs text-white/70 h-32 overflow-hidden flex flex-col justify-end">
                    </div>
            </div>

            <div class="bg-blue-900/10 border border-blue-500/10 p-4 rounded">
                <h3 class="text-blue-400 font-bold uppercase text-xs mb-3 font-mono">Hardware Icon Key</h3>
                <div class="grid grid-cols-2 gap-2 text-[10px] text-white/60 font-mono">
                    <div class="flex items-center gap-2"><span class="text-xl">⦿</span> End Device</div>
                    <div class="flex items-center gap-2"><span class="text-xl">☍</span> Intermediary</div>
                    <div class="flex items-center gap-2"><span class="text-xl">⚡</span> Media/Cable</div>
                    <div class="flex items-center gap-2"><span class="text-xl">🛡</span> Security</div>
                </div>
            </div>

        </div>

    </main>

    <footer class="mt-12 text-center text-white/20 text-[10px] font-mono uppercase">
        Shelnet Secure Systems // Unauthorized Access Prohibited
    </footer>

    <script>
        const osiData = [
            { 
                id: 7, 
                name: "Application", 
                role: "User Interface",
                hw: ["Web Browser", "Email Client", "API Endpoints"], 
                icon: "⦿" 
            },
            { 
                id: 6, 
                name: "Presentation", 
                role: "Encryption & Format",
                hw: ["Operating System", "Encryption Gateways", "SSO Service"], 
                icon: "🛡" 
            },
            { 
                id: 5, 
                name: "Session", 
                role: "Auth & Reconnection",
                hw: ["Session Controller", "Load Balancer", "Gateway"], 
                icon: "☍" 
            },
            { 
                id: 4, 
                name: "Transport", 
                role: "Flow Control (TCP/UDP)",
                hw: ["Firewalls (ACLs)", "Load Balancers", "WAN Accelerator"], 
                icon: "🛡" 
            },
            { 
                id: 3, 
                name: "Network", 
                role: "Routing (IP)",
                hw: ["Routers", "L3 Switches", "Multilayer Switch"], 
                icon: "☍" 
            },
            { 
                id: 2, 
                name: "Data Link", 
                role: "Switching (MAC)",
                hw: ["Managed Switch", "Network Bridge", "NIC (Card)"], 
                icon: "☍" 
            },
            { 
                id: 1, 
                name: "Physical", 
                role: "Raw Bits",
                hw: ["Cat6/Fiber Cables", "Hubs", "Repeaters", "Modems"], 
                icon: "⚡" 
            }
        ];

        const container = document.getElementById('layers-container');
        const logOutput = document.getElementById('log-output');
        const scanner = document.getElementById('scanner');

        // Helper to add logs
        function addLog(msg) {
            const div = document.createElement('div');
            div.innerHTML = `<span class="text-blue-500 mr-2">[${new Date().toLocaleTimeString().split(' ')[0]}]</span> ${msg}`;
            logOutput.appendChild(div);
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        // Generate Layer HTML
        function renderLayers() {
            container.innerHTML = '';
            osiData.forEach(layer => {
                const layerEl = document.createElement('div');
                layerEl.className = 'glass-pane relative flex items-center justify-between p-4 md:p-5 rounded group cursor-crosshair';
                layerEl.id = `layer-${layer.id}`;
                
                // Hardware List Construction
                const hwHTML = layer.hw.map(item => 
                    `<span class="hw-item inline-flex items-center gap-1 border border-blue-500/20 px-2 py-0.5 rounded bg-black/40 text-blue-200">
                        ${item}
                    </span>`
                ).join('');

                layerEl.innerHTML = `
                    <div class="flex flex-col w-1/4 border-r border-blue-500/20 pr-4">
                        <span class="text-4xl font-bold text-blue-500/20 group-hover:text-blue-400 transition-colors font-mono">0${layer.id}</span>
                        <span class="text-sm font-bold uppercase tracking-wider text-white group-hover:text-blue-100">${layer.name}</span>
                        <span class="text-[10px] text-blue-400/60 font-mono uppercase">${layer.role}</span>
                    </div>

                    <div class="flex-1 pl-6 flex flex-wrap gap-2 justify-end font-mono text-[10px] md:text-xs">
                        <div class="absolute right-2 top-2 text-blue-500/10 text-4xl pointer-events-none group-hover:text-blue-500/20 transition-colors">
                            ${layer.icon}
                        </div>
                        ${hwHTML}
                    </div>

                    <div class="absolute top-0 left-0 w-2 h-2 border-l border-t border-blue-400 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div class="absolute bottom-0 right-0 w-2 h-2 border-r border-b border-blue-400 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                `;

                // Add hover listeners for logging
                layerEl.addEventListener('mouseenter', () => {
                    addLog(`Analyzing Layer ${layer.id}: ${layer.name}... Accessing inventory.`);
                });

                container.appendChild(layerEl);
            });
        }

        // Animation Sequence
        function runScan() {
            // Reset
            document.querySelectorAll('.glass-pane').forEach(el => el.classList.remove('revealed'));
            addLog("Initializing Sequence...");
            
            // Start Scanner
            scanner.classList.remove('scanning');
            void scanner.offsetWidth; // Trigger reflow
            scanner.classList.add('scanning');

            // Timing logic to match scanline speed (2.5s total)
            const totalDuration = 2500; 
            const layerCount = 7;
            const step = totalDuration / layerCount;

            osiData.forEach((layer, index) => {
                setTimeout(() => {
                    const el = document.getElementById(`layer-${layer.id}`); // ID 7 is first visually
                    if(el) {
                        el.classList.add('revealed');
                        // Play a tiny sound effect here if desired
                    }
                }, index * step + (step/2)); // Offset slightly so line passes then reveals
            });

            setTimeout(() => {
                addLog("Scan Complete. All systems operational.");
            }, totalDuration);
        }

        // Init
        window.addEventListener('DOMContentLoaded', () => {
            renderLayers();
            addLog("System Booted.");
            setTimeout(runScan, 1000); // Wait 1s then scan
        });

    </script>
</body>
</html>
